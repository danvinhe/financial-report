<text id="text160" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,118.761,377.019)" xml:space="preserve"><tspan id="tspan142" x="0 13.2418 26.483601 39.725399 52.967201 66.209 79.450798 92.692596 105.9344 119.1762 132.418 145.65981 158.9016 170.2074 181.84979 195.0916 208.3334 221.5752 234.817 248.05881 261.3006 274.54239 287.78421 301.026 314.26779 327.50961 340.7514 353.99319 367.23499 380.47681" y="0">号文以及其他相关法规及规定，参与境外上市公司股权激励计划的中</tspan><tspan id="tspan144" x="-33.720501 -20.7768 -7.8330998 5.1106 18.0543 30.997999 43.9417 56.885399 69.829102 82.772797 95.716499 108.6602 121.6039 134.54761 147.4913 160.435 173.37869 186.3224 199.2661 212.20979 225.1535 238.0972 251.04089 263.98459 276.92831 289.87201 302.8157 315.7594 328.70309 341.64679 354.59052 367.53421 380.47791" y="15.9995">国居民须向国家外汇管理局或其地方分支机构或商业银行进行登记并办理若</tspan><tspan id="tspan146" x="-33.720501 -20.6712 -7.6219001 5.4274001 18.4767 29.782499 41.197201 54.246498 67.295799 80.3451 93.394402 106.4437 119.493 132.5423 145.5916 158.6409 171.6902 184.7395 197.7888 210.8381 223.88741 236.93671 249.98599 263.03531 276.08459 289.13391 302.1832 315.23251 328.2818 341.33109 354.3804 367.42969 380.479" y="31.999001">干其他手续。身为中国居民的股权激励计划参与者须保有一名合资格中国代</tspan><tspan id="tspan148" x="-33.720501 -27.0347 -15.4451 -2.2472999 10.9505 24.1483 37.3461 50.5439 63.741699 76.939499 90.137299 103.3351 116.5329 129.7307 142.9285 156.1263 169.3241 182.5219 195.7197 208.9175 222.1153 235.3131 248.51089 261.70871 274.90649 288.10431 301.30209 314.49991 327.69769 340.89551 354.09329 367.29111 380.48889" y="47.998501">理（可为该境外上市公司的中国附属公司或中国附属公司选定的其他合资格</tspan><tspan id="tspan150" x="-33.720501 -21.2377 -9.9329996 -4.1272001 7.1796999 19.6625 32.145302 44.628101 57.110901 69.593697 82.0765 94.559303 107.0421 119.5249 132.00771 144.49049 156.9733 169.4561 181.9389 194.42171 206.9045 219.3873 231.8701 244.35291 256.83569 269.31851 281.8013 294.28409 306.76691 319.24969 331.73251 344.2153 356.69809 369.18091 380.4856" y="63.998001">机构），以就股权激励计划代表其参与者办理国家外汇管理局登记及其他手续。</tspan><tspan id="tspan152" x="-33.720501 -20.560101 -7.3997002 5.7607002 18.921101 32.081501 45.241901 58.402302 71.562698 84.723099 97.883499 111.0439 124.2043 137.3647 150.5251 161.8309 173.37759 186.53799 199.69839 212.8588 226.0192 239.1796 252.34 265.5004 278.6608 291.8212 303.12589 314.67261 327.83301 340.99341 354.15381 367.31421 380.47461" y="79.997498">参与者亦须保有一家境外委托机构，以处理有关购股权行使、相关股票买卖</tspan><tspan id="tspan154" x="-33.720501 -20.4424 -7.1643 6.1138 19.391899 32.669998 45.948101 59.2262 72.504303 85.782402 99.060501 110.3663 122.0516 135.3297 146.6344 158.3197 171.59779 184.8759 198.15401 211.4321 224.71021 237.9883 249.2941 260.9794 274.25751 287.53561 300.81369 314.0918 327.3699 340.64801 353.92609 367.20419 380.4823" y="95.997002">或权益及资金转让等事宜。此外，倘股权激励计划、中国代理或境外委托机</tspan><tspan id="tspan156" x="-33.720501 -20.6712 -7.6219001 5.4274001 18.4767 31.525999 44.575298 57.624599 70.673897 83.723198 96.772499 109.8218 122.8711 135.92039 148.9697 162.019 175.0683 188.1176 199.4234 210.8392 223.8885 236.93781 249.98711 263.03641 276.08569 289.13501 302.1843 315.23361 328.2829 341.33221 354.3815 367.43079 380.4801" y="111.9965">构发生任何重大变动或出现其他重大变动，中国代理须就股权激励计划向国</tspan><tspan id="tspan158" x="-33.720501 -20.455601 -7.1907001 6.0742002 19.3391 32.604 45.8689 59.133801 72.398697 85.663597 98.928497 112.1934 123.4992 135.1691 148.43401 159.73869 171.4086 184.67349 197.9384 211.20329 224.4682 237.73309 250.998" y="127.996">家外汇管理局办理登记变更。另外，国家外汇管理局</tspan></text>

<text id="text38" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,394.9688,713.0118)" xml:space="preserve"><tspan id="tspan34" x="0 6.6847 18.474501 31.8417 45.2089 58.576099 70.365898 77.533501 90.900703 104.2679" y="0">元（如为实体）及最高</tspan><tspan id="tspan36" x="-309.92941 -296.6821 -283.43481" y="15.9995">人民币</tspan></text>
<text id="text42" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,124.2148,697.0123)" xml:space="preserve"><tspan id="tspan40" x="0 6.4218001 12.8436 16.207399 22.6292 29.051001" y="0">50,000</tspan></text>
<text id="text62" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,161.0681,697.0123)" xml:space="preserve"><tspan id="tspan44" x="0 6.6858001 18.334801 31.5821 44.829399 58.076698 69.7257 76.755798 90.003098 103.2504 116.4977 129.745 142.99229 156.23959 169.48689 180.79269 192.4417 205.689 218.93629 232.18359 245.43089 258.67819 271.92551 285.17279 298.4201 311.66739 324.9147 338.16199" y="0">元（如为个人）的罚款及法律制裁，亦可能限制我们向中国附属</tspan><tspan id="tspan46" x="-76.028702 -62.868301 -49.707901 -36.547501 -23.3871 -10.2267 2.9337001 16.094101 29.254499 40.561401 52.106998 65.267403 78.427803 91.588203 104.7486 117.909 131.0694 144.2298 157.3902 170.5506 183.711 196.8714 210.0318 223.1922 236.3526 249.513 262.6734 275.8338 287.13959 298.68631 311.84671 325.00711 338.16751" y="15.9995">公司额外出资的能力、限制中国附属公司向我们分派股息的能力，或以其他</tspan><tspan id="tspan48" x="-76.028702 -63.072899 -50.1171 -37.161301 -24.2055 -11.2497 1.7061 14.6619 27.617701 40.573502 53.529301 66.4851 79.440903 92.396698 105.3525 118.3083 129.61411" y="31.999001">方式对我们的业务产生重大不利影响。</tspan><tspan id="tspan50" x="-47.681702 -34.7094 -21.737101 -8.7648001 4.2075 17.1798 30.1521 43.124401 56.096699 69.069 82.041298 95.013603 107.9859 120.9582 133.9305 146.9028 159.87511 172.8474 185.8197 198.79201 211.7643 224.7366 237.70889 250.6812 263.6535 276.62579 287.93271 299.2572 312.22949 325.20181 338.1741" y="63.9991">国家税务总局亦已颁布有关雇员股份奖励的相关法规及规定。根据该等</tspan><tspan id="tspan52" x="-76.028702 -62.979401 -49.930099 -36.880798 -23.831499 -12.5257 -1.1109999 11.9383 24.9876 38.0369 51.086201 64.135498 77.184799 90.2341 103.2834 116.3327 129.382 142.4313 155.48061 168.52991 181.57919 194.62849 207.6778 220.7271 233.7764 246.8257 259.875 272.92429 285.9736 299.02289 312.0722 325.12149 338.17081" y="79.998596">法规及规定，我们在中国工作的雇员将须因获授股份奖励而缴纳中国个人所</tspan><tspan id="tspan54" x="-76.028702 -63.352299 -52.046501 -40.7407 -28.064301 -15.3879 -2.7114999 9.9649 22.6413 35.317699 47.994099 60.670502 73.346901 86.0233 98.699699 111.3761 124.0525 136.7289 149.4053 162.0817 174.7581 187.43449 200.1109 212.78729 225.4637 238.14011 250.8165 263.49289 276.16931 288.8457 301.52209 314.19849 326.87491 338.18069" y="95.9981">得税。我们中国附属公司有义务就已授出股份奖励向相关税务机关提交文件，</tspan><tspan id="tspan56" x="-76.028702 -62.979401 -49.930099 -36.880798 -23.831499 -10.7822 2.2671001 15.3164 28.3657 41.415001 54.464298 67.513603 80.562897 93.612198 106.6615 119.7108 132.7601 145.8094 158.8587 171.908 183.21381 194.62849 207.6778 220.7271 233.7764 246.8257 259.875 272.92429 285.9736 299.02289 312.0722 325.12149 338.17081" y="111.9976">并于授出股份奖励时为其雇员预扣个人所得税。倘我们雇员未能根据相关法</tspan><tspan id="tspan58" x="-76.028702 -62.979401 -49.930099 -36.880798 -23.831499 -10.7822 2.2671001 15.3164 28.3657 41.415001 54.464298 67.513603 80.562897 93.612198 106.6615 119.7108 132.7601 145.8094 158.8587 170.16451 181.58031 194.62959 207.67889 220.7282 233.7775 246.8268 259.8761 272.92542 285.9747 299.02399 312.0733 325.12259 338.17191" y="127.9971">规及规定缴纳或我们未能预扣其个人所得税，则我们可能面临政府主管部门</tspan><tspan id="tspan60" x="-76.028702 -63.072899 -50.1171 -37.161301 -24.2055 -12.9008" y="143.9966">施加的制裁。</tspan></text>
<text id="text66" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,521.0156)" xml:space="preserve"><tspan id="tspan64" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 207.2928 220.2486 233.20441 246.1602 259.116 272.07181 285.02759 296.3334" y="0">我们股东取得的针对我们的若干判决未必可强制执行。</tspan></text>
<text id="text74" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,489.0155)" xml:space="preserve"><tspan id="tspan68" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 117.8001 130.88901 143.97791 157.0668 170.1557 183.2446 194.5493 206.01241 219.1013 232.1902 245.2791 258.36801 271.45691 284.54581 297.6347 310.7236 323.8125 336.9014 349.9903 363.07919 374.38501 385.84698" y="0">我们是在开曼群岛注册成立的公司，而我们绝大部分资产位于中国，且</tspan><tspan id="tspan70" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 180.36591 191.9115 205.0719 216.3777 227.92439 241.08479 254.24519 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="15.9995">我们目前绝大部分经营亦在中国进行。此外，我们大多数现有董事及高级职</tspan><tspan id="tspan72" x="-28.347 -15.3967 -2.4463999 10.5039 23.454201 36.404499 49.354801 62.305099 75.255402 86.561203 97.865898 110.8162 123.7665 136.7168 149.6671 162.6174 175.5677 188.51801 201.46831 214.41859 227.3689 240.3192 253.2695 266.21979 279.1701 292.12039 303.42621 314.73199 327.68231 338.987 350.29279" y="31.999001">员为中国公民及居民，且该等人士的绝大部分资产位于中国。因此，倘</tspan></text>
<text id="text80" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,486.2853,457.0165)" xml:space="preserve"><tspan id="tspan76" x="0 12.9503" y="0">阁下</tspan><tspan id="tspan78" x="-401.24701 -387.95789 -374.66879 -361.3797 -348.09061 -334.80151 -321.51239 -308.2233 -294.9342 -281.64511 -268.35599 -255.06689 -241.7778 -228.48869 -215.1996 -201.91051 -188.6214 -175.33231 -162.0432 -150.7374" y="15.9995">根据适用证券法或其他法律认为权利遭侵犯，</tspan></text>
<text id="text92" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,353.0544,441.017)" xml:space="preserve"><tspan id="tspan82" x="0 13.2891 26.578199 39.867298 53.156399 66.445503 79.734596 93.023697 106.3128 119.6019 132.89101 146.1801" y="0">阁下可能难以或不能在香港</tspan><tspan id="tspan84" x="-268.01611 -255.01961 -242.0231 -229.0266 -216.03011 -203.0336 -190.03709 -177.0406 -164.0441 -151.04761 -138.0511 -125.0546 -112.0581 -99.0616 -86.065102 -73.068604 -60.072102 -47.0756 -34.079102 -21.0826 -8.0860996 4.9103999 17.9069 30.9034 43.899899 56.8964 69.892899 82.889397 95.885902 108.8824 121.8789 134.8754 146.1801" y="15.9995">向我们或该等人士送达法律程序文件或在香港对我们或该等人士提起诉讼。</tspan><tspan id="tspan86" x="-268.01611 -254.7039 -243.3981 -231.6732 -218.36099 -205.0488 -191.7366 -178.42439 -165.1122 -151.8 -138.48779 -125.1756 -111.8634 -98.551201 -85.238998 -71.926804 -58.614601 -45.302399 -31.9902 -18.677999 -5.3657999 7.9464002 21.2586 34.570801 47.882999 61.195202 74.507401 81.204201 92.930199 106.2424 119.5546 132.86681 146.179" y="31.999001">此外，由于中国法院对于根据境外证券法提起之案件的管辖权（中华人民共</tspan><tspan id="tspan88" x="-268.01611 -254.7171 -241.41811 -228.11909 -214.8201 -203.5143 -191.80479 -178.5058 -165.2068 -151.90781 -138.6088 -125.3098 -112.0108 -98.7118 -85.412804 -72.1138 -58.8148 -45.5158 -32.216801 -18.917801 -5.6188002 7.6802001 20.9792 34.278198 47.577202 60.876202 74.175201 87.474197 100.7732 112.4849 119.5821 132.8811 146.1801" y="47.998501">和国证券法、中国刑法及其相应的程序法或法律冲突所订明者除外）并无特</tspan><tspan id="tspan90" x="-268.01611 -254.72701 -241.4379 -228.1488 -214.8597 -201.5706 -188.28149 -174.9924 -161.70329 -148.4142 -135.12511 -123.8193" y="63.998001">定法定及司法解释或指引，</tspan></text>
<text id="text98" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,246.7405,377.019)" xml:space="preserve"><tspan id="tspan94" x="0 13.2891 26.578199 39.867298 53.156399 66.445503 79.734596 93.023697 106.3128 119.6019 132.89101 146.1801 159.46919 172.7583 186.04739 199.3365 212.6256 225.9147 239.2038 252.4929" y="0">阁下可能难以根据非中国证券法的责任规定在</tspan><tspan id="tspan96" x="-161.7011 -148.5407 -135.38029 -122.2199 -109.0595 -95.899101 -82.738701 -69.5783 -56.4179 -43.2575 -30.097099 -16.936701 -3.7763 9.3841 22.5445 35.704899 48.865299 62.0257 75.186096 88.346497 101.5069 114.6673 127.8277 140.9881 154.1485 167.3089 178.6147 190.16141 203.32179" y="15.9995">中国法院对我们或我们中国居民高级职员及董事提起原诉讼。即使</tspan></text>
<text id="text104" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,472.9148,361.0195)" xml:space="preserve"><tspan id="tspan100" x="0 13.1604 26.320801" y="0">阁下成</tspan><tspan id="tspan102" x="-387.8754 -374.715 -361.5546 -348.3942 -335.2338 -322.07339 -308.91299 -297.60721 -286.06161 -272.90121 -259.74081 -246.5804 -233.42 -220.2596 -207.0992 -193.9388 -180.7784 -167.618 -154.4576 -141.2972" y="15.9995">功提起此类诉讼，开曼群岛及中国法律或会使</tspan></text>
<text id="text110" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,354.4701,345.02)" xml:space="preserve"><tspan id="tspan106" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 105.2832 118.4436 131.604 144.7644" y="0">阁下无法强制执行针对我们</tspan><tspan id="tspan108" x="-269.43179 -256.47601 -243.5202 -230.56441 -217.6086 -204.6528 -191.69701 -178.7412 -165.7854 -152.82961 -139.87379 -126.918 -113.9622 -101.0064 -88.050598 -75.094803 -62.139 -50.833199" y="15.9995">资产或我们董事及高级职员资产的判决。</tspan></text>
<text id="text114" style="font-variant:normal;font-size:12px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,297.139)" xml:space="preserve"><tspan id="tspan112" x="0 14.1336 28.2672 42.400799 56.534401 70.667999 84.801598 98.935204 113.0688 127.2024" y="0">与全球发售有关的风险</tspan></text>
<text id="text118" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,265.012)" xml:space="preserve"><tspan id="tspan116" x="0 12.6764 25.3528 38.029202 50.705601 63.382 76.058403 88.734802 101.4112 114.0876 126.764 139.4404 152.11681 164.7932 177.4696 190.146 201.4518 212.7576 225.43401 238.1104 250.7868 263.4632 276.13959 288.81601 301.4924 314.16879 326.84521 339.52161 352.198 364.87439 377.55081 390.2272 402.90359 414.20831" y="0">我们的股份过往并未在公开市场流通，且股份的流通性及市价可能发生波动。</tspan></text>
<text id="text126" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,233.0119)" xml:space="preserve"><tspan id="tspan120" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 102.927 114.3901 127.479 140.5679 153.6568 166.7457 179.83459 192.92349 206.01241 219.1013 232.1902 245.2791 258.36801 271.45691 284.54581 297.6347 310.7236 323.8125 336.9014 348.20721 359.66919 372.75809 385.84698" y="0">在全球发售完成前，我们的股份并未在任何公开股票市场流通。我们概</tspan><tspan id="tspan122" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 337.03339 348.3392 359.755 372.80429 385.85361" y="15.9995">不保证我们的股份将在全球发售完成后形成或维持活跃的交易市场。发售价</tspan><tspan id="tspan124" x="-28.347 -15.2086 -2.0702 11.0682 24.2066 37.345001 50.483398 63.621799 76.760201 89.898598 103.037 116.1754 129.3138 136.0018 147.52319 160.66161 173.8 186.9384 200.0768 213.21519 226.35361 239.492 252.6304 265.7688 277.28909 284.19159 297.32999 310.46841 323.60681 336.74521 348.05099 359.57239 372.71078 385.84921" y="31.999001">乃由本公司与联席全球协调人（为其自身及代表包销商）磋商后厘定，未必能</tspan></text>

<text id="text30" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 234.88741 246.19321 257.60901 270.65829 283.70761 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="0">代表我们股份于全球发售完成后的交易价格。我们股份的市价可能会于全球</tspan><tspan id="tspan28" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 207.2928 218.5986" y="15.9995">发售完成后任何时间下跌至低于发售价。</tspan></text>
<text id="text34" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,665.0122)" xml:space="preserve"><tspan id="tspan32" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 166.77541 178.08121 191.037 203.9928 216.94859 229.9044" y="0">我们股份的交易价格可能波动，从而可能令</tspan></text>
<text id="text38" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,337.5521,665.0122)" xml:space="preserve"><tspan id="tspan36" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 101.9964" y="0">阁下遭受重大损失。</tspan></text>
<text id="text60" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,633.0121)" xml:space="preserve"><tspan id="tspan40" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 166.9734 178.2979 191.2702 204.24249 217.2148 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">我们股份的交易价格可能波动，且可能受到我们控制范围之外的因素影</tspan><tspan id="tspan42" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 49.3493 61.033501 74.3116 87.589699 100.8678 112.1736 123.8578 137.13589 148.4417 160.127 173.40511 186.6832 199.9613 213.2394 226.5175 239.79559 253.0737 266.35181 279.62991 292.90799 306.1861 319.4642 332.74231 346.02039 359.29849 372.5766 385.85471" y="15.9995">响而大幅波动，包括香港、中国、美国及全球其他地区证券市场的整体市场</tspan><tspan id="tspan44" x="-28.347 -15.1866 -3.8819001 7.6648002 20.825199 33.9856 45.291401 56.837002 69.997398 83.157799 96.318199 109.4786 122.639 135.79939 148.95979 162.12019 175.28059 188.44099 201.60139 214.7618 227.9222 241.0826 254.243 267.40341 280.56381 293.72421 306.88461 320.04501 333.20541 346.36581 359.52621 372.68661 385.84698" y="31.999001">状况。尤其是，其他业务营运主要位于中国且其证券在香港上市的公司的股</tspan><tspan id="tspan46" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 75.081596 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 321.66089 333.20651 346.36691 359.52731 372.68771 385.84811" y="47.998501">份表现及市价波动，可能影响我们股份价格及交易量的波动性。众多总部位</tspan><tspan id="tspan48" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 178.6983 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="63.998001">于中国的公司已将其证券在香港上市，部分公司正在准备将其证券在香港上</tspan><tspan id="tspan50" x="-28.347 -17.041201 -5.4945002 7.6659002 20.8263 33.986698 47.147099 60.307499 73.467903 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 203.2173 214.76289 227.92329 241.08369 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="79.997498">市。部分该等公司的股价曾经历剧烈波动，包括首次公开发售后价格大幅下</tspan><tspan id="tspan52" x="-28.347 -17.041201 -5.6254001 7.4239001 20.4732 33.522499 46.5718 59.621101 72.670403 85.719704 98.768997 111.8183 124.8676 137.9169 150.9662 164.0155 177.0648 190.11411 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="95.997002">跌。该等公司证券于其发售之时或之后的交易表现可能影响整体投资者对总</tspan><tspan id="tspan54" x="-28.347 -15.6706 -2.9942 9.6822004 22.358601 35.035 47.711399 60.387798 73.064201 85.740601 98.417 111.0934 123.7698 136.4462 149.1226 161.799 174.4754 185.7812 197.08701 209.7634 222.4398 235.1162 247.7926 260.46899 273.14539 285.82181 298.4982 311.17459 323.85101 336.5274 349.2038 361.88019 374.55661 385.8613" y="111.9965">部位于中国但在香港上市的公司的信心，因此可能影响我们股份的交易表现。</tspan><tspan id="tspan56" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 337.03339 348.3392 359.755 372.80429 385.85361" y="127.996">该等广泛的市场及行业因素可能严重影响我们股份的市价及波动性，而不论</tspan><tspan id="tspan58" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 112.5168" y="143.9955">我们的实际营运表现如何。</tspan></text>
<text id="text66" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,457.0165)" xml:space="preserve"><tspan id="tspan62" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 220.0946 231.51041 244.55969 257.60901 270.65829 283.70761 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="0">股份定价及交易之间存在数天的时间差，而我们股份的价格在交易开始时可</tspan><tspan id="tspan64" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 89.040604" y="15.9995">能会低于发售价。</tspan></text>
<text id="text78" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,409.0169)" xml:space="preserve"><tspan id="tspan68" x="0 13.0317 26.0634 39.0951 52.126801 65.158501 78.190201 91.221901 104.2536 117.2853 130.317 143.34869 156.3804 169.41209 182.4438 195.47549 208.5072 221.53889 234.5706 247.60229 260.634 273.66571 286.69739 299.7291 312.7608 325.79251 338.82419 350.13 361.5238 374.55551 385.8613" y="0">股份在全球发售中向公众发售的初始价格预计将于定价日厘定。然而，</tspan><tspan id="tspan70" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 191.7476 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="15.9995">股份在交付前将不会在联交所开始买卖，预计股份将于定价日后五个营业日</tspan><tspan id="tspan72" x="-28.347 -15.4605 -4.1546998 7.1500001 20.036501 31.3423 42.646999 55.533501 68.419998 81.306503 94.193001 107.0795 119.966 132.85249 145.739 158.6255 171.51199 184.3985 197.285 210.17149 223.058 235.9445 248.83099 261.7175 274.604 287.49051 300.37701 313.26349 326.14999 339.0365 350.34341 361.6492 374.53571 385.84039" y="31.999001">交付。因此，在此期间内投资者可能无法售出或以其他方式买卖股份。故此，</tspan><tspan id="tspan74" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 165.649 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="47.998501">我们股份的持有人将面临以下风险，即股份在交易开始时的价格可能会因股</tspan><tspan id="tspan76" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 178.9458 191.9016 204.85741 217.8132 230.769 243.72479 256.6806 269.63641 282.59219 295.548 308.50381 321.45959 334.41541 347.37119 360.327 371.63281" y="63.998001">份出售至交易开始期间的不利市况或其他不利的事态发展而低于发售价。</tspan></text>
<text id="text82" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,313.0188)" xml:space="preserve"><tspan id="tspan80" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 179.7312 191.037 203.9928 216.94859 229.9044 242.8602 255.81599 268.77179 281.7276 294.68341 307.63919 320.595 333.55081 346.50659 357.81241" y="0">阁下的投资将被立即及大幅摊薄，且未来亦有可能进一步被摊薄。</tspan></text>
<text id="text90" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,281.0187)" xml:space="preserve"><tspan id="tspan84" x="0 13.3056 26.6112 39.916801 53.222401 66.528 79.833603 93.139198 106.4448 119.7504 133.056 146.3616 159.66721 172.97279 186.2784 199.584 212.8896 226.19521 239.50079 252.8064 266.112 279.4176 292.72321 306.02881 319.33441 332.64001 345.94559 359.25119 372.55679 385.8624" y="0">由于我们股份的发售价高于我们股份在紧接全球发售之前的每股股份</tspan><tspan id="tspan86" x="-28.347 -15.1239 -1.9008 11.3223 24.545401 37.768501 49.074299 60.695801 73.9189 85.224701 96.846199 110.0693 123.2924 136.5155 149.7386 162.9617 176.1848 189.4079 202.631 215.8541 229.07719 242.30029 255.52341 268.74649 281.9696 295.19269 308.4158 321.63889 334.862 348.08511 361.3082 374.53131 385.8371" y="15.9995">有形账面净值，因此，于全球发售中购买我们股份的买家将立即遭到摊薄。</tspan><tspan id="tspan88" x="-28.347 -16.067699 -3.7883999 8.4909 20.770201 33.0495 45.3288 57.608101 69.887398 82.166702 94.445999 105.6253 116.8046 129.08389 141.3632 153.6425 165.9218 178.2011 190.48039 202.7597 215.039 227.3183 239.5976 251.87691 264.15619 276.43549 288.71481 300.99411 313.27341 325.5527 337.832 350.1113 362.39059 374.66989 385.84921" y="31.999001">如未来我们发行更多股份，全球发售股份的买家的股权比例可能被进一步摊薄。</tspan></text>

<text id="text30" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 105.2832 118.4436 131.604 144.7644 157.9248 171.08521 184.24561 197.40601 210.56641 223.72681 236.88721 250.04761 263.20801 276.36841 287.67419 299.22089 312.38129 325.54169 338.70209 351.86249 365.02289 376.3287 387.8743 401.0347 414.1951" y="0">实际或被视为出售大量股份或有大量股份可供出售，尤其是由董事、行政人</tspan><tspan id="tspan28" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 114.9522 126.258 139.21381 152.1696 165.1254 178.08121 191.037 203.9928 216.94859 229.9044 242.8602 255.81599 268.77179 281.7276 294.68341 307.63919 320.595 333.55081 344.8566" y="15.9995">员及控股股东作出时，可能会对我们股份的市价产生不利影响。</tspan></text>
<text id="text46" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,665.0122)" xml:space="preserve"><tspan id="tspan32" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 117.8001 130.88901 143.97791 155.28259 166.7457 179.83459 192.92349 206.01241 219.1013 232.1902 243.496 254.95799 268.04691 281.1358 294.2247 307.3136 320.4025 333.49139 346.58029 359.66919 372.75809 385.84698" y="0">于未来出售大量我们的股份，尤其是由董事、行政人员及控股股东作出</tspan><tspan id="tspan34" x="-28.347 -17.041201 -5.4945002 7.6659002 20.8263 33.986698 47.147099 60.307499 73.467903 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 190.0569 201.60361 214.76401 227.92439 241.08479 254.24519 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="15.9995">时，或被认为或预期将作出该等出售时，可能会对我们股份在香港的市价以</tspan><tspan id="tspan36" x="-28.347 -15.4033 -2.4596 10.4841 23.427799 36.371498 49.315201 62.2589 75.202599 88.146301 101.09 114.0337 126.9774 139.9211 152.86481 165.8085 178.7522 191.69591 204.6396 217.5833 230.52699 243.4707 256.4144 269.35809 282.30179 295.24551 308.18921 321.1329 334.0766 347.02029 359.96399 372.90771 385.85141" y="31.999001">及我们在未来于我们认为合适的时机以我们认为合适的价格筹集股本的能力</tspan><tspan id="tspan38" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 47.737801" y="47.998501">产生负面影响。</tspan><tspan id="tspan40" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 231.8349 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="79.998596">由控股股东持有的股份须遵守若干禁售期。尽管我们目前并不知悉控股</tspan><tspan id="tspan42" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 243.94479 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="95.9981">股东有意于禁售期届满后出售大量其持有的股份，但概不保证彼不会出售任</tspan><tspan id="tspan44" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 151.3842" y="111.9976">何其目前或未来可能拥有的股份。</tspan></text>
<text id="text52" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,521.0145)" xml:space="preserve"><tspan id="tspan48" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 141.7988 153.2146 166.2639 179.3132 192.3625 205.4118 218.46111 231.51041 244.55969 257.60901 270.65829 283.70761 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="0">我们为一家开曼群岛公司，由于在开曼群岛法例下有关股东权利的司法先例</tspan><tspan id="tspan50" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 127.908 139.21271" y="15.9995">较其他司法权区为有限，故</tspan></text>
<text id="text56" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,246.8615,505.015)" xml:space="preserve"><tspan id="tspan54" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 207.2928 220.2486 231.5544" y="0">阁下于保障股东权利方面可能会遇到困难。</tspan></text>
<text id="text72" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3853,473.0149)" xml:space="preserve"><tspan id="tspan58" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 117.8001 130.88901 143.97791 157.0668 168.37151 179.83459 192.92349 206.01241 219.1013 232.1902 245.2791 258.36801 271.45691 284.54581 297.6347 310.7236 323.8125 336.9014 349.9903 363.07919 374.38501 385.84698" y="0">我们的公司事务受大纲及细则、开曼公司法及开曼群岛普通法规管。根</tspan><tspan id="tspan60" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 61.9212 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 244.552 257.7124 270.8728 284.0332 295.33899 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="15.9995">据开曼群岛法例，股东对董事及我们采取法律行动的权利、少数股东采取的</tspan><tspan id="tspan62" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 322.2406 333.6553 346.70459 359.75391 372.80319 385.85251" y="31.999001">行动及董事对我们的受信责任很大程度受开曼群岛普通法规管。开曼群岛普</tspan><tspan id="tspan64" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 217.84621 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="47.998501">通法部分源自开曼群岛比较有限的司法先例，以及对开曼群岛法院具有说服</tspan><tspan id="tspan66" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 152.5986 164.0144 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="63.998001">力但不具有约束力的英国普通法。开曼群岛有关保障少数股东权益的法例于</tspan><tspan id="tspan68" x="-28.347 -15.4033 -2.4596 10.4841 23.427799 36.371498 49.315201 62.2589 75.202599 88.146301 101.09 114.0337 126.9774 139.9211 152.86481 165.8085 178.7522 191.69591 204.6396 217.5833 230.52699 243.4707 256.4144 269.35809 282.30179 295.24551 308.18921 321.1329 334.0766 347.02029 359.96399 372.90771 385.85141" y="79.997498">若干方面有别于少数股东可能所处的司法权区的成文法及现有司法先例所制</tspan><tspan id="tspan70" x="-28.347 -15.73 -3.1129999 9.5039997 20.808701 32.114498 44.731499 57.348499 69.9655 82.582497 95.199501 107.8165 120.4335 126.2349 137.5407 150.1577 162.7747" y="95.997002">定的规定。请参阅本招股章程「附录三</tspan></text>
