         y="15.9995"
         id="tspan168">未发行股份（不论为原有股本的部分或任何新增股本）应由董事处置，</tspan><tspan

         y="31.999001"
         id="tspan170">董事可在其认为适当的时间，按其厘定为适当的代价及条款，向其</tspan><tspan
         x="-28.348101 -15.3417 -2.3353 10.6711 23.6775 36.683899 49.6903 62.696701 75.703102 87.010002 98.375198 111.3816 124.388 137.39439 148.7002 160.0665 173.07291 186.0793 199.08569 212.0921 225.0985 238.1049 251.1113 264.11771 277.12411 290.13049 303.1369 316.14331 329.14969"

         y="95.9981"
         id="tspan176">根据组织章程细则的条文规定及本公司于股东大会上作出的</tspan><tspan

         y="111.9976"
         id="tspan178">任何指示，并且在不损害任何现有股份持有人获赋予或任何类别</tspan><tspan

         y="127.9971"
         id="tspan180">股份所附的任何特别权利的前提下，董事可在其认为适当的时间，</tspan><tspan

         y="143.9966"
         id="tspan182">按其厘定为适当的代价，向其认为适当的人士发行附有该等优先权、</tspan><tspan

         y="159.99609"

         y="175.99561"
         id="tspan186">资本归还或其他方面）的任何股份。按照公司法的规定及在任何股</tspan><tspan

         y="191.9951"
         id="tspan188">东获赋予的任何特别权利或任何类别股份所附特别权利的规限下，</tspan><tspan

         y="207.9946"
         id="tspan190">经特别决议案批准后，任何股份可按须予赎回或可由本公司或股</tspan><tspan

         y="0"
         id="tspan30">倘任何董事应本公司要求提供任何特殊或额外服务，则董事</tspan><tspan
         x="-28.347 -15.3406 -2.3341999 10.6722 23.6786 36.685001 49.691399 62.6978 75.704201 87.011101 98.376297 111.3827 124.3891 137.39549 150.4019 163.40829 176.4147 189.4211 202.42751 215.4339 226.7397 238.106 251.1124 264.1188 277.12521 290.13159 303.138 316.14441 329.15079"
         y="15.9995"
         id="tspan32">可向其授出特殊酬金。此种特殊酬金可以薪金、佣金或分享盈利或</tspan><tspan
         x="-28.347 -14.971 -1.595 11.781 25.157 38.533001 51.909 65.285004 78.661003 92.037003 105.413 118.789 132.16499 143.47079 155.27049 168.6465 182.02251 195.3985 208.77451 222.1505 235.5265 248.9025 262.2785 275.65451 289.03049 302.40649 315.7825 329.15851"
         y="31.999001"
         id="tspan34">协定的其他方式支付予该董事，作为其担任董事所得一般酬金外</tspan><tspan
         x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 138.42841"
         y="47.998501"
         id="tspan36">的额外报酬或代替其一般酬金。</tspan><tspan
         x="0 13.1659 26.3318 39.4977 52.663601 65.829498 78.995399 92.161301 105.3272 118.4931 131.659 144.82491 157.9908 171.15669 184.3226 197.48849 210.6544 223.8203 236.98621 250.1521 263.31799 276.48389 289.64981 302.8157 315.9816 329.14749"
         y="79.998596"
         id="tspan38">董事可不时厘定执行董事或获本公司委任担任任何其他管理</tspan><tspan
         x="-28.347 -15.3406 -2.3341999 10.6722 23.6786 34.984402 46.349602 59.355999 72.362396 85.368797 98.375198 109.681 121.0473 134.0537 147.0601 160.0665 173.07291 186.0793 199.08569 212.0921 225.0985 238.1049 251.1113 264.11771 277.12411 290.13049 303.1369 316.14331 329.14969"
         y="95.9981"
         id="tspan40">职务的酬金，可能以薪金、佣金或分享盈利或其他方式或以上全部</tspan><tspan
         x="-28.347 -15.1646 -1.9822 11.2002 24.382601 37.564999 50.747398 62.0532 73.625198 86.807602 99.989998 113.1724 126.3548 139.5372 152.7196 165.90199 179.0844 192.2668 205.4492 218.63161 231.814 244.9964 258.1788 271.36121 284.54361 291.22061 302.7926 315.97501 329.15741"
         y="111.9976"
         id="tspan42">或任何方式支付，并包括由董事可能不时决定的其他福利（包括购</tspan><tspan
         x="-28.347 -15.2933 -2.2395999 9.1816998 20.603001 33.6567 46.7104 59.764099 72.817802 84.239098 95.6604 108.7141 121.7678 134.8215 147.8752 159.29649 170.7178 183.7715 196.8252 209.87891 222.9326 235.9863 249.03999 260.4613 267.2681 280.32181 293.37549 304.6813 316.1026 329.15631"
         y="127.9971"
         id="tspan44">股权及╱或养老金及╱或抚恤金及╱或其他退休福利）及津贴。上述</tspan><tspan
         x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 178.9458 191.9016 204.85741 216.16431"
         y="143.9966"
         id="tspan46">酬金为担任董事有权收取的酬金以外的酬金。</tspan></text>

    <text
       xml:space="preserve"
       transform="matrix(1,0,0,-1,170.079,505.012)"
       style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none"
       id="text90"><tspan
         x="0 13.31 26.620001 39.93 53.240002 66.550003 79.860001 93.169998 106.48 119.79 133.10001 146.41 159.72 173.03 186.34 199.64999 212.96001 226.27 239.58 250.8847 262.60629 275.91629 289.22629 302.53629 315.84631 329.15631"
         y="0"
         id="tspan58">董事有权随时及不时委任任何人士出任董事，以填补临时空</tspan><tspan
         x="-28.347 -14.971 -1.595 11.781 25.157 38.533001 51.909 65.285004 78.661003 92.037003 103.3428 115.1425 128.51849 141.8945 155.27049 168.6465 182.02251 195.3985 208.77451 222.1505 235.5265 248.9025 262.2785 275.65451 289.03049 302.40649 315.7825 329.15851"
         y="15.9995"
         id="tspan60">缺或增加现有董事人数。以此方式委任的董事任期将于本公司下</tspan><tspan
         x="-28.347 -15.3406 -2.3341999 10.6722 23.6786 36.685001 49.691399 62.6978 75.704201 88.710602 100.0164 111.3827 124.3891 137.39549 150.4019 163.40829 176.4147 189.4211 202.42751 215.4339 228.44031 241.4467 254.45309 265.76001 277.12521 290.13159 303.138 316.14441 329.15079"
         y="31.999001"
         id="tspan62">届股东大会举行时届满，届时有资格于会上膺选连任，惟将不会计</tspan><tspan
         x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 178.9458 191.9016 204.85741 217.8132 230.769 242.0748"
         y="47.998501"
         id="tspan64">入该会议的董事人数及于会上将轮值退任的董事。</tspan><tspan
         x="0 12.9646 25.929199 38.893799 51.858398 64.822998 77.787598 90.752197 103.7168 116.6814 129.646 142.6106 155.5752 168.53979 181.50439 194.46899 207.43359 220.39819 233.36279 246.32739 259.29199 272.25659 278.94571 290.26251 303.22711 316.19171 329.15631"
         y="79.998596"
         id="tspan66">本公司可通过普通决议案将任何任期未届满的董事（包括董事</tspan><tspan
         x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 100.5136 107.3127 120.362 133.4113 146.4606 159.5099 172.5592 185.60851 198.65781 211.70711 224.75639 237.80569 250.855 263.9043 276.95361 290.0029 303.05219 316.1015 329.15079"
         y="95.9981"
         id="tspan68">总经理或其他执行董事）免职而毋须受组织章程细则或本公司与该</tspan><tspan
         x="-28.347 -14.971 -1.595 11.781 25.157 38.533001 51.909 65.285004 78.661003 92.037003 105.413 118.789 130.0948 141.8945 155.27049 168.6465 182.02251 195.3985 208.77451 222.1505 235.5265 248.9025 262.2785 275.65451 289.03049 302.40649 315.7825 329.15851"
         y="111.9976"
         id="tspan70">董事订立的任何协议的规限，惟不得影响就因终止其董事任期或</tspan><tspan
         x="-28.347 -15.1063 -1.8656 11.3751 24.615801 37.856499 51.097198 64.337898 77.578598 90.819298 104.06 117.3007 130.5414 143.7821 157.0228 170.2635 183.5042 196.7449 209.9856 223.2263 236.467 249.7077 262.94839 276.18909 289.42981 302.6705 315.91119 329.15189"
         y="127.9971"
         id="tspan72">因终止其董事任期而获得的任何其他委任或任职应付的赔偿或损</tspan><tspan
         x="-28.347 -14.971 -1.595 11.781 25.157 38.533001 51.909 65.285004 76.590797 88.390503 101.7665 115.1425 128.51849 141.8945 155.27049 168.6465 182.02251 195.3985 208.77451 222.1505 235.5265 248.9025 262.2785 275.65451 289.03049 302.40649 315.7825 329.15851"
         y="143.9966"
         id="tspan74">害赔偿而提出索偿。本公司可通过普通决议案委任另一名人士取</tspan><tspan
         x="-28.347 -14.971 -1.595 11.781 23.0868 34.886501 48.262501 61.6385 75.014503 88.390503 101.7665 115.1425 128.51849 141.8945 155.27049 168.6465 182.02251 195.3985 208.77451 222.1505 235.5265 248.9025 262.2785 275.65451 289.03049 302.40649 315.7825 329.15851"
         y="159.99609"
         id="tspan76">代其职位。按上述方式委任的任何董事的任期将与其替任的董事</tspan><tspan
         x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 138.42841"
         y="175.99561"
         id="tspan78">如不被免职而应有的任期相同。</tspan><tspan
         x="0 13.31 26.620001 39.93 53.240002 66.550003 79.860001 93.169998 106.48 119.79 133.10001 146.41 159.72 173.03 186.34 199.64999 212.96001 226.27 239.58 252.89 266.20001 277.5047 289.22629 302.53629 315.84631 329.15631"
         y="207.9957"
         id="tspan80">本公司亦可通过普通决议案选任任何人士为董事，以填补临</tspan><tspan
         x="-28.347 -14.971 -1.595 11.781 25.157 38.533001 51.909 65.285004 78.661003 92.037003 105.413 118.789 130.0948 141.8945 155.27049 168.6465 182.02251 195.3985 208.77451 222.1505 235.5265 248.9025 262.2785 275.65451 289.03049 302.40649 315.7825 329.15851"
         y="223.99519"
         id="tspan82">时空缺或增加现有董事人数。任何未经董事推荐的人士均不可于</tspan><tspan
         x="-28.347 -14.971 -1.595 11.781 25.157 38.533001 51.909 65.285004 78.661003 92.037003 105.413 118.789 130.0948 141.8945 155.27049 168.6465 182.02251 195.3985 208.77451 222.1505 235.5265 248.9025 262.2785 275.65451 289.03049 302.40649 315.7825 329.15851"
         y="239.99471"
         id="tspan84">任何股东大会上获选为董事，除非自安排有关选举的大会通告寄</tspan><tspan
         x="-28.347 -15.2933 -2.2395999 10.8141 23.8678 36.921501 49.975201 63.0289 76.082603 89.136299 102.19 115.2437 128.29739 141.3511 154.4048 167.4585 180.51221 193.5659 206.6196 219.67329 232.72701 245.7807 258.83441 271.88809 278.57501 289.99631 303.04999 316.1037 329.15741"
         y="255.9942"
         id="tspan86">发日期翌日起至不迟于该等大会举行日期前七日的期间（须最少七</tspan><tspan
         x="-28.347 -17.041201 -11.2354 0.0704 12.8271 25.583799 38.3405 51.097198 63.853901 76.610603 89.367302 102.124 114.8807 127.6374 140.3941 153.1508 165.9075 178.6642 191.4209 204.1776 216.9343 229.69099 242.44769 248.2612 259.56589 272.3226 285.07932 297.836 310.59271 323.3494 334.65521"
         y="271.99371"
         id="tspan88">日），由有资格出席大会并于会上投票的本公司股东（非获提名人士）</tspan></text>

         y="0"

    <text

         y="0"
         id="tspan80">修订现有股份或类别股份的权利</tspan></text>
    <text
       xml:space="preserve"

       id="text106"><tspan
         x="0 12.9437 25.8874 38.8311 51.774799 64.718498 77.662201 90.605904 103.5496 116.4933 129.437 142.38071 155.3244 168.2681 181.21181 194.1555 207.0992 220.04289 232.9866 244.2924 255.59711 268.5408 281.4845 294.42819 307.37189 320.31561 333.25931 346.203 357.50879"
         y="0"
         id="tspan84">倘本公司股本在任何时间分为不同类别股份，根据公司法的规定，</tspan><tspan
         x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 62.460201 75.432503 88.4048 101.3771 114.3494 127.3217 140.29401 153.2663 164.5721 175.89661 188.8689 201.8412 214.81351 227.7858 240.7581 253.73039 266.7027 279.67499 292.64731 305.6196 318.59189 331.56421 344.5365 357.50879"
         y="15.9995"
         id="tspan86">除非某类股份的发行条款另有规定，否则任何类别股份于发行时所附有</tspan><tspan
         x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 62.460201 73.765999 85.0905 98.062798 111.0351 124.0074 136.97971 149.952 162.9243 175.89661 188.8689 201.8412 214.81351 227.7858 240.7581 253.73039 266.7027 279.67499 292.64731 305.6196 318.59189 331.56421 344.5365 357.50879"
         y="31.999001"
         id="tspan88">的全部或任何权利，可经由不少于持有该类已发行股份面值四分之三的</tspan><tspan
         x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 60.793701 72.118202 85.0905 98.062798 111.0351 124.0074 136.97971 149.952 162.9243 175.89661 188.8689 201.8412 214.81351 227.7858 240.7581 253.73039 266.7027 279.67499 292.64731 305.6196 318.59189 331.56421 344.5365 357.50879"
         y="47.998501"
         id="tspan90">持有人书面同意，或经由该类股份持有人在另行召开的股东大会上通过</tspan><tspan
         x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 62.460201 75.432503 88.4048 101.3771 114.3494 127.3217 138.6275 149.952 162.9243 175.89661 188.8689 201.8412 214.81351 227.7858 240.7581 253.73039 266.7027 279.67499 292.64731 305.6196 318.59189 331.56421 344.5365 357.50879"
         y="63.998001"
         id="tspan92">特别决议案批准而修订或废除。组织章程细则中关于股东大会的所有规</tspan><tspan
         x="-28.3459 -15.257 -2.1681001 10.9208 24.009701 37.098598 50.1875 63.276402 74.5811 86.044197 99.133102 112.222 125.3109 138.3998 151.48869 164.57761 177.6665 190.7554 203.8443 216.9332 230.02209 241.3279 252.7899 265.87881 278.96771 292.05661 305.14551 318.23441 331.3233 344.4122 357.5011"
         y="79.997498"
         id="tspan94">定作出必要修订后，适用于各次另行召开的大会，惟该等大会及其任何</tspan><tspan
         x="-28.3459 -15.0403 -1.7347 11.5709 24.876499 38.182098 51.487701 64.793297 78.0989 91.404503 104.7101 118.0157 131.3213 144.62691 157.9325 171.2381 184.5437 197.8493 211.15491 224.46049 237.7661 251.0717 264.37729 277.68289 290.98849 304.2941 317.5997 330.9053 344.21091 357.51651"
         y="95.997002"
         id="tspan96">续会之法定人数须为于召开有关会议之日合共持有该类已发行股份面</tspan><tspan
         x="-28.3459 -15.3901 -2.4342999 10.5215 23.477301 36.433102 49.388901 62.3447 75.300499 88.256302 101.2121 107.8957 119.2004 132.1562 145.112 158.06779 171.02361 183.9794 196.9352 209.89101 222.8468 235.8026 248.75841 261.7142 274.67001 285.9758 291.77939"
         y="111.9965"
         id="tspan98">值不少于三分之一的人士（或其受委代表或正式授权代表）。</tspan><tspan
         x="0 13.376 26.752001 40.127998 53.504002 66.879997 80.255997 93.632004 107.008 120.384 133.75999 147.136 160.51199 173.888 187.26401 200.64 214.01601 227.392 240.76801 252.07491 263.8746 277.25061 290.62659 304.00259 317.3786 330.75461 344.13062 357.50659"
         y="143.9966"
         id="tspan100">除非有关股份所附权利或发行条款另有规定，否则赋予任何类别</tspan><tspan
         x="-28.3459 -15.0403 -1.7347 11.5709 24.876499 38.182098 51.487701 64.793297 78.0989 91.404503 104.7101 118.0157 131.3213 144.62691 157.9325 171.2381 184.5437 197.8493 211.15491 224.46049 237.7661 251.0717 264.37729 277.68289 290.98849 304.2941 317.5997 330.9053 344.21091 357.51651"
         y="159.99609"
         id="tspan102">股份持有人的特别权利不得因设立或发行与其享有同等权益的其他股</tspan><tspan
         x="-28.3459 -15.3901 -2.4342999 10.5215 23.477301 36.433102 49.388901 60.694698"
         y="175.99561"
         id="tspan104">份而视为被修订。</tspan></text>

    <text

       id="text46"><tspan
         x="0 13.376 26.752001 40.127998 53.504002 66.879997 80.255997 93.632004 107.008 120.384 133.75999 147.136 160.51199 173.888 187.26401 198.57091 210.37061 223.7466 237.1226 250.4986 263.8746 277.25061 290.62659 304.00259 317.3786 330.75461 344.13062 357.50659"
         y="0"
         id="tspan38">不论当时所有法定股本是否已发行，亦不论当时所有已发行股份</tspan><tspan
         x="-28.3459 -15.3142 -2.2825 10.7492 23.780899 35.0867 46.480499 59.512199 72.5439 85.5756 98.6073 111.639 124.6707 137.70239 150.7341 163.76579 176.7975 189.82919 202.8609 215.89259 228.9243 241.95599 254.9877 268.01941 281.05109 294.08279 307.1145 320.14621 333.17789 346.20959 357.51541"
         y="15.9995"
         id="tspan40">是否已缴足，本公司可不时以普通决议案透过增设新股份而增加股本，</tspan><tspan
         x="-28.3459 -15.3901 -2.4342999 10.5215 23.477301 36.433102 49.388901 62.3447 75.300499 88.256302 101.2121 112.5179 123.8226 136.7784 149.73421 162.69 175.6458 188.60159 201.5574 214.5132 227.46899 240.4248 253.3806 266.3364 279.29221 292.24799 305.2038 318.15961 331.11539 342.4223"
         y="31.999001"
         id="tspan42">新股本数额由决议案规定，并将股本分为决议案所规定面额的股份。</tspan><tspan
         x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 166.77541"
         y="63.9991"
         id="tspan44">本公司可不时通过普通决议案：</tspan></text>
    <text
       xml:space="preserve"
       transform="matrix(1,0,0,-1,141.732,585.0128)"

    <text

       style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none"
       id="text74"><tspan
         x="0 13.31 26.620001 39.93 53.240002 66.550003 79.860001 93.169998 106.48 119.79 133.10001 146.41 159.72 173.03 186.34 199.64999 212.96001 226.27 239.58 252.89 266.20001 279.51001 292.82001 306.13 317.43579 329.15741"
         y="0"
         id="tspan52">将所有或任何股本合并及分成面值大于现有股份的股份。在</tspan><tspan
         x="0 13.31 26.620001 39.93 53.240002 66.550003 79.860001 93.169998 106.48 119.79 133.10001 146.41 159.72 173.03 186.34 199.64999 212.96001 226.27 239.58 252.89 266.20001 279.51001 292.82001 306.13 317.43579 329.15741"
         y="15.9995"
         id="tspan54">合并已缴足股份并将其分为面值大于现有股份的股份时，董</tspan><tspan
         x="0 13.31 26.620001 39.93 53.240002 66.550003 79.860001 93.169998 106.48 119.79 133.10001 146.41 159.72 173.03 186.34 199.64999 212.96001 226.27 239.58 252.89 266.20001 279.51001 292.82001 304.12579 315.84741 329.15741"
         y="31.999001"
         id="tspan56">事或须以其认为适当的方式解决任何可能出现的困难，尤其</tspan><tspan
         x="0 6.6847 18.366699 31.6415 44.916302 58.191101 71.465897 84.7407 98.015503 111.2903 124.5651 137.8399 151.1147 164.3895 177.66431 189.3452 196.4072 209.68201 222.9568 236.2316 249.50639 262.78119 276.056 289.33081 302.60559 315.8804 329.15521"
         y="47.998501"
         id="tspan58">是（在不影响上述的一般性原则下）须合并股份的不同持有人</tspan><tspan
         x="-0.0011 13.3089 26.6189 39.928902 53.238899 66.548897 79.858902 93.1689 106.4789 119.7889 133.09891 146.40891 159.7189 173.0289 186.3389 199.6489 212.95889 226.26891 239.5789 252.8889 264.1936 275.91519 289.22519 302.53519 315.84521 329.15521"
         y="63.998001"
         id="tspan60">之间如何决定将何种股份合并为每一合并股份。倘若任何人</tspan><tspan
         x="-0.0011 13.3089 26.6189 39.928902 53.238899 66.548897 79.858902 93.1689 106.4789 119.7889 133.09891 146.40891 159.7189 173.0289 186.3389 199.6489 212.95889 226.26891 239.5789 252.8889 264.1936 275.91519 289.22519 302.53519 315.84521 329.15521"
         y="79.997498"
         id="tspan62">士因股份合并而获得合并股份或股份的零碎股，则该零碎股</tspan><tspan
         x="-0.0011 13.3089 26.6189 39.928902 53.238899 66.548897 79.858902 93.1689 106.4789 119.7889 133.09891 146.40891 159.7189 173.0289 184.3336 196.05521 209.3652 222.6752 235.9852 249.2952 262.60519 275.91519 289.22519 302.53519 315.84521 329.15521"
         y="95.997002"
         id="tspan64">份可由董事就此委任的人士出售，且就此委任的人士或会将</tspan><tspan
         x="-0.0011 13.4629 26.926901 40.3909 53.8549 67.318901 80.782898 94.246902 107.7109 119.0167 130.9198 144.3838 157.84779 171.3118 184.7758 198.23981 211.7038 225.1678 238.63181 252.09579 265.55981 279.0238 292.48779 303.79361 315.69669 329.16071"
         y="111.9965"
         id="tspan66">售出股份转让予买方，对该项转让的有效性不得异议，并将</tspan><tspan
         x="-0.0011 13.1648 26.3307 39.496601 52.662498 65.8284 78.994301 92.160202 105.3261 118.492 131.6579 144.82381 157.9897 171.15559 184.3215 197.4874 210.65331 223.8192 236.98511 250.151 263.31689 276.48279 289.64871 302.81461 315.9805 329.14639"
         y="127.996"
         id="tspan68">出售所得款项扣除有关出售费用后的净额按原应获得合并股</tspan><tspan
         x="-0.0011 13.3089 26.6189 39.928902 53.238899 66.548897 79.858902 93.1689 106.4789 119.7889 133.09891 146.40891 159.7189 173.0289 186.3389 199.6489 212.95889 226.26891 239.5789 252.8889 266.19891 279.50891 292.81891 306.12891 317.43469 329.15631"
         y="143.9955"
         id="tspan70">份或股份的零碎股之人士之权利或权益比例分派予彼等，或</tspan><tspan
         x="-0.0011 12.9547 25.9105 38.866299 51.822102 64.777901 77.733704 90.689499 103.6453 116.6011 129.5569 142.5127 155.46851 166.77431"
         y="159.995"
         id="tspan72">支付予本公司而归本公司所有；</tspan></text>

       id="text86"><tspan
         x="0 13.1659 26.3318 39.4977 52.663601 65.829498 78.995399 92.161301 105.3272 118.4931 131.659 144.82491 157.9908 171.15669 184.3226 197.48849 210.6544 223.8203 236.98621 250.1521 263.31799 276.48389 289.64981 302.8157 315.9816 329.14749"
         y="0"
         id="tspan80">注销在决议案通过当日仍未被任何人士认购或同意认购的股</tspan><tspan

         y="15.9995"
         id="tspan82">份，并将股本按所注销股份的面额减少，惟须受公司法条文</tspan><tspan
         x="0 12.9558 25.9116 37.2174 48.522099"

         id="tspan94">惟不得违反公司法的规定，且有关分拆股份的决议案可决定</tspan><tspan

         id="tspan96">在分拆股份引致的股份持有人之间，其中一股或更多股股份</tspan><tspan
         x="0 12.837 25.674 38.511002 51.348 64.184998 77.022003 89.859001 102.696 115.533 128.37 141.207 154.04401 166.881 179.718 192.55499 203.86189 215.1666 228.0036 240.84061 253.6776 266.51459 279.35159 292.1886 305.0256 317.86261 329.1684"

         id="tspan98">可较其他股份有优先或其他特别权利，或有递延权利或限制，</tspan><tspan
         x="0 13.31 26.620001 39.93 53.240002 66.550003 79.860001 93.169998 106.48 119.79 133.10001 146.41 157.71471 169.43739 182.74741 196.0574 209.3674 222.6774 235.9874 249.29739 262.60739 275.91739 289.22739 302.53741 315.84741 329.15741"

         id="tspan100">而该等优先或其他特别权利、递延权利或限制为本公司可附</tspan><tspan

         id="tspan104">本公司可在符合公司法指定的任何条件下，通过特别决议案以任</tspan><tspan

    <text

         y="0"
         id="tspan38">组织章程细则内定义的「特别决议案」一词拥有公司法所界定的涵义，</tspan><tspan
         x="-28.3459 -15.3879 -2.4298999 10.5281 23.486099 36.444099 49.4021 62.3601 75.3181 88.2761 101.2341 114.1921 127.1501 140.10809 153.0661 166.02409 178.9821 191.94009 204.8981 217.85609 230.8141 243.77209 250.45351 261.76151 274.71951 287.67749 300.6355 311.94461 318.6315 331.58951 344.54749 357.50549"
         y="15.9995"
         id="tspan40">指须由有权投票的本公司股东在股东大会上亲自或（如为公司）其正式授</tspan><tspan
         x="-28.3459 -15.3318 -2.3176999 10.6964 23.710501 36.724602 49.738701 62.7528 69.436401 80.810402 93.824501 106.8386 118.2126 124.9655 137.9796 150.9937 164.0078 177.0219 190.036 203.05009 216.06419 229.07829 242.09241 255.10651 268.12061 281.1347 294.1488 307.1629 320.177 333.1911 346.2052 357.51099"
         y="31.999001"
         id="tspan42">权代表或受委代表（倘允许）以不少于四分之三大多数票通过的决议案，</tspan><tspan
         x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 62.460201 75.432503 88.4048 101.3771 114.3494 127.3217 140.29401 153.2663 166.2386 179.21091 192.1832 205.1555 218.12781 231.1001 244.0724 257.04471 268.35049 279.67499 292.64731 305.6196 318.59189 331.56421 344.5365 357.50879"
         y="47.998501"
         id="tspan44">而指明拟提呈特别决议案的有关大会通告已正式发出，亦包括由有权在</tspan><tspan
         x="-28.3459 -15.0403 -1.7347 11.5709 24.876499 38.182098 51.487701 64.793297 78.0989 91.404503 104.7101 118.0157 131.3213 144.62691 157.9325 171.2381 184.5437 197.8493 211.15491 224.46049 237.7661 251.0717 264.37729 277.68289 290.98849 304.2941 317.5997 330.9053 344.21091 357.51651"
         y="63.998001"
         id="tspan46">本公司股东大会上投票的本公司全体股东以书面方式在一名或多名该</tspan><tspan
         x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 62.460201 75.432503 88.4048 101.3771 114.3494 127.3217 140.29401 153.2663 166.2386 179.21091 192.1832 205.1555 218.12781 231.1001 244.0724 257.04471 270.017 281.32391 292.64841 305.6207 318.59299 331.56531 344.5376 357.50989"
         y="79.997498"
         id="tspan48">等股东签署的一份或多份正式文件上批准的特别决议案，而以此方式获</tspan><tspan
         x="-28.3459 -15.3879 -2.4298999 10.5281 23.486099 36.444099 49.4021 62.3601 75.3181 88.2761 101.2341 114.1921 127.1501 140.10809 153.0661 166.02409 178.9821 191.94009 204.8981 217.85609 230.8141 243.77209 250.45351 261.76151 274.71951 287.67749 300.6355 313.59351 324.90149 331.58951 344.54749 357.50549"
         y="95.997002"
         id="tspan50">采纳的特别决议案的生效日期为该文件或最后一份（如超过一份）文件签</tspan><tspan
         x="-28.3459 -15.3901 -2.4342999 10.5215 21.827299"
         y="111.9965"
         id="tspan52">署的日期。</tspan><tspan
         x="0 13.3353 26.670601 40.005901 51.311699 63.064098 76.399399 89.734703 103.07 116.4053 129.7406 143.0759 156.41119 169.74651 183.0818 191.6376 203.39 216.7253 230.06059 243.3959 256.7312 268.48361 277.48709 290.82239 304.15771 317.49301 330.82831 344.1636 357.4989"
         y="143.9966"
         id="tspan54">另一方面，组织章程细则内定义的「普通决议案」一词指由有权投</tspan><tspan
         x="-28.3459 -15.2152 -2.0845001 11.0462 24.176901 37.307598 50.438301 63.569 76.699699 89.830399 102.9611 116.0918 129.2225 142.3532 155.4839 168.61459 181.7453 194.87601 208.0067 221.13741 234.2681 247.3988 260.52951 273.66019 286.79089 299.9216 313.05231 326.18301 339.31369 345.99289 357.50439"
         y="159.99609"
         id="tspan56">票的本公司股东在根据组织章程细则规定举行的股东大会上亲自或（如</tspan><tspan
         x="-28.3459 -15.9148 -3.4837 7.8221002 13.6268 26.057899 38.488998 50.920101 63.3512 75.782303 88.213402 100.6445 113.0756 125.5067 137.93781 150.3689 156.1758 167.4816 179.9127 192.3438 203.6496 209.4543 221.88541 234.3165 246.7476 259.17871 271.6098 284.04089 296.47198 308.90311 321.3342 333.76529 346.19641 357.5022"
         y="175.99561"
         id="tspan58">为公司）其正式授权代表或受委代表（倘允许）以简单多数票通过的决议案，</tspan><tspan
         x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 178.9458 191.9016 204.85741 217.8132 230.769 243.72479 255.03059"
         y="191.9951"
         id="tspan60">亦包括所有上述本公司股东书面批准的普通决议案。</tspan></text>

         y="0"
         id="tspan72">除任何类别股份当时附有的有关投票的任何特别权利、优先权或</tspan><tspan
         x="-28.3459 -15.0942 -1.8425 9.4622002 21.116699 34.368401 47.620098 60.871799 74.123497 87.375198 100.6269 113.8786 127.1303 140.382 153.6337 166.88541 180.1371 193.38879 206.6405 219.8922 233.14391 246.3956 259.64731 272.89899 286.1507 299.4024 312.65411 319.3465 331.00101 344.25269 357.50439"
         y="15.9995"
         id="tspan74">限制外，每位亲自出席任何以投票方式表决的股东大会的股东（倘股东</tspan><tspan
         x="-28.3459 -15.1063 -1.8667001 9.4391003 21.0793 34.318901 47.558498 60.7981 74.037697 87.277298 100.5169 113.7565 125.3967 132.42239 145.662 158.9016 172.1412 185.3808 198.62041 211.86 225.09959 238.3392 251.5788 264.81839 278.05801 291.29761 304.5372 317.77679 331.01639 344.25601 357.49561"
         y="31.999001"
         id="tspan76">为公司，则其正式授权代表）或受委代表按本公司股东名册中以其名义</tspan><tspan
         x="-28.3459 -15.3901 -2.4342999 10.5215 23.477301 36.433102 49.388901 60.694698 72.000504 84.956299 97.912102 110.8679 122.1737"
         y="47.998501"
         id="tspan78">登记的股份投票，一股一票。</tspan><tspan
         x="0 13.376 26.752001 40.127998 53.504002 66.879997 78.186897 89.986603 103.3626 116.7386 130.11459 143.4906 156.86659 170.2426 183.61861 196.9946 210.37061 223.7466 237.1226 250.4986 263.8746 277.25061 290.62659 304.00259 317.3786 330.75461 344.13062 357.50659"
         y="79.998596"
         id="tspan80">根据上市规则，倘股东不得就任何特定决议案投票或仅限于就任</tspan><tspan
         x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 62.460201 75.432503 88.4048 101.3771 114.3494 127.3217 138.6275 149.952 162.9243 175.89661 188.8689 201.8412 214.81351 227.7858 240.7581 253.73039 266.7027 279.67499 292.64731 305.6196 318.59189 331.56421 344.5365 357.50879"
         y="95.9981"
         id="tspan82">何特定决议案投赞成或反对票，则该股东或代表该股东违反该规定或限</tspan><tspan
         x="-28.3459 -15.3901 -2.4342999 10.5215 23.477301 36.433102 49.388901 62.3447 75.300499 88.256302 101.2121 114.1679 125.4737"
         y="111.9976"
         id="tspan84">制的任何投票不得计算在内。</tspan><tspan
         x="0 13.376 26.752001 40.127998 53.504002 66.879997 80.255997 93.632004 107.008 120.384 133.75999 147.136 160.51199 173.888 185.1949 196.9946 210.37061 223.7466 237.1226 250.4986 263.8746 277.25061 290.62659 304.00259 317.3786 330.75461 344.13062 357.50659"
         y="143.9977"
         id="tspan86">倘属任何股份的联名登记持有人，则任何一名该等人士均可于大</tspan><tspan
         x="-28.3459 -15.6915 -3.0371001 9.6173 22.2717 34.926102 47.580502 60.234901 72.889297 78.695099 90.0009 102.6553 115.3097 127.9641 140.6185 153.2729 165.92731 178.5817 191.2361 203.8905 215.1963 221.0032 232.30901 244.96339 257.6178 270.27219 282.92661 295.58099 308.23541 320.8898 333.54419 346.19861 357.50439"
         y="159.99719"
         id="tspan88">会上就有关股份投票（不论亲自或由受委代表），犹如为唯一有权投票者，</tspan><tspan
         x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 62.460201 75.432503 88.4048 101.3771 114.3494 127.3217 140.29401 153.2663 166.2386 179.21091 192.1832 205.1555 218.12781 231.1001 244.0724 257.04471 270.017 282.98929 294.2962 305.6207 318.59299 331.56531 344.5376 357.50989"
         y="175.9967"
         id="tspan90">惟倘超过一名联名登记持有人亲自或由受委代表出席大会，则仅上述出</tspan><tspan

         id="tspan92">席会议的人士中排名最先或（视情况而定）较先者有权就有关联名登记股</tspan><tspan

         y="207.9957"

         id="tspan30">任何管辖法院或主管官员颁令其确实或可能神志失常或因其他原</tspan><tspan
         x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 62.460201 75.432503 88.4048 101.3771 114.3494 127.3217 138.6275 149.952 162.9243 175.89661 188.8689 201.8412 214.81351 227.7858 240.7581 253.73039 266.7027 279.67499 292.64731 305.6196 318.59189 331.56421 344.5365 357.50879"
         y="15.9995"
         id="tspan32">因不能处理事务的本公司股东，可由任何在此情况下获授权人士代其表</tspan><tspan
         x="-28.3459 -17.041201 -5.7354002 7.2203999 20.176201 33.132 46.087799 59.043598 71.999397 84.9552 97.911003 110.8668 123.8226 136.7784 148.0842"
         y="31.999001"
         id="tspan34">决，该人士亦可由受委代表表决。</tspan><tspan
         x="0 13.376 26.752001 40.127998 53.504002 66.879997 80.255997 93.632004 107.008 120.384 133.75999 147.136 160.51199 173.888 187.26401 200.64 214.01601 227.392 240.76801 252.07491 263.8746 277.25061 290.62659 304.00259 317.3786 330.75461 344.13062 357.50659"
         y="63.9991"
         id="tspan36">除组织章程细则明文规定或董事另有决定外，并非正式登记为本</tspan><tspan
         x="-28.3459 -15.0403 -1.7347 11.5709 24.876499 38.182098 51.487701 64.793297 78.0989 91.404503 104.7101 118.0157 131.3213 144.62691 157.9325 171.2381 184.5437 197.8493 211.15491 224.46049 237.7661 251.0717 264.37729 277.68289 290.98849 304.2941 317.5997 330.9053 344.21091 357.51651"
         y="79.998596"
         id="tspan38">公司股东及已就其股份支付当时应付本公司总额的人士一概不得亲自</tspan><tspan
         x="-28.3459 -15.2152 -2.0845001 11.0462 24.176901 37.307598 50.438301 63.569 76.699699 89.830399 102.9611 116.0918 129.2225 142.3532 155.4839 168.61459 175.2971 186.80859 199.9393 213.07001 226.2007 239.33141 252.4621 265.5928 278.72351 291.85419 304.98489 318.1156 331.24631 344.37701 357.50769"
         y="95.9981"
         id="tspan40">或委派代表出席任何股东大会或投票（惟作为本公司另一股东的受委代</tspan><tspan

         id="tspan42">表除外）或计入法定人数内。</tspan><tspan

         y="143.9977"
         id="tspan44">于任何股东大会上，提呈大会表决的决议案须以投票方式表决，惟</tspan><tspan

         id="tspan50">倘一间认可结算所（或其代名人）为本公司股东，则可授权其认为适</tspan><tspan

         id="tspan56">权须列明该等获授权人士各自所代表的股份数目及类别。根据本规定获</tspan><tspan

         id="tspan58">授权的人士可代表该认可结算所（或其代名人）行使该认可结算所（或其</tspan><tspan

         id="tspan60">代名人）犹如持有授权所指定股份数目及类别的本公司个别股东而可行</tspan><tspan

         y="303.9938"
         id="tspan62">使的相同权利及权力，包括（倘允许以举手方式表决）以个别举手表决方</tspan><tspan

         y="239.99361"
         id="tspan58">邮寄后即停止寄出股息支票或股息单。两名或以上联名持有人的任何一</tspan><tspan
         x="0 13.3056 26.6112 39.916801 53.222401 66.528 79.833603 93.139198 106.4448 119.7504 133.056 146.3616 159.66721 172.97279 186.2784 199.584 212.8896 226.19521 239.50079 252.8064 266.112 279.4176 292.72321 306.02881 319.33441 332.64001 345.94559 359.25119 372.55679 385.8624"
         y="255.9931"
         id="tspan60">人可就该等联名持有人所持股份的任何股息或其他应付款项或可分配</tspan><tspan

         id="tspan62">财产发出有效收据。</tspan><tspan
         x="28.3459 41.721901 55.0979 68.4739 81.849899 95.225899 108.6019 121.9779 135.3539 148.7299 162.1059 175.4819 188.85789 202.2339 215.60989 228.9859 242.36189 255.7379 269.11389 282.4899 295.86591 309.24191 322.61789 335.9939 349.3699 362.74591 374.0528 385.85251"

         id="tspan64">所有于宣派股息之日起六年后仍未领取的股息可由董事没收，归</tspan><tspan

         y="351.99231"
         id="tspan68">经本公司股东于股东大会上同意，董事可规定以分派任何类别指</tspan><tspan

         y="367.99179"
         id="tspan70">定资产（尤其是任何其他公司的缴足股份、债券或可认购证券的认股权证）</tspan><tspan
         x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 117.8001 130.88901 143.97791 155.28259 166.7457 179.83459 192.92349 206.01241 219.1013 232.1902 245.2791 258.36801 271.45691 284.54581 297.6347 308.94049 320.4025 333.49139 346.58029 359.66919 372.75809 385.84698"

         y="399.99081"
         id="tspan74">为适当的方式解决，尤其可略去零碎配额、将零碎配额向上或向下约整</tspan><tspan
         x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 218.86369 230.1882 243.16051 256.13281 269.1051 282.07739 295.04971 308.022 320.99429 333.96661 346.9389 359.91119 372.88351 385.8558"

         id="tspan78">产的价值，并可厘定按所厘定的价值向本公司任何股东支付现金，以调</tspan><tspan
         x="0 12.9723 25.944599 38.916901 51.889198 64.861504 76.167297 87.491798 100.4641 113.4364 126.4087 139.381 152.3533 165.32561 178.2979 191.2702 204.24249 217.2148 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471"

         id="tspan80">整各方的权利，并可在董事确认为恰当的情况下将该等指定资产交予受</tspan><tspan

         y="0"
         id="tspan38">凡有权出席本公司会议并于会上投票的本公司股东可委任另一人</tspan><tspan
         x="-28.3459 -21.6612 -10.2223 2.8468001 15.9159 28.985001 40.423901 47.242802 60.311901 73.380997 86.450104 99.519203 112.5883 125.6574 138.7265 151.79559 164.8647 177.93381 191.0029 204.07201 215.37781 226.8167 239.8858 252.9549 266.02399 279.09311 292.1622 305.23129 318.30042 331.36951 344.4386 357.50769"

         id="tspan40">士（须为个人）为其受委代表代其出席及投票，而获委任的受委代表在会</tspan><tspan
         x="-28.3459 -15.3901 -2.4342999 10.5215 23.477301 36.433102 49.388901 62.3447 75.300499 88.256302 101.2121 114.1679 127.1237 140.0795 151.3853 162.6911 175.6469 188.60271 201.5585 214.5143 227.47009 240.4259 253.3817 266.33749 279.2933 292.24911 305.2049 316.51071"
         y="31.999001"
         id="tspan42">上享有与该名股东同等的发言权。受委代表毋须为本公司股东。</tspan><tspan
         x="0 13.376 26.752001 40.127998 53.504002 66.879997 80.255997 93.632004 107.008 120.384 133.75999 147.136 160.51199 173.888 187.26401 200.64 214.01601 227.392 240.76801 254.144 267.51999 280.896 294.272 307.64801 321.02399 332.3309 344.13062 357.50659"
         y="63.9991"
         id="tspan44">委任代表的文据须为通用格式或董事不时批准的其他格式，惟须</tspan><tspan
         x="-28.3459 -15.2152 -2.0845001 11.0462 24.176901 37.307598 50.438301 63.569 76.699699 89.830399 102.9611 116.0918 129.2225 142.3532 155.4839 168.61459 181.7453 194.87601 201.5585 213.07001 226.2007 239.33141 252.4621 265.5928 278.72351 291.85419 304.98489 318.1156 331.24631 344.37701 357.50769"
         y="79.998596"
         id="tspan46">让股东可指示其受委代表表决赞成或反对（或如无作出指示或指示有矛</tspan><tspan

         y="95.9981"
         id="tspan48">盾，则可自行酌情表决）委任表格相关会议所提呈的各项决议案。委任</tspan><tspan

         y="111.9976"
         id="tspan50">代表文据须视为授权受委代表对会议提呈的决议案的任何修改作出其</tspan><tspan

         y="111.9987"
         id="tspan130">组织章程细则规定，本身为公司的本公司股东如委派经该公司董</tspan><tspan

         y="0"
         id="tspan50">倘本公司清盘而可供分派予本公司股东的资产不足以偿还全部缴</tspan><tspan
         x="-28.3459 -15.3736 -2.4013 8.9045 20.229 33.201302 46.173599 59.145901 72.118202 85.0905 98.062798 111.0351 124.0074 136.97971 149.952 162.9243 175.89661 188.8689 201.8412 214.81351 227.7858 240.7581 253.73039 266.7027 279.67499 292.64731 305.6196 318.59189 331.56421 344.5365 357.50879"
         y="15.9995"
         id="tspan52">足股本，则资产的分派方式为尽可能由本公司股东按开始清盘时各自所</tspan><tspan
         x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 62.460201 75.432503 88.4048 101.3771 114.3494 127.3217 140.29401 153.2663 166.2386 179.21091 192.1832 205.1555 216.4613 227.7858 240.7581 253.73039 266.7027 279.67499 292.64731 305.6196 318.59189 331.56421 344.5365 357.50879"
         y="31.999001"
         id="tspan54">持股份的已缴足或应缴足股本比例分担亏损。倘本公司清盘而可供分派</tspan><tspan
         x="-28.3459 -15.4308 -2.5157001 10.3994 23.314501 36.229599 49.144699 62.059799 74.974899 87.889999 100.8051 113.7202 126.6353 139.5504 152.4655 165.3806 178.2957 191.2108 204.1259 217.041 229.9561 242.8712 255.7863 268.70139 281.61649 294.53159 307.44669 320.36179 333.27689 346.19199 357.4978"
         y="47.998501"
         id="tspan56">予本公司股东的资产足以偿还清盘开始时的全部缴足股本并有余额时，</tspan><tspan
         x="-28.3459 -15.8609 -3.3759 9.1091003 21.594101 34.079102 46.564098 59.049099 71.534103 84.019096 96.504097 108.9891 121.4741 133.95911 146.44411 158.92909 171.41409 183.89909 196.38409 208.86909 221.3541 233.8391 246.3241 258.80911 271.2941 283.77911 296.2641 308.74911 321.2341 333.71909 346.2041 357.50989"
         y="63.998001"
         id="tspan58">则余下资产按本公司股东于清盘开始时各自所持已缴足股份的比例分派。</tspan><tspan
         x="-28.3459 -15.4308 -2.5157001 10.3994 23.314501 36.229599 49.144699 62.059799 74.974899 87.889999 100.8051 113.7202 126.6353 139.5504 152.4655 165.3806 178.2957 191.2108 204.1259 217.041 229.9561 242.8712 255.7863 268.70139 281.61649 294.53159 307.44669 320.36179 333.27689 346.19199 357.4978"
         y="79.997498"
         id="tspan60">上述清盘不影响已发行股份持有人根据特别条款及条件所享有的权利。</tspan><tspan
         x="0 13.376 26.752001 40.127998 53.504002 66.879997 78.186897 89.986603 103.3626 116.7386 130.11459 143.4906 156.86659 170.2426 183.61861 196.9946 210.37061 223.7466 237.1226 250.4986 263.8746 277.25061 290.62659 304.00259 317.3786 330.75461 344.13062 357.50659"
         y="111.9976"
         id="tspan62">倘本公司清盘，则清盘人可在获得本公司特别决议案授权及公司</tspan><tspan
         x="-28.3459 -15.0942 -1.8425 11.4092 24.6609 37.912601 51.164299 64.416 77.667702 90.919403 104.1711 117.4228 130.6745 143.92619 155.23199 166.88651 180.1382 193.38989 206.6416 219.8933 233.145 246.3967 259.64841 272.90009 286.15179 299.4035 312.65521 325.90689 332.59821 344.25269 357.50439"
         y="127.9971"
         id="tspan64">法规定的任何其他批准的情况下，将本公司全部或任何部分资产（不论</tspan><tspan
         x="-28.3459 -15.1063 -1.8667001 11.3729 24.612499 37.8521 51.091702 64.331299 77.5709 90.810501 104.0501 115.6914 122.716 135.9556 149.19521 162.4348 175.67439 188.914 202.15359 215.3932 228.6328 241.87241 255.112 268.35159 281.59119 294.83081 306.1366 317.77789 331.01749 344.25711 357.4967"
         y="143.9966"
         id="tspan66">该等资产是否属同类财产）以现金或实物分派予本公司股东，并可就此</tspan><tspan
         x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 62.460201 75.432503 88.4048 101.3771 114.3494 127.3217 140.29401 153.2663 166.2386 179.21091 192.1832 205.1555 218.12781 229.43359 240.7581 253.73039 266.7027 279.67499 292.64731 305.6196 318.59189 331.56421 344.5365 357.50879"
         y="159.99609"
         id="tspan68">为前述分发的任何财产厘定其认为公平的价值，以及决定本公司股东或</tspan><tspan
         x="-28.3459 -15.257 -2.1681001 10.9208 24.009701 37.098598 50.1875 63.276402 76.365303 89.454201 102.5431 115.632 128.7209 140.0256 151.48869 164.57761 177.6665 190.7554 203.8443 216.9332 230.02209 243.11099 256.19989 269.28879 282.37769 295.46661 308.55551 321.64441 334.73331 346.03909 357.5011"
         y="175.99561"
         id="tspan70">不同类别股东之间的分派方式。清盘人可在获得相同授权的情况下，将</tspan><tspan
         x="-28.3459 -15.0403 -1.7347 11.5709 24.876499 38.182098 51.487701 64.793297 78.0989 91.404503 104.7101 118.0157 131.3213 144.62691 157.9325 171.2381 184.5437 197.8493 211.15491 224.46049 237.7661 251.0717 264.37729 277.68289 290.98849 304.2941 317.5997 330.9053 344.21091 357.51651"
         y="191.9951"
         id="tspan72">全部或任何部分资产授予清盘人根据公司法认为适当并以本公司股东</tspan><tspan
         x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 62.460201 75.432503 88.4048 101.3771 114.3494 127.3217 138.6275 149.952 162.9243 175.89661 188.8689 201.8412 214.81351 227.7858 240.7581 253.73039 266.7027 279.67499 292.64731 305.6196 318.59189 331.56421 344.5365 357.50879"
         y="207.9946"
         id="tspan74">为受益人所设立信托的受托人，惟不得强逼本公司股东接受任何涉及债</tspan><tspan
         x="-28.3459 -15.3901 -2.4342999 10.5215 21.827299 33.133099 46.088902 59.044701 72.000504 84.956299 97.912102 110.8679 122.1737"
         y="223.99409"
         id="tspan76">务的资产、股份或其他证券。</tspan></text>

         y="0"
         id="tspan78">根据公司组织章程细则的规定，公司可于董事不时认为适当的开曼群岛</tspan><tspan
         x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 204.79691 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361"
         y="15.9995"
         id="tspan80">境内外地点设立股东名册总册及任何分册。公司法并无规定公司须向开曼群</tspan><tspan
         x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 51.321602 64.599701 77.8778 91.155899 104.434 117.7121 130.9902 144.2683 155.5741 167.2594 180.53751 191.84219 203.5275 216.8056 230.08369 243.3618 256.63989 269.918 283.19611 296.47421 309.75229 323.0304 336.3085 349.58661 362.86469 374.1705 385.8558"
         y="31.999001"
         id="tspan82">岛公司注册处处长递交股东名单。因此，股东姓名及地址并非公开资料，不</tspan><tspan
         x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 47.737801"

         id="tspan84">会供公众查阅。</tspan></text>

         y="0"
         id="tspan96">根据公司法，公司股东一般并无查阅或获得公司股东名册或公司记录副</tspan><tspan
         x="-28.347 -15.3912 -2.4354 10.5204 21.8262 33.130901 46.0867 59.0425 71.998299 84.954102 97.909897 110.8657 123.8215 136.7773 149.73309 162.6889 175.6447 188.60049 201.5563 214.5121 227.4679 240.42371 253.3795 264.6864"

         x="0 12.9723 25.944599 38.916901 51.889198 63.195 74.519501 87.491798 100.4641 113.4364 126.4087 139.381 152.3533 165.32561 178.2979 191.2702 204.24249 217.2148 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471"
         y="0"
         id="tspan110">公司法规定，一项决议案须获至少三分之二有权投票的大多数股东亲自</tspan><tspan
         x="-28.347 -21.6612 -10.1398 2.9986 16.136999 29.2754 42.413799 55.5522 68.690598 80.210899 87.112297 100.2507 113.3891 126.5275 139.66589 152.80431 165.9427 179.0811 192.2195 205.35789 218.49631 231.6347 244.7731 256.07889 267.60031 280.73871 293.87711 307.0155 320.1539 333.2923 346.43069 359.56909 372.70749 385.84589"
         y="15.9995"
         id="tspan112">或（如准许受委代表）其受委代表在股东大会上通过，且载明拟提呈该项决议</tspan><tspan
         x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 182.21941 195.37981 208.54021 219.84599 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 323.5155 336.6759 347.98169 359.52731 372.68771 385.84811"
         y="31.999001"
         id="tspan114">案为特别决议案的股东大会通告已正式发出，方可视为特别决议案，惟公司</tspan><tspan
         x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 335.28989 346.70569 359.755 372.80429 385.85361"
         y="47.998501"
         id="tspan116">可在其组织章程细则中订明所需大多数须为多于三分之二的数目，并可另外</tspan><tspan
         x="-28.347 -15.3142 -2.2814 10.7514 23.784201 36.817001 49.8498 62.882599 69.5662 80.962196 93.995003 107.0278 120.0606 133.0934 146.12621 159.159 172.1918 183.5878 190.3616 203.39439 216.4272 229.46001 242.4928 255.5256 268.55841 281.59119 294.62399 307.6568 320.68961 333.72241 346.75519 359.78799 372.8208 385.85361"
         y="63.998001"
         id="tspan118">规定任何该大多数（即不少于三分之二）可因须以特别决议案批准的任何事宜</tspan><tspan
         x="-28.347 -15.1866 -3.8819001 7.6648002 20.825199 33.9856 47.146 60.3064 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 150.5746 162.12131 175.28169 188.44209 201.60249 214.76289 227.92329 241.08369 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811"
         y="79.997498"
         id="tspan120">而异。倘公司组织章程细则授权，公司当时有权投票的全体股东签署的书面</tspan><tspan
         x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 164.34"
         y="95.997002"
         id="tspan122">决议案亦可具有特别决议案的效力。</tspan></text>

         x="-28.347 -17.041201 -5.4945002 7.6659002 20.8263 33.986698 47.147099 60.307499 73.467903 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 308.50049 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921"

         id="tspan54">公司法允许开曼群岛公司之间以及开曼群岛公司与非开曼群岛公司兼</tspan><tspan

         id="tspan76">为一间合并公司并将该等公司的业务、财产及负债拨归合并公司。为进行兼</tspan><tspan

         y="0"
         id="tspan94">获得参与公司组织章程细则规定的</tspan><tspan

         id="tspan96">其他授权（如有）。兼并或合并的书面计划须连同有关合并或存续公司偿债能</tspan><tspan

         y="31.999001"
         id="tspan98">力的声明、各参与公司的资产及负债清单以及有关兼并或合并证书的副本须</tspan><tspan

         y="47.998501"
         id="tspan100">提交开曼群岛公司注册处存档，并须承诺将向各参与公司的股东及债权人提</tspan><tspan
         x="-229.4798 -216.4305 -203.3812 -190.33189 -177.28259 -164.23331 -151.18401 -138.1347 -125.0854 -112.0361 -98.986801 -85.9375 -72.888199 -59.838902 -46.7896 -33.740299 -20.691 -7.6416998 5.4075999 18.4569 31.506201 44.5555 57.604801 70.654099 83.7034 96.752701 109.802 122.8513 135.9006 147.20641 158.62219 171.67149 184.72079"
         y="63.998001"
         id="tspan102">供兼并或合并证书副本和兼并或合并的通知将在开曼群岛宪报刊登。除若干</tspan><tspan
         x="-229.4798 -216.1676 -202.85539 -189.5432 -176.231 -164.9252 -153.2003 -139.88811 -126.5759 -113.2637 -99.9515 -86.639297 -73.327103 -60.0149 -46.702702 -33.390499 -20.0783 -6.7660999 6.5461001 19.858299 33.170502 46.4827 59.794899 73.107101 86.419296 99.731499 113.0437 126.3559 139.66811 152.9803 166.2925 172.9915 184.7164"
         y="79.997498"
         id="tspan104">特殊情况外，有异议的股东可按照规定的程序获支付彼等股份的公平值（倘</tspan><tspan
         x="-229.4798 -216.5108 -203.54179 -190.5728 -177.60381 -164.6348 -153.33009 -142.0089 -129.0399 -116.0709 -103.1019 -90.132896 -77.163902 -64.194901 -51.225899 -38.256901 -25.287901 -13.9667 -8.1653004 3.1559 16.124901 29.093901 42.062901 55.031898 68.0009 80.969902 93.938904 106.9079 119.8769 132.8459 145.8149 158.78391 171.7529 184.72189"
         y="95.997002"
         id="tspan106">各方未能协定，则由开曼群岛法院厘定）。按照该等监管程序而进行的兼并或</tspan><tspan
         x="-229.4798 -216.524 -203.56821 -190.6124 -177.6566 -164.70081 -151.745 -138.7892 -125.8334 -114.5276"

         id="tspan108">合并无需经法院批准。</tspan></text>

         y="0"
         id="tspan130">价值的大多数股东或债权人赞成及其后获得开曼群岛大法</tspan><tspan
         x="-101.0163 -87.855904 -74.695503 -61.535099 -50.229301 -38.682598 -25.5222 -12.3618 0.79860002 12.1044 23.65 36.810398 49.970798 63.131199 76.291603 89.452003 102.6124 115.7728 128.9332 142.0936 155.254 168.4144 181.5748 194.7352 207.8956 221.056 234.2164 247.3768 260.5372 273.6976 286.858 300.0184 313.1788"
         y="15.9995"
         id="tspan132">院批准后，方可作实。尽管有异议的股东可向大法院表示所申请批准的交易</tspan><tspan
         x="-101.0163 -87.967003 -74.917702 -61.868401 -48.819099 -35.769798 -22.720501 -9.6711998 3.3780999 16.427401 29.4767 42.526001 55.575298 68.624603 79.929298 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 234.88741 247.93671 260.98599 274.03531 287.08459 300.13391 313.1832"
         y="31.999001"
         id="tspan134">对股东所持股份并未给予公平值，惟倘无证据显示管理层有欺诈或不诚实行</tspan><tspan
         x="-101.0163 -89.710503 -78.163803 -65.003403 -51.842999 -38.682598 -25.5222 -12.3618 0.79860002 13.959 27.1194 40.2798 53.440201 66.600601 79.761002 92.921402 106.0818 119.2422 132.4026 145.563 158.7234 171.8838 183.18961 194.7352 207.8956 221.056 234.2164 247.3768 260.5372 273.6976 286.858 300.0184 313.1788"
         y="47.998501"
         id="tspan136">为，大法院不大可能仅因上述理由而否决该项交易，而倘该项交易获批准及</tspan><tspan
         x="-101.0163 -87.704102 -76.3983 -64.673401 -51.361198 -38.049 -24.736799 -11.4246 1.8875999 15.1998 28.511999 41.8242 55.136398 68.448601 81.760803 95.072998 108.3852 121.6974 135.0096 148.32179 161.634 174.9462 188.25841 201.5706 214.8828 228.19501 241.5072 254.8194 268.13159 281.44379 294.75601 301.45499 313.1799"
         y="63.998001"
         id="tspan138">完成，异议股东不会获得类似美国公司异议股东一般所具有之估值权利（即</tspan><tspan
         x="-101.0163 -88.060501 -75.104698 -62.148899 -49.1931 -36.237301 -23.2815 -10.3257 2.6301 15.5859 28.5417 41.497501 54.4533 67.409103 80.364899 93.320702 106.2765 119.2323 132.1881 145.14391 156.45081 162.2522"
