<text id="text30" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 234.88741 247.93671 260.98599 274.03531 287.08459 300.13391 313.1832 326.23251 339.2818 352.33109 365.3804 378.42969 389.73441 401.15021 414.19949" y="0">我们的合约安排未必会在提供经营控制权方面如直接拥有权一样有效。葩趣</tspan><tspan id="tspan28" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 207.2928 220.2486 233.20441 246.1602 259.116 272.07181 285.02759 297.9834 310.93921 322.245" y="15.9995">互娱或其相关股东可能未能履行彼等于合约安排下的责任。</tspan></text>
<text id="text70" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,665.0122)" xml:space="preserve"><tspan id="tspan32" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 259.44601 272.4183 285.39059 298.36292 311.33521 324.3075 335.61441 346.9389 359.91119 372.88351 385.8558" y="0">由于中国限制或禁止外资在中国拥有互联网及其他相关业务，我们通过</tspan><tspan id="tspan34" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 283.09271 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="15.9995">我们并无拥有权权益的葩趣互娱在中国经营一部分业务。我们依赖与葩趣互</tspan><tspan id="tspan36" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 309.19131 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="31.999001">娱及其相关股东之间的一系列合约安排来控制及经营其业务。该等合约安排</tspan><tspan id="tspan38" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 140.88361 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 321.66089 333.20651 346.36691 359.52731 372.68771 385.84811" y="47.998501">旨在使我们有效控制葩趣互娱，并使我们可自其获得经济利益。有关该等合</tspan><tspan id="tspan40" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 73.649399 84.9552 97.911003 110.8668 119.4226 130.72729 143.68311 156.6389 169.5947 180.9005 186.7041" y="63.998001">约安排的更多详情，请参阅「合约安排」。</tspan><tspan id="tspan42" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 205.8903 217.2148 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="95.9981">尽管我们的中国法律顾问向我们表示，我们与葩趣互娱之间的合约安排</tspan><tspan id="tspan44" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 127.7232 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 244.552 257.7124 270.8728 284.0332 297.1936 310.354 323.5144 336.6748 347.98169 359.52731 372.68771 385.84811" y="111.9976">构成有效且具约束力的责任，可根据协议条款对协议各方强制执行，但该等</tspan><tspan id="tspan46" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 283.09271 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="127.9971">合约安排未必在控制葩趣互娱时如直接拥有权一样有效。倘葩趣互娱或其相</tspan><tspan id="tspan48" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 230.89549 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="143.9966">关股东未能履行彼等各自于合约安排下的责任，我们可能承担巨额费用及耗</tspan><tspan id="tspan50" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 139.5504 150.9662 164.0155 177.0648 190.11411 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="159.99609">费巨大资源来执行我们的权利。所有该等合约安排受中国法律规管并据此诠</tspan><tspan id="tspan52" x="-28.347 -17.041201 -5.3558998 7.9222002 21.2003 34.478401 47.7565 61.034599 74.312698 87.590797 100.8689 114.147 127.4251 140.7032 153.98129 167.2594 180.53751 193.8156 207.0937 220.3718 233.6499 246.92799 260.20609 273.48419 286.7623 300.04041 313.31851 326.59659 337.9024 349.58771 362.86581 374.1705 385.8558" y="175.99561">释，而因该等合约安排产生的争议将在中国通过仲裁或诉讼解决。然而，中</tspan><tspan id="tspan54" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 296.1409 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="191.9951">国的法律制度仍在不断演进且不如其他司法权区那般成熟。对于有关可变利</tspan><tspan id="tspan56" x="-28.347 -15.7564 -3.1658001 9.4247999 22.0154 34.605999 47.196602 59.787201 72.3778 84.968399 97.558998 110.1496 122.7402 135.3308 147.9214 160.51199 173.1026 185.69321 198.2838 210.8744 223.465 236.0556 248.64619 261.23679 273.82739 286.418 299.00861 311.59921 324.18979 336.7804 349.371 361.96161 374.55219 385.858" y="207.9946">益实体的合约安排应如何根据中国法律诠释或执行鲜有先例及官方意见可寻。</tspan><tspan id="tspan58" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 217.84621 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="223.99409">有关仲裁或诉讼的结果仍存在重大不确定性。该等不确定性可能限制我们执</tspan><tspan id="tspan60" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 100.4025 111.8172 124.8665 137.9158 150.9651 164.0144 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="239.99361">行该等合约安排的能力。倘我们无法执行该等合约安排或我们在执行该等合</tspan><tspan id="tspan62" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 191.7476 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="255.9931">约安排过程中遭遇重大延误或其他障碍，则我们未必能够有效控制联属公司</tspan><tspan id="tspan64" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 182.21941 195.37981 208.54021 221.70061 233.00639 244.5531 257.7135 269.01929 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="271.99261">并可能会失去对葩趣互娱所拥有资产的控制权。因此，我们可能无法将葩趣</tspan><tspan id="tspan66" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 178.6983 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="287.9921">互娱综合入账至我们的综合财务报表，而我们开展业务的能力可能会受到负</tspan><tspan id="tspan68" x="-28.347 -15.3912 -2.4354 8.8704004" y="303.99161">面影响。</tspan></text>
<text id="text76" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,329.0205)" xml:space="preserve"><tspan id="tspan72" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 234.88741 246.19321 257.60901 270.65829 283.70761 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="0">倘葩趣互娱宣布破产或牵涉解散或清盘程序，我们可能无法使用葩趣互娱所</tspan><tspan id="tspan74" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 205.64281" y="15.9995">持有对我们的业务经营属重大的资产。</tspan></text>
<text id="text92" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,281.0209)" xml:space="preserve"><tspan id="tspan78" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 259.44601 272.4183 285.39059 296.69641 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">我们未必会对葩趣互娱的资产拥有优先抵押及留置权。倘葩趣互娱遭受</tspan><tspan id="tspan80" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 61.9212 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 244.552 257.7124 270.8728 284.0332 295.33899 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="15.9995">非自愿清盘程序，第三方债权人可能申索部分或全部资产，而我们未必就葩</tspan><tspan id="tspan82" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 182.21941 195.37981 206.68671 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 308.50049 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="31.999001">趣互娱的资产对第三方债权人享有优先权。倘葩趣互娱清盘，我们可能根据</tspan><tspan id="tspan84" x="-28.347 -15.4033 -2.4596 10.4841 23.427799 36.371498 49.315201 62.2589 75.202599 88.146301 101.09 114.0337 126.9774 139.9211 152.86481 165.8085 178.7522 191.69591 204.6396 217.5833 230.52699 243.4707 256.4144 269.35809 282.30179 295.24551 308.18921 321.1329 334.0766 347.02029 359.96399 372.90771 385.85141" y="47.998501">中国企业破产法作为普通债权人参与清盘程序并根据适用服务协议收回我们</tspan><tspan id="tspan86" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 99.560997" y="63.998001">欠付的任何未偿还负债。</tspan><tspan id="tspan88" x="0 12.9151 25.8302 38.7453 51.6604 64.5755 77.490601 90.405701 103.3208 116.2359 129.151 142.0661 154.9812 167.8963 180.8114 193.7265 206.6416 219.5567 232.4718 245.3869 258.302 271.2171 284.1322 297.0473 309.9624 322.8775 335.7926 348.7077 361.6228 374.5379 385.84369" y="95.9981">倘葩趣互娱的相关股东试图未经我们事先同意而将葩趣互娱自愿清盘，</tspan><tspan id="tspan90" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 139.5504 150.9662 164.0155 177.0648 190.11411 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="111.9976">为有效预防该未授权自愿清盘，我们可能根据与葩趣互娱相关股东之间的独</tspan></text>

<text id="text42" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 13.046 26.091999 39.138 52.183998 65.230003 78.276001 91.321999 104.368 117.414 130.46001 143.506 156.552 169.59801 182.644 195.69 208.73599 221.782 234.828 247.87399 260.92001 273.966 287.01199 300.05801 313.104 326.14999 339.19601 352.242 365.28799 376.6994 388.11081 401.1568 414.20279" y="0">家购买权协议行使权利要求葩趣互娱相关股东暂缓有关自愿清盘及╱或将彼</tspan><tspan id="tspan28" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 105.2832 118.4436 131.604 144.7644 157.9248 171.08521 184.24561 197.40601 210.56641 223.72681 236.88721 250.04761 263.20801 276.36841 289.52881 300.83569 312.38129 325.54169 336.8475 348.3942 361.5546 374.715 387.8754 401.0358 414.1962" y="15.9995">等各自的全部股权转让予我们指定的中国实体或个人。此外，根据葩趣互娱</tspan><tspan id="tspan30" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 167.8974 179.3132 192.3625 205.4118 218.46111 231.51041 244.55969 257.60901 270.65829 283.70761 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="31.999001">及其相关股东签订的合约安排，葩趣互娱相关股东未经我们同意无权向彼等</tspan><tspan id="tspan32" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 234.88741 247.93671 260.98599 274.03531 287.08459 300.13391 313.1832 326.23251 339.2818 352.33109 363.6369 375.0527 388.10199 401.15131 414.20059" y="47.998501">自身派付股息或以其他方式分派葩趣互娱的保留盈利或其他资产。倘葩趣互</tspan><tspan id="tspan34" x="0 12.9437 25.8874 38.8311 51.774799 64.718498 77.662201 90.605904 103.5496 116.4933 129.437 142.38071 155.3244 168.2681 181.21181 194.1555 207.0992 220.04289 232.9866 245.9303 258.87399 271.81769 284.76141 297.70511 310.6488 323.5925 336.53619 349.47989 362.42361 375.36731 388.311 401.2547 414.19839" y="63.998001">娱相关股东未经我们授权而发起自愿清盘程序或未经我们事先同意而试图分</tspan><tspan id="tspan36" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 167.8974 179.3132 192.3625 205.4118 218.46111 231.51041 244.55969 257.60901 270.65829 283.70761 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="79.997498">派葩趣互娱的保留盈利或资产，我们可能需诉诸法律程序来执行合约安排的</tspan><tspan id="tspan38" x="0 13.1604 24.465099 36.011799 49.172199 62.3326 75.492996 88.653397 101.8138 114.9742 128.1346 141.295 154.4554 167.6158 180.7762 193.9366 207.097 218.4028 229.94949 243.10989 256.27029 269.43069 282.59109 295.7515 308.9119 322.0723 335.2327 348.3931 361.5535 374.7139 387.8743 401.0347 414.1951" y="95.997002">条款。任何相关法律程序可能费用高昂，并分散管理层时间及精力而无法专</tspan><tspan id="tspan40" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 89.040604 100.3453 113.3011 126.2569 139.21271 152.1685 165.1243 178.08009 191.0359 203.9917 216.94749 229.90331 242.8591 255.8149 268.77069 281.7265 294.68231 307.63809 318.94501" y="111.9965">注于业务营运中，且相关法律程序的结果将存在不确定性。</tspan></text>
<text id="text48" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,569.0152)" xml:space="preserve"><tspan id="tspan44" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 234.88741 247.93671 259.24249 270.6572 283.70651 296.7558 309.80511 322.8544 335.90369 348.953 362.00229 375.05161 388.10089 401.15021 414.19949" y="0">葩趣互娱的相关股东可能与我们存在利益冲突，从而对我们的业务产生重大</tspan><tspan id="tspan46" x="0 12.9558 25.9116 38.867401 50.173199" y="15.9995">不利影响。</tspan></text>
<text id="text56" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,521.0156)" xml:space="preserve"><tspan id="tspan50" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 259.44601 272.4183 283.72409 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">葩趣互娱的相关股东可能与我们存在潜在利益冲突，倘彼等认为会促进</tspan><tspan id="tspan52" x="-28.347 -15.1866 -2.0262001 11.1342 22.440001 33.986698 47.147099 60.307499 73.467903 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 176.8965 188.44321 201.60361 214.76401 227.92439 241.08479 254.24519 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="15.9995">自身利益，或者在其他方面恶意行事，彼等可能会违反与我们签订的合约安</tspan><tspan id="tspan54" x="-28.347 -17.041201 -5.7354002 7.2149 20.165199 33.115501 46.0658" y="31.999001">排。我们无法向</tspan></text>
<text id="text74" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,182.0616,489.0166)" xml:space="preserve"><tspan id="tspan58" x="0 12.9503 25.9006 38.850899 50.1567 61.462502 74.412804 87.363098 100.3134 113.2637 126.214 139.16431 152.11459 165.0649 178.0152 190.9655 203.9158 216.8661 229.81641 242.76669 255.717 268.6673 279.97198 291.2778 304.22809 317.17841" y="0">阁下保证，当我们与葩趣互娱之间出现利益冲突时，葩趣互</tspan><tspan id="tspan60" x="-97.022202 -83.9729 -70.923599 -57.874298 -44.825001 -31.7757 -18.7264 -5.6771002 7.3722 20.421499 33.470798 46.5201 59.569401 72.618698 85.667999 98.7173 110.0231 121.4378 134.48711 147.53641 160.58569 173.63499 186.6843 199.7336 212.7829 225.8322 238.8815 251.9308 264.9801 278.02939 291.0787 304.12799 317.17731" y="15.9995">娱的相关股东将按照我们的利益行事，亦无法保证利益冲突将按有利于我们</tspan><tspan id="tspan62" x="-97.022202 -84.066399 -71.110603 -58.1548 -45.199001 -32.243198 -19.287399 -7.9815998" y="31.999001">的方式得以解决。</tspan><tspan id="tspan64" x="-68.675201 -55.5863 -44.281601 -32.818501 -19.729601 -6.6406999 6.4482002 19.5371 32.625999 45.714901 58.803799 71.8927 84.981598 98.070503 111.1594 124.2483 137.3372 150.4261 163.515 176.6039 189.69279 202.78169 215.87061 228.9595 242.0484 255.1373 268.2262 281.31509 294.40399 305.70981 317.17181" y="63.9991">此外，葩趣互娱的相关股东可能违反或促使葩趣互娱违反合约安排。倘</tspan><tspan id="tspan66" x="-97.022202 -84.025703 -71.029198 -58.0327 -45.036201 -32.0397 -19.0432 -6.0467 6.9498 19.946301 32.942799 45.939301 58.935799 71.932297 84.928802 97.925301 110.9218 123.9183 136.91479 149.9113 162.90781 175.9043 188.9008 201.89729 214.8938 227.8903 240.8868 253.8833 266.87979 279.87631 292.8728 305.86929 317.17401" y="79.998596">葩趣互娱或其相关股东违反彼等与我们订立的合约安排或与我们发生争议，</tspan><tspan id="tspan68" x="-97.022202 -83.861801 -70.701401 -57.541 -44.3806 -31.2202 -18.059799 -4.8994002 8.2609997 21.4214 34.581799 45.8876 57.434299 70.594704 83.755096 96.915497 110.0759 123.2363 136.3967 149.5571 162.7175 175.8779 189.0383 202.1987 215.3591 226.6649 238.21159 251.37199 264.53241 277.69281 290.85321 304.01361 317.17401" y="95.9981">我们可能须提起法律诉讼，而有关诉讼涉及重大不确定性。该等争议和诉讼</tspan><tspan id="tspan70" x="-97.022202 -83.915703 -70.809196 -57.702702 -44.596199 -31.4897 -18.3832 -5.2767 7.8298001 20.9363 34.042801 47.1493 60.255798 71.5616 83.044502 96.151001 109.2575 122.364 135.4705 148.577 161.6835 174.78999 187.8965 201.00301 214.1095 227.216 240.32249 253.429 266.53549 279.642 292.7485 305.85501 317.1608" y="111.9976">或会严重干扰我们的业务营运，对我们控制葩趣互娱的能力产生不利影响，</tspan><tspan id="tspan72" x="-97.022202 -83.744102 -70.466003 -57.187901 -43.909801 -30.631701 -17.3536 -4.0755 7.2302999 18.9156 32.193699 45.471802 58.749901 72.028" y="127.9971">进而导致负面宣传。我们无法向</tspan></text>
<text id="text80" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,277.0774,361.0195)" xml:space="preserve"><tspan id="tspan76" x="0 13.2781 26.5562 39.834301 51.141201 62.825401 76.1035 89.381599 102.6597 115.9378 129.2159 142.494 155.77209 169.0502 182.32829 195.6064 208.88451 222.1626" y="0">阁下保证，任何该等争议或诉讼的结果将</tspan><tspan id="tspan78" x="-192.03799 -179.0822 -166.1264 -153.17059 -140.2148 -127.259 -115.9532" y="15.9995">会对我们有利。</tspan></text>
<text id="text86" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,313.0199)" xml:space="preserve"><tspan id="tspan82" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 234.88741 247.93671 259.24249 270.6572 283.70651 296.7558 309.80511 322.8544 335.90369 348.953 362.00229 375.05161 388.10089 401.15021 414.19949" y="0">倘我们行使选择权收购葩趣互娱的股权及资产，所有权或资产转让可能使我</tspan><tspan id="tspan84" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 179.7312" y="15.9995">们受到若干限制及承担巨额成本。</tspan></text>
<text id="text102" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,265.0203)" xml:space="preserve"><tspan id="tspan88" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 76.167297 87.491798 100.4641 113.4364 126.4087 139.381 152.3533 165.32561 178.2979 191.2702 204.24249 217.2148 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">根据合约安排，北京泡泡玛特或其指定人士有独家权利以名义价格从葩</tspan><tspan id="tspan90" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 178.9458 191.9016 204.85741 217.8132 229.1201" y="15.9995">趣互娱相关股东购买其全部或任何部分的股权。</tspan><tspan id="tspan92" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 117.8001 130.88901 142.1937 153.6568 166.7457 179.83459 191.1404 202.6024 215.6913 228.7802 241.86909 254.95799 268.04691 281.1358 294.2247 307.3136 320.4025 333.49139 346.58029 359.66919 372.75809 385.84698" y="47.999599">股权转让可能须经商务部、工信部、国家市场监督管理总局及其他主管</tspan><tspan id="tspan94" x="-28.347 -15.081 -1.8150001 11.451 24.716999 36.386902 48.056801 61.3228 74.588799 87.854797 101.1208 114.3868 127.6528 140.91879 154.1848 167.45081 180.7168 193.9828 207.24879 220.5148 233.78081 247.0468 258.3515 270.02139 283.28741 294.5943 306.26419 319.53021 332.7962 346.06219 359.32819 372.59421 385.8602" y="63.9991">政府机关及╱或彼等地方职能分支机构审批及备案。此外，股权转让价可能</tspan><tspan id="tspan96" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 217.84621 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="79.998596">须由相关税务或商务机关审查并作税项调整。葩趣互娱相关股东将根据合约</tspan><tspan id="tspan98" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 217.84621 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="95.9981">安排向葩趣互娱支付彼等收取的股权转让价。葩趣互娱将收取的金额亦可能</tspan><tspan id="tspan100" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 73.649399 84.9552 97.911003 110.8668 123.8226 136.7784 149.73421 162.69 173.9958" y="111.9976">须缴纳企业所得税。该税款可能高昂。</tspan></text>

<text id="text132" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,120.3329,537.0162)" xml:space="preserve"><tspan id="tspan130" x="0 3.9688001 10.3906" y="0">(d)</tspan></text>
<text id="text166" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,136.0684,537.0162)" xml:space="preserve"><tspan id="tspan134" x="0 12.9558 24.2616 35.567402 48.523201 61.479 74.434799 87.390602 100.3464 113.3022 126.258 139.21381 152.1696 165.1254 178.08121 191.037 203.9928 216.94859 229.9044 242.8602 255.81599 268.77179 280.07761" y="0">法律、行政法规或者国务院规定的其他方式的投资。</tspan><tspan id="tspan136" x="-22.680901 -9.592 3.4969001 16.5858 29.6747 42.763599 54.068298 65.531403 78.6203 91.709198 104.7981 117.887 130.97591 144.0648 157.1537 170.2426 183.3315 196.42039 209.50929 222.59821 235.6871 248.776 261.8649 273.17068 284.63269 297.72159 310.81049 323.89941 336.98831 350.07721 363.16611" y="32.000099">包括我们在内，诸多中国公司通过合约安排开展营运，以取得及维持必</tspan><tspan id="tspan138" x="-51.027901 -38.058899 -25.089899 -12.1209 0.84810001 13.8171 25.1229 36.444099 49.413101 62.382099 75.351097 88.320099 101.2891 114.2581 127.2271 140.19611 153.1651 166.13409 179.1031 192.0721 205.04111 218.0101 230.9791 243.9481 256.91711 269.88611 282.8551 295.8241 307.12991 312.939 324.26129 337.23029 350.19931 363.1683" y="47.999599">要牌照及许可，从而进入现时受中国外商投资限制或禁止的行业。《外商投资</tspan><tspan id="tspan140" x="-51.027901 -39.2854 -33.041801 -19.714199 -6.3866 6.941 20.2686 33.596199 46.923801 60.2514 73.579002 86.906601 100.2342 113.5618 126.8894 140.217 153.5446 166.87219 180.1998 191.5056 203.24809 216.5757 229.90331 243.2309 256.5585 269.88611 283.21371 296.54129 309.8689 323.1965 336.52411 349.85172 363.17929" y="63.9991">法》将四种形式的投资活动界定为外商投资，但并未明确规定合约安排为外</tspan><tspan id="tspan142" x="-51.027901 -38.072102 -25.116301 -12.1605 0.79530001 13.7511 26.7069 39.662701 50.968498" y="79.998596">商投资的形式之一。</tspan><tspan id="tspan144" x="-22.680901 -9.6733999 3.3341 16.3416 29.3491 42.356602 55.364101 66.669899 78.0373 83.845299 95.2127 108.2202 121.2277 134.2352 147.24271 158.61011 164.47861 177.4861 190.49361 203.5011 216.50861 229.5161 242.52361 255.5311 264.08691 275.45541 288.46289 299.76761 311.13501 324.14249 337.14999 350.1575 363.16501" y="111.9987">尽管有上述情况，但《外商投资法》规定外商投资包括「法律、行政法规或</tspan><tspan id="tspan146" x="-51.026798 -37.950001 -24.873199 -11.7964 1.2804 14.3572 27.434 40.510799 53.587601 66.664398 79.741203 92.818001 105.8948 118.9716 130.4193 136.2218 147.66949 160.74631 172.05209 183.4998 196.5766 209.6534 222.73019 235.80701 247.11279 258.55939 271.6362 284.71301 297.78979 310.86661 323.94339 337.0202 350.09698 363.1738" y="127.9982">者国务院规定的其他方式的投资」。因此，未来的法律、行政法规或国务院的</tspan><tspan id="tspan148" x="-51.026798 -37.977501 -24.9282 -11.8789 1.1704 14.2197 27.268999 40.318298 53.367599 66.416901 79.466202 92.515503 105.5648 118.6141 131.66341 144.71271 157.76199 170.81129 183.8606 196.9099 209.9592 223.0085 236.0578 247.3636 258.77939 271.8287 284.87799 297.92731 310.97659 324.02591 337.0752 350.12451 363.1738" y="143.9977">规定条文可能将若干合约安排视为一种外商投资方式，而此举可能影响我们</tspan><tspan id="tspan150" x="-51.026798 -37.977501 -24.9282 -11.8789 1.1704 14.2197 27.268999 40.318298 53.367599 66.416901 79.466202 92.515503 105.5648 118.6141 131.66341 144.71271 156.01849 167.4332 180.4825 193.5318 206.5811 219.6304 232.6797 245.729 258.77829 271.82761 284.87689 297.92621 310.97549 324.02481 337.0741 350.12341 363.1727" y="159.99719">的合约安排是否将被认定为外商投资、合约安排是否将被视为违反外商投资</tspan><tspan id="tspan152" x="-51.026798 -38.070999 -25.1152 -12.1594 -0.85360003 10.4511 23.4069 36.362701 49.318501 60.624298 71.930099 84.885902 97.841698 110.7975 123.7533 136.70911 149.6649 162.6207 175.57651 188.5323 201.4881 214.44389 227.3997 240.3555 253.31129 264.6171" y="175.9967">准入规定，有鉴于此，合约安排将如何处理存在不确定性。</tspan><tspan id="tspan154" x="-22.6798 -9.4776001 3.7246001 16.9268 30.129 43.3312 54.637001 66.2332 79.435402 92.637604 105.8398 119.042 132.2442 145.4464 158.64861 171.8508 185.05299 198.2552 211.4574 223.0536 234.6498 247.85201 261.0542 274.25641 287.45859 300.6608 313.86301 325.16879 336.76501 349.96719 363.1694" y="207.9968">在最坏情况下，我们可能须解除合约安排及╱或出售葩趣互娱，这可能</tspan><tspan id="tspan156" x="-51.026798 -37.866402 -24.705999 -11.5456 1.6148 14.7752 27.9356 39.241402 50.786999 63.947399 77.107803 90.268204 103.4286 116.589 129.7494 142.90981 156.07021 169.23061 182.39101 195.55141 208.71181 221.87219 235.03259 248.19299 261.35339 272.65921 284.2059 297.3663 310.5267 323.6871 336.8475 350.0079 363.1683" y="223.99631">会对我们的业务、财务状况及经营业绩造成重大不利影响。倘我们于上述解</tspan><tspan id="tspan158" x="-51.026798 -37.977501 -24.9282 -11.8789 1.1704 14.2197 27.268999 40.318298 53.367599 66.416901 79.466202 92.515503 105.5648 118.6141 131.66341 144.71271 157.76199 170.81129 183.8606 196.9099 209.9592 223.0085 236.0578 249.1071 262.1564 275.20569 288.255 301.30429 314.35361 325.65939 337.0752 350.12451 363.1738" y="239.9958">除合约安排或出售后不再拥有持续经营业务或倘未能遵守有关规定，联交所</tspan><tspan id="tspan160" x="-51.026798 -37.977501 -24.9282 -11.8789 1.1704 14.2197 27.268999 40.318298 53.367599 66.416901 79.466202 90.772003 102.1878 115.2371 128.28641 141.33569 154.38499 167.4343 180.4836 193.5329 206.5822 219.6315 232.6808 245.7301 258.77939 271.8287 284.87799 297.92731 310.97659 324.02591 337.0752 350.12451 363.1738" y="255.9953">或会对我们采取法律行动，这会对我们的股份交易造成重大不利影响甚至导</tspan><tspan id="tspan162" x="-51.026798 -37.770699 -24.514601 -11.2585 1.9976 15.2537 28.5098 39.815601 51.4734 64.7295 70.531998 82.190903 95.446999 108.7031 121.9592 135.2153 146.87421 153.0298 166.2859 179.54201 192.7981 206.0542 219.3103 232.56641 245.82249 259.07861 272.33469 285.59079 298.84689 312.103 325.3591 338.6152 351.87131 363.17709" y="271.99481">致本公司被除牌。有关《外商投资法》及其可能对本公司产生的影响的详情，</tspan><tspan id="tspan164" x="-51.026798 -38.070999 -25.1152 -16.559401 -5.2536001 7.7021999" y="287.99429">请参阅「法规</tspan></text>

<text id="text30" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 12.9723 24.278099 35.6026 48.574902 61.547199 74.519501 87.491798 100.4641 113.4364 126.4087 139.381 152.3533 165.32561 178.2979 191.2702 204.24249 217.2148 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">因此，无法保证合约安排及葩趣互娱的业务未来将不会受到重大不利影</tspan><tspan id="tspan28" x="-28.347 -17.041201" y="15.9995">响。</tspan></text>
<text id="text36" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.039,665.0122)" xml:space="preserve"><tspan id="tspan32" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 105.2832 118.4436 131.604 144.7644 157.9248 171.08521 184.24561 197.40601 210.56641 223.72681 235.03371 246.5793 259.73969 272.90009 286.06049 299.22089 312.38129 325.54169 338.70209 351.86249 365.02289 378.18329 391.34369 402.64951 414.1951" y="0">我们的合约安排可能受中国税务机关审查，而若发现我们欠缴额外税款，则</tspan><tspan id="tspan34" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464" y="15.9995">我们的综合净收入及</tspan></text>
<text id="text40" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,211.2959,649.0127)" xml:space="preserve"><tspan id="tspan38" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 166.77541" y="0">阁下的投资价值可能大幅减少。</tspan></text>
<text id="text58" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,617.0126)" xml:space="preserve"><tspan id="tspan42" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 102.1119 113.4364 126.4087 139.381 152.3533 165.32561 178.2979 191.2702 204.24249 217.2148 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">根据中国法律法规，关联方之间的安排及交易可能受中国税务机关审查</tspan><tspan id="tspan44" x="-28.347 -15.2977 -2.2484 9.0563002 20.472099 33.5214 46.570702 59.619999 72.669296 85.718597 98.767899 111.8172 124.8665 137.9158 150.9651 164.0144 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="15.9995">或质疑。倘中国税务机关确定中国附属公司与葩趣互娱之间的合约安排并不</tspan><tspan id="tspan46" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 309.19131 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="31.999001">代表公平价格并以转移定价调整的方式调整葩趣互娱的收入，我们可能面临</tspan><tspan id="tspan48" x="-28.347 -15.0964 -1.8458 11.4048 24.655399 37.905998 51.156601 64.407204 75.712997 87.366402 100.617 113.8676 127.1182 140.3688 153.6194 166.87 178.1747 189.82809 203.0787 216.3293 229.5799 242.83051 256.08109 269.3317 282.58231 295.83289 309.0835 315.7616 327.41501 340.66559 353.9162 367.16681 378.81909 385.84921" y="47.998501">重大不利税务后果。就中国税务而言，转移定价调整可能导致（其中包括）葩</tspan><tspan id="tspan50" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 51.321602 64.599701 77.8778 91.155899 104.434 117.7121 130.9902 142.29601 153.98129 167.2594 180.53751 193.8156 207.0937 220.3718 233.6499 246.92799 260.20609 273.48419 286.7623 298.06699 309.75229 323.0304 334.33621 346.02151 359.29959 372.5777 385.8558" y="63.998001">趣互娱入账的开支扣除额减少，从而增加彼等的税项负债。此外，中国税务</tspan><tspan id="tspan52" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 337.03339 350.0827 361.38739 372.80319 385.85251" y="79.997498">机关可能按欠缴税款对中国可变利益实体征收滞纳金及处以其他处罚。倘我</tspan><tspan id="tspan54" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 270.0434 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="95.997002">们的税项负债增加或倘我们须缴纳滞纳金或其他罚款，则我们的经营业绩可</tspan><tspan id="tspan56" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 86.605202" y="111.9965">能受到重大不利影响。</tspan></text>
<text id="text62" style="font-variant:normal;font-size:12px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,473.139)" xml:space="preserve"><tspan id="tspan60" x="0 14.1336 28.2672 42.400799 56.534401 70.667999 84.801598 98.935204 113.0688 127.2024 141.336 155.4696 169.6032" y="0">与在中国经营业务有关的风险</tspan></text>
<text id="text66" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,441.012)" xml:space="preserve"><tspan id="tspan64" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 105.2832 118.4436 131.604 144.7644 157.9248 171.08521 184.24561 197.40601 210.56641 223.72681 236.88721 250.04761 263.20801 274.51379 286.05939 299.21979 312.38019 325.54059" y="0">中国法律法规的诠释及执行方面存在不确定因素，或会限制</tspan></text>
<text id="text72" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,433.4336,441.012)" xml:space="preserve"><tspan id="tspan68" x="0 13.1604 26.320801 39.481201 52.641602 65.802002" y="0">阁下及我们获</tspan><tspan id="tspan70" x="-348.3942 -335.43839 -322.4826 -309.52679 -296.57101 -283.6152 -272.30939" y="15.9995">得的法律保障。</tspan></text>
<text id="text104" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,393.0124)" xml:space="preserve"><tspan id="tspan74" x="0 12.5686 25.137199 37.705799 50.274399 62.842999 75.411598 87.980202 100.5488 113.1174 125.686 138.25459 150.8232 163.3918 174.6976 186.0034 198.57201 211.14059 223.7092 236.2778 248.84641 261.41501 273.98361 286.55219 299.12079 311.68939 324.258 336.8266 349.3952 361.96381 374.53241 385.8371" y="0">中国的法律体系以成文法为基础。司法案例在此体系中的先例价值有限，</tspan><tspan id="tspan76" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 88.243103 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 216.3777 227.92439 241.08479 254.24519 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="15.9995">这有别于普通法体系。二十世纪七十年代末，中国政府开始颁布一套规管一</tspan><tspan id="tspan78" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 152.5986 164.0144 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="31.999001">般经济事务的综合法律法规体系。过去三十年立法的整体影响已大幅增加中</tspan><tspan id="tspan80" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 204.79691 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="47.998501">国各类外商或私营部门投资可获得的保障。我们的中国附属公司及葩趣互娱</tspan><tspan id="tspan82" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 182.21941 195.37981 208.54021 221.70061 234.86099 246.16679 257.7124 270.8728 282.17969 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="63.998001">须遵守整体适用于中国公司的各项中国法律法规。然而，由于该等法律法规</tspan><tspan id="tspan84" x="-28.347 -15.0689 -1.7908 11.4873 22.7931 34.477299 47.755402 61.033501 74.3116 87.589699 100.8678 114.1459 127.424 140.7021 153.98019 167.2583 180.53641 193.8145 207.09261 218.39951 230.08479 243.3629 256.64099 269.9191 281.22491 292.91019 306.18829 319.4664 332.74451 346.02261 359.30069 372.5788 385.8569" y="79.997498">相对较新，加上中国法律体系不断迅速演变，不少法律、法规及规则的诠释</tspan><tspan id="tspan86" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 47.737801 59.043598 71.999397 84.9552 97.911003 110.8668 122.1726 133.47729 146.43311 159.3889 172.3447 185.30051 198.2563 211.2121 224.16789 237.1237 250.0795 263.03531 275.99109 288.9469 301.90271 314.85849 326.16541" y="95.997002">未必保持一致，且该等法律、法规及规则的执行涉及不确定因素。</tspan><tspan id="tspan88" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 117.8001 130.88901 143.97791 157.0668 170.1557 183.2446 196.3335 209.42239 222.51131 235.6002 248.6891 261.77802 274.86691 286.1716 297.6347 310.7236 322.02939 333.49139 346.58029 359.66919 372.75809 385.84698" y="127.9971">我们或须不时诉诸行政及诉讼程序以行使合法权利。然而，由于中国行</tspan><tspan id="tspan90" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 335.28989 346.70569 359.755 372.80429 385.85361" y="143.9966">政及司法机关在诠释和执行法定及合约条款方面或有不同酌情权，故可能更</tspan><tspan id="tspan92" x="-28.347 -15.4033 -2.4596 10.4841 23.427799 36.371498 49.315201 62.2589 75.202599 88.146301 101.09 114.0337 126.9774 139.9211 152.86481 165.8085 178.7522 191.69591 204.6396 217.5833 230.52699 243.4707 256.4144 269.35809 282.30179 295.24551 308.18921 321.1329 334.0766 347.02029 359.96399 372.90771 385.85141" y="159.99609">难以评估行政及诉讼程序的结果及我们相较发达法律体系中所享法律保障的</tspan><tspan id="tspan94" x="-28.347 -15.7806 -4.4748001 6.8298998 19.396299 30.702101 42.0079 54.574299 67.140701 79.7071 92.273499 104.8399 117.4063 129.9727 142.53909 155.1055 167.67191 180.2383 192.8047 205.37109 217.9375 230.50391 243.0703 255.6367 268.20309 280.7695 293.33591 305.90231 318.46869 331.0351 343.6015 356.16791 368.73431 374.54449 385.84921" y="175.99561">水平。此外，中国法律体系部分依据可能具追溯效力的政府政策及内部规则（部</tspan><tspan id="tspan96" x="-28.347 -15.3538 -2.3606 10.6326 23.625799 36.618999 49.612202 62.6054 75.598602 88.591797 101.585 114.5782 125.928 132.6534 145.64661 156.95129 168.3011 181.2943 192.599 203.94881 216.942 229.9352 242.92841 255.9216 268.91479 281.90799 294.90121 307.89441 320.8876 333.8808 346.87399 359.86719 372.86041 385.85361" y="191.9951">分并无及时公布或不曾公布）制定。因此，我们可能在不知情情况下触犯该等</tspan><tspan id="tspan98" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 34.780899 46.0867 59.0425 71.998299 84.954102 97.909897 110.8657 123.8215 135.1273 146.43311 159.3889 172.3447 185.30051 198.2563 211.2121 222.5179 233.8226 246.7784 253.1848 264.4906 277.44641 290.40219 303.358 316.31381 329.26959 340.57541 346.98291 359.93869 372.8945 385.85031" y="207.9946">政策及规则。该等不确定因素，包括我们合约、财产（包括知识产权）及诉讼权</tspan><tspan id="tspan100" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 335.28989 346.70569 359.755 372.80429 385.85361" y="223.99409">利的范围及效力所涉不确定因素以及未能应对中国监管环境变动，可能会对</tspan><tspan id="tspan102" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 138.42841 149.73421 162.69 175.6458 188.60159 201.5574 214.5132 227.46899 240.4248 253.3806 266.3364 279.29221 292.24799 303.5538" y="239.99361">我们的业务造成重大不利影响，并阻碍我们持续经营的能力。</tspan></text>
</g>

<text id="text30" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 13.0493 26.0986 39.1479 52.197201 63.502998 74.917702 87.967003 101.0163 114.0656 127.1149 140.1642 153.2135 166.2628 179.3121 192.3614 205.41071 218.46001 231.50929 244.55859 257.60791 270.6572 283.70651 296.7558 309.80511 322.8544 335.90369 348.953 362.00229 375.05161 388.10089 401.15021 414.19949" y="0">中国的经济、政治及社会状况以及政府政策或会对我们的业务及前景造成不</tspan><tspan id="tspan28" x="0 12.9558 25.9116 37.2174" y="15.9995">利影响。</tspan></text>
<text id="text64" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,665.0122)" xml:space="preserve"><tspan id="tspan32" x="0 13.3441 26.6882 40.032299 53.3764 66.720497 80.064598 93.408699 106.7528 120.0969 133.44099 146.7851 158.0898 169.8532 183.1973 194.5031 206.26649 219.6106 232.9547 246.2988 259.64291 270.9487 282.7121 296.05621 307.362 319.1254 332.46951 345.8136 359.15771 372.5018 385.84589" y="0">我们绝大部分业务位于中国。因此，我们的业务、前景、财务状况及经</tspan><tspan id="tspan34" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 204.79691 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="15.9995">营业绩或会在很大程度上受中国整体政治、经济及社会状况以及中国整体持</tspan><tspan id="tspan36" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 73.649399" y="31.999001">续经济增长所影响。</tspan><tspan id="tspan38" x="0 13.2132 26.426399 39.639599 52.852798 66.066002 79.279198 92.492401 105.7056 118.9188 132.132 143.43671 155.045 168.25819 181.47141 194.6846 205.9904 217.59869 230.8119 244.0251 255.3298 266.93811 280.15131 293.3645 306.5777 319.79089 333.00409 346.21729 359.43051 372.64371 385.8569" y="63.9991">中国经济在政府干预程度、发展水平、增长率、外汇管控及资源分配等</tspan><tspan id="tspan40" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 152.5986 164.0144 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="79.998596">众多方面有别于大多数发达国家。尽管中国政府已实行措施著重利用市场力</tspan><tspan id="tspan42" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 61.254601 72.670403 85.719704 98.768997 111.8183 124.8676 137.9169 150.9662 164.0155 177.0648 190.11411 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="95.9981">量进行经济改革，同时减少国家对生产性资产的所有权及加强企业的企业管</tspan><tspan id="tspan44" x="-28.347 -17.041201 -5.3558998 7.9222002 21.2003 34.478401 47.7565 61.034599 74.312698 87.590797 100.8689 114.147 127.4251 140.7032 153.98129 167.2594 180.53751 193.8156 207.0937 220.3718 231.6776 243.3629 256.64099 267.94571 279.63101 292.90909 306.18719 319.4653 332.74341 346.02151 359.29959 372.5777 385.8558" y="111.9976">治，中国相当大部分生产性资产仍由政府控制。此外，中国政府通过落实行</tspan><tspan id="tspan46" x="-28.347 -15.2405 -2.1340001 10.9725 24.079 37.185501 50.292 63.398499 76.504997 89.611504 102.718 115.8245 128.931 142.03751 155.144 168.2505 181.35699 194.4635 207.57001 220.6765 231.9823 243.46629 256.57281 269.67929 282.7858 295.8923 308.99881 322.10529 335.21179 348.3183 361.4248 374.53131 385.8371" y="127.9971">业政策持续在规管行业发展方面发挥重要作用。中国政府亦通过调配资源、</tspan><tspan id="tspan48" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 126.5011 137.9169 150.9662 164.0155 177.0648 190.11411 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="143.9966">控制以外币计值负债的付款、制订货币政策及向特定行业或公司提供优惠待</tspan><tspan id="tspan50" x="-28.347 -17.041201 -5.7354002 7.2203999 20.176201 33.132 46.087799 59.043598 71.999397 84.9552 97.911003 110.8668 122.1726" y="159.99609">遇，大力管控中国经济增长。</tspan><tspan id="tspan52" x="0 13.0317 26.0634 39.0951 52.126801 65.158501 78.190201 91.221901 104.2536 117.2853 130.317 143.34869 156.3804 169.41209 180.7168 192.11169 205.1434 218.17509 231.2068 244.23849 257.2702 270.30191 283.33359 296.3653 309.397 322.42871 335.46039 348.4921 361.5238 374.55551 385.8602" y="191.9962">中国经济于过往数十年显著增长，但各地区及不同行业的增长不平衡。</tspan><tspan id="tspan54" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 283.09271 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="207.9957">中国政府已实行多项措施鼓励经济增长及指导资源分配。部分该等措施或有</tspan><tspan id="tspan56" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 51.321602 64.599701 75.905502 87.590797 100.8689 114.147 127.4251 140.7032 153.98129 167.2594 180.53751 193.8156 207.0937 220.3718 231.6776 243.3629 256.64099 267.94571 279.63101 292.90909 306.18719 319.4653 332.74341 346.02151 359.29959 372.5777 385.8558" y="223.99519">利于中国整体经济，但可能对我们有负面影响。例如，我们的财务状况及经</tspan><tspan id="tspan58" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 182.21941 195.37981 208.54021 221.70061 234.86099 248.02139 261.18179 274.34219 287.50259 300.66299 313.82339 326.9838 338.28961 349.8363 362.9967 374.30249 385.84811" y="239.99471">营业绩或会因政府管控资本投资或税务法规变动而受到不利影响。此外，中</tspan><tspan id="tspan60" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 140.88361 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 255.8589 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="255.9942">国政府曾实行加息等若干措施，控制经济增长速度。该等措施或会导致中国</tspan><tspan id="tspan62" x="-28.347 -15.0656 -1.7842 11.4972 24.778601 38.060001 49.365799 61.053299" y="271.99371">经济活动减少。自</tspan></text>

<text id="text80" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,345.0189)" xml:space="preserve"><tspan id="tspan76" x="0 12.9437 25.8874 38.8311 51.774799 64.718498 77.662201 90.605904 103.5496 116.4933 129.437 142.38071 155.3244 168.2681 181.21181 194.1555 207.0992 220.04289 232.9866 245.9303 258.87399 271.81769 284.76141 297.70511 310.6488 323.5925 336.53619 349.47989 362.42361 375.36731 388.311 401.2547 414.19839" y="0">并购规定及若干其他中国法规就外国投资者进行部分中国公司收购事项制订</tspan><tspan id="tspan78" x="0 12.9558 25.9116 38.867401 50.173199 61.477901 74.433701 87.389503 100.3453 113.3011 126.2569 139.21271 152.1685 165.1243 178.08009 191.0359 203.9917 216.94749 229.90331 242.8591 255.8149 268.77069 281.7265 294.68231 305.9892" y="15.9995">复杂程序，可能令我们更难以在中国通过收购实现增长。</tspan></text>

99 108.1223 121.2827 134.4431 147.6035 160.7639 173.9243 187.0847 198.3916 209.93719 223.0976 236.258 249.4184 262.5788 275.7392 288.8996 302.06" y="63.998001">日后，我们可能会通过收购互补性业务扩大我们的业务。遵照上述法规及其</tspan><tspan id="tspan56" x="-112.1351 -98.822899 -85.510696 -72.198502 -58.886299 -45.5741 -32.261902 -18.949699 -5.6374998 7.6746998 20.9869 34.299099 47.611301 60.9235 74.235703 87.547897 100.8601 114.1723 125.477 137.203 150.5152 163.82739 177.1396 190.4518 203.76401 217.0762 230.3884 243.70061 257.01279 263.71069 275.43671 288.7489 302.0611" y="79.997498">他相关规定的要求完成该等交易可能费时，且所需的任何审批程序（包括自</tspan><tspan id="tspan58" x="-112.1351 -98.946098 -85.757103 -72.5681 -59.379101 -46.190102 -33.001099 -19.812099 -6.6230998 6.5658998 19.7549 32.943901 46.1329 59.321899 72.510902 84.090599 91.0448 104.2338 117.4228 130.6118 143.8008 156.98981 170.1788 183.3678 196.55679 209.7458 222.9348 236.12379 249.31281 262.5018 275.6908 288.87979 302.06879" y="95.997002">商务部或其地方主管部门取得审批）可能会延迟或约束我们完成该等交易的</tspan><tspan id="tspan60" x="-112.1351 -99.179298 -87.873497 -76.568802 -63.612999 -50.6572 -37.701401 -24.7456 -11.7898 1.166 14.1218 27.0776 40.033401 52.989201 65.945 78.900803 91.856598 104.8124 117.7682 130.724 143.67979 156.6356 169.5914 182.5472 195.50301 206.80991" y="111.9965">能力，从而可能影响我们扩大业务或保持市场份额的能力。</tspan></text>

24603 109.2641 120.5699 132.09241 145.2319" y="63.998001">认定所有境外企业税务居民身份的一般立场。根据</tspan></text>
<text id="text130" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,370.2078,345.0211)" xml:space="preserve"><tspan id="tspan128" x="0 6.4218001" y="0">82</tspan></text>

<text id="text174" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,238.3508,249.0241)" xml:space="preserve"><tspan id="tspan172" x="0 4.1216998 7.0223999 12.9811" y="0">(iv)</tspan></text>

<text id="text38" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 117.8001 130.88901 142.1937 153.6568 166.7457 179.83459 192.92349 206.01241 219.1013 232.1902 245.2791 258.36801 271.45691 284.54581 297.6347 310.7236 323.8125 336.9014 349.9903 363.07919 374.38501 385.84698" y="0">我们认为就中国税务而言，我们的中国境外实体概非中国居民企业。然</tspan><tspan id="tspan28" x="-28.347 -17.041201 -5.5307999 7.5988002 20.728399 33.858002 46.987598 60.117199 73.246803 86.376404 99.505997 112.6356 125.7652 138.89481 152.0244 165.15401 178.2836 191.41319 204.5428 217.67239 230.802 242.1089 253.61819 266.7478 275.30359 286.814 299.9436 313.07321 326.20279 339.3324 352.46201 363.97241 372.73279 385.8624" y="15.9995">而，企业的税收居民身份须由中国税务机构认定，有关「实际管理机构」一词</tspan><tspan id="tspan30" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 88.243103 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 323.5155 334.82129 346.36801 359.52841 372.68881 385.84921" y="31.999001">的解释存在不确定性。由于我们几乎所有管理层成员均位于中国，税收居民</tspan><tspan id="tspan32" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 204.79691 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="47.998501">身份规定如何应用于我们的情况尚不明确。倘中国税务机构就中国企业所得</tspan><tspan id="tspan34" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 337.03339 350.0827 363.13199 374.43781 385.85251" y="63.998001">税而言将我们或我们位于中国境外的任何附属公司认定为中国居民企业，则</tspan><tspan id="tspan36" x="-28.347 -15.2207 -2.0943999 11.0319 24.158199 37.2845 50.410801 63.537102 76.663399 89.789703 102.916 116.0423 129.16859 142.29491 155.4212 168.5475 181.6738 194.80009 207.92641" y="79.997498">我们或有关附属公司可能须就其全球收入按</tspan></text>
<text id="text42" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,333.9844,633.0143)" xml:space="preserve"><tspan id="tspan40" x="0 6.4218001 12.8436" y="0">25%</tspan></text>
<text id="text54" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,358.2922,633.0143)" xml:space="preserve"><tspan id="tspan44" x="0 13.1263 26.2526 39.378899 52.505199 65.6315 78.757797 91.884102 105.0104 116.3162 127.8211 140.9474" y="0">的税率缴纳中国税项，这可</tspan><tspan id="tspan46" x="-273.2532 -260.47891 -247.70461 -234.9303 -222.15601 -209.3817 -196.60741 -183.8331 -171.05881 -158.2845 -145.51019 -134.20441 -122.8997 -110.1254 -98.819603 -87.513802 -74.739502 -61.965199 -49.190899 -36.416599 -23.6423 -10.868 1.9062999 14.6806 27.454901 40.229198 53.003502 65.777802 78.552101 91.326401 104.1007 116.875 129.64931 140.95399" y="15.9995">能大大减少我们的净收入。此外，我们亦将须履行中国企业所得税申报责任。</tspan><tspan id="tspan48" x="-273.2532 -260.0928 -248.7881 -237.24139 -224.08099 -210.92059 -197.76019 -184.59979 -171.43941 -158.27901 -145.11861 -131.95821 -118.7978 -105.6374 -92.476997 -79.316597 -66.156197 -52.9958 -39.8354 -26.674999 -13.5146 -0.35420001 12.8062 25.9666 39.126999 52.287399 65.4478 78.6082 91.7686 103.0755 114.6211 127.7815 140.94189" y="31.999001">此外，倘中国税务机构就企业所得税而言认定我们属中国居民企业，对于我</tspan><tspan id="tspan50" x="-273.2532 -260.20389 -247.1546 -234.1053 -221.056 -208.0067 -194.9574 -181.9081 -168.8588 -155.80949 -142.76019 -129.71091 -116.6616 -103.6123 -90.563004 -77.513702 -64.464401 -51.4151 -38.365799 -25.3165 -12.2672 0.78210002 13.8314 26.880699 39.93 52.979301 66.028603 77.334396 88.7491 101.7984 114.8477 127.897 140.9463" y="47.998501">们派付的股息及出售或以其他方式处置我们普通股变现的收入，则将及可能</tspan><tspan id="tspan52" x="-273.2532 -260.12689 -247.0006 -233.8743 -220.748 -207.6217 -194.49541 -183.18961 -171.68359 -158.5573 -145.431 -132.3047 -119.1784 -106.0521 -92.925797 -79.7995 -66.673203 -53.546902 -40.420601" y="63.998001">须缴纳中国税项，非中国企业的适用税率为</tspan></text>
<text id="text58" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,330.5436,569.0163)" xml:space="preserve"><tspan id="tspan56" x="0 6.4218001 12.8436" y="0">10%</tspan></text>
<text id="text62" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,354.8514,569.0163)" xml:space="preserve"><tspan id="tspan60" x="0 13.1263 26.2526 39.378899 52.505199 65.6315 78.757797 91.884102 105.0104 118.1367 131.263 144.3893" y="0">而非中国个人的适用税率为</tspan></text>
<text id="text66" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.039,553.0168)" xml:space="preserve"><tspan id="tspan64" x="0 6.4218001 12.8436" y="0">20%</tspan></text>
<text id="text76" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,103.8468,553.0168)" xml:space="preserve"><tspan id="tspan68" x="0 11.6688 24.9326 38.1964 51.460201 64.723999 77.987801 91.251602 104.5154 117.7792 131.043 144.30679 157.5706 170.8344 184.09821 197.362 210.62579 223.8896 237.1534 250.41721 262.086 267.89731 279.5661 292.8299 306.09369 319.35751 332.62131 345.8851 357.19089 368.85971 382.1235 395.3873" y="0">（在各情况下须遵守任何适用税收协定的条文），且就股息而言，倘该股</tspan><tspan id="tspan70" x="-18.8078 -5.6473999 7.513 20.673401 33.833801 46.994202 60.154598 73.315002 86.475403 99.635803 112.7962 124.102 135.6487 148.8091 161.9695 175.1299 188.2903 201.4507 214.6111 227.7715 240.9319 254.0923 267.25269 278.5585 290.10519 303.26559 316.42599 329.5864 342.7468 355.9072 369.0676 382.228 395.3884" y="15.9995">息或收入被视为源自中国，则中国税项将于源头预扣。倘我们被认为是中国</tspan><tspan id="tspan72" x="-18.8078 -5.7585001 7.2908001 20.340099 31.645901 43.0606 56.109901 69.159203 82.208504 95.257797 108.3071 121.3564 134.4057 147.455 160.5043 173.5536 186.60291 199.65221 212.70151 225.75079 238.80009 251.8494 264.89871 277.948 290.99731 304.0466 317.09589 330.1452 343.19449 356.2438 369.29309 382.34241 395.39169" y="31.999001">居民企业，并不明确本公司的非中国股东能否申索彼等税务居民国家与中国</tspan><tspan id="tspan74" x="-18.8078 -5.6473999 7.513 20.673401 33.833801 46.994202 60.154598 73.315002 86.475403 99.635803 112.7962 124.102 135.6487 148.8091 161.9695 175.1299 188.2903 201.4507 214.6111 227.7715 240.9319 254.0923" y="47.998501">之间任何税收协定的利益。任何该等税收可能减少</tspan></text>
<text id="text82" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,380.7916,505.0183)" xml:space="preserve"><tspan id="tspan78" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 105.2832 118.4436" y="0">阁下投资于我们股份的</tspan><tspan id="tspan80" x="-295.75259 -282.79681 -271.491" y="15.9995">回报。</tspan></text>
<text id="text86" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.039,457.0187)" xml:space="preserve"><tspan id="tspan84" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 153.8196" y="0">汇率波动可能导致外汇亏损。</tspan></text>
<text id="text112" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,425.0186)" xml:space="preserve"><tspan id="tspan88" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 76.749199 88.212303 101.3012 114.3901 127.479 140.5679 153.6568 166.7457 179.83459 192.92349 206.01241 219.1013 232.1902 243.496 254.95799 268.04691 281.1358 294.2247 307.3136 320.4025 333.49139 346.58029 359.66919 372.75809 385.84698" y="0">人民币兑港元、美元及其他货币的价值波动，且可能会由于中国政府的</tspan><tspan id="tspan90" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 61.9212 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 244.552 257.7124 270.8728 284.0332 297.1936 310.354 323.5144 336.6748 349.83521 361.14099 372.68771 385.84811" y="15.9995">政策而发生改变，并在很大程度上取决于国内及国际经济及政治发展，以及</tspan><tspan id="tspan92" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 87.352097 98.767899 111.8172 124.8665 137.9158 150.9651 164.0144 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="31.999001">当地市场的供需状况。目前难以预测未来市场力量或政府政策会如何影响人</tspan><tspan id="tspan94" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 36.071201 47.755402 61.033501 74.3116 87.589699 100.8678 114.1459 127.424 140.7021 153.98019 167.2583 180.53641 193.8145 205.1203 216.8056 230.08369 241.3884 253.0737 266.35181 279.62991 292.90799 306.1861 319.4642 332.74231 346.02039 359.29849 372.5766 385.85471" y="47.998501">民币与港元、美元或其他货币之间的汇率。此外，中国人民银行会定期对外</tspan><tspan id="tspan96" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 178.9458 191.9016 204.85741 217.8132 230.769 243.72479 256.6806 269.63641 280.9422" y="63.998001">汇市场进行干预以限制人民币汇率波动及实现政策目标。</tspan><tspan id="tspan98" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 117.8001 130.88901 143.97791 157.0668 170.1557 181.4604 192.92349 206.01241 217.31821 228.7802 241.86909 254.95799 268.04691 281.1358 294.2247 307.3136 320.4025 333.49139 346.58029 359.66919 372.75809 385.84698" y="95.9981">全球发售所得款项将以港元收取。因此，人民币兑港元升值可能导致我</tspan><tspan id="tspan100" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 167.20441 178.7511 191.9115 203.2173 214.76289 227.92329 241.08369 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="111.9976">们的全球发售所得款项的价值减少。相反，人民币贬值可能对外币计值股份</tspan><tspan id="tspan102" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 182.21941 195.37981 208.54021 221.70061 234.86099 248.02139 261.18179 274.34219 285.64801 297.1947 310.3551 321.66089 333.20651 346.36691 359.52731 372.68771 385.84811" y="127.9971">的价值及就外币计值股份应付的任何股息产生不利影响。此外，可供我们以</tspan><tspan id="tspan104" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 180.36591 191.9115 205.0719 216.3777 227.92439 241.08479 254.24519 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="143.9966">合理的成本降低外币风险的工具有限。另外，目前我们将大额外币兑换为人</tspan><tspan id="tspan106" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 191.7476 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="159.99609">民币前亦须取得国家外汇管理局的批准。所有该等因素均可能会对我们的业</tspan><tspan id="tspan108" x="-28.347 -17.041201 -5.3558998 7.9222002 21.2003 34.478401 45.784199 57.469501 70.747597 84.025703 97.303802 110.5819 123.86 137.13811 150.4162 163.69431 176.9724 190.2505 203.52859 216.8067 230.08479 243.3629 254.6687 266.354 279.63211 292.91019 306.18829 319.4664 332.74451 346.02261 359.30069 372.5788 385.8569" y="175.99561">务、财务状况、经营业绩及前景产生重大不利影响，并可能减少外币计值股</tspan><tspan id="tspan110" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 178.9458 190.2516" y="191.9951">份的价值及就外币计值股份应付的股息。</tspan></text>
</g>

<text id="text28" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 12.6764 25.3528 38.029202 50.705601 63.382 76.058403 88.734802 101.4112 114.0876 126.764 139.4404 152.11681 164.7932 177.4696 190.146 202.8224 215.49879 228.1752 240.85159 253.528 264.8338 276.13959 288.81601 301.4924 314.16879 326.84521 339.52161 352.198 364.87439 377.55081 390.2272 402.90359 414.20831" y="0">中国政府管制外币兑换或会限制我们的外汇交易，包括有关股份的股息支付。</tspan></text>
<text id="text54" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,681.0117)" xml:space="preserve"><tspan id="tspan30" x="0 12.958 25.916 38.874001 51.832001 64.790001 77.748001 90.706001 103.664 116.622 129.58 142.53799 155.496 162.1785 173.4865 186.4445 199.4025 212.3605 225.3185 238.2765 251.2345 264.1925 277.15051 290.10849 303.0665 316.02451 328.98251 341.94049 354.8985 366.20651 372.8912 385.84921" y="0">中国政府对人民币兑换成外币（以及在若干情况下向中国境外汇款）实施</tspan><tspan id="tspan32" x="-28.347 -15.0689 -3.7630999 7.9222002 21.2003 34.478401 47.7565 61.034599 74.312698 87.590797 100.8689 114.147 127.4251 140.7032 153.98129 167.2594 180.53751 193.8156 207.0937 218.39951 230.08479 243.3629 256.64099 269.9191 283.1972 296.47531 309.75339 323.03149 336.3096 349.58771 362.86581 374.1705 385.8558" y="15.9995">管制。我们以人民币收取绝大部分收入净额。根据我们目前的企业架构，于</tspan><tspan id="tspan34" x="-28.347 -15.4033 -2.4596 10.4841 23.427799 36.371498 49.315201 62.2589 75.202599 88.146301 101.09 114.0337 126.9774 139.9211 152.86481 165.8085 178.7522 191.69591 204.6396 217.5833 230.52699 243.4707 256.4144 269.35809 282.30179 295.24551 308.18921 321.1329 334.0766 347.02029 359.96399 372.90771 385.85141" y="31.999001">开曼群岛的本公司依赖来自中国附属公司的股息付款来满足我们可能出现的</tspan><tspan id="tspan36" x="-28.347 -15.3527 -2.3584001 10.6359 23.630199 36.6245 49.618801 62.613098 75.607399 86.9132 98.264099 111.2584 124.2527 137.24699 150.2413 163.2356 176.2299 189.2242 202.21851 215.2128 226.5186 237.86951 250.8638 263.85809 276.85239 289.84671 302.841 309.52679 320.87881 333.87311 346.8674 359.86169 372.85599 385.85031" y="47.998501">任何现金及融资需求。根据现行中国外汇法规，经常项目付款（如盈利分配以</tspan><tspan id="tspan38" x="-28.347 -15.158 -1.969 11.22 24.409 37.598 50.786999 63.976002 77.165001 90.353996 103.543 116.732 128.31059 135.267 148.45599 161.645 174.834 188.02299 201.21201 214.401 227.59 240.77901 253.968 267.15701 280.34601 293.535 306.724 319.91299 333.10199 346.29099 359.48001 372.66901 385.858" y="63.998001">及贸易及服务相关外汇交易）可不必取得国家外汇管理局事先批准以外币进</tspan><tspan id="tspan40" x="-28.347 -17.041201 -5.3558998 7.9222002 21.2003 34.478401 47.7565 61.034599 74.312698 87.590797 100.8689 114.147 125.4528 137.13699 150.4151 161.7209 173.4062 186.6843 199.9624 213.24049 226.5186 239.79671 253.0748 266.35291 279.63101 292.90909 306.18719 319.4653 332.74341 346.02151 359.29959 372.5777 385.8558" y="79.997498">行，惟需符合若干程序规定。因此，我们的中国附属公司能以外币向我们支</tspan><tspan id="tspan42" x="-28.347 -15.1866 -2.0262001 9.2796001 20.825199 33.9856 47.146 60.3064 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 242.6974 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="95.997002">付股息，而毋须取得国家外汇管理局的事先批准，惟条件是向中国境外汇出</tspan><tspan id="tspan44" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 217.84621 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="111.9965">该等股息必须符合中国外汇监管的若干程序，如身为中国居民的本公司实益</tspan><tspan id="tspan46" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 127.7232 139.2688 152.4292 163.735 175.28169 188.44209 201.60249 214.76289 227.92329 241.08369 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="127.996">拥有人须进行海外投资登记。然而，人民币兑换成外币并汇出中国以支付资</tspan><tspan id="tspan48" x="-28.347 -15.3912 -2.4354 3.4056001 14.7103 27.6661 40.621899 53.577702 66.533501 79.489304 92.445099 105.4009 118.3567 129.66251 135.5024 148.45821 161.414 174.3698 187.32561 200.2814 213.2372 226.19299 239.1488 252.1046 265.06039 278.0162 290.97198 303.9278 316.88361 329.83939 342.7952 355.75101 368.70679 374.54449 385.84921" y="143.9955">本开支（如偿还外币计值贷款）的情况则必须向有关政府机构或其指定机构（如</tspan><tspan id="tspan50" x="-28.347 -15.3912 -2.4354 10.5204 21.8262 28.5109 41.466702 54.422501 67.378304 80.334099 93.289902 106.2457 117.5526" y="159.995">商业银行）申请批准或登记。</tspan><tspan id="tspan52" x="0 12.9426 25.885201 38.827801 51.770401 64.712997 77.655602 90.598198 103.5408" y="191.9951">鉴于人民币走弱导致</tspan></text>
<text id="text58" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,229.5717,489.0166)" xml:space="preserve"><tspan id="tspan56" x="0 6.4218001 12.8436 19.2654" y="0">2016</tspan></text>
<text id="text70" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,256.6064,489.0166)" xml:space="preserve"><tspan id="tspan60" x="0 12.9426 25.885201 38.827801 51.770401 64.712997 77.655602 90.598198 103.5408 114.8466 126.1524 139.095 152.0376 164.98019 177.92281 190.8654 203.808 216.7506 229.69321 242.6358" y="0">年中国资金大量外流，中国政府已实施更加严</tspan><tspan id="tspan62" x="-171.567 -158.5177 -145.4684 -132.4191 -119.3698 -106.3205 -93.271202 -80.221901 -67.1726 -54.123299 -41.074001 -28.0247 -14.9754 -1.9261 11.1232 24.172501 37.221802 50.271099 63.3204 76.369698 89.418999 100.7248 112.1395 125.1888 138.2381 151.2874 164.3367 177.386 190.4353 203.4846 216.53391 229.58321 242.63251" y="15.9995">格的外汇政策并增强对重大资金向外流动的审查。国家外汇管理局就监管资</tspan><tspan id="tspan64" x="-171.567 -158.5177 -145.4684 -132.4191 -119.3698 -106.3205 -93.271202 -80.221901 -67.1726 -54.123299 -41.074001 -28.0247 -14.9754 -1.9261 11.1232 24.172501 37.221802 50.271099 63.3204 76.369698 89.418999 102.4683 113.7741 125.1899 138.2392 151.2885 164.3378 177.3871 190.4364 203.4857 216.535 229.5843 242.63361" y="31.999001">本项目下的跨境交易实施更多限制及重大审核程序。中国政府未来可能酌情</tspan><tspan id="tspan66" x="-171.567 -158.5177 -145.4684 -132.4191 -119.3698 -106.3205 -93.271202 -80.221901 -67.1726 -54.123299 -41.074001 -28.0247 -14.9754 -1.9261 11.1232 24.172501 37.221802 50.271099 63.3204 74.626198 86.042 99.091301 112.1406 125.1899 138.2392 151.2885 164.3378 177.3871 190.4364 203.4857 216.535 229.5843 242.63361" y="47.998501">进一步制约我们取得外汇进行经常项目交易。倘外汇管制制度使我们不能取</tspan><tspan id="tspan68" x="-171.567 -158.61121 -145.6554 -132.6996 -119.7438 -106.788 -93.832199 -80.876404 -67.920601 -54.964802 -42.008999 -29.0532 -16.097401 -3.1415999 9.8142004 22.77 34.075802 45.381599 58.337399 71.293198 84.249001 97.204803 110.1606 123.1164 136.0722 149.028 161.9838 174.93961 187.8954 200.8512 213.80701 226.7628 238.0686" y="63.998001">得充足的外币以满足我们的外汇需求，我们未必能以外币向股东支付股息。</tspan></text>
<text id="text80" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,393.0185)" xml:space="preserve"><tspan id="tspan72" x="0 12.9437 25.8874 38.8311 51.774799 64.718498 77.662201 90.605904 103.5496 116.4933 129.437 142.38071 155.3244 168.2681 181.21181 194.1555 207.0992 220.04289 232.9866 245.9303 258.87399 271.81769 284.76141 297.70511 310.6488 323.5925 336.53619 349.47989 362.42361 375.36731 388.311 401.2547 414.19839" y="0">关于境外控股公司向中国实体发放贷款及直接投资的中国法规可能会延误或</tspan><tspan id="tspan74" x="0 12.9437 25.8874 38.8311 51.774799 64.718498 77.662201 90.605904 103.5496 116.4933 129.437 142.38071 155.3244 168.2681 181.21181 194.1555 207.0992 220.04289 232.9866 245.9303 258.87399 271.81769 284.76141 297.70511 310.6488 323.5925 336.53619 349.47989 362.42361 375.36731 388.311 401.2547 414.19839" y="15.9995">阻碍我们使用全球发售所得款项向我们的中国附属公司发放贷款或提供额外</tspan><tspan id="tspan76" x="0 13.0493 24.355101 35.770901 48.820202 61.869499 74.9188 87.968102 101.0174 114.0667 127.116 140.1653 153.2146 166.2639 179.3132 192.3625 205.4118 218.46111 231.51041 244.55969 257.60901 270.65829 283.70761 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="31.999001">出资，这可能对我们的流动资金以及我们筹资及扩充业务的能力造成重大不</tspan><tspan id="tspan78" x="0 12.9558 25.9116 37.2174" y="47.998501">利影响。</tspan></text>

918 -144.8425 -131.7932 -118.7439 -105.6946 -92.645302 -81.3395 -69.923698 -56.874401 -43.8251 -30.775801 -17.7265 -4.6771998 8.3720999 21.4214 34.470699 47.52 60.569302 73.618599 86.6679 99.717201 112.7665 125.8158 138.8651 151.9144 164.9637 178.013 191.0623 204.1116 217.1609 230.21021" y="175.99561">已备案的登记资料，则该境外母公司的中国附属公司可能被限制向其境外母</tspan><tspan id="tspan112" x="-183.9904 -170.83 -157.6696 -144.5092 -131.3488 -118.1884 -105.028 -91.867599 -78.707199 -65.546799 -52.386398 -39.226002 -26.065599 -14.7598 -3.2131 9.9473 23.1077 36.268101 49.428501 62.588902 75.749298 88.909698 102.0701 115.2305 126.5363 138.08189 151.24229 164.40269 177.5631 190.7235 203.8839 217.0443 230.2047" y="191.9951">公司分派溢利及源于任何减资、转股或清算的所得款项，而境外母公司亦可</tspan><tspan id="tspan114" x="-183.9904 -170.83 -157.6696 -144.5092 -131.3488 -118.1884 -105.028 -91.867599 -78.707199 -65.546799 -52.386398 -39.226002 -26.065599 -12.9052 -1.5983 9.9473 23.1077 34.413502 45.960201 59.120602 72.280998 85.441399 98.601799 111.7622 124.9226 138.08299 151.24339 164.40379 177.56419 190.72459 203.88499 217.04539 230.2058" y="207.9946">能被限制向其中国附属公司增资。此外，未能遵守上述各项外汇登记规定可</tspan><tspan id="tspan116" x="-183.9904 -170.9048 -157.8192 -144.7336 -131.64799 -118.5624 -105.4768 -92.391197 -79.305603 -66.220001 -53.134399 -40.048801 -26.9632 -13.8776 -0.792 12.2936 25.3792 38.464802 51.5504 64.636002 77.721603 89.027397 100.485 113.5706" y="223.99409">能导致逃避适用外汇限制而按中国法律承担责任，包括</tspan></text>

y="79.998596">例如，我们可能就外汇活动（如汇出股息及外币计值借款）面临更为严格的审</tspan><tspan id="tspan64" x="-337.83749 -324.55939 -311.28131 -299.97549 -288.29019 -275.01208 -261.73401 -248.4559 -235.1778 -221.8997 -208.6216 -195.34351 -182.0654 -168.78729 -155.5092 -142.23109 -128.953 -115.6749 -102.3968 -89.118698 -75.840599 -62.5625 -49.284401 -36.006302 -22.728201 -9.4500999 1.8557 13.541 26.819099 38.124901 49.809101 63.0872 76.365303" y="95.9981">批程序，这可能对我们的经营业绩及财务状况产生不利影响。此外，倘我们</tspan><tspan id="tspan66" x="-337.83749 -324.8432 -311.84891 -298.85461 -285.86029 -272.866 -259.8717 -246.8774 -233.8831 -220.88879 -207.8945 -194.90021 -183.59441 -172.2424 -159.24809 -146.2538 -133.25951 -120.2652" y="111.9976">决定收购一家中国国内公司，我们无法向</tspan></text>
<text id="text76" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,325.2684,537.0162)" xml:space="preserve"><tspan id="tspan70" x="0 12.9943 25.9886 38.982899 51.9772 64.971497 77.965797 90.960098 103.9544 116.9487 129.94299 142.9373 155.93159 162.6174 173.96831" y="0">阁下保证我们或该公司拥有人（视</tspan><tspan id="tspan72" x="-240.22791 -226.92889 -213.6299 -200.3309 -188.6214 -181.53081 -168.2318 -154.9328 -141.6338 -128.33479 -115.0358 -101.7368 -88.437798 -75.138802 -61.839802 -48.540798 -35.241798 -21.942801 -8.6437998 4.6552 17.954201 31.253201 44.5522 57.8512 71.1502 84.449203 97.748199 111.0472 124.3462 137.6452 150.9442 162.2511 173.9606" y="15.9995">情况而定）将能按外汇法规的规定取得必要批文或办妥必要备案及登记。这</tspan><tspan id="tspan74" x="-240.22791 -227.6373 -215.04671 -202.4561 -189.86549 -177.2749 -164.6843 -152.0937 -139.5031 -126.9125 -114.3219 -101.7313 -89.140701 -76.550102 -63.959499 -51.3689 -38.778301 -26.1877 -13.5971 -1.0065 11.5841 24.1747 36.765301 49.3559 61.946499 74.537102 87.127701 99.7183 112.3089 124.8995 137.4901 150.0807 162.6713 173.9771" y="31.999001">或会限制我们实施收购战略的能力并可能对我们的业务及前景产生不利影响。</tspan></text>
