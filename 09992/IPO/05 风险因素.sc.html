<text id="text46" style="font-variant:normal;font-size:11.388px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(0.96592673,0,-0.25881568,-0.96592673,121.011,702.3125)" xml:space="preserve"><tspan id="tspan44" x="0 13.466342 26.932684 40.399029 53.865368 67.331711 80.798058 94.264397 107.73074 121.19708 134.66342 148.12976 161.59612 173.29959" y="0">投资我们的股份涉及重大风险。</tspan></text>
<text id="text58" style="font-variant:normal;font-size:11.388px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(0.96592673,0,-0.25881568,-0.96592673,311.0855,702.3125)" xml:space="preserve"><tspan id="tspan48" x="0 13.466342 26.932684 40.399029 53.865368 67.331711 80.798058 94.264397 107.73074 121.19708 134.66342 146.36804 158.13643 171.60277 185.06911" y="0">阁下于投资我们的股份前，应审慎</tspan><tspan id="tspan50" x="-221.68732 -208.1982 -194.70908 -181.21996 -167.73083 -154.24171 -140.75259 -127.26348 -113.77437 -100.28525 -86.796127 -73.307007 -59.81789 -48.114414 -36.319836 -22.830717 -9.3415985 4.1475196 17.636639 31.125757 44.614876 58.103992 71.593109 85.08223 98.57135 112.06046 123.76508 135.55852 149.04764 162.53676 176.02588 189.515" y="16.563887">考虑本招股章程内的所有资料，包括下述风险及不明朗因素。下文描述我</tspan><tspan id="tspan52" x="-217.2494 -203.76028 -190.27116 -176.78204 -163.29292 -149.8038 -136.31468 -122.82557 -109.33645 -97.631836 -85.838394 -72.349274 -58.860157 -45.37104 -31.881922 -18.392803 -4.9036846 8.585434 22.074553 35.563671 49.052788 62.541908 76.031029 89.520142 103.00926 114.71387 126.50845 139.99757 153.48669 166.97581 180.46494 193.95406" y="33.127773">们认为属重大的风险。任何以下风险均可能对我们的业务、财务状况及经</tspan><tspan id="tspan54" x="-212.81148 -199.32237 -185.83325 -172.34413 -158.85501 -145.36589 -131.87677 -118.38766 -104.89854 -91.409416 -77.920296 -66.215683 -54.422245 -40.933125 -27.444008 -13.954888 -0.46577033 13.023348 26.512466 40.001583 51.705059 63.499641 76.988762 90.477875 103.967 117.45612 130.94524 144.43436 157.92346 171.41258 184.9017 198.39082" y="49.691658">营业绩造成重大不利影响。在任何有关情况下，我们股份的市价可能会下</tspan><tspan id="tspan56" x="-208.37357 -196.66896 -184.96434" y="66.255547">跌，而</tspan></text>
<text id="text70" style="font-variant:normal;font-size:11.388px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(0.96592673,0,-0.25881568,-0.96592673,137.88603,638.3145)" xml:space="preserve"><tspan id="tspan60" x="0 13.412819 26.825638 40.238457 53.651276 67.064095 80.476913 93.889732 107.30255 120.71537 134.12819 147.541 160.95383 172.65843" y="0">阁下或会损失全部或部分投资。</tspan><tspan id="tspan62" x="-8.5945444 5.1758585 18.94626 32.716663 46.487068 60.257469 74.02787 87.798271 101.56868 115.33908 129.10948 142.87988 156.65028 170.42068 184.19109 195.89571 208.02054 221.79094 235.56134 249.33174 263.10214 276.87256 290.64294 304.41336 318.18375 331.95416 345.72458 359.49496 373.26538" y="33.12891">该等因素为未必会发生的或然事件，且我们概不能就任何或然事件</tspan><tspan id="tspan64" x="-33.502438 -20.013319 -6.5242009 6.9649177 20.454037 33.943153 47.432274 60.921391 74.410507 87.899628 101.38875 114.87786 126.58248 138.37592 151.86504 165.35416 178.84328 192.3324 205.82152 217.52612 229.31956 242.80869 256.29779 269.78693 283.27603 296.76517 310.25427 323.74341 337.23251 350.72162 364.21075 377.69986" y="49.692795">发生的可能性发表任何意见。除非另有指明，否则已提供的资料均为截至</tspan><tspan id="tspan66" x="-29.064524 -15.575405 -2.0862865 11.402832 24.891951 38.381069 51.870186 65.359306 78.848427 92.33754 105.82666 117.53127 129.32472 142.81383 156.30295 169.79207 183.28119 196.77031 210.25943 223.74855 237.23766 250.72678 264.21591 275.91937 287.71396 301.20306 314.6922 328.1813 341.67044 355.15955 368.64865 382.13779" y="66.256683">最后实际可行日期的资料，不会于本文件日期后更新，并受限于本招股章</tspan><tspan id="tspan68" x="-24.62661 -15.769001 -4.0643868 9.3484316 22.76125 36.174068 49.586887 61.2915 70.147972 83.560791 96.97361 110.38643 123.79925 137.21207 150.62488 162.33064" y="82.820564">程「前瞻性陈述」一节的警示声明。</tspan></text>
<text id="text74" style="font-variant:normal;font-size:12px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,517.686)" xml:space="preserve"><tspan id="tspan72" x="0 14.1336 28.2672 42.400799 56.534401 70.667999 84.801598 98.935204 113.0688 127.2024 141.336 155.4696 169.6032 183.7368" y="0">与我们的业务及行业有关的风险</tspan></text>
<text id="text78" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,485.559)" xml:space="preserve"><tspan id="tspan76" x="0 13.2781 26.5562 39.834301 53.1124 66.390503 79.668602 92.946701 106.2248 119.5029 130.8087 142.494 155.77209 169.0502 182.32829 195.6064" y="0">作为潮流文化娱乐公司，我们无法向</tspan></text>
<text id="text84" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,303.6336,485.559)" xml:space="preserve"><tspan id="tspan80" x="0 13.2781 26.5562 39.834301 51.140099 62.825401 76.1035 89.381599 102.6597 115.9378 129.2159 142.494 155.77209 169.0502 182.32829 195.6064" y="0">阁下保证，我们将能够设计及开发受</tspan><tspan id="tspan82" x="-218.59309 -205.6373 -192.6815 -179.72569 -166.7699 -153.8141 -140.85831 -127.9025 -116.5967 -105.2909 -92.335098 -79.379303 -66.4235 -53.467701 -40.511902 -27.556101 -14.6003 -1.6445 11.3113 24.267099 37.2229 50.178699 63.134499 76.090302 89.046097 102.0019 114.9577 126.2635" y="15.9995">消费者欢迎的产品，或我们将能够保持成功产品的受欢迎程度。</tspan></text>
<text id="text90" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3875,437.5594)" xml:space="preserve"><tspan id="tspan86" x="0 13.2132 26.426399 39.639599 52.852798 66.066002 79.279198 92.492401 105.7056 118.9188 132.132 145.3452 156.6499 168.25819 181.47141 194.6846 207.8978 221.11099 234.3242 247.5374 260.75061 273.96381 285.26959 296.8779 310.09109 323.30429 336.51749 349.73071 362.94391 374.24969 385.858" y="0">消费者的兴趣发展非常迅速，且不时发生巨大变化。为了取得成功，我</tspan><tspan id="tspan88" x="-28.347 -15.268 -2.1889999 10.89 23.969 37.048 50.126999 63.206001 76.285004 89.363998" y="15.9995">们须预测吸引消费者的</tspan></text>
<text id="text94" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,215.4367,421.5599)" xml:space="preserve"><tspan id="tspan92" x="0 3.5167" y="0">IP</tspan></text>
<text id="text126" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,227.969,421.5599)" xml:space="preserve"><tspan id="tspan96" x="0 13.079 26.158001 37.463799 48.914799 61.993801 75.0728 88.151802 101.2308 114.3098 127.3888 140.4678 153.5468 166.62579 179.7048 192.7838 205.86279 218.9418 232.0208 245.09979 258.1788 271.25781" y="0">及产品，并快速开发及推出能够赢得消费者有限时</tspan><tspan id="tspan98" x="-142.9285 -131.6227 -119.9374 -106.6593 -93.381203 -80.103104 -66.824997 -53.546902 -40.268799 -26.9907 -15.6849 -3.9995999 9.2784996 22.556601 35.834702 49.112801 62.3909 75.668999 88.947098 102.2252 115.5033 128.7814 142.05949 155.3376 168.61571 181.8938 195.17191 208.45 221.7281 233.03391 244.71809 257.99619 271.27429" y="15.9995">间、关注及消费的产品。不断变化的消费者品味及不断变化的利益，加上消</tspan><tspan id="tspan100" x="-142.9285 -129.6163 -116.3041 -102.9919 -89.679703 -76.3675 -63.055302 -49.743099 -36.430901 -23.1187 -9.8065004 3.5057001 10.1959 21.9219 35.2341 48.546299 61.858501 75.1707 88.482903 101.7951 115.1073 128.41949 141.7317 153.03641 164.76241 178.0746 191.3868 204.69901 218.0112 231.32339 244.6356 257.94781 271.26001" y="31.999001">费者感兴趣及所接受消费品（内容的不断变化及扩大，使得若干产品及内容</tspan><tspan id="tspan102" x="-142.9285 -129.7681 -116.6077 -103.4473 -90.286903 -77.126503 -63.966099 -50.805698 -39.499901 -27.953199 -14.7928 -1.6324 11.528 24.6884 37.848801 51.009201 64.169601 77.330002 90.490402 103.6508 116.8112 129.9716 143.132 156.2924 169.4528 182.6132 195.77361 208.93401 222.09441 233.40021 244.9458 258.1062 271.2666" y="47.998501">无法被消费者接受，而其他产品及内容可能会在一段时间内受欢迎，然后迅</tspan><tspan id="tspan104" x="-142.9285 -129.6779 -116.4273 -103.1767 -91.870903 -80.218597 -66.968002 -55.662201 -44.008801 -30.7582 -17.507601 -10.8251 0.8272 14.0778 27.3284 40.578999 53.829601 67.0802 80.330803 93.581398 106.832 120.0826 133.33321 146.5838 159.8344 173.08501 186.3356 197.9879 205.01691 218.2675 231.5181 244.76871 258.01929 271.2699" y="63.998001">速被取代。因此，消费品（尤其是像我们这样的潮流文化产品）的生命周期可</tspan><tspan id="tspan106" x="-142.9285 -129.7681 -116.6077 -103.4473 -90.286903 -78.981102 -67.435501 -54.275101 -42.969299 -31.4226 -18.262199 -5.1018 8.0586004 21.219 34.379398 47.539799 60.700199 73.860603 87.021004 100.1814 113.3418 126.5022 139.6626 152.823 165.9834 179.1438 192.3042 205.4646 218.625 231.7854 244.9458 258.1062 271.2666" y="79.997498">能相对较短。此外，鉴于数字产品市场不断增长以及潮流文化的数字化程度</tspan><tspan id="tspan108" x="-142.9285 -129.7681 -116.6077 -103.4473 -92.141502 -80.594803 -67.434402 -54.273998 -41.113602 -27.953199 -14.7928 -1.6324 11.528 24.6884 37.848801 51.009201 64.169601 77.330002 90.490402 103.6508 116.8112 129.9716 143.132 156.2924 169.4528 182.6132 195.77361 208.93401 222.09441 233.40021 244.9458 258.1062 271.2666" y="95.997002">越来越高，消费者对实体产品的需求亦可能随著时间的推移而降低。消费者</tspan><tspan id="tspan110" x="-142.9285 -129.8792 -116.8299 -103.7806 -90.7313 -77.681999 -64.632698 -51.583401 -38.5341 -25.4848 -12.4355 0.61379999 13.6631 26.7124 39.7617 52.811001 65.860298 78.909599 91.9589 105.0082 118.0575 131.1068 144.1561 157.2054 170.2547 183.304 196.3533 209.4026 220.7084 232.12421 245.17349 258.22281 271.27209" y="111.9965">对潮流文化产品的需求可以且确实在没有任何警示的情况下变化。即使我们</tspan><tspan id="tspan112" x="-142.9285 -130.25211 -117.5757 -104.8993 -92.2229 -79.546501 -66.870102 -54.193699 -41.5173 -30.2115 -18.905701 -6.2293 6.4471002 19.123501 31.7999 44.476299 57.152699 69.829102 82.505501 95.1819 107.8583 120.5347 133.21111 145.8875 158.5639 171.2403 183.9167 196.59309 209.2695 221.94591 234.6223 247.29871 259.9751 271.27979" y="127.996">的产品组合最初成功，亦无法保证我们能够保持其在消费者中的受欢迎程度。</tspan><tspan id="tspan114" x="-142.9285 -129.8792 -118.5734 -107.1576 -94.108299 -81.058998 -68.009697 -54.9604 -41.911098 -28.861799 -15.8125 -2.7632 10.2861 23.3354 36.384701 49.433998 62.483299 75.5326 88.581902 101.6312 114.6805 127.7298 140.7791 153.8284 166.8777 179.927 192.9763 206.0256 219.07491 232.12421 245.17349 258.22281 271.27209" y="143.9955">因此，我们的成功将部分取决于我们不断创作及推出消费者感兴趣的新产品</tspan><tspan id="tspan116" x="-142.9285 -129.65041 -116.3723 -105.0665 -93.381203 -80.103104 -66.824997 -53.546902 -40.268799 -26.9907 -13.7126 -2.4068 9.2774 22.5555 35.833599 49.111698 62.389801 75.6679 88.945999 102.2241 115.5022 128.7803 142.0584 155.3365 168.61459 181.8927 195.17081 208.4489 221.72701 233.03391 244.71809 257.99619 271.27429" y="159.995">的能力。倘我们无法实现，我们的销量及盈利能力将受到不利影响。倘我们</tspan><tspan id="tspan118" x="-142.9285 -129.9848 -117.0411 -104.0974 -91.153702 -78.209999 -65.266296 -52.322601 -39.378899 -26.4352 -13.4915 -0.5478 12.3959 25.3396 38.283298 51.227001 64.1707 77.114403 90.058098 103.0018 115.9455 128.88921 141.8329 154.7766 167.72031 180.664 193.6077 206.55141 219.4951 232.4388 245.38251 258.3262 271.2699" y="175.99451">投入时间及资源开发及营销该等对于消费者没有足够吸引力或根本没有吸引</tspan><tspan id="tspan120" x="-142.9285 -129.8792 -116.8299 -103.7806 -90.7313 -77.681999 -64.632698 -51.583401 -38.5341 -25.4848 -12.4355 0.61379999 13.6631 26.7124 38.017101 49.432899 62.482201 75.531502 88.580803 101.6301 114.6794 127.7287 140.778 153.8273 166.8766 179.9259 192.9752 206.02451 219.07381 232.12309 245.17239 258.22171 271.271" y="191.994">力的产品以满足我们的销售目标，则我们的销量及溢利可能会下降且我们的</tspan><tspan id="tspan122" x="-142.9285 -129.9727 -117.0169 -104.0611 -91.105301 -78.149498 -65.193703 -52.2379 -39.282101 -26.3263 -13.3705 -2.0646999" y="207.9935">业务表现可能会受到损害。</tspan><tspan id="tspan124" x="-114.5815 -101.6587 -88.735901 -75.813103 -62.890301 -49.967499 -37.044701 -25.74 -14.4342 -1.5114 11.4114" y="239.99361">于往绩记录期间，我们从</tspan></text>

6 94.619797 107.7802 119.086 130.63161 143.79201 156.95239" y="63.998001">功一般取决于该等第三方的努力，以及媒体及整个娱乐行业的状况。倘一个</tspan><tspan id="tspan134" x="-257.24271 -244.01849 -230.7943 -217.5701 -204.3459" y="79.997498">或多个该等</tspan></text>

001">我们及我们的授权方（包括艺术家及</tspan></text>

131.604 144.7644 157.9248 171.08521 184.24561 197.40601 210.56641 223.72681 236.88721 250.04761 261.35339 272.90009 286.06049 299.22089 312.38129 325.54169 338.70209 351.86249 363.1683 374.715 387.8754 401.0358 414.1962" y="95.9981">我们的品牌亦取决于我们应对竞争压力的能力。倘我们未能如此，我们的品</tspan><tspan id="tspan38" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 141.7988 153.2146 166.2639 179.3132 192.3625 205.4118 218.46111 231.51041 244.55969 257.60901 270.65829 283.70761 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="111.9976">牌价值或声誉可能会降低，且我们的业务及经营业绩可能会受到重大不利影</tspan><tspan id="tspan40" x="0 11.3058 22.9911 36.269199 47.573898 59.259201 72.5373 85.815399 99.093498 112.3716 125.6497 138.9278 152.2059 165.48399 178.7621 192.04021 203.34599 215.0313 228.3094 241.58749 254.8656 268.14371 281.42181 294.69989 307.978 321.2561 334.53421 347.81229 361.09039 374.3685 387.64661 400.92471 414.20279" y="127.9971">响。此外，随著我们的规模不断扩大、扩大我们的产品范围及扩大我们的地</tspan><tspan id="tspan42" x="0 13.2781 26.5562 39.834301 53.1124 64.418198 76.102402 89.380501 102.6586 115.9367 129.2148 142.4929 155.771 169.0491 182.32719 195.6053 208.88341 222.1615 235.43961 248.7177 261.99579 275.2739 288.552 299.85889 311.54309 324.8212 338.0993 351.37741 364.65549 377.93359" y="143.9966">理覆盖范围，保持产品质量及一致性可能会更加困难，且我们无法向</tspan></text>

.998001">利影响。此外，任何关于我们的产品（包括泡泡玛特品牌产品及第三方产品）、</tspan><tspan id="tspan56" x="-400.91809 -387.96231 -376.65649 -365.35181 -352.396 -339.44019 -326.48441 -313.52859 -300.57281 -287.617 -274.66119 -261.70541 -248.7496 -235.79379 -222.838 -209.8822 -196.92641 -183.9706 -171.0148 -158.05901 -145.1032 -132.1474 -119.1916 -106.2358 -93.279999 -80.324203 -67.368401 -54.412601 -41.456799 -28.500999 -15.5452 -2.5894001 8.7174997" y="79.997498">服务、本集团或管理层的负面宣传或争议亦可能严重损害我们的品牌形象。</tspan><tspan id="tspan58" x="-372.57111 -359.59879 -346.6265 -333.65421 -320.68188 -307.70959 -294.7373 -281.76501 -268.79269 -255.8204 -242.8481 -229.87579 -216.9035 -203.9312 -190.95889 -177.9866 -165.0143 -152.04201 -139.0697 -126.0974 -113.1251 -100.1528 -87.180496 -74.208199 -62.901299 -51.576801 -38.6045 -25.6322 -12.6599 0.31240001 13.2847" y="111.9976">我们认为我们的商标及品牌名称对我们的业务至关重要。倘我们无法充</tspan><tspan id="tspan60" x="-400.91809 -387.75769 -374.59729 -361.43689 -348.27649 -335.11609 -321.95569 -308.79529 -295.63489 -284.328 -272.78241 -259.62201 -246.46159 -233.30119 -220.14079 -206.98039 -193.82001 -180.65961 -167.49921 -154.33881 -141.17841 -129.8726 -118.3259 -105.1655 -92.005096 -78.844704 -65.684303 -52.523899 -39.363499 -26.2031 -13.0427 0.1177 13.2781" y="127.9971">分保护该等知识产权，我们可能会失去该等权利、我们的品牌形象可能会受</tspan><tspan id="tspan62" x="-400.91809 -387.64111 -374.36411 -363.05829 -351.37411 -338.09711 -324.8201 -311.54309 -298.26611 -284.98911 -271.7121 -258.43509 -245.1581 -231.8811 -218.6041 -205.3271 -192.05009 -178.7731 -165.49609 -152.2191 -138.94209 -125.6651 -114.3604 -102.6762 -89.3992 -76.1222 -62.8452 -49.568199 -41.012402" y="143.9966">到损害，及我们的竞争地位及业务可能会受到影响。请参阅下文「</tspan></text>

<text id="text152" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3875,505.0161)" xml:space="preserve"><tspan id="tspan108" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 218.86369 230.1882 243.16051 256.13281 269.1051 282.07739 295.04971 308.022 320.99429 333.96661 346.9389 359.91119 372.88351 385.8558" y="0">我们的知识产权是我们业务的宝贵财富。我们产品的市场在很大程度上</tspan><tspan id="tspan110" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 309.19131 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="15.9995">取决于与我们的产品设计及我们授权的知识产权相关的价值。虽然我们的若</tspan><tspan id="tspan112" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 75.081596 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 308.49939 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="31.999001">干知识产权在中国、香港及我们经营所在若干其他国家注册，但无法保证与</tspan><tspan id="tspan114" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 51.321602 64.599701 77.8778 91.155899 104.434 117.7121 130.9902 144.2683 157.5464 170.82449 182.13029 193.8145 207.09261 220.3707 233.6488 246.9269 260.20499 271.5119 283.19611 296.47421 307.78 319.4653 332.74341 346.02151 359.29959 372.5777 385.8558" y="47.998501">该等国家的该等知识产权相关的权利，包括我们注册、使用、维持或维护关</tspan><tspan id="tspan116" x="-28.347 -15.2823 -2.2176001 10.8471 23.9118 36.976501 50.041199 63.1059 76.170601 87.476402 98.910896 111.9756 125.0403 138.105 151.16969 164.23441 175.54021 186.9747 200.0394 213.1041 226.16879 239.23351 252.2982 263.604 275.03851 288.10321 301.16791 314.2326 325.53839 336.9729 350.0376 361.34341 372.77789 385.84259" y="63.998001">键商标及版权的能力。于可能范围内，我们依赖商标、商业包装、版权、专利</tspan><tspan id="tspan118" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 337.03339 348.3392 359.755 372.80429 385.85361" y="79.997498">及商业机密法律以及保密程序或其他具相同或类似性质的合同限制，以建立</tspan><tspan id="tspan120" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 51.321602 64.599701 77.8778 91.155899 104.434 117.7121 130.9902 144.2683 157.5464 170.82449 184.1026 195.4095 207.0937 220.3718 231.6776 243.3629 256.64099 269.9191 283.1972 294.50299 306.18829 319.4664 332.74451 346.02261 359.30069 372.5788 385.8569" y="95.997002">及保护我们的知识产权或其他专有权利。然而，该等法律、程序及限制可能</tspan><tspan id="tspan122" x="-28.347 -15.2405 -2.1340001 10.9725 24.079 37.185501 50.292 63.398499 76.504997 89.611504 102.718 115.8245 127.1303 138.6132 151.7197 164.8262 177.93269 191.0392 204.14571 217.2522 230.3587 243.46519 256.57169 269.67819 282.7847 295.8912 308.99771 322.10419 335.21069 348.3172 361.42371 374.53021 385.836" y="111.9965">仅提供有限及不确定的保护，且我们的任何知识产权都可能受造假者质疑、</tspan><tspan id="tspan124" x="-28.347 -15.3967 -4.0908999 7.2149 20.165199 31.4699 42.7757 55.726002 68.6763 81.626602 94.576897 105.8827 117.1885 130.13879 141.4435 152.7493 165.6996 178.6499 191.6002 204.55051 217.50079 230.4511 243.4014 256.35172 269.302 282.25229 295.20261 308.15289 321.10321 334.0535 347.00381 359.9541 372.90439 385.85471" y="127.996">推翻、规避、侵犯或侵占。此外，我们在许多其他国家的知识产权组合不如我</tspan><tspan id="tspan126" x="-28.347 -15.5727 -2.7983999 9.9758997 22.7502 35.524502 48.298801 61.073101 73.847397 85.153198 96.459 109.2333 122.0076 134.78191 147.5562 160.33051 171.63631 182.94099 195.7153 208.48959 221.2639 234.03819 246.8125 259.58679 272.36111 285.13541 297.9097 310.68399 323.45831 336.2326 349.0069 361.78119 374.55551 385.8613" y="143.9955">们在中国的组合广泛，且外国的法律，包括我们的产品销售所在的新兴市场，</tspan><tspan id="tspan128" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 230.89549 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="159.995">可能无法像中国法律一样保护我们的知识产权。保护我们的商标及版权所需</tspan><tspan id="tspan130" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 60.6936" y="175.99451">的费用可能很高。</tspan><tspan id="tspan132" x="0 12.9723 24.278099 35.6026 48.574902 61.547199 74.519501 87.491798 100.4641 113.4364 126.4087 139.381 152.3533 165.32561 178.2979 191.2702 204.24249 217.2148 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="207.9946">此外，我们可能无法申请或无法获得对我们业务中使用或对我们业务有</tspan><tspan id="tspan134" x="-28.347 -15.3967 -2.4463999 10.5039 23.454201 36.404499 49.354801 62.305099 75.255402 88.205704 101.156 114.1063 127.0566 140.0069 151.3127 162.6185 175.5688 186.8735 198.17931 211.12959 224.0799 237.0302 249.9805 262.93079 274.2366 285.54239 298.49271 311.44299 324.39331 337.3436 348.64828 359.9541 372.90439 385.85471" y="223.99409">益的知识产权的若干方面的保护。此外，我们无法保证，我们对商标、版权等</tspan><tspan id="tspan136" x="-28.347 -15.3967 -2.4463999 10.5039 23.454201 36.404499 49.354801 62.305099 75.255402 88.205704 101.156 112.4618 123.7665 136.7168 149.6671 162.6174 173.9232 185.229 198.17931 211.12959 224.0799 237.0302 249.9805 262.93079 275.8811 288.83139 301.78171 314.73199 326.03781 337.3436 350.29391 361.5986 372.90439 385.85471" y="239.99361">知识产权的申请将被授予，或倘授予，将提供稳健及有效的保护。此外，第三</tspan><tspan id="tspan138" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 337.03339 350.0827 361.38739 372.80319 385.85251" y="255.9931">方过去及可能在将来对我们当前的任何商标及版权以及其他知识产权，或我</tspan><tspan id="tspan140" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 335.28989 346.70569 359.755 372.80429 385.85361" y="271.99261">们将来可能寻求获得的任何商标或版权或其他知识产权提起侵权、失效或类</tspan><tspan id="tspan142" x="-28.347 -15.3967 -2.4463999 8.8593998 20.165199 33.115501 46.0658 59.016102 71.9664 84.916702 96.222504 107.5272 120.4775 133.4278 146.3781 159.3284 172.2787 183.5845 194.8903 207.84061 220.79089 233.7412 246.6915 259.64182 272.5921 285.54239 298.49271 311.44299 324.39331 337.3436 348.64828 359.9541 372.90439 385.85471" y="287.9921">似申索。任何该等申索，无论是否成功，都可能产生极高的辩护成本、转移管</tspan><tspan id="tspan144" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 88.243103 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 229.5381 241.08369 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="303.99161">理层的注意力及资源、损害我们的声誉及品牌，并严重损害我们的业务及经</tspan><tspan id="tspan146" x="-28.347 -15.1866 -2.0262001 9.2796001 20.825199 33.9856 47.146 60.3064 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 244.552 257.7124 270.8728 284.0332 297.1936 310.354 321.65979 333.20541 346.36581 359.52621 372.68661 385.84698" y="319.99109">营业绩。我们提起的任何诉讼或法律程序都可能耗费大量资金、时间并分散</tspan><tspan id="tspan148" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 165.649 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="335.9906">管理层在其他业务问题上的注意力。诉讼及其他法律程序亦使我们的知识产</tspan><tspan id="tspan150" x="-28.347 -15.9379 -3.5288 8.8802996 21.2894 33.698502 46.107601 58.516701 69.822502 81.127197 93.536301 105.9454 118.3545 130.7636 142.0694 153.3752 165.7843 178.19341 190.60249 203.0116 215.4207 227.8298 240.23891 252.64799 265.0571 277.46619 289.87531 302.28439 314.69351 327.1026 339.51169 350.8175 362.12329 374.53241 385.8382" y="351.99011">权面临失效的风险，或倘未失效，可能会导致我们的知识产权范围缩小。此外，</tspan></text>

<text id="text56" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 12.6764 25.3528 38.029202 50.705601 63.382 76.058403 88.734802 101.4112 114.0876 126.764 139.4404 152.11681 164.7932 177.4696 190.146 202.8224 215.49879 228.1752 240.85159 253.528 266.20441 278.8808 291.55719 304.23361 316.91 329.5864 342.26279 354.93921 367.6156 378.92139 390.2272 402.90359 414.20831" y="0">我们保护及捍卫我们的商标及版权以及其他知识产权的努力可能无效。此外，</tspan><tspan id="tspan28" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 233.14391 244.55969 257.60901 270.65829 283.70761 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="15.9995">我们可能会引起第三方针对我们提起申索。我们可能不会在我们提起的任何</tspan><tspan id="tspan30" x="0 13.1384 26.2768 39.415199 52.5536 65.692001 78.830399 91.968803 105.1072 118.2456 131.384 144.5224 155.8282 167.3485 180.48689 193.62531 206.7637 219.9021 233.0405 246.17889 259.31729 272.45569 285.59409 298.73251 311.87091 325.00931 331.69949 343.22089 356.35931 367.88071 374.78101 387.9194 401.0578 414.1962" y="31.999001">诉讼或其他法律程序中胜诉，且获得的损害赔偿或其他补救（如有）可能不具</tspan><tspan id="tspan32" x="0 13.1604 26.320801 39.481201 52.641602 63.947399 75.492996 88.653397 101.8138 114.9742 128.1346 141.295 154.4554 167.6158 180.7762 193.9366 207.097 220.2574 233.4178 246.5782 259.73859 272.89899 286.05939 297.3652 308.9119 322.0723 335.2327 348.3931 361.5535 374.7139 387.8743 401.0347 414.1951" y="47.998501">有商业价值。任何该等事件的发生可能对我们的业务、财务状况及经营业绩</tspan><tspan id="tspan34" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 101.9964" y="63.998001">造成重大不利影响。</tspan><tspan id="tspan36" x="28.347 41.435902 52.740601 64.203697 77.292603 90.3815 103.4704 116.5593 129.64819 142.73711 155.826 168.9149 182.0038 195.0927 208.18159 221.27049 234.35941 247.4483 260.5372 273.6261 286.715 299.80389 312.89279 325.98169 339.07059 352.15948 365.24841 378.33731 391.42621 402.73199 414.194" y="95.9981">再者，我们的大多数产品都拥有我们授权方的商标及其他知识产权，且</tspan><tspan id="tspan38" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 220.0946 231.51041 244.55969 257.60901 270.65829 283.70761 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="111.9976">我们产品的价值受该等权利的价值影响。我们的授权方维持及保护彼等的商</tspan><tspan id="tspan40" x="0 12.5906 25.1812 37.771801 50.3624 62.952999 75.543602 88.134201 100.7248 113.3154 125.906 138.4966 151.0872 163.6778 176.2684 188.85899 201.4496 214.04021 226.6308 239.22141 251.812 264.40259 276.99319 289.5838 302.17441 314.76501 327.35559 339.9462 352.5368 365.12741 377.71799 390.30859 402.8992 414.20499" y="127.9971">标及其他知识产权的能力受到与上述与我们的知识产权相关风险相似的风险。</tspan><tspan id="tspan42" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 234.88741 247.93671 260.98599 274.03531 287.08459 300.13391 313.1832 324.48792 335.90369 348.953 362.00229 375.05161 388.10089 401.15021 414.19949" y="143.9966">我们并无控制对我们授权方的商标及其他知识产权的保护，亦不能确保我们</tspan><tspan id="tspan44" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 234.88741 247.93671 260.98599 274.03531 285.34109 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="159.99609">授权方能够获得或保护彼等的商标及其他知识产权。失去我们拥有的或获授</tspan><tspan id="tspan46" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 103.4286 114.9753 128.1357 141.2961 154.4565 167.6169 180.7773 193.9377 207.0981 220.2585 233.4189 246.5793 259.73969 272.90009 286.06049 299.22089 312.38129 325.54169 336.84641 348.3931 361.5535 374.7139 387.8743 401.0347 414.1951" y="175.99561">权的任何重要商标、版权或其他知识产权可能对我们的业务、财务状况及经</tspan><tspan id="tspan48" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 105.2832 118.4436 131.604 142.90981 154.4565 167.6169 178.9227 190.46941 203.62981 216.79021 229.95061 243.11099 256.27139 269.43179 282.59219 295.75259 308.91299 322.07339 335.2338 348.3942 361.5546 374.715 387.8754 401.0358 414.1962" y="191.9951">营业绩产生重大不利影响。此外，我们的授权方可能会从事可能损害彼等的</tspan><tspan id="tspan50" x="0 12.9437 25.8874 38.8311 51.774799 64.718498 77.662201 90.605904 103.5496 116.4933 129.437 142.38071 155.3244 168.2681 181.21181 194.1555 207.0992 220.04289 232.9866 245.9303 258.87399 271.81769 284.76141 297.70511 310.6488 323.5925 336.53619 349.47989 362.42361 375.36731 388.311 401.2547 414.19839" y="207.9946">声誉并损害我们获彼等授权的知识产权价值的活动或其他受到负面宣传的活</tspan><tspan id="tspan52" x="0 11.3058 22.852501 36.012901 49.173302 62.333698 75.494102 88.654503 101.8149 114.9753 128.1357 141.2961 154.4565 167.6169 180.7773 193.9377 207.0981 220.2585 233.4189 246.5793 259.73969 272.90009 286.06049 299.22089 312.38129 325.54169 336.8475 348.3942 361.5546 374.715 387.8754 401.0358 414.1962" y="223.99409">动，从而可能降低消费者对我们产品的需求并对我们的业务、财务状况及经</tspan><tspan id="tspan54" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 114.9522" y="239.99361">营业绩产生不利影响。</tspan></text>
<text id="text62" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,441.0181)" xml:space="preserve"><tspan id="tspan58" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 105.2832 116.5901 128.1357 141.2961 154.4565 167.6169 180.7773 193.9377 207.0981 220.2585 233.4189 246.5793 259.73969 272.90009 286.06049 299.22089 312.38129 325.54169 338.70209 351.86249 365.02289 376.3287 387.8743 401.0347 414.1951" y="0">我们的行业竞争激烈。倘我们无法与现有或新的竞争对手有效竞争，我们的</tspan><tspan id="tspan60" x="0 12.9558 24.2616 35.566299 48.522099 61.477901 74.433701 87.389503 100.3453 113.3011 126.2569 139.21271 152.1685 165.1243 178.08009 191.0359 202.34171" y="15.9995">销量、市场份额及盈利能力可能下降。</tspan></text>
<text id="text88" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,393.0185)" xml:space="preserve"><tspan id="tspan64" x="0 12.5686 25.137199 37.705799 50.274399 62.842999 75.411598 87.980202 100.5488 113.1174 125.686 138.25459 150.8232 163.3918 175.9604 188.52901 201.0976 212.4023 223.7081 236.2767 248.84531 261.41391 273.98251 286.55109 299.11969 311.68829 324.2569 336.8255 349.3941 361.96271 374.53131 385.836" y="0">我们的行业现在并将继续保持激烈竞争。我们主要与潮流玩具公司竞争。</tspan><tspan id="tspan66" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 270.0434 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="15.9995">我们亦与国内外众多较小收藏品设计商及制造商竞争。我们的竞争对手可能</tspan><tspan id="tspan68" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 51.321602 64.599701 77.8778 91.155899 102.4617 114.147 127.4251 138.7298 150.4151 163.69321 176.9713 190.2494 203.5275 216.8056 230.08369 241.3895 253.0748 266.35291 279.63101 292.90909 306.18719 319.4653 332.74341 346.02151 359.29959 372.5777 385.8558" y="31.999001">比我们拥有更多的财务、技术、营销及其他资源，并且可能会投入更多的资</tspan><tspan id="tspan70" x="-28.347 -15.0689 -1.7908 11.4873 22.7931 34.477299 47.755402 61.033501 74.3116 87.589699 100.8678 114.1459 127.424 140.7021 153.98019 165.286 176.9713 190.2494 201.55521 213.2394 226.5175 239.79559 253.0737 266.35181 279.62991 292.90799 306.1861 319.4642 332.74231 346.02039 359.29849 372.5766 385.85471" y="47.998501">源来开发、推广及支持彼等的产品。此外，彼等可能比我们拥有更广泛的行</tspan><tspan id="tspan72" x="-28.347 -15.0689 -1.7908 9.5150003 21.2003 34.478401 47.7565 61.034599 74.312698 87.590797 100.8689 114.147 127.4251 140.7032 153.98129 167.2594 180.53751 193.8156 207.0937 220.3718 231.6776 243.3629 256.64099 267.94571 279.63101 292.90909 306.18719 319.4653 332.74341 346.02151 359.29959 372.5777 385.8558" y="63.998001">业关系、更久的运营历史及更大的品牌知名度。因此，该等竞争对手可能会</tspan><tspan id="tspan74" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 101.4024 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 242.6974 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="79.997498">对消费者的品味及趋势、寻求吸引消费者的创意、推出与我们竞争的新产品</tspan><tspan id="tspan76" x="-28.347 -15.5727 -2.7983999 9.9758997 22.7502 35.524502 48.298801 59.604599 70.9104 83.6847 96.459 109.2333 122.0076 133.3134 144.6192 157.39349 170.1678 182.94209 195.7164 208.49071 221.265 234.03931 246.8136 259.58789 272.36221 285.13651 297.9108 310.68509 323.45941 336.2337 349.008 361.78229 374.55661 385.8613" y="95.997002">为消费者所接受、购买新技术、规管要求及消费者需求方面作出更快的回应。</tspan><tspan id="tspan78" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 116.0159 127.479 140.5679 153.6568 166.7457 179.83459 192.92349 206.01241 219.1013 232.1902 245.2791 258.36801 269.6738 281.1358 294.2247 307.3136 320.4025 333.49139 346.58029 359.66919 372.75809 385.84698" y="127.9971">除现有竞争对手之外，越来越多地使用数字技术、社交媒体及互联网吸</tspan><tspan id="tspan80" x="-28.347 -15.4033 -2.4596 10.4841 23.427799 36.371498 49.315201 62.2589 75.202599 88.146301 101.09 114.0337 126.9774 139.9211 152.86481 165.8085 178.7522 191.69591 204.6396 217.5833 230.52699 243.4707 256.4144 269.35809 282.30179 295.24551 308.18921 321.1329 334.0766 347.02029 359.96399 372.90771 385.85141" y="143.9966">引消费者的兴趣进一步提高了新参与者进入我们市场的能力并扩大了与我们</tspan><tspan id="tspan82" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 61.9212 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 244.552 257.7124 270.8728 284.0332 297.1936 310.354 323.5144 336.6748 347.98169 359.52731 372.68771 385.84811" y="159.99609">竞争的公司阵容。新参与者可以在很短的时间内获得消费者的青睐，并成为</tspan><tspan id="tspan84" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 112.5168" y="175.99561">我们产品竞争的重要源头。</tspan><tspan id="tspan86" x="0 13.0306 24.336399 35.729099 48.759701 61.790298" y="207.9957">此外，基于与</tspan></text>

<text id="text56" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,159.7569,697.0123)" xml:space="preserve"><tspan id="tspan44" x="0 13.1912 26.382401 39.573601 52.764801 65.956001 79.147202 92.338402 105.5296 116.8354 128.4173 141.60851 154.7997 167.99091 181.1821 194.37331 207.5645 220.75571 233.9469 247.13811 260.32932 273.52051 286.7117 299.90289 313.09409 326.28531 339.4765" y="0">提供商亦可保留制造、经销及销售与我们根据授权协议设计及</tspan><tspan id="tspan46" x="-74.717499 -61.4394 -48.161301 -34.883202 -21.605101 -8.3269997 4.9510999 18.2292 31.507299 44.7854 58.063499 71.341599 82.6474 94.332703 107.6108 120.8889 134.16701 147.4451 160.72321 174.0013 187.2794 200.5575 213.8356 227.11369 240.3918 253.66991 266.948 278.25381 289.93909 303.21719 314.52301 326.20721 339.48529" y="15.9995">销售产品相类似产品的权利，这将直接与我们的产品构成竞争。因此，我们</tspan><tspan id="tspan48" x="-74.717499 -61.668201 -48.6189 -35.569599 -22.5203 -9.4709997 3.5783 16.6276 29.676901 42.7262 55.775501 68.824799 81.8741 94.923401 107.9727 121.022 134.0713 147.12061 160.16991 173.21919 186.26849 199.31779 212.3671 225.4164 238.4657 249.7704 261.18619 274.2355 287.28479 300.33411 313.38339 326.43271 339.48199" y="31.999001">的竞争对手可能以更具竞争力的价格出售类似我们的产品，对我们造成价格</tspan><tspan id="tspan50" x="-74.717499 -61.4394 -50.133598 -38.448299 -25.1702 -11.8921 1.386 14.6641 27.9422 41.220299 54.498402 67.776497 81.054604 94.332703 107.6108 120.8889 134.16701 147.4451 160.72321 174.0013 187.2794 200.5575 213.8356 225.1414 236.82561 250.1037 261.40948 273.09479 286.37289 299.651 312.92911 326.20721 339.48529" y="47.998501">压力，并对我们的盈利能力及竞争优势产生不利影响。此外，我们的竞争对</tspan><tspan id="tspan52" x="-74.717499 -61.668201 -48.6189 -35.569599 -22.5203 -9.4709997 3.5783 16.6276 29.676901 42.7262 55.775501 68.824799 81.8741 94.923401 107.9727 121.022 134.0713 147.12061 1 <text id="text70" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,554.515)" xml:space="preserve"><tspan id="tspan62" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 259.44601 272.4183 285.39059 298.36292 311.33521 324.3075 337.27979 350.25211 363.2244 374.53021 385.85471" y="0">由于我们主要通过零售店及机器人商店网络营销及销售我们的产品，因</tspan><tspan id="tspan64" x="-28.347 -15.4033 -2.4596 10.4841 23.427799 36.371498 49.315201 62.2589 75.202599 88.146301 101.09 114.0337 126.9774 139.9211 152.86481 165.8085 178.7522 191.69591 204.6396 217.5833 230.52699 243.4707 256.4144 269.35809 282.30179 295.24551 308.18921 321.1329 334.0766 347.02029 359.96399 372.90771 385.85141" y="15.5001">此我们的增长在很大程度上取决于我们增加该等商店数量以及维持及提升其</tspan><tspan id="tspan66" x="-28.347 -15.6706 -2.9942 9.6822004 22.358601 33.664398 44.9702 57.646599 70.322998 82.999397 95.675797 108.3522 121.0286 133.705 146.38139 159.0578 171.73421 184.4106 197.08701 209.7634 222.4398 235.1162 247.7926 260.46899 273.14539 285.82181 298.4982 311.17459 323.85101 336.5274 349.2038 361.88019 374.55661 385.8624" y="31.0002">业绩的能力。我们于往绩记录期间不断扩展我们的零售店及机器人商店网络。</tspan><tspan id="tspan68" x="-28.347 -14.9127" y="46.500301">截至</tspan></text>

.755001 75.306 87.857002 100.408 111.7138 123.0196 135.5706 148.1216 160.67261 173.2236 185.7746 198.32561 210.8766 223.4276 235.97861 248.5296 261.0806 273.63159 286.18259 298.73361 311.28461 323.8356 336.3866 348.93759 360.24231" y="77.500504">运营现有机器人商店，我们的财务状况及经营业绩或受到不利影响；</tspan></text>

<text id="text58" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,433.2389,601.0142)" xml:space="preserve"><tspan id="tspan48" x="0 13.2 26.4 39.599998 52.799999 66" y="0">提供商的不利</tspan><tspan id="tspan50" x="-348.19949 -335.03909 -321.87869 -308.71829 -295.55789 -282.39749 -269.23709 -256.07669 -242.91631 -229.75591 -216.5955 -203.4351 -190.2747 -177.1143 -163.9539 -150.7935 -137.6331 -124.4727 -111.3123 -98.151901 -84.991501 -71.8311 -58.6707 -45.5103 -32.349899 -21.042999 -9.4974003 3.6630001 14.9688 26.515499 39.6759 52.8363 65.996696" y="15.9995">报道或负面新闻会对我们的声誉及经营业绩产生不利影响。此外，我们的葩</tspan><tspan id="tspan52" x="-348.19949 -335.03909 -321.87869 -308.71829 -295.55789 -282.39749 -269.23709 -256.07669 -242.91631 -231.60941 -220.0638 -206.9034 -193.743 -180.5826 -167.4222 -154.2618 -141.10139 -127.941 -114.7806 -101.6202 -90.3144 -78.768799 -65.608398 -52.448002 -39.287601 -26.127199 -12.9668 0.1936 13.354 26.5144 39.674801 52.835201 65.995598" y="31.999001">趣平台面向公众开放，用户可以自由发布内容。我们或未能发现及预防发布</tspan><tspan id="tspan54" x="-348.19949 -334.92139 -321.64331 -308.3652 -295.0871 -281.80899 -268.53091 -255.25281 -241.9747 -230.6689 -218.9836 -205.70551 -192.4274 -179.14931 -165.8712 -152.59309 -139.315 -126.0369 -112.7588 -99.480698 -88.174896 -76.489601 -63.211498 -49.933399 -36.6553 -25.349501 -13.6642 -0.38609999 12.892 26.170099 39.4482 52.726299 66.004402" y="47.998501">违法或不适当的内容，而这可能招致监管调查、法律责任，甚至被从应用商</tspan><tspan id="tspan56" x="-348.19949 -335.24371 -322.2879 -310.98209" y="63.998001">店移除。</tspan></text>
<text id="text64" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,505.0161)" xml:space="preserve"><tspan id="tspan60" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 105.2832 118.4436 131.604 144.7644 157.9248 171.08521 182.39211 193.9377 207.0981 220.2585 233.4189 246.5793 259.73969 272.90009 286.06049 299.22089 312.38129 325.54169 338.70209 351.86249 365.02289 378.18329 391.34369 402.6506 414.1962" y="0">我们的成功取决于我们在不侵犯、侵占或以其他方式侵犯其他方的商标、版</tspan><tspan id="tspan62" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 205.64281" y="15.9995">权及专有权的情况下经营业务的能力。</tspan></text>
<text id="text98" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,457.0165)" xml:space="preserve"><tspan id="tspan66" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 257.77951 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">我们的商业成功至少部分取决于我们在不侵害、侵占或以其他方式侵犯</tspan><tspan id="tspan68" x="-28.347 -15.4605 -2.5739999 10.3125 23.198999 36.085499 47.3913 58.697102 71.583603 84.4701 97.356598 110.2431 123.1296 136.0161 148.9026 161.78909 174.6756 187.5621 200.44859 213.3351 226.2216 239.10809 251.9946 263.30042 274.6051 287.49161 298.79739 310.10211 322.98859 335.87509 348.7616 361.6481 374.53461 385.84039" y="15.9995">其他方的商标、版权及其他专有权情况下的经营能力。然而，我们无法确定，</tspan><tspan id="tspan70" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 167.20441 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 323.5155 336.6759 349.8363 361.14099 372.68771 385.84811" y="31.999001">我们的业务经营并无且将不会侵害、侵占或以其他方式侵犯该等权利。许多</tspan><tspan id="tspan72" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 270.0434 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="47.998501">公司已将知识产权诉讼作为获取竞争优势的一种方式，且在我们作为上市公</tspan><tspan id="tspan74" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 182.21941 195.37981 206.68671 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 323.5155 336.6759 349.8363 361.14209 372.68881 385.84921" y="63.998001">司获得更大知名度及市场曝光度的情况下，我们亦可能面临更大风险，成为</tspan><tspan id="tspan76" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 51.321602 62.627399 74.312698 87.590797 100.8689 114.147 127.4251 140.7032 153.98129 167.2594 180.53751 191.84331 203.52859 216.8067 230.08479 243.3629 256.64099 269.9191 283.1972 294.50299 306.18829 319.4664 332.74451 346.02261 359.30069 372.5788 385.8569" y="79.997498">该等诉讼的主体。由于该等及其他原因，第三方可能指称，我们的产品或活</tspan><tspan id="tspan78" x="-28.347 -15.0689 -1.7908 9.5150003 21.2003 34.478401 47.7565 61.034599 74.312698 87.590797 100.8689 114.147 127.4251 140.7032 153.98129 167.2594 180.53751 193.8156 207.0937 218.39951 230.08479 243.3629 256.64099 269.9191 283.1972 296.47531 309.75339 323.03149 334.33731 346.02261 359.30069 372.5788 385.8569" y="95.997002">动侵害、侵占或以其他方式侵犯彼等的商标、版权或其他专有权。对指控及</tspan><tspan id="tspan80" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 152.5986 164.0144 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="111.9965">诉讼进行辩护可能耗费大量资金、时间并分散管理层在其他业务问题上的注</tspan><tspan id="tspan82" x="-28.347 -15.3967 -4.0908999 7.2149 20.165199 33.115501 46.0658 59.016102 71.9664 84.916702 97.866997 110.8173 123.7676 135.0723 146.3781 159.3284 170.6331 181.9389 194.88921 207.83949 220.78979 233.7401 246.6904 259.64069 270.9465 282.25229 295.20261 308.15289 321.10321 334.0535 347.00381 359.9541 372.90439 385.85471" y="127.996">意力，并推迟将产品推向市场。此外，倘发现我们侵害、侵占或以其他方式侵</tspan><tspan id="tspan84" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 48.760799 60.307499 73.467903 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 163.7361 175.28281 188.44321 201.60361 214.76401 227.92439 241.08479 254.24519 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="143.9955">犯第三方商标、版权或其他专有权，我们可能被要求支付大额损害赔偿或被</tspan><tspan id="tspan86" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 48.760799 60.307499 73.467903 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 282.17969 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="159.995">下达法院命令，禁止我们销售若干产品或从事若干活动，或甚至更糟的情况</tspan><tspan id="tspan88" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 152.5986 164.0144 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="175.99451">是没收或销毁若干产品及其收益，吊销营业执照或处以若干行政罚款或刑事</tspan><tspan id="tspan90" x="-28.347 -15.0689 -3.7630999 7.9222002 21.2003 34.478401 47.7565 61.034599 74.312698 87.590797 100.8689 114.147 127.4251 140.7032 153.98129 167.2594 178.5641 190.2494 203.5275 216.8056 230.08369 243.3618 256.63989 269.918 283.19611 296.47421 309.75229 323.0304 336.3085 347.61429 359.29849 372.5766 385.85471" y="191.994">责任。任何侵犯他人知识产权的申索，即使是没有法律依据的申索，均可能</tspan><tspan id="tspan92" x="-28.347 -15.5727 -2.7983999 9.9758997 22.7502 35.524502 48.298801 61.073101 73.847397 86.621696 99.396004 112.1703 123.4761 134.78081 147.5551 158.8609 170.1656 182.9399 195.7142 208.48849 221.2628 234.03709 246.8114 259.58569 272.35999 285.13431 297.9086 310.68289 323.45721 336.23151 349.0058 361.78009 374.55441 385.8602" y="207.9935">损害我们的声誉及品牌形象。此外，我们或仅可有限使用具争议的知识产权，</tspan><tspan id="tspan94" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 51.321602 64.599701 77.8778 91.155899 104.434 115.7398 127.4251 140.7032 153.98129 167.2594 180.53751 193.8156 207.0937 220.3718 233.6499 244.9557 256.64099 269.9191 283.1972 296.47531 309.75339 323.03149 336.3096 349.58771 362.86581 374.1705 385.8558" y="223.993">这将严重影响我们的运营。倘任何上述情况发生，可能会对我们的业务、财</tspan><tspan id="tspan96" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 177.29581" y="239.99249">务状况及经营业绩产生重大不利影响。</tspan></text>
<text id="text104" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,185.0239)" xml:space="preserve"><tspan id="tspan100" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 234.88741 247.93671 260.98599 274.03531 287.08459 298.39041 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="0">通过第三方制造商生产产品会给我们的业务带来风险。未能控制产品质量可</tspan><tspan id="tspan102" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 179.7312" y="15.9995">能会对我们的业务造成不利影响。</tspan></text>
<text id="text110" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,137.0243)" xml:space="preserve"><tspan id="tspan106" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 259.44601 272.4183 285.39059 298.36292 311.33521 322.64099 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">我们通过第三方制造商生产我们所有的泡泡玛特品牌产品，且以往依赖</tspan><tspan id="tspan108" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 182.21941 195.37981 206.68559 218.2312 231.3916 242.6974 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="15.9995">少量制造商及工厂生产我们的大部分产品。因此，一家主要制造商或工厂失</tspan></text>

<text id="text48" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 13.2781 26.5562 39.834301 53.1124 64.418198 76.102402 89.380501 102.6586 115.9367 129.2148 142.4929 153.7998 165.48399 178.7621 192.04021 205.3183 218.59641 231.8745 245.1526 258.43069 271.7088 283.01459 294.69989 307.978 321.2561 334.53421 347.81229 361.09039 374.3685 387.64661 400.92471 414.20279" y="0">去或不可用，即使是临时的，亦可能对我们的业务、财务状况及经营业绩产</tspan><tspan id="tspan28" x="0 13.1604 26.320801 39.481201 52.641602 63.947399 75.492996 88.653397 101.8138 114.9742 128.1346 141.295 154.4554 167.6158 180.7762 193.9366 207.097 220.2574 233.4178 246.5782 259.73859 272.89899 286.05939 299.21979 312.38019 325.54059 338.70099 351.86139 365.02179 376.3287 387.8743 401.0347 414.1951" y="15.9995">生负面影响。虽然我们相信我们有能力在必要时更换我们的制造商，但任何</tspan><tspan id="tspan30" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 193.996 205.41071 218.46001 231.50929 244.55859 257.60791 270.6572 283.70651 296.7558 309.80511 322.8544 335.90369 348.953 362.00229 375.05161 388.10089 401.15021 414.19949" y="31.999001">这样的举动可能都是耗时且昂贵的。我们相信我们的制造业务通常会占与我</tspan><tspan id="tspan32" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 207.0453 218.46001 231.50929 244.55859 257.60791 270.6572 283.70651 296.7558 309.80511 322.8544 335.90369 348.953 362.00229 375.05161 388.10089 401.15021 414.19949" y="47.998501">们合作的各工厂总产能的很大一部分，所以与新制造商建立关系并让彼等以</tspan><tspan id="tspan34" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 234.88741 247.93671 259.24249 270.6572 283.70651 296.7558 309.80511 322.8544 335.90369 348.953 362.00229 375.05161 388.10089 401.15021 414.19949" y="63.998001">类似条款及匹配质量生产可能是具有挑战性的。我们亦可能需要寻找其他制</tspan><tspan id="tspan36" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 180.9456 192.3614 205.41071 218.46001 231.50929 244.55859 257.60791 270.6572 283.70651 296.7558 309.80511 322.8544 335.90369 348.953 362.00229 375.05161 388.10089 401.15021 414.19949" y="79.997498">造商以应对我们产品的需求增加，因为我们目前的制造商可能没有能力增加</tspan><tspan id="tspan38" x="0 13.1604 24.465099 36.011799 49.172199 62.3326 75.492996 88.653397 101.8138 114.9742 128.1346 141.295 154.4554 167.6158 180.7762 193.9366 207.097 220.2574 233.4178 246.5782 259.73859 272.89899 286.05939 297.3652 308.9119 322.0723 335.2327 348.3931 361.5535 374.7139 387.8743 401.0347 414.1951" y="95.997002">产量。倘我们未能获得我们制造商生产的大部分产品，或我们未能更换制造</tspan><tspan id="tspan40" x="0 11.3058 22.611601 35.567402 48.523201 61.479 74.434799 87.390602 100.3464 113.3022 126.258 139.21381 152.1696 165.1254 178.08121 191.037 203.9928 216.94859 229.9044 241.21021" y="111.9965">商，我们的销售额及盈利能力可能大大降低。</tspan><tspan id="tspan42" x="28.347 41.319302 54.291599 67.263901 80.236198 93.208504 106.1808 119.1531 132.1254 145.0977 158.07001 171.0423 184.0146 196.98689 208.29269 219.6172 232.58949 245.5618 258.53409 271.50641 284.4787 297.45099 310.42331 323.3956 336.36789 349.34021 362.3125 375.28479 388.25711 401.2294 414.20169" y="143.9966">我们将产品的生产外包给供应商，而我们在整个生产过程中实施质量控</tspan><tspan id="tspan44" x="0 11.3058 22.9911 36.269199 49.547298 62.825401 76.1035 89.381599 102.6597 115.9378 129.2159 140.5217 152.2059 165.48399 178.7621 192.04021 205.3183 218.59641 231.8745 245.1526 258.43069 271.7088 284.98691 298.26501 311.54309 324.8212 338.0993 351.37741 362.6843 374.3696 387.64771 400.92581 414.20389" y="159.99609">制。我们实施了与原材料、生产工艺及成品相关的质量控制系统，并要求负</tspan><tspan id="tspan46" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 105.2832 118.4436 131.604 144.7644 157.9248 171.08521 184.24561 197.40601 210.56641 223.72681 235.03259 246.5782 259.73859 272.89899 286.05939 299.21979 312.38019 325.54059 338.70099 351.86139 365.02179 373.57761 385.1232 398.2836" y="175.99561">责生产工艺的供应商满足我们的选择标准。有关进一步详情请参阅「业务</tspan></text>
<text id="text54" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,499.2367,538.6662)" xml:space="preserve"><tspan id="tspan50" x="0" y="0">—</tspan><tspan id="tspan52" x="11.3058" y="1.65"> </tspan></text>
<text id="text58" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,521.0167)" xml:space="preserve"><tspan id="tspan56" x="0 13.1802 26.360399 39.5406 52.720798 65.901001 77.470802 86.291702 94.846397 106.4173 119.5975" y="0">我们的供应商」及「业务</tspan></text>
<text id="text64" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,220.5814,522.6667)" xml:space="preserve"><tspan id="tspan60" x="0" y="0">—</tspan><tspan id="tspan62" x="11.3058" y="1.65"> </tspan></text>
<text id="text82" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,236.5226,521.0167)" xml:space="preserve"><tspan id="tspan66" x="0 13.1802 26.360399 39.5406 51.1115 56.9184 68.488197 81.668404 92.974197 104.5451 117.7253 130.9055 144.08569 157.2659 170.44611 183.6263 196.8065 209.98669 223.1669 236.34711 249.5273 262.70749" y="0">质量控制」。然而，我们或无法有效控制我们供应</tspan><tspan id="tspan68" x="-151.4832 -138.3228 -125.1624 -112.002 -98.841599 -85.681198 -72.520798 -59.360401 -46.200001 -33.0396 -19.8792 -6.7188001 6.4415998 19.601999 32.762402 45.922798 57.229698 68.775299 81.935699 95.0961 108.2565 121.4169 134.5773 147.7377 160.8981 174.0585 187.2189 200.3793 213.5397 224.8455 236.3911 249.5515 262.71191" y="15.9995">商是否将严格遵守我们的规格及说明，例如生产产品所用的原材料。我们的</tspan><tspan id="tspan70" x="-151.4832 -138.4339 -125.3846 -112.3353 -99.286003 -86.236702 -73.187401 -60.1381 -47.088799 -34.039501 -20.9902 -7.9408998 5.1083999 18.1577 31.207001 44.256302 57.305599 70.354897 83.404198 96.453499 109.5028 122.5521 135.60139 148.6507 161.7 173.0047 184.4205 197.4698 210.5191 223.56841 236.61771 249.66701 262.71631" y="31.999001">一家或多家第三方制造商不符合我们规定的风险始终存在，且我们未必能即</tspan><tspan id="tspan72" x="-151.4832 -138.3228 -125.1624 -112.002 -98.841599 -85.681198 -72.520798 -59.360401 -46.200001 -33.0396 -19.8792 -6.7188001 6.4415998 19.601999 30.908899 42.454498 55.614899 66.9207 78.4674 91.6278 104.7882 117.9486 131.10899 144.26939 157.42979 170.59019 183.7506 196.911 210.0714 223.2318 236.3922 249.5526 262.71301" y="47.998501">时甚至不会发现该等不合规行为。因此，使用第三方制造商可能会使我们面</tspan><tspan id="tspan74" x="-151.4832 -138.20509 -124.927 -111.6489 -98.370796 -85.092697 -71.814598 -60.508801 -48.823502 -35.545399 -22.2673 -8.9891996 2.3176999 14.0019 27.280001 40.558102 53.836201 67.114304 80.392403 93.670502 106.9486 120.2267 133.50481 146.7829 160.061 173.3391 184.6449 196.3302 209.60831 222.8864 236.16451 249.4426 262.7207" y="63.998001">临产品责任申索、行政处罚、没收或销毁若干产品及其收益，吊销营业执照</tspan><tspan id="tspan76" x="-151.4832 -138.3228 -125.1624 -112.002 -98.841599 -85.681198 -72.520798 -59.360401 -46.200001 -33.0396 -19.8792 -6.7188001 4.5869999 16.132601 29.292999 42.4534 55.6138 68.7742 81.934601 95.095001 108.2554 121.4158 134.5762 147.7366 160.897 172.2028 183.7495 196.9099 210.0703 223.2307 236.3911 249.5515 262.71191" y="79.997498">或处以其他行政或刑事责任。倘制造及销售有缺陷的产品，将会损害我们的</tspan><tspan id="tspan78" x="-151.4832 -138.3228 -127.0181 -115.4714 -102.311 -89.150597 -75.990196 -62.8298 -49.669399 -38.363602 -26.818001 -13.6576 -0.49720001 12.6632 25.823601 38.984001 52.144402 65.304802 78.465202 91.625603 104.786 117.9464 131.1068 144.2672 157.4276 170.588 183.7484 196.9088 210.0692 223.2296 236.39 249.5504 262.71078" y="95.997002">声誉，导致产品召回、消费者诉讼及其他可能对我们的业务造成重大不利影</tspan><tspan id="tspan80" x="-151.4832 -138.5274 -125.5716 -112.6158 -101.31" y="111.9965">响的行为。</tspan></text>
<text id="text88" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,377.0201)" xml:space="preserve"><tspan id="tspan84" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 180.9456 192.3614 205.41071 218.46001 231.50929 244.55859 257.60791 270.6572 283.70651 296.7558 309.80511 322.8544 335.90369 348.953 362.00229 375.05161 388.10089 401.15021 414.19949" y="0">我们须遵守环境保护法律及法规，且现有法律及法规变动或会导致我们产生</tspan><tspan id="tspan86" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 76.084801" y="15.9995">额外合规成本。</tspan></text>
<text id="text108" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,329.0205)" xml:space="preserve"><tspan id="tspan90" x="0 12.7666 25.533199 38.299801 51.066399 63.833 76.599602 89.366203 102.1328 114.8994 127.666 140.4326 153.1992 165.96581 178.73241 191.49899 197.3092 208.61391 221.38049 234.14709 246.9137 258.21951 269.5242 282.2908 293.59659 304.90131 317.66791 330.43451 343.20111 355.96771 368.73431 380.0412 385.85031" y="0">由于我们产品所用原材料及包装材料（例如塑料、颜料、油墨及纸张等），</tspan><tspan id="tspan92" x="-28.3459 -15.0337 -1.7215 11.5907 24.902901 38.215099 51.527302 64.8395 78.151703 91.463898 104.7761 118.0883 131.4005 144.71271 158.0249 171.3371 184.64931 197.9615 211.2737 224.58591 237.8981 249.2028 260.9288 274.241 287.55319 300.86539 314.17761 327.48981 340.802 354.1142 360.8132 372.53922 385.85141" y="15.9995">我们的业务营运须遵守多项中国环境法律及法规，有关法律及法规对（其中</tspan><tspan id="tspan94" x="-28.3459 -15.3527 -4.0029001 2.7258 15.719 28.7122 40.018002 51.366699 64.359901 77.353104 90.346298 103.3395 116.3327 129.3259 142.31911 155.3123 168.3055 181.29871 194.2919 207.2851 220.27831 233.2715 246.26469 259.2579 272.2511 285.24429 298.23749 311.23071 322.5354 333.88519 346.87839 359.87161 372.86481 385.858" y="31.999001">包括）向土壤、水或大气层排放或释放污染物或废弃物进行监管。政府机关或</tspan><tspan id="tspan96" x="-28.3459 -15.1855 -2.0251 11.1353 24.2957 37.4561 50.616501 63.776901 76.937302 90.097702 103.2581 116.4185 127.7243 139.2699 152.4314 165.5918 178.7522 191.9126 205.073 218.2334 231.3938 244.5542 257.7146 270.875 284.0354 297.1958 310.3562 321.66199 333.20761 346.36801 359.52841 372.68881 385.84921" y="47.998501">会不时修订有关法律及法规，以颁布更高水平的环境保护标准，并对潮流玩</tspan><tspan id="tspan98" x="-28.3459 -15.1855 -2.0251 11.1353 24.2957 35.601501 47.147099 60.307499 73.467903 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 269.01929 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="63.998001">具的原材料、生产过程及最终产品施加更严格的限制，从而可能对我们的日</tspan><tspan id="tspan100" x="-28.3459 -15.0678 -1.7897 11.4884 24.7665 38.044601 51.322701 62.628502 74.313797 87.591904 100.87 114.1481 127.4262 140.7043 153.98241 167.2605 180.5386 193.8167 207.0948 220.37289 233.651 244.9568 256.64209 269.9202 281.22491 292.91019 306.18829 319.4664 332.74451 346.02261 359.30069 372.5788 385.8569" y="79.997498">常营运造成影响，并导致我们产生额外合规成本。此外，倘我们的制造商未</tspan><tspan id="tspan102" x="-28.3459 -15.1855 -2.0251 11.1353 24.2957 37.4561 50.616501 63.776901 76.937302 90.097702 103.2581 116.4185 129.5789 142.7393 154.0451 165.5907 178.7522 191.9126 205.073 218.2334 231.3938 244.5542 257.7146 270.875 284.0354 297.1958 310.3562 323.5166 334.82239 346.36911 359.52951 372.68991 385.85031" y="95.997002">能遵守该等环境保护法律及法规，则可能会对我们造成严重后果，例如生产</tspan><tspan id="tspan104" x="-28.3459 -15.0678 -1.7897 11.4884 22.794201 34.478401 47.7565 61.034599 74.312698 87.590797 100.8689 112.1747 123.8589 137.13699 150.4151 163.69321 176.9713 190.2494 203.5275 216.8056 230.08369 243.3618 256.63989 269.918 283.19611 296.47421 309.75229 323.0304 336.3085 349.58661 362.86469 374.1694 385.85471" y="111.9965">能力不足、产品供应延迟、替代制造商的额外成本及对我们声誉的损害，从</tspan><tspan id="tspan106" x="-28.3459 -15.3901 -2.4342999 10.5215 23.477301 36.433102 49.388901 60.694698 71.999397 84.9552 97.911003 110.8668 122.1726 133.47729 146.43311 159.3889 172.3447 185.30051 198.2563 211.2121 224.16789 237.1237 250.0795 263.03531 275.99109 288.9469 300.25159" y="127.996">而对我们的业务、财务状况、经营业绩及前景造成不利影响。</tspan></text>

64 292.71329 304.39859 317.6767 330.9548 344.23291 357.51099" y="79.998596">销商续签经销协议。此外，我们未必能成功管理我们的经销商，且我们经销</tspan><tspan id="tspan48" x="-56.692902 -43.749199 -30.8055 -17.861799 -4.9180999 8.0256004 20.969299 33.912998 46.856701 59.8004 72.744102 85.687798 98.6315 111.5752 124.5189 137.4626 150.4063 163.35001 176.2937 189.2374 202.18111 215.1248 228.0685 241.01221 253.9559 266.8996 279.84329 292.78699 305.73071 318.67441 331.6181 344.5618 357.50549" y="95.9981">及销售网络的任何整合或进一步扩张的成本可能会超出整合或扩张所产生的</tspan><tspan id="tspan50" x="-56.692902 -43.532501 -32.227798 -20.681101 -7.5207 5.6396999 18.8001 31.960501 45.120899 58.2813 71.441704 84.602097 97.762497 110.9229 124.0833 137.2437 150.4041 163.5645 176.7249 189.8853 203.0457 216.2061 229.3665 242.5269 255.6873 268.84769 282.00809 295.16849 308.32889 321.48929 334.64969 345.9566 357.5022" y="111.9976">收益。无法保证我们能成功发现我们的经销商违反经销协议条文的行为。经</tspan><tspan id="tspan52" x="-56.692902 -44.102299 -31.5117 -18.921101 -6.3305001 6.2600999 18.8507 31.441299 44.031898 56.622501 69.213097 81.803703 94.394302 106.9849 119.5755 132.16611 144.7567 157.34731 169.9379 182.5285 195.11909 207.7097 220.30029 232.8909 245.48151 258.07211 270.66269 283.2533 295.8439 308.43451 321.02509 333.61569 346.2063 357.51208" y="127.9971">销商的不合规行为可能会对我们的品牌声誉产生负面影响并破坏我们的销售。</tspan><tspan id="tspan54" x="-56.692902 -43.532501 -32.227798 -20.681101 -7.5207 5.6396999 18.8001 31.960501 45.120899 58.2813 71.441704 84.602097 97.762497 110.9229 124.0833 137.2437 150.4041 163.5645 176.7249 189.8853 203.0457 216.2061 229.3665 242.5269 255.6873 268.84769 282.00809 293.3139 304.8595 318.0199 331.1803 344.3407 357.5011" y="143.9966">此外，倘我们售予消费者的产品的销量没有维持在理想的水平，或我们的经</tspan><tspan id="tspan56" x="-56.692902 -43.6436 -30.594299 -17.545 -4.4956999 8.5536003 21.6029 34.652199 47.7015 60.750801 73.800102 86.849403 98.155197 109.571 122.6203 135.6696 148.7189 161.7682 174.8175 187.86681 200.91611 213.96539 227.01469 240.064 253.1133 266.1626 279.21191 292.2612 305.31049 318.3598 331.40909 344.4584 357.50769" y="159.99609">销订单不能反映消费者需求，我们的经销商可能不会再向我们下达任何新订</tspan><tspan id="tspan58" x="-56.692902 -45.3871 -33.701801 -20.4237 -7.1455998 6.1325002 19.410601 32.688702 45.966801 59.2449 72.523003 85.801102 99.079201 112.3573 125.6354 138.9135 152.1916 165.4697 178.7478 190.0536 201.73891 215.017 226.3217 238.007 251.2851 264.5632 277.84131 291.11938 304.39749 317.6756 330.9537 344.23181 357.50989" y="175.99561">单、削减惯常订单的数量或要求提供折扣价。此外，我们的大多数经销商销</tspan><tspan id="tspan60" x="-56.692902 -43.532501 -30.372101 -17.2117 -4.0513 9.1091003 22.269501 35.429901 48.590302 59.897202 71.442802 84.603203 97.763603 110.924 124.0844 137.2448 150.4052 163.5656 176.726 189.8864 203.0468 216.2072 227.513 239.05859 252.21899 265.37939 278.53979 291.7002 304.8606 318.021 331.1814 344.3418 357.5022" y="191.9951">售由其他制造商生产、可能与我们直接竞争的产品，这在若干情况下可能会</tspan><tspan id="tspan62" x="-56.692902 -43.6436 -30.594299 -17.545 -4.4956999 8.5536003 21.6029 34.652199 47.7015 60.750801 73.800102 86.849403 99.898697 112.948 125.9973 139.0466 152.0959 165.1452 178.1945 191.2438 204.29311 217.34241 230.39169 243.44099 256.4903 269.53961 280.8454 292.2601 305.30939 318.3587 331.40799 344.45731 357.50659" y="207.9946">妨碍或影响我们的经销商尽可能销售我们产品的能力或动力。上述任何因素</tspan><tspan id="tspan64" x="-56.692902 -43.6436 -30.594299 -17.545 -4.4956999 8.5536003 21.6029 34.652199 47.7015 60.750801 73.800102 86.849403 99.898697 112.948 125.9973 139.0466 152.0959 165.1452 178.1945 189.50031 200.91611 213.96539 227.01469 240.064 253.1133 266.1626 279.21191 292.2612 305.31049 318.3598 331.40909 344.4584 357.50769" y="223.99409">的出现均可能导致我们产品的销量大幅下降，进而对我们的财务状况及经营</tspan><tspan id="tspan66" x="-56.692902 -43.737099 -30.7813 -17.8255 -4.8697 8.0860996 21.041901 33.9977 45.303501" y="239.99361">业绩造成不利影响。</tspan><tspan id="tspan68" x="-28.3459 -15.3736 -4.0678 7.2567 20.229 33.201302 46.173599 59.145901 72.118202 85.0905 98.062798 111.0351 124.0074 136.97971 149.952 162.9243 175.89661 188.8689 201.8412 214.81351 227.7858 240.7581 253.73039 266.7027 279.67499 292.64731 305.6196 318.59189 331.56421 344.5365 357.50879" y="271.99371">此外，我们的经销商可能无法或不愿向我们及时提供有关其对我们产品</tspan><tspan id="tspan70" x="-56.692902 -44.016499 -31.340099 -18.6637 -5.9872999 6.6890998 19.365499 32.041901 44.7183 57.394699 70.071098 81.3769 92.682701 105.3591 118.0355 130.7119 143.38831 156.0647 168.7411 181.4175 194.0939 206.77029 219.4467 232.12309 244.7995 257.47589 270.15231 282.8287 295.5051 308.18149 320.85791 333.5343 346.21069 357.51541" y="287.99319">的库存水平及销售的资料。由于我们并无掌控属于经销商的库存及销售数据，</tspan><tspan id="tspan72" x="-56.692902 -43.532501 -30.372101 -17.2117 -4.0513 9.1091003 22.269501 35.429901 48.590302 61.750702 74.911102 88.071503 101.2319 114.3923 127.5527 138.85851 150.4052 163.5656 174.8714 186.41701 199.57739 212.73779 225.89819 239.05859 252.21899 265.37939 278.53979 291.7002 304.8606 318.021 331.1814 344.3418 357.5022" y="303.99271">我们依赖经销商向我们提供的资料。因此，我们准确追踪经销商对我们产品</tspan><tspan id="tspan74" x="-56.692902 -43.6436 -30.594299 -17.545 -4.4956999 8.5536003 21.6029 34.652199 47.7015 60.750801 73.800102 86.849403 99.898697 111.2045 122.6203 135.6696 148.7189 161.7682 174.8175 187.86681 200.91611 213.96539 227.01469 240.064 253.1133 266.1626 279.21191 292.2612 305.31049 318.3598 331.40909 344.4584 357.50769" y="319.99219">的销售及库存水平的能力有限。我们对经销商的销售未必能反映对消费者的</tspan><tspan id="tspan76" x="-56.692902 -43.6436 -30.594299 -17.545 -4.4956999 8.5536003 19.8594 31.2752 44.324501 57.373798 70.423103 83.472397 96.521698 109.571 122.6203 135.6696 148.7189 161.7682 174.8175 187.86681 200.91611 213.96539 227.01469 240.064 253.1133 266.1626 279.21191 292.2612 305.31049 318.3598 331.40909 344.4584 357.50769" y="335.9917">实际销售趋势，且我们可能无法及时收集有关我们产品市场需求及消费者喜</tspan><tspan id="tspan78" x="-56.692902 -43.6436 -30.594299 -17.545 -4.4956999 8.5536003 21.6029 34.652199 47.7015 59.006199 70.421997 83.471298 96.520599 109.5699 122.6192 135.6685 148.7178 161.76711 174.81641 187.86571 200.91499 213.96429 227.0136 240.0629 253.1122 266.1615 279.21078 292.2601 305.30939 318.3587 331.40799 344.45731 357.50659" y="351.99121">好的充足资料及数据。无法准确追踪经销商的销售及库存水平并及时收集市</tspan><tspan id="tspan80" x="-56.692902 -43.6436 -30.594299 -19.2896 -7.8737998 5.1754999 18.2248 31.274099 44.323399 57.3727 70.421997 83.471298 96.520599 109.5699 122.6192 135.6685 148.7178 161.76711 174.81641 187.86571 200.91499 213.96429 227.0136 240.0629 253.1122 266.1615 279.21078 292.2601 305.30939 318.3587 331.40799 344.45731 357.50659" y="367.99069">场资料，可能会导致我们误判销售趋势并妨碍我们因应市场变化快速调整市</tspan><tspan id="tspan82" x="-56.692902 -43.737099 -30.7813 -17.8255 -4.8697 8.0860996 21.041901 33.9977 45.303501" y="383.9902">场营销及产品策略。</tspan></text>

们的业务及增长前景产生重大不利影响。例如，倘我们无</tspan><tspan id="tspan76" x="-292.6275 -279.57819 -266.5289 -253.4796 -240.4303 -227.381 -214.3317 -201.28239 -188.23309 -175.18381 -162.13451 -149.08521 -136.0359 -122.9866 -109.9373 -96.888 -83.838699 -70.789398 -59.483601 -48.067799 -35.018501 -21.9692 -8.9198999 4.1293998 17.178699 30.228001 43.277302 56.326599 69.3759 82.425201 95.474503 108.5238 121.5731" y="95.9981">法与该等第三方品牌拥有人维持良好关系，我们可能无法通过彼等获得具有</tspan><tspan id="tspan78" x="-292.6275 -279.40109 -266.17471 -252.9483 -239.72189 -226.4955 -219.8064 -208.18159 -194.9541 -181.72659 -168.4991 -155.27161 -142.0441 -130.42039 -124.6168 -112.9909 -99.763397 -86.535896 -73.308403 -60.080898 -46.853401 -35.548698 -23.923901 -10.6975 2.53 15.7575 28.985001 42.212502 55.439999 68.667503 81.894997 95.122498 108.35 121.5775" y="111.9976">竞争力的条款（包括定价条款），而我们的收益、溢利及利润率可能会受到重</tspan><tspan id="tspan80" x="-292.6275 -279.67169 -266.71591 -253.7601 -240.80431 -229.4996" y="127.9971">大不利影响。</tspan><tspan id="tspan82" x="-264.28049 -251.3082 -240.0024 -228.6779 -215.7056 -202.73331 -189.761 -176.7887 -163.81641 -150.8441 -137.8718 -124.8995 -111.9272 -98.954903 -85.982597 -73.0103 -60.037998 -47.065701 -34.093399 -21.121099 -8.1487999 4.8235002 17.795799 30.768101 43.740398 56.7127 69.684998 82.657303 95.629601 108.6019 121.5742" y="159.99719">此外，我们维持现有协议以及与第三方品牌拥有人订立新协议的能力亦</tspan><tspan id="tspan84" x="-292.6275 -279.25369 -265.87991 -252.5061 -239.13229 -225.7585 -212.3847 -199.01089 -185.6371 -172.26331 -158.8895 -145.5157 -132.14191 -118.7681 -105.3943 -92.0205 -78.646698 -67.342003 -55.544498 -42.1707" y="175.9967">可能对我们的业务及经营业绩造成影响。截至</tspan></text>

<text id="text102" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,141.7319,441.0126)" xml:space="preserve"><tspan id="tspan92" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 153.82069" y="0">境外销售售价及溢利率波动。</tspan><tspan id="tspan94" x="-28.3459 -15.257 -2.1681001 10.9208 24.009701 37.098598 50.1875 63.276402 76.365303 89.454201 102.5431 115.632 128.7209 141.8098 154.8987 167.98759 181.07651 192.3812 203.8443 216.9332 230.02209 243.11099 256.19989 269.28879 282.37769 295.46661 308.55551 319.8613 331.3233 344.4122 357.5011" y="32.000099">随著我们进一步扩展到新的区域及市场，该等风险可能会加剧。与该等</tspan><tspan id="tspan96" x="-56.692902 -43.6964 -30.6999 -17.7034 -4.7069001 8.2896004 21.2861 34.2826 47.279099 60.2756 73.272102 86.2686 99.265099 112.2616 125.2581 138.25459 151.2511 164.2476 177.24409 190.2406 203.23711 216.2336 229.2301 242.22659 255.2231 268.2196 281.21609 294.21259 307.20911 320.2056 333.20209 346.19861 357.5033" y="47.999599">风险及不确定性相关的负面后果可能会危及或限制我们的海外销售及扩张。</tspan><tspan id="tspan98" x="-56.692902 -43.918598 -32.612801 -21.3081 -8.5338001 4.2405 17.014799 29.789101 42.5634 55.3377 68.112 80.886299 93.660599 106.4349 119.2092 131.98351 144.7578 157.5321 170.3064 183.0807 195.855 208.6293 221.40359 232.7094 244.0152 256.78949 269.56381 282.3381 295.1124 307.88669 320.66101 333.4353 346.20959 357.51431" y="63.9991">因此，我们扩展海外销售及经营的努力可能不会成功，这可能对我们的业务、</tspan><tspan id="tspan100" x="-56.692902 -43.737099 -30.7813 -17.8255 -6.5197001 4.7849998 17.740801 30.6966 43.652401 56.6082 69.564003 82.519798 95.475601 108.4314 121.3872 134.343 147.2988 160.25459 173.2104 186.1662 197.4731" y="79.998596">财务状况、经营业绩及前景造成重大不利影响。</tspan></text>
<text id="text108" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.039,329.0139)" xml:space="preserve"><tspan id="tspan104" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 180.9456 192.3614 205.41071 218.46001 231.50929 244.55859 257.60791 270.6572 283.70651 296.7558 309.80511 322.8544 335.90369 348.953 362.00229 375.05161 388.10089 401.15021 414.19949" y="0">我们拟在营销方面投入大量成本，而若干营销活动可能无法实现我们的预期</tspan><tspan id="tspan106" x="0 12.9558 24.2616" y="15.9995">结果。</tspan></text>
<text id="text132" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,281.0143)" xml:space="preserve"><tspan id="tspan110" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 166.9734 178.2979 191.2702 204.24249 217.2148 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">我们在竞争激烈的行业中经营，且我们拟投入大量广告及营销支出以及</tspan><tspan id="tspan112" x="-28.347 -15.1866 -2.0262001 11.1342 22.440001 33.986698 47.147099 60.307499 73.467903 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 216.3777 227.92439 241.08479 254.24519 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="15.9995">其他资源，以维持及提高我们的品牌认知度。我们的营销活动可能不会受到</tspan><tspan id="tspan114" x="-28.347 -15.1866 -2.0262001 11.1342 22.440001 33.986698 47.147099 60.307499 73.467903 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 242.6985 254.24519 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="31.999001">市场欢迎，亦可能不会达到我们预期的销售水平。我们亦可能无法留住或招</tspan><tspan id="tspan116" x="-28.347 -15.6706 -2.9942 9.6822004 22.358601 35.035 47.711399 60.387798 73.064201 85.740601 98.417 111.0934 123.7698 136.4462 149.1226 161.799 174.4754 187.15179 198.4576 209.7634 222.4398 235.1162 247.7926 260.46899 273.14539 285.82181 298.4982 311.17459 323.85101 336.5274 349.2038 361.88019 374.55661 385.8613" y="47.998501">聘足够数量的经验丰富的销售及营销人员，或培训新雇用的销售及营销人员，</tspan><tspan id="tspan118" x="-28.347 -15.7564 -3.1658001 9.4247999 22.0154 34.605999 47.196602 59.787201 72.3778 84.968399 97.558998 110.1496 122.7402 135.3308 147.9214 160.51199 173.1026 185.69321 198.2838 210.8744 223.465 236.0556 248.64619 261.23679 273.82739 286.418 299.00861 311.59921 324.18979 336.7804 349.371 361.96161 374.55219 385.858" y="63.998001">我们认为这对于以具有成本效益的方式实施我们的销售及营销策略至关重要。</tspan><tspan id="tspan120" x="-28.347 -15.1866 -3.8819001 7.6648002 20.825199 33.9856 47.146 60.3064 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 244.552 257.7124 270.8728 284.0332 297.1936 308.49939 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="79.997498">此外，中国潮流玩具市场的销售及营销方法及工具迅速发展。这要求我们不</tspan><tspan id="tspan122" x="-28.347 -15.6706 -2.9942 9.6822004 22.358601 35.035 47.711399 60.387798 73.064201 85.740601 98.417 111.0934 123.7698 135.07561 146.38139 159.0578 171.73421 184.4106 197.08701 209.7634 222.4398 235.1162 247.7926 260.46899 273.14539 285.82181 298.4982 311.17459 323.85101 336.5274 349.2038 361.88019 374.55661 385.8613" y="95.997002">断改进我们的销售及营销策略，并尝试新策略以跟上行业发展及消费者偏好。</tspan><tspan id="tspan124" x="-28.347 -15.4033 -2.4596 10.4841 23.427799 36.371498 49.315201 62.2589 75.202599 88.146301 101.09 114.0337 126.9774 139.9211 152.86481 165.8085 178.7522 191.69591 204.6396 217.5833 230.52699 243.4707 256.4144 269.35809 282.30179 295.24551 308.18921 321.1329 334.0766 347.02029 359.96399 372.90771 385.85141" y="111.9965">未能以具成本效益的方式进行销售及营销活动以及未能实现我们销售及营销</tspan><tspan id="tspan126" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 182.21941 195.37981 208.54021 219.84599 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 323.5155 336.6759 347.98169 359.52731 372.68771 385.84811" y="127.996">活动的预期结果可能会降低我们的市场份额，导致我们的收益下降，对我们</tspan><tspan id="tspan128" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 114.5628 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 216.3777 227.92439 241.08479 254.24519 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="143.9955">的盈利能力产生负面影响，并对我们的业务、财务状况及经营业绩造成重大</tspan><tspan id="tspan130" x="-28.347 -15.3912 -4.0854001" y="159.995">损害。</tspan></text>

<text id="text38" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.039,633.0132)" xml:space="preserve"><tspan id="tspan36" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 207.2928 220.2486 233.20441 246.1602 259.116 272.07181 285.02759 297.9834 310.93921 323.89499 336.8508 349.80661 361.11349" y="0">我们的无形资产减值可能会对财务状况及经营业绩造成负面影响。</tspan></text>
