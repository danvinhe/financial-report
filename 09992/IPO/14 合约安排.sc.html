<text id="text32" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,679.992)" xml:space="preserve"><tspan id="tspan30" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379" y="0">葩趣互娱财务业绩综合入账</tspan></text>
<text id="text36" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,647.9919)" xml:space="preserve"><tspan id="tspan34" x="0 12.4619 24.9238 37.3857 49.847599 62.309502 74.7714 87.233299 99.695198 112.1571 124.619" y="0">根据国际财务报告准则第</tspan></text>
<text id="text40" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,249.4509,647.9919)" xml:space="preserve"><tspan id="tspan38" x="0 6.4218001" y="0">10</tspan></text>
<text id="text90" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,262.4375,647.9919)" xml:space="preserve"><tspan id="tspan42" x="0 11.3058 22.6105 35.072399 47.534302 59.996201 72.458099 84.919998 96.2258 107.5316 119.9935 132.4554 144.9173 157.3792 169.84109 182.30299 194.76489 207.22681 219.68871 225.49451 236.79919" y="0">号－综合财务报表，附属公司为由另一实体（即</tspan><tspan id="tspan44" x="-177.397 -164.40379 -151.4106 -140.06081 -133.33211 -120.3389 -107.3457 -94.352501 -81.359299 -70.053497 -58.703701 -45.710499 -32.7173 -19.7241 -6.7308998 6.2623 19.255501 32.248699 45.241901 58.2351 71.228302 84.221497 97.214699 110.2079 123.2011 136.19431 149.1875 162.18069 175.1739 188.1671 201.16029 214.1535 225.45821 236.8069" y="15.9995">母公司）控制的实体。当投资者可或有权通过参与投资对象获得可变回报，且</tspan><tspan id="tspan46" x="-177.397 -164.2366 -151.0762 -137.9158 -124.7554 -111.595 -98.434601 -85.2742 -72.1138 -58.9534 -45.792999 -32.632599 -19.4722 -6.3118 6.8485999 20.009001 33.169399 46.3298 59.4902 72.650597 83.956398 95.503098 108.6635 121.8239 134.9843 148.1447 161.3051 174.4655 187.6259 200.7863 212.0921 223.63879 236.79919" y="31.999001">有能力通过对投资对象的权力影响该等回报时，即算作控制投资对象。尽管</tspan><tspan id="tspan48" x="-177.397 -164.3477 -151.2984 -138.2491 -125.1998 -112.1505 -99.101196 -86.051903 -73.002602 -59.9533 -46.903999 -33.854698 -20.805401 -7.7561002 5.2932 18.342501 29.6483 41.063 54.112301 67.161598 80.210899 93.260201 106.3095 119.3588 132.4081 145.4574 158.5067 171.556 184.6053 197.6546 210.7039 223.7532 236.80251" y="47.998501">本公司并未直接或间接拥有葩趣互娱，但上文所述的合约安排令本公司可对</tspan><tspan id="tspan50" x="-177.397 -164.44119 -151.4854 -138.5296 -125.5738 -112.618 -99.662201 -86.706398 -73.750603 -62.444801" y="63.998001">葩趣互娱行使控制权。</tspan><tspan id="tspan52" x="-149.05 -136.0183 -122.9866 -109.9549 -96.923203 -83.891502 -70.859802 -57.828098 -44.796398 -31.7647 -18.733 -5.7013001 7.3304 20.362101 33.393799 46.425499 59.457199 72.488899 85.520599 98.552299 111.584 124.6157 137.6474 150.67909 163.7108 175.0155 186.4104 199.44209 212.4738 225.50549 236.8102" y="95.9981">根据北京泡泡玛特与葩趣互娱订立的独家咨询和服务协议，各方同意，</tspan><tspan id="tspan54" x="-177.397 -164.7206 -152.0442 -139.3678 -126.6914 -114.015 -101.3386 -88.662201 -75.985802 -63.309399 -50.632999 -37.9566 -25.280199 -12.6038 0.0726 11.3784 22.6842 35.3606 48.036999 60.713402 73.389801 86.0662 98.742599 111.419 124.0954 136.7718 149.4482 162.1246 174.80099 187.4774 200.15379 212.8302 225.50661 236.81129" y="111.9976">作为北京泡泡玛特提供服务的代价，葩趣互娱将向北京泡泡玛特支付服务费。</tspan><tspan id="tspan56" x="-177.397 -164.25861 -151.12019 -144.4344 -132.91299 -119.7746 -106.6362 -93.497803 -80.359398 -67.221001 -54.0826 -40.944199 -27.805799 -14.6674 -3.1471 3.7553999 16.893801 30.0322 43.170601 56.308998 69.447403 82.5858 95.724197 108.8626 122.001 135.1394 148.2778 159.5836 171.105 184.24339 197.38181 210.5202 223.6586 236.797" y="127.9971">服务费（可由北京泡泡玛特调整）相等于葩趣互娱的全部纯利，亦可包括葩趣</tspan><tspan id="tspan58" x="-177.397 -164.2366 -151.0762 -137.9158 -124.7554 -111.595 -98.434601 -85.2742 -72.1138 -58.9534 -45.792999 -32.632599 -19.4722 -6.3118 4.9951 16.540701 29.701099 42.8615 56.0219 69.182297 82.342697 95.503098 108.6635 121.8239 134.9843 148.1447 161.3051 174.4655 187.6259 200.7863 213.9467 225.2536 236.79919" y="143.9966">互娱于过往财务期间的保留盈利。北京泡泡玛特可全权酌情调整服务费，并</tspan><tspan id="tspan60" x="-177.397 -164.3477 -151.2984 -138.2491 -125.1998 -112.1505 -99.101196 -86.051903 -73.002602 -59.9533 -46.903999 -33.854698 -20.805401 -7.7561002 5.2932 18.342501 31.3918 44.441101 57.490398 70.539703 83.588997 96.638298 109.6876 120.9934 132.40919 145.4585 158.5078 171.5571 184.6064 197.6557 210.705 223.7543 236.8036" y="159.99609">允许葩趣互娱保留充足营运资金以实施任何增长计划。葩趣互娱须定期向北</tspan><tspan id="tspan62" x="-177.397 -164.2366 -151.0762 -137.9158 -124.7554 -111.595 -98.434601 -85.2742 -72.1138 -58.9534 -45.792999 -32.632599 -19.4722 -6.3118 6.8485999 20.009001 33.169399 46.3298 59.4902 72.650597 85.810997 97.116798 108.6624 121.8228 133.1297 144.67529 157.83569 170.99609 184.15649 197.31689 210.47729 223.6377 236.7981" y="175.99561">京泡泡玛特提交彼等各自的管理账目及经营数据。因此，北京泡泡玛特有能</tspan><tspan id="tspan64" x="-177.397 -164.44119 -151.4854 -138.5296 -125.5738 -112.618 -99.662201 -86.706398 -73.750603 -60.7948 -47.839001 -34.883202 -21.927401 -8.9715996 3.9842 16.940001 29.8958 42.851601 55.8074 68.763199 81.719002 94.674797 107.6306 120.5864 133.54221 146.498 159.4538 172.40961 185.3654 198.3212 211.27699 222.58279" y="191.9951">力全权酌情透过独家咨询和服务协议提取葩趣互娱的绝大部分经济利益。</tspan><tspan id="tspan66" x="-149.05 -135.96111 -124.6564 -113.1933 -100.1044 -87.015503 -73.926598 -60.8377 -47.748798 -34.659901 -21.570999 -8.4820995 4.6068001 17.6957 30.784599 43.873501 56.962399 68.268204 79.730202 92.819099 105.908 118.9969 132.0858 145.1747 158.2636 171.35249 184.44141 197.5303 210.6192 223.7081 236.797" y="223.99519">此外，根据各方订立的独家购买权协议，由于须取得北京泡泡玛特事先</tspan><tspan id="tspan68" x="-177.397 -164.2366 -151.0762 -137.9158 -126.61 -115.0633 -101.9029 -88.7425 -75.5821 -62.4217 -49.261299 -36.100899 -22.9405 -9.7800999 3.3803 16.540701 29.701099 42.8615 56.0219 69.182297 82.342697 93.648499 105.1952 118.3556 131.51601 144.67641 157.83681 170.99719 184.15759 197.31799 210.47839 223.63879 236.79919" y="239.99471">书面同意，且北京泡泡玛特可要求即时分派溢利，北京泡泡玛特可绝对控制</tspan><tspan id="tspan70" x="-177.397 -164.44119 -151.4854 -138.5296 -125.5738 -112.618 -99.662201 -86.706398 -73.750603 -60.7948 -47.839001 -34.883202 -21.927401 -8.9715996 3.9842 16.940001 29.8958 42.851601 54.157398" y="255.9942">向葩趣互娱股东分派股息或任何其他款项。</tspan><tspan id="tspan72" x="-149.05 -135.96111 -124.6564 -113.1933 -100.1044 -87.015503 -73.926598 -60.8377 -47.748798 -34.659901 -21.570999 -8.4820995 4.6068001 17.6957 29.001499 40.463501 53.552399 66.641296 79.730202 92.819099 105.908 118.9969 132.0858 145.1747 158.2636 171.35249 184.44141 197.5303 210.6192 223.7081 236.797" y="287.99429">此外，根据股东表决权委托协议，北京泡泡玛特享有作为股东的所有权</tspan><tspan id="tspan74" x="-177.397 -166.0912 -154.7854 -141.8989 -129.01241 -116.1259 -103.2394 -90.352898 -77.4664 -64.579903 -51.693401 -38.8069 -25.920401 -13.0339 -0.14740001 11.1584 22.464199 35.3507 48.237202 61.123699 72.429497 83.7342 96.620697 109.5072 122.3937 135.2802 148.1667 161.05321 173.9397 186.8262 199.71271 212.5992 225.4857 236.7915" y="303.9938">利，并可行使对葩趣互娱的控制权，包括提议、召开及出席股东大会的权利、</tspan><tspan id="tspan76" x="-177.397 -164.1189 -152.8131 -141.12781 -127.8497 -116.545 -104.8597 -91.581596 -78.303497 -65.025398 -51.747299 -38.4692 -25.191099 -11.913 1.3651 14.6432 25.948999 37.6343 50.912399 64.190498 77.468597 90.746696 104.0248 117.3029 130.58099 143.8591 157.13721 170.4153 183.69341 196.9715 210.2496 223.52769 236.8058" y="319.99329">出售、转让、质押或处置股份的权利、行使股东投票权及委任葩趣互娱法定</tspan><tspan id="tspan78" x="-177.397 -164.39169 -151.3864 -144.70061 -133.3365 -120.3312 -108.9671 -103.1624 -91.798302 -78.792999 -67.487198 -56.1231 -43.117802 -31.813101 -20.447901 -7.4425998 5.5626998 18.568001 25.252701 36.616798 49.622101 62.627399 73.991501 80.735603 93.740898 106.7462 119.7515 132.75681 145.7621 158.7674 171.77271 184.778 197.78329 210.7886 223.7939 236.79919" y="335.9928">代表人（主席）、董事、监事、行政总裁（总经理）及股东大会委任的其他高级管</tspan><tspan id="tspan80" x="-177.3981 -164.2377 -151.0773 -137.9169 -124.7565 -111.5961 -98.435699 -87.129898 -75.584297 -62.423901 -49.2635 -36.1031 -22.942699 -9.7823 1.5235 13.0702 26.2306 39.390999 52.551399 65.7118 78.8722 92.0326 105.193 118.3534 131.51379 144.67419 157.83459 170.995 184.1554 197.3158 210.4762 223.6366 236.797" y="351.99231">理层成员的权利。由于该等协议，我们已透过北京泡泡玛特取得葩趣互娱的</tspan><tspan id="tspan82" x="-177.3981 -164.62379 -151.8495 -140.5437 -129.239 -116.4647 -103.6904 -90.9161 -78.1418 -65.3675 -52.593201 -39.818901 -27.0446 -14.2703 -1.4960001 11.2783 24.052601 36.8269 49.6012 62.3755 75.149803 87.924103 100.6984 113.4727 126.247 139.0213 151.79559 164.5699 177.34419 190.1185 201.4243 212.7301 225.50439 236.8091" y="367.99179">控制权，并可全权酌情收取葩趣互娱所产生的绝大部分经济利益回报。因此，</tspan><tspan id="tspan84" x="-177.3981 -164.3488 -151.2995 -138.2502 -125.2009 -112.1516 -99.102303 -86.053001 -73.0037 -61.699001 -50.283199 -37.233898 -24.184601 -11.1353 1.914 14.9633 28.0126 41.061901 54.111198 67.1605 80.209801 93.259102 106.3084 119.3577 132.407 145.4563 158.5056 171.5549 184.6042 197.6535 210.7028 223.75211 236.80141" y="383.9913">葩趣互娱的经营业绩、资产及负债以及现金流量均于我们的财务报表中综合</tspan><tspan id="tspan86" x="-177.3981 -164.44231 -153.13651" y="399.99081">入账。</tspan><tspan id="tspan88" x="-149.0511 -136.0667 -123.0823 -110.0979 -97.113503" y="431.99091">葩趣互娱于</tspan></text>
