2 92.406601 105.083 117.7594 130.43581 143.1122 155.7886 168.465 181.1414 192.4472" y="63.998001">不合理负担，因此本公司或我们附属公司持有葩趣互娱的任何股权并不可行。</tspan><tspan id="tspan214" x="-221.76221 -208.8064 -197.5006 -186.19591 -173.2401 -160.2843 -147.32851 -134.3727 -121.4169 -108.4611 -95.505302 -82.5495 -69.593697 -56.637901 -43.682098 -30.726299 -17.7705 -4.8147001 8.1410999 21.096901 34.0527 47.008499 59.964298 72.920097 85.8759 97.181702" y="79.997498">因此，北京泡泡玛特就葩趣互娱的全部股权订立合约安排。</tspan><tspan id="tspan216" x="-193.41521 -180.2845 -167.15379 -154.0231 -140.8924 -127.7617 -114.631 -101.5003 -88.369598 -75.238899 -62.1082 -48.977501 -35.846802 -22.716101 -9.5853996 3.5453 10.2278 21.7393 34.8689 47.999599 61.130299 74.261002 87.391701 100.5224 113.6531 126.7838 139.91451 153.0452 166.1759 179.30659 192.4373" y="111.9976">倘适用中国法律法规容许外资拥有权（或容许较现时批准百分比高的外</tspan><tspan id="tspan218" x="-221.76221 -208.51711 -195.272 -182.0269 -170.3812 -164.57651 -152.9308 -139.6868 -126.4417 -113.1966 -99.9515 -86.706398 -73.461304 -60.216202 -46.9711 -33.726002 -20.4809 -7.2357998" y="127.9971">资拥有权），或倘相关政府机关取消持有</tspan></text>

2 -56.8722 -49.970798 -36.832401 -23.694 -10.5556 2.5827999 15.7212 28.8596 40.165401 51.686798 64.825203 77.9636 91.101997 104.2404 117.3788 130.5172 143.65559 156.79401 169.9324 183.0708 196.2092 209.3476" y="95.9981">娱及相关股东（作为另一方）之间的合约安排，我们将获得对葩趣互娱目前经</tspan><tspan id="tspan80" x="-204.84641 -191.89059 -178.9348 -165.979 -153.02319 -140.0674 -127.1116 -114.1558 -101.2 -88.244202 -75.288399 -62.3326 -49.376801 -36.421001 -23.4652 -10.5094 2.4463999 15.4022 28.358 41.313801 54.2696 67.225403 80.181198 93.137001 106.0928 117.3986" y="111.9976">营的业务的有效控制并取得该业务所产生的所有经济利益。</tspan></text>

7.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 337.03339 348.3392 359.755 372.80429 385.85361" y="63.998001">让我们可在中国从事受外商投资限制规限的行业的业务而严谨设计。我们的</tspan><tspan id="tspan98" x="-28.347 -15.0216 -1.6962 11.6292 22.934999 34.675301 48.000702 61.326099 74.651497 87.976898 101.3023 114.6277 127.9531 141.2785 152.5843 164.3257 177.65109 190.9765 202.2812" y="79.997498">董事认为，合约安排属公平合理，原因是：</tspan></text>

<text id="text98" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,194.8403,665.0133)" xml:space="preserve"><tspan id="tspan64" x="0 12.8799 25.7598 38.639702 51.5196 64.399498 77.279404 90.159302 103.0392 115.9191 128.799 141.67889 152.9847 164.2905 177.17039 190.05029 202.93021 215.8101 228.69 241.5699 254.4498 267.32971 280.20959 293.08951 304.3942" y="0">与任何第三方的整合或兼并，或收购或投资任何第三方。</tspan><tspan id="tspan66" x="-109.7998 -96.533798 -85.227997 -73.558098 -60.292099 -47.0261 -33.760101 -20.494101 -7.2280998 6.0379 19.3039 32.569901 45.835899 59.101898 72.367897 85.633904 98.899902 110.2057 121.8756 135.1416 148.40759 161.6736 174.93961 188.2056 199.8755 211.54539 224.8114 238.07739 251.3434 264.60941 277.8754 291.14139 304.40741" y="15.9995">因此，由于该等协议的相关限制性规定，倘葩趣互娱及╱或其附属公司蒙受</tspan><tspan id="tspan68" x="-109.7998 -96.844002 -83.888199 -70.932404 -59.626598 -48.321899 -35.3661 -22.410299 -9.4545002 3.5013001 16.4571 29.412901 42.368698 55.324501 68.280296 81.236099 94.191902 107.1477 120.1035 133.0593 146.01511 158.9709 171.9267 184.88251 197.8383 210.7941 223.74989 236.7057 249.6615 262.61731 275.57309 286.87891" y="31.999001">任何损失，可在一定程度上限制对北京泡泡玛特及我们的潜在不利影响。</tspan><tspan id="tspan70" x="-81.452797 -68.480499 -55.508202 -42.5359 -29.563601 -16.591299 -3.619 9.3533001 22.3256 35.297901 48.270199 61.2425 74.214798 87.187103 100.1594 113.1317 126.104 139.07629 152.0486 165.0209 177.99319 189.299 200.6235 213.59579 226.5681 239.54041 252.5127 265.48499 278.45731 291.4296 304.40189" y="63.9991">为防止葩趣互娱的相关资产及价值流向相关股东，在独家购买权协议的</tspan><tspan id="tspan72" x="-109.7998 -96.639397 -83.478996 -72.173203 -60.627602 -47.467201 -34.306801 -21.1464 -7.9860001 5.1743999 18.334801 31.495199 44.655602 57.816002 70.976402 84.136803 97.297203 110.4576 123.618 134.9238 146.4705 159.63091 172.79131 185.95171 199.11211 212.27251 225.43291 238.59331 251.75369 264.91409 278.07449 291.23489 304.39529" y="79.998596">期限内，倘未经北京泡泡玛特事先书面同意，葩趣互娱不得向其股东作出任</tspan><tspan id="tspan74" x="-109.7998 -96.521698 -83.243599 -71.937798 -60.252499 -46.9744 -33.696301 -20.4182 -7.1401 6.138 19.4161 32.694199 45.972301 59.250401 72.528503 85.806602 99.084702 110.3905 122.0758 135.3539 148.632 161.9101 175.1882 188.46629 201.7444 215.02251 228.3006 241.5787 254.8568 268.13489 279.4407 291.12491 304.40302" y="95.9981">何分派。倘相关股东接获葩趣互娱股息、溢利及分派以外的任何利益，在中</tspan><tspan id="tspan76" x="-109.7998 -96.487602 -83.1754 -69.863197 -56.550999 -43.2388 -29.9266 -18.6208 -6.8948002 6.4173999 19.729601 33.041801 46.354 59.666199 72.978401 86.290604 99.602798 112.915 126.2272 139.5394 152.85159 166.1638 179.476 192.78819 206.1004 219.4126 232.72479 246.037 259.34921 272.66141 285.9736 292.67151 304.39639" y="111.9976">国法律的规限下，相关股东须立即支付或转让有关分派予北京泡泡玛特（或</tspan><tspan id="tspan78" x="-109.7998 -96.830803 -83.861801 -70.892799 -57.923801 -46.6026 -40.799 -29.4778 -16.508801 -3.5397999 9.4292002 22.398199 35.367199 48.336201 61.305199 74.2742 87.243202 100.2122 113.1812 126.1502 137.4549 148.77609 161.7451 174.7141 187.68311 200.6521 213.62109 226.5901 239.5591 252.52811 265.4971 278.46609 291.43509 304.40411" y="127.9971">其指定人士）。倘北京泡泡玛特行使其购买权，所收购的葩趣互娱的全部或任</tspan><tspan id="tspan80" x="-109.7998 -96.7043 -83.608803 -70.513298 -57.417801 -44.3223 -32.8526 -21.3829 -8.2874002 4.8081002 17.903601 30.9991 44.094601 57.190102 70.285599 83.381104 96.476601 109.5721 122.6676 135.76311 147.06889 158.5386 171.63409 184.7296 197.8251 210.92059 224.0161 237.1116 248.5813 260.05099 273.14651 286.242 292.9267 304.39639" y="143.9966">何部分股权及╱或资产将转让予北京泡泡玛特，且股权拥有权及╱或资产（如</tspan><tspan id="tspan82" x="-109.7998 -96.844002 -85.5382 -78.8535 -65.897697 -52.941898 -39.986099 -27.0303 -14.0745 -1.1187 11.8371 24.7929 37.748699 50.704498 63.660301 76.616096 89.571899 102.5277 115.4835 126.7893" y="159.99609">适用）的利益应归属我们及我们的股东所有。</tspan><tspan id="tspan84" x="-81.453903 -68.364998 -55.2761 -42.187199 -29.098301 -16.009399 -2.9205 10.1684 23.257299 36.346199 49.435101 62.523998 75.6129 88.701797 100.0065 111.4696 124.5585 137.6474 150.7363 163.8252 176.91409 190.00301 203.0919 216.1808 227.4866 238.94859 252.03751 265.1264 278.2153 291.3042 304.3931" y="191.9962">我们的中国法律顾问已告知我们，独家购买权协议合法、有效并对各方</tspan><tspan id="tspan86" x="-109.8009 -96.640503 -83.480103 -70.319702 -57.159302 -45.8535 -34.307899 -21.147499 -7.9871001 5.1732998 18.3337 31.494101 44.654499 57.814899 70.975304 84.135696 97.296097 110.4565 123.6169 136.7773 149.9377 163.0981 176.2585 187.5643 199.11099 212.27139 225.43179 238.59219 251.75259 264.91299 278.07339 291.2338 304.3942" y="207.9957">具有约束力，且根据适用中国法律法规可予强制执行。由于葩趣互娱并非国</tspan><tspan id="tspan88" x="-109.8009 -96.640503 -83.480103 -72.174301 -60.6287 -47.4683 -34.307899 -21.147499 -7.9871001 5.1732998 18.3337 31.494101 44.654499 57.814899 70.975304 84.135696 97.296097 110.4565 123.6169 136.7773 149.9377 163.0981 176.2585 189.4189 202.5793 215.7397 227.0455 238.59219 251.75259 264.91299 278.07339 291.2338 304.3942" y="223.99519">有企业，葩趣互娱可与北京泡泡玛特或其指定人士订立合约，就北京泡泡玛</tspan><tspan id="tspan90" x="-109.8009 -96.754898 -83.7089 -70.662903 -57.616901 -44.5709 -31.5249 -18.478901 -5.4329 7.6131001 20.6591 33.705101 46.751099 59.7971 72.843102 85.889099 98.935097 111.9811 125.0271 138.0731 151.11909 164.1651 177.21111 190.2571 203.3031 216.34911 229.3951 242.4411 253.85249 265.26389 278.30991 291.3559 304.40189" y="239.99471">特或其指定人士按名义价或预定金额收购葩趣互娱的相关股权及╱或资产作</tspan><tspan id="tspan92" x="-109.8009 -96.850601 -83.900299 -72.594498 -61.2887 -48.338402 -35.3881 -22.437799 -9.4875002 3.4628 16.413099 29.3634 42.313702 55.264 66.568703 77.874496 90.824799 103.7751 116.7254 129.6757 142.62601 155.57629 168.5266 179.8324 191.1371 204.0874 215.3932 226.69901 239.64931 252.59959 265.5499 278.50021 291.4505 304.40079" y="255.9942">出规定，而毋须受任何预先审查、预先批准程序所限。此外，北京泡泡玛特或</tspan><tspan id="tspan94" x="-109.8009 -96.751602 -83.702301 -70.653 -57.603699 -44.554401 -31.5051 -18.455799 -5.4064999 7.6427999 20.692101 33.741402 45.047199 56.463001 69.512299 82.5616 95.610901 108.6602 121.7095 134.7588 147.80811 160.85741 173.90669 186.95599 200.00529 213.0546 226.1039 239.1532 252.2025 265.2518 278.30109 291.3504 304.39969" y="271.99371">其指定人士可行使其购买权，根据独家购买权协议规定的相关程序按名义价</tspan><tspan id="tspan96" x="-109.8009 -96.8451 -83.889297 -70.933502 -57.977699 -45.0219 -32.066101 -19.1103 -6.1545 6.8013 19.757099 32.712898 45.668701 58.6245 71.580299 84.536102 97.491898 108.7977 120.1035 133.0593 146.01511 157.32091" y="287.99319">或预定金额购买葩趣互娱的相关股权及╱或资产。</tspan></text>

<text id="text136" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,175.6266,297.0204)" xml:space="preserve"><tspan id="tspan134" x="0 13.2814 26.562799 39.8442 53.125599 66.406998 79.6884 92.969803 106.2512" y="0">独家咨询和服务协议</tspan></text>
<text id="text150" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,293.5664,297.0204)" xml:space="preserve"><tspan id="tspan138" x="0 5.8058 11.6116 23.3002 36.5816 47.887402 59.574902 72.8563 86.137703 99.419098 112.7005 125.9819 139.26331 152.54469 165.8261 179.1075 192.3889 205.6703" y="0">」），据此，葩趣互娱将同意聘请北京泡</tspan><tspan id="tspan140" x="-208.52589 -195.57561 -182.62531 -169.675 -156.7247 -143.7744 -130.8241 -117.8738 -104.9235 -91.973198 -79.022903 -66.072601 -54.7668 -43.462101 -30.511801 -17.561501 -4.6111999 6.6946001 18.000401 30.950701 43.901001 56.851299 69.801598 82.7519 94.057701 105.3635 118.3138 131.2641 144.2144 155.5191 166.82491 179.77521 192.72549 205.6758" y="15.9995">泡玛特为其软件开发及推广、技术支持、业务合作咨询、市场咨询、客户管理</tspan><tspan id="tspan142" x="-208.52589 -195.2478 -183.942 -172.2567 -158.97861 -145.7005 -132.42239 -119.1443 -105.8662 -92.588097 -79.309998 -66.031898 -52.753799 -39.4757 -28.171 -16.485701 -3.2076001 10.0705 23.3486 34.6544 46.339699 59.617802 72.895897 86.174004 99.452103 112.7302 126.0083 139.28641 152.5645 165.84261 179.1207 192.3988 205.6769" y="31.999001">咨询、公共关系及人力资源咨询、市场研究、制定市场开发计划以及葩趣互</tspan><tspan id="tspan144" x="-208.52589 -195.36549 -182.20509 -169.04469 -155.88429 -142.72391 -129.56351 -116.4031 -103.2427 -90.082298 -76.921898 -63.761501 -50.601101 -37.440701 -24.2803 -11.1199 2.0404999 15.2009 28.3613 39.667099 51.213799 64.374199 77.534599 90.695 103.8554 117.0158 130.17619 143.33659 156.49699 169.65739 182.81779 194.1236 205.6692" y="47.998501">娱所需的其他相关咨询及服务的独家供应商，并支付服务费以换取服务。根</tspan><tspan id="tspan146" x="-208.52589 -195.36549 -182.20509 -169.04469 -155.88429 -144.57851 -133.0329 -119.8725 -106.7121 -93.551697 -80.391296 -67.230904 -54.070499 -40.910099 -27.749701 -14.5893 -1.4289 11.7315 24.891899 38.052299 51.2127 64.3731 75.68 87.225601 100.386 113.5464 126.7068 139.8672 153.0276 166.188 179.3484 192.5088 205.6692" y="63.998001">据该等安排，北京泡泡玛特可全权酌情调整服务费，该等服务费将于北京泡</tspan><tspan id="tspan148" x="-208.52589 -195.5701 -182.6143 -169.65849 -156.7027 -143.7469 -130.79111 -117.8353 -104.8795 -91.923698 -78.967903 -66.0121 -53.056301 -40.100498 -27.144699 -14.1889 -1.2331001 11.7227 24.678499 37.6343 50.590099 63.545898 76.501701 87.806396" y="79.997498">泡玛特发出付款通知后电汇至北京泡泡玛特指定账户。</tspan></text>

563 191.0403 204.1468 217.2533 230.3598 243.46629 256.57281 269.67929 282.7858 295.8923 308.99881 322.10529 335.21179 348.3183 361.4248 374.53131 385.8371" y="63.998001">从事相关业务或任何其他受限制业务，北京泡泡玛特已设立内部控制流程，</tspan><tspan id="tspan36" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 182.21941 195.37981 208.54021 221.70061 234.86099 248.02139 261.18179 274.34219 287.50259 300.66299 313.82339 326.9838 338.28961 349.8363 362.9967 374.30249 385.84811" y="79.997498">要求相关部门的高级员工对北京泡泡玛特将涉足的业务进行审查。此外，我</tspan><tspan id="tspan38" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 296.1409 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="95.997002">们的法务部将对北京泡泡玛特将订立的业务合约进行审查，以确保遵守适用</tspan><tspan id="tspan40" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 34.780899 46.0867 59.0425 71.998299 84.954102 97.909897 109.2157" y="111.9965">的中国法律、法规及规则。</tspan><tspan id="tspan42" x="0 13.0317 26.0634 39.0951 52.126801 65.158501 78.190201 91.221901 104.2536 117.2853 130.317 143.34869 156.3804 169.41209 182.4438 195.47549 208.5072 221.53889 232.8436 244.23849 257.2702 270.30191 283.33359 296.3653 309.397 322.42871 335.46039 348.4921 361.5238 374.55551 385.8602" y="143.9966">葩趣互娱的正常业务过程中产生知识产权。根据独家咨询和服务协议，</tspan><tspan id="tspan44" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 217.84621 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="159.99609">鉴于北京泡泡玛特向葩趣互娱提供咨询服务，北京泡泡玛特拥有葩趣互娱所</tspan><tspan id="tspan46" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 191.7476 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="175.99561">开发的所有知识产权的独家及专有权利。葩趣互娱所产生的部分经济利益将</tspan><tspan id="tspan48" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 322.2406 333.6553 346.70459 359.75391 372.80319 385.85251" y="191.9951">为于葩趣互娱的正常业务营运过程中所开发或产生的知识产权。北京泡泡玛</tspan><tspan id="tspan50" x="-28.347 -15.2317 -2.1164 10.9989 24.114201 37.2295 50.344799 63.460098 76.575401 89.690697 102.806 115.9213 129.03661 142.1519 155.2672 168.38251 181.4978 194.6131 207.72839 214.4131 225.9059 239.02119 252.13651 265.2518 278.3671 291.48239 304.59769 317.71301 330.82831 343.9436 357.0589 368.5517 374.35641 385.84921" y="207.9946">特所提供的服务通常包括提供核心技术服务（例如编程及管理咨询服务），而</tspan><tspan id="tspan52" x="-28.347 -15.2317 -2.1164 10.9989 24.114201 37.2295 50.344799 63.460098 76.575401 89.690697 102.806 115.9213 129.03661 142.1519 155.2672 168.38251 175.0661 186.5589 199.67419 212.78951 225.9048 239.0201 252.13541 265.2507 278.366 291.48129 304.59659 317.71191 329.20581 335.0105 346.5033 359.61859 372.73389 385.84921" y="223.99409">葩趣互娱执行相关构思并作细化补充（例如艺术设计及文字编辑），从而于此</tspan><tspan id="tspan54" x="-28.348101 -15.1877 -2.0272999 11.1331 24.293501 37.453899 50.6143 63.7747 76.935097 88.241997 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 176.8954 188.44209 201.60249 214.76289 227.92329 241.08369 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="239.99361">过程中发展知识产权。根据合约安排，葩趣互娱须获得北京泡泡玛特事先书</tspan><tspan id="tspan56" x="-28.348101 -15.2988 -2.2495 10.7998 23.8491 36.898399 49.947701 62.997002 76.046303 89.095596 102.1449 115.1942 128.2435 139.5493 150.9651 164.0144 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="255.9931">面同意方可向任何第三方转让、出让或处置北京泡泡玛特根据独家咨询和服</tspan><tspan id="tspan58" x="-28.348101 -15.1514 -1.9547 11.242 24.4387 37.635399 50.8321 64.028801 77.225502 90.422203 103.6189 116.8156 130.0123 143.209 156.4057 167.7115 179.3011 192.4978 205.6945 218.8912 232.08791 245.28461 258.48129 271.67801 284.87469 298.07141 311.2681 322.57391" y="271.99261">务协议持有及授权的任何知识产权。我们的中国法律顾问认为，</tspan></text>

6499 111.4949 118.184 129.7054 142.8438" y="63.998001">股权及相关资产）或准许就有关股权及资产设置产权负担。倘违约事件（股权</tspan><tspan id="tspan54" x="-271.35349 -258.0545 -244.75549 -231.4565 -218.1575 -204.85851 -191.55949 -178.2605 -166.5499 -159.45821 -146.15919 -134.85339 -123.1439 -109.8449 -96.545898 -83.246902 -69.947899 -56.648899 -43.349899 -30.0509 -16.7519 -3.4528999 9.8460999 23.1451 36.444099 49.743099 63.042099 76.341103 89.640099 102.9391 116.2381 129.53709 142.83611" y="79.997498">质押协议所订明者）发生，除非该违约事件以令北京泡泡玛特满意的方式成</tspan><tspan id="tspan56" x="-271.35349 -258.20081 -245.0481 -233.74229 -222.20551 -209.0528 -195.9001 -182.74741 -169.5947 -156.442 -143.28931 -130.1366 -116.9839 -103.8312 -90.678497 -77.525803 -64.3731 -51.220402 -38.067699 -24.915001 -11.7623 1.3904001 12.9283 24.4662 37.6189 50.771599 63.924301 77.077003 90.229698 103.3824 116.5351 129.68781 142.8405" y="95.997002">功解决，否则北京泡泡玛特可书面要求相关股东及╱或葩趣互娱立即支付独</tspan><tspan id="tspan58" x="-271.35349 -258.3042 -245.2549 -232.2056 -219.1563 -206.10699 -193.05769 -180.00841 -166.95911 -153.90981 -140.8605 -127.8112 -114.7619 -101.7126 -88.6633 -75.613998 -62.564701 -49.5154 -36.466099 -23.4168 -10.3675 2.6817999 15.7311 28.780399 41.8297 54.879002 67.928299 80.9776 94.026901 105.3327 116.7485 129.79781 142.84711" y="111.9965">家咨询和服务协议以及独家购买权协议项下结欠的所有未偿还款项、偿还两</tspan><tspan id="tspan60" x="-271.35349 -258.24701 -245.1405 -232.034 -218.92751 -205.821 -192.71449 -179.608 -166.5015 -153.395 -140.2885 -127.182 -114.0755 -100.969 -87.862503 -74.755997 -61.649502 -48.542999 -35.436501 -22.33 -9.2235003 2.0822999 13.5663 26.6728 39.779301 52.885799 65.992302 79.098801 92.205299 105.3118 118.4183 131.5248 142.8306" y="127.996">项协议项下任何贷款及支付结欠的所有其他款项，或寻求落实该两项协议。</tspan><tspan id="tspan62" x="-271.35349 -258.40979 -245.46609 -232.5224 -219.5787 -206.63499 -193.6913 -180.7476 -167.80389 -154.8602 -141.9165 -128.97279 -116.0291 -103.0854 -90.141701 -77.197998 -64.254303 -51.3106 -38.366901 -25.423201 -12.4795 0.46419999 13.4079 26.351601 39. .1745 -178.0856 -164.9967 -151.90781 -138.81889 -125.73 -112.6411 -99.5522 -86.463303 -75.1586 -63.695499 -50.606602 -37.5177 -24.428801 -11.3399 1.749 14.8379 27.9268 41.015701 52.321499 63.783501 76.872398 89.961304 103.0502 116.1391 129.228 142.31689 155.40581" y="95.9981">股东表决权委托协议亦规定，为避免潜在利益冲突，倘相关股东为本集</tspan><tspan id="tspan156" x="-258.78821 -245.73891 -232.68961 -219.6403 -206.591 -193.5417 -180.4924 -167.4431 -154.3938 -143.088 -131.6722 -118.6229 -105.5736 -92.5243 -79.474998 -66.425697 -53.3764 -40.327099 -27.2778 -14.2285 -1.1792001 11.8701 24.919399 37.9687 51.018002 64.067299 77.1166 90.165901 103.2152 116.2645 129.3138 142.3631 155.4124" y="111.9976">团的高级职员或董事，则授权书将以本集团其他无关联的高级职员或董事为</tspan><tspan id="tspan158" x="-258.78821 -245.8324 -232.8766 -219.92081 -206.965 -195.66029" y="127.9971">受益人授出。</tspan></text>

"63.998001">他非法活动、宣告破产或进入清盘时，股东表决权委托协议方于到期前终止。</tspan><tspan id="tspan46" x="-388.15369 -375.1044 -362.05511 -349.0058 -335.95651 -322.9072 -309.85791 -296.80859 -283.75931 -270.70999 -257.66071 -244.6114 -231.5621 -218.5128 -205.4635 -192.4142 -179.3649 -166.3156 -153.2663 -140.217 -127.1677 -114.1184 -101.0691 -88.019798 -74.970497 -61.9212 -48.871899 -35.822601 -22.7733 -11.4675 -0.0517 12.9976 26.0469" y="79.997498">倘北京泡泡玛特于股东表决权委托协议到期前宣告破产或进行清盘，则股东</tspan><tspan id="tspan48" x="-388.15369 -374.99329 -361.83289 -348.67249 -335.51208 -322.35172 -309.19131 -296.03091 -282.87051 -269.71011 -256.54971 -243.3893 -232.0835 -220.5379 -207.3775 -194.2171 -181.0567 -167.8963 -154.7359 -141.5755 -128.4151 -117.1093 -105.5626 -92.402199 -79.241798 -66.081398 -52.921001 -39.760601 -26.600201 -13.4398 -0.27939999 12.881 26.041401" y="95.997002">表决权委托协议将自动终止。尽管订有上述条文，北京泡泡玛特有权于向相</tspan><tspan id="tspan50" x="-388.15369 -375.19791 -362.2421 -349.28629 -336.33051 -323.37469 -310.41891 -297.4631 -284.50729 -271.55151" y="111.9965">关股东及葩趣互娱发出</tspan></text>

<text id="text104" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,279.9436,505.0161)" xml:space="preserve"><tspan id="tspan100" x="0 13.0658 26.131599 32.817402 44.252998 57.318802 70.384598 83.450401 96.516197 109.582 121.0165 127.8321 140.8979 153.9637 167.0295 180.09531 193.1611 206.2269 219.29269" y="0">其配偶（作为登记股东）于葩趣互娱所持有</tspan><tspan id="tspan102" x="-194.9035 -181.9268 -168.9501 -155.9734 -142.9967 -130.02 -117.0433 -104.0666 -91.089897 -78.113197 -65.136497 -52.159801 -39.183102 -26.2064 -13.2297 -0.25299999 12.7237 24.0306" y="15.9995">的任何股权不属于夫妻共有财产的范畴；</tspan></text>
<text id="text108" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,315.2734,489.0166)" xml:space="preserve"><tspan id="tspan106" x="0 4.1216998 7.0223999 9.9231005" y="0">(ii)</tspan></text>
<text id="text114" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,330.5436,489.0166)" xml:space="preserve"><tspan id="tspan110" x="0 12.9767 25.9534 38.930099 51.906799 64.883499 77.860199 90.836899 103.8136 116.7903 129.767 142.7437 155.7204 168.6971" y="0">彼不会采取与合约安排有冲突之</tspan><tspan id="tspan112" x="-245.50349 -232.5477 -219.5919 -206.63609 -195.33031 -184.0256" y="15.9995">任何做法；及</tspan></text>
<text id="text118" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,159.1988,473.0171)" xml:space="preserve"><tspan id="tspan116" x="0 3.9688001 6.7165999 9.4644003 12.2122" y="0">(iii)</tspan></text>
<text id="text122" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,176.7603,473.0171)" xml:space="preserve"><tspan id="tspan120" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 207.2928 220.2486 231.5544" y="0">彼从未亦不会参与葩趣互娱的营运或管理。</tspan></text>
<text id="text126" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0412,441.017)" xml:space="preserve"><tspan id="tspan124" x="0 12.9558 25.9116 38.867401" y="0">争议解决</tspan></text>
<text id="text136" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3882,409.0169)" xml:space="preserve"><tspan id="tspan128" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 89.838097 101.3012 114.3901 127.479 140.5679 153.6568 166.7457 179.83459 192.92349 206.01241 219.1013 232.1902 245.2791 258.36801 271.45691 284.54581 297.6347 310.7236 323.8125 335.11829 346.58029 359.66919 372.75809 385.84698" y="0">各合约安排规定，倘就诠释及履行其条文方面存在任何争议，订约方应</tspan><tspan id="tspan130" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 154.0451 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 295.34009 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="15.9995">秉著诚信的原则协商以解决争议。就独家咨询和服务协议、独家购买权协议</tspan><tspan id="tspan132" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 126.5011 137.9169 150.9662 164.0155 177.0648 190.11411 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="31.999001">及股东表决权委托协议而言，倘订约方未能于任何一方要求透过协商解决争</tspan><tspan id="tspan134" x="-28.347 -15.3252 -2.3034 10.7184" y="47.998501">议之日后</tspan></text>
<text id="text140" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,136.7863,361.0184)" xml:space="preserve"><tspan id="tspan138" x="0 6.4218001" y="0">30</tspan></text>
<text id="text152" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,151.0071,361.0184)" xml:space="preserve"><tspan id="tspan142" x="0 13.0218 26.0436 39.065399 52.0872 65.109001 78.130798 91.152603 104.1744 117.1962 130.218 143.23981 154.54559 165.92841 178.9502 191.972 204.9938 218.01559 231.0374 244.0592 257.08099 270.10281 283.1246 296.14639 309.16821 322.19 335.21179 348.23361" y="0">天内就该争议解决达成协议，任何一方可提交相关争议予北京仲</tspan><tspan id="tspan144" x="-65.967003 -52.806599 -39.646198 -26.4858 -13.3254 -0.16500001 12.9954 26.1558 39.3162 52.476601 65.637001 78.797401 91.957802 105.1182 118.2786 131.439 144.5994 157.7598 170.9202 182.226 193.77271 206.93311 220.09351 233.25391 246.41431 259.57471 272.73511 285.89551 297.2002 308.74689 321.90729 335.06769 348.22809" y="15.9995">裁委员会依据当时有效的仲裁规则进行仲裁。仲裁须于北京进行，且仲裁期</tspan><tspan id="tspan146" x="-65.967003 -52.806599 -39.646198 -26.4858 -13.3254 -0.16500001 12.9954 26.1558 39.3162 52.476601 63.782398 75.329102 88.489502 101.6499 114.8103 127.9707 141.1311 154.2915 167.4519 180.6123 193.77271 205.07739 216.6241 229.7845 242.9449 256.10529 269.26569 282.42609 295.58649 308.74689 321.90729 335.06769 348.22809" y="31.999001">间所用的语言应为中文。仲裁裁决应为最终定论，且对所有订约方均具有约</tspan><tspan id="tspan148" x="-65.967003 -53.0112 -41.705399" y="47.998501">束力。</tspan><tspan id="tspan150" x="-37.619999 -24.3617 -13.0559 -1.3947999 11.8635 25.121799 38.3801 51.638401 64.896698 78.154999 91.4133 104.6716 117.9299 131.1882 144.4465 155.7523" y="79.998596">然而，我们的中国法律顾问已告知：</tspan></text>
<text id="text156" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,318.063,281.0198)" xml:space="preserve"><tspan id="tspan154" x="0 4.1216998 7.0223999" y="0">(i)</tspan></text>
<text id="text162" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,330.4303,281.0198)" xml:space="preserve"><tspan id="tspan158" x="0 13.2583 26.5166 39.774899 53.033199 66.291496 77.598396 89.259499 102.5178 115.7761 129.03439 142.29269 155.55099 168.8093" y="0">根据中国法律，仲裁庭通常不会</tspan><tspan id="tspan160" x="-245.3891 -232.4124 -219.4357 -206.459 -193.4823 -180.5056 -167.5289 -154.5522 -141.5755 -128.5988 -115.6221 -102.6454 -89.668701 -76.692001 -63.715302 -50.738602 -39.4328" y="15.9995">授予禁令救济或颁令将葩趣互娱清盘；</tspan></text>
<text id="text166" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,302.2989,265.0203)" xml:space="preserve"><tspan id="tspan164" x="0 4.1216998 7.0223999 9.9231005" y="0">(ii)</tspan></text>
<text id="text172" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,317.568,265.0203)" xml:space="preserve"><tspan id="tspan168" x="0 12.9767 25.9534 38.930099 51.906799 64.883499 77.860199 90.836899 103.8136 116.7903 129.767 142.7437 155.7204 168.6971 181.6738" y="0">由香港及开曼群岛等境外法院授予</tspan><tspan id="tspan170" x="-232.52679 -219.2058 -205.8848 -192.5638 -179.2428 -165.9218 -152.6008 -139.2798 -125.9588 -112.6378 -99.316803 -85.995796 -72.674797 -59.353802 -46.032799 -32.7118 -19.3908 -6.0697999 7.2512002 20.572201 33.8932 47.214199 60.535198 73.856201 87.1772 100.4982 113.8192 127.1402 140.4612 151.767 163.5018" y="15.9995">的临时救济措施或强制执行命令未必能在中国得到认可或强制执行；及</tspan></text>
<text id="text176" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,493.7473,249.0208)" xml:space="preserve"><tspan id="tspan174" x="0 4.1216998 7.0223999 9.9231005 12.8238" y="0">(iii)</tspan></text>
<text id="text182" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0412,233.0213)" xml:space="preserve"><tspan id="tspan178" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 233.14391 244.55969 257.60901 270.65829 283.70761 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="0">即使上述条文根据中国法律不可强制执行，争议解决条款的余下条文仍属合</tspan><tspan id="tspan180" x="0 11.3058 22.611601 35.567402 48.523201 61.479 74.434799 87.390602 100.3464 113.3022 126.258 139.21381 152.1696 165.1254 178.08121 191.037 203.9928 216.94859 229.9044 242.8602 255.81599 268.77179 280.07761" y="15.9995">法、有效且对合约安排项下的协议各方具有约束力。</tspan></text>

<text id="text34" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 76.749199 88.212303 101.3012 114.3901 127.479 140.5679 153.6568 166.7457 179.83459 192.92349 206.01241 219.1013 232.1902 245.2791 258.36801 271.45691 284.54581 297.6347 310.7236 322.02939 333.49139 346.58029 359.66919 372.75809 385.84698" y="0">基于上述原因，倘葩趣互娱或相关股东违反任何合约安排，我们未必能</tspan><tspan id="tspan28" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 87.352097 98.767899 111.8172 124.8665 137.9158 150.9651 164.0144 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="15.9995">及时取得充足的救济，而我们有效控制葩趣互娱及经营业务的能力可能受到</tspan><tspan id="tspan30" x="-28.347 -14.9919 -1.6368001 11.7183 25.0734 38.428501 49.734299 61.5098 74.864899 88.220001 101.5751 114.9302 128.28529 141.6404 154.9955 168.3506 181.7057 190.26151 202.037 215.39211 228.74719 242.10229 253.87669 265.65219 279.00729 292.3624 305.7175 319.0726 332.4277 345.78281 359.13791 372.49301 385.84811" y="31.999001">重大不利影响。详情请参阅本招股章程「风险因素－与我们的合约安排有关</tspan><tspan id="tspan32" x="-28.347 -15.3912 -2.4354 8.8704004 17.426201 30.382 41.687801" y="47.998501">的风险」一节。</tspan></text>
<text id="text38" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.039,633.0132)" xml:space="preserve"><tspan id="tspan36" x="0 12.9558 25.9116 38.867401" y="0">继承事项</tspan></text>
<text id="text56" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,601.0131)" xml:space="preserve"><tspan id="tspan40" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 259.44601 272.4183 285.39059 298.36292 309.6698 320.99429 333.96661 346.9389 359.91119 372.88351 385.8558" y="0">合约安排载有的条文亦对相关股东的继承人具有约束力，犹如该继承人</tspan><tspan id="tspan42" x="-28.347 -15.8488 -3.3506 9.1476002 21.6458 34.144001 46.6422 59.1404 71.638603 82.944397 94.2491 106.7473 119.2455 131.7437 144.2419 156.7401 169.2383 181.7365 193.0423 204.3481 216.8463 229.3445 241.8427 254.3409 266.83911 279.33731 291.83551 304.33371 315.6395 326.94531 339.44351 350.7482 362.05399 374.55219 385.8569" y="15.9995">为合约安排的签约方。根据中国继承法律，法定继承人包括配偶、子女、父母、</tspan><tspan id="tspan44" x="-28.347 -15.0689 -3.7630999 7.9222002 21.2003 32.505001 44.1903 57.468399 70.746498 84.024597 97.302696 110.5808 123.8589 137.13699 148.44279 160.1281 173.4062 186.6843 199.9624 213.24049 226.5186 239.79671 253.0748 266.35291 279.63101 292.90909 306.18719 319.4653 332.74341 346.02151 359.29959 372.5777 385.8558" y="31.999001">兄弟、姐妹、祖父母及外祖父母，而继承人的任何违约行为将被视为违反合</tspan><tspan id="tspan46" x="-28.347 -15.0689 -1.7908 9.5150003 21.2003 34.478401 47.7565 61.034599 74.312698 87.590797 98.896599 110.5819 123.86 137.13811 150.4162 163.69431 176.9724 190.2505 203.52859 216.8067 230.08479 243.3629 256.64099 269.9191 283.1972 296.47531 309.75339 323.03149 336.3096 347.61539 359.29959 372.5777 385.8558" y="47.998501">约安排。倘有违约事项，北京泡泡玛特可对继承人强制执行其权利。根据合</tspan><tspan id="tspan48" x="-28.347 -15.3967 -2.4463999 8.8593998 20.165199 33.115501 46.0658 59.016102 71.9664 84.916702 97.866997 110.8173 123.7676 136.7179 149.6682 162.6185 175.5688 188.5191 201.46941 214.41969 227.37 240.3203 251.6261 262.93079 275.8811 288.83139 301.78171 314.73199 327.68231 338.9881 350.29391 363.2442 374.54999 385.85471" y="63.998001">约安排，相关股东的任何继承人将因相关股东身故、丧失行为能力、结婚、离</tspan><tspan id="tspan50" x="-28.347 -17.041201 -5.6254001 7.4239001 20.4732 33.522499 46.5718 59.621101 72.670403 85.719704 98.768997 111.8183 124.8676 137.9169 150.9662 164.0155 177.0648 190.11411 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="79.997498">婚、破产或其他会影响彼等行使于葩趣互娱的股权的情况而继承登记股东于</tspan><tspan id="tspan52" x="-28.347 -15.6706 -2.9942 9.6822004 22.358601 35.035 47.711399 60.387798 73.064201 85.740601 98.417 111.0934 123.7698 136.4462 149.1226 161.799 173.1048 184.4106 197.08701 209.7634 222.4398 235.1162 247.7926 260.46899 273.14539 285.82181 298.4982 311.17459 323.85101 336.5274 349.2038 361.88019 374.55661 385.8613" y="95.997002">合约安排下的任何及所有权利及义务，犹如继承人为该等合约安排的签约方。</tspan><tspan id="tspan54" x="0 13.123 26.246 39.368999 52.492001 65.614998 78.737999 91.861 104.984 118.107 131.23 144.353 157.476 170.599 181.9048 193.4064 206.5294 219.6524 232.77541 245.89841 259.02139 272.14441 283.4502" y="127.9971">根据股东表决权委托协议的条款，各相关股东承诺，</tspan></text>
<text id="text60" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,408.1332,473.016)" xml:space="preserve"><tspan id="tspan58" x="0 4.1216998 7.0223999" y="0">(i)</tspan></text>
<text id="text68" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,420.5016,473.016)" xml:space="preserve"><tspan id="tspan62" x="0 13.123 26.246 39.368999 52.492001 65.614998 78.737999" y="0">倘其身故或丧失</tspan><tspan id="tspan64" x="-335.46149 -322.51779 -309.5741 -296.6304 -283.68671 -270.74301 -257.79929 -244.85561 -231.9119 -218.9682 -206.02451 -193.0808 -180.1371 -167.19341 -154.24969 -141.306 -128.3623 -115.4186 -102.4749 -89.531197 -76.587502 -63.643799 -50.7001 -37.756401 -24.8127 -11.869 1.0747 14.0184 26.962099 39.9058 52.849499 65.793198 78.7369" y="15.9995">行为能力或发生可能影响其行使或履行作为葩趣互娱股东的权利及义务的任</tspan><tspan id="tspan66" x="-335.46149 -322.47601 -309.49051 -296.505 -283.5195 -272.21371 -260.87271" y="31.999001">何其他情况；或</tspan></text>
<text id="text72" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,172.3097,441.017)" xml:space="preserve"><tspan id="tspan70" x="0 4.1216998 7.0223999 9.9231005" y="0">(ii)</tspan></text>
<text id="text82" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,187.5799,441.017)" xml:space="preserve"><tspan id="tspan74" x="0 12.9855 25.971001 38.956501 51.942001 64.927498 77.913002 90.898499 103.884 116.8695 129.855 142.8405 155.826 168.81149 181.797 194.7825 207.76801 220.75349 233.739 246.7245 259.70999 272.6955 285.681 298.6665 311.65201" y="0">倘破产或解散或发生任何事件可能影响其行使或履行作为</tspan><tspan id="tspan76" x="-102.5398 -89.490501 -76.4412 -63.391899 -50.342602 -37.293301 -24.243999 -11.1947 1.8546 14.9039 27.953199 41.002499 54.0518 67.101097 80.150398 91.4562 102.8709 115.9202 128.9695 142.0188 155.0681 168.1174 181.1667 194.216 207.2653 220.31461 233.36391 246.41319 259.46249 272.51181 285.5611 298.61041 311.6597" y="15.9995">葩趣互娱股东的权利及义务的情况，则其于相关股东承诺内的继承人应承担</tspan><tspan id="tspan78" x="-102.5398 -89.584 -76.628197 -63.672401 -50.716599 -37.760799 -24.805 -11.8492 1.1066 14.0624 27.0182 39.973999 52.929798 65.885597 78.8414 91.797203 104.753 117.7088 130.6646 143.62041 156.5762 169.532 180.8378" y="31.999001">相关股东于独家购买权协议项下的全部权利及义务。</tspan><tspan id="tspan80" x="-74.192802 -61.069801 -47.9468 -34.823799 -21.7008 -8.5777998 2.7269001 14.2285 27.3515 40.474499 53.5975 66.720497 79.843498 92.966499 106.0895 119.2125 132.33549 145.4585 156.7632" y="63.9991">基于上文所述，我们的中国法律顾问认为，</tspan></text>
<text id="text86" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,355.6445,377.0179)" xml:space="preserve"><tspan id="tspan84" x="0 4.1216998 7.0223999" y="0">(i)</tspan></text>
<text id="text92" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,368.0129,377.0179)" xml:space="preserve"><tspan id="tspan88" x="0 13.123 26.246 39.368999 52.492001 65.614998 78.737999 91.861 104.984 118.107 131.23" y="0">即使相关股东丧失行为能</tspan><tspan id="tspan90" x="-282.97171 -271.66589 -260.2204 -247.1458 -235.84 -224.3945 -211.3199 -204.63519 -193.1897 -180.1151 -167.0405 -155.595 -149.7892 -138.3437 -125.2691 -112.1945 -99.119904 -86.045303 -74.740601 -63.295101 -50.220501 -37.145901 -24.071301 -10.9967 2.0778999 15.1525 28.2271 41.301701 54.376301 67.450897 80.525497 91.8302 103.2768" y="15.9995">力、身故、破产（如适用）、结婚或离婚，合约安排仍为我们提供保障；及</tspan></text>
<text id="text96" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,483.9683,361.0184)" xml:space="preserve"><tspan id="tspan94" x="0 4.1216998 7.0223999 9.9231005" y="0">(ii)</tspan></text>
<text id="text104" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,499.2385,361.0184)" xml:space="preserve"><tspan id="tspan98" x="0" y="0">相</tspan><tspan id="tspan100" x="-414.1962 -400.85101 -387.5058 -374.16061 -360.8154 -347.47021 -334.125 -320.77979 -307.4346 -296.12881 -284.36539 -271.0202 -259.71439 -247.951 -234.6058 -227.92329 -216.1599 -202.8147 -189.4695 -177.705 -171.9003 -160.1369 -146.7917 -133.4465 -120.1013 -106.7561 -93.410896 -80.065697 -66.720497 -53.375301 -40.030102 -26.6849 -13.3397 0.0055" y="15.9995">关股东丧失行为能力、身故、破产（如适用）、结婚或离婚将不会影响合约安</tspan><tspan id="tspan102" x="-414.1951 -401.9158 -389.63651 -377.35721 -365.07791 -353.89859 -342.7193 -330.44 -318.16071 -305.88141 -293.60211 -281.32281 -269.04349 -256.76419 -244.48489 -232.2056 -219.9263 -207.647 -195.36771 -183.08839 -170.8091 -158.5298 -146.2505 -133.97121 -121.6919 -109.4126 -97.133301 -84.853996 -72.574699 -60.295399 -48.016102 -35.736801 -23.4575 -11.1782 0.0022" y="31.999001">排的有效性，且北京泡泡玛特可根据合约安排对相关股东的继承人行使其权利。</tspan></text>
<text id="text108" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0434,297.0193)" xml:space="preserve"><tspan id="tspan106" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558" y="0">解决潜在利益冲突的安排</tspan></text>
<text id="text112" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3904,265.0192)" xml:space="preserve"><tspan id="tspan110" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 89.040604 100.3464 113.3022 126.258 139.21381 152.1696 165.1254 178.08121 191.037 203.9928 216.94859 229.9044 242.8602 255.81599 267.1218" y="0">相关股东将承诺，于合约安排仍然生效的期间内，</tspan></text>
<text id="text116" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3904,233.0191)" xml:space="preserve"><tspan id="tspan114" x="0 3.9688001 6.7165999 10.6854 28.347 32.4687 39.0434" y="0">(i) (a)</tspan></text>
<text id="text124" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,157.7787,233.0191)" xml:space="preserve"><tspan id="tspan118" x="0 13.1329 26.2658 39.398701 52.531601 65.664497 78.797401 91.930298 105.0632 118.1961 131.32899 144.4619 157.5948 170.72771 183.8606 196.9935 210.1264 223.25929 236.3922 249.5251 262.65799 275.79089 288.9238 302.0567 315.18961 328.32251 341.45541" y="0">彼等不会与任何第三方签订任何与北京泡泡玛特或葩趣互娱所</tspan><tspan id="tspan120" x="-16.0424 -2.8017001 10.439 23.679701 36.920399 50.161098 63.401798 76.642502 89.883202 103.1239 116.3646 129.6053 142.84599 156.0867 169.32739 182.5681 195.80881 209.0495 222.29021 235.5309 248.77161 262.0123 275.25299 288.49371 301.73441 314.9751 328.21579 341.45651" y="15.9995">订立任何协议具有利益冲突的文件或向任何第三方作出任何与北</tspan><tspan id="tspan122" x="-16.0424 -2.7808001 10.4808 23.742399 37.004002 50.265598 63.527199 76.788803 90.0504 103.312 116.5736 129.83521 143.0968 156.3584 169.62 182.88161 196.1432 209.4048 222.6664 235.92799 249.18961 262.4512 275.7128 288.9744 302.23599 315.49759 326.80341" y="31.999001">京泡泡玛特或葩趣互娱所订立任何协议具有利益冲突的承诺，</tspan></text>

9 218.2323 231.3927 244.5531 255.8589 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="63.998001">财产为其自身债务及亏损负责。根据中国法律法规，本公司或北京泡泡玛特</tspan><tspan id="tspan108" x="-28.347 -15.6706 -2.9942 9.6822004 22.358601 35.035 47.711399 60.387798 73.064201 85.740601 98.417 111.0934 123.7698 136.4462 149.1226 161.799 174.4754 187.15179 199.8282 212.50459 225.181 237.85741 250.5338 263.21021 275.8866 288.56299 301.23941 313.9158 325.22159 336.5274 349.2038 361.88019 374.55661 385.8613" y="79.997498">并无明确被要求分担葩趣互娱的亏损或向葩趣互娱提供财务支持。尽管如此，</tspan><tspan id="tspan110" x="-28.347 -15.3142 -2.2814 10.7514 23.784201 36.817001 49.8498 62.882599 75.915398 88.948196 95.631798 107.0278 120.0606 133.0934 146.12621 159.159 172.1918 185.22459 198.2574 211.29021 224.323 237.3558 250.3886 263.42139 276.45419 289.487 300.883 307.6546 320.68741 333.72021 346.75299 359.7858 372.8186 385.85141" y="95.997002">鉴于我们透过葩趣互娱（该公司持有必要的中国执照及批准）在中国开展相关</tspan><tspan id="tspan112" x="-28.347 -15.2977 -3.9919 7.4239001 20.4732 33.522499 46.5718 59.621101 72.670403 85.719704 98.768997 111.8183 124.8676 137.9169 150.9662 164.0155 177.0648 190.11411 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="111.9965">业务，且葩趣互娱的经营业绩与资产及负债根据适用会计原则综合入账至我</tspan><tspan id="tspan114" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 51.321602 64.599701 77.8778 91.155899 104.434 117.7121 129.0179 140.7032 153.98129 167.2594 180.53751 193.8156 207.0937 220.3718 233.6499 246.92799 260.20609 273.48419 284.79001 296.47421 309.75229 323.0304 336.3085 349.58661 362.86469 374.1705 385.8558" y="127.996">们的经营业绩与资产及负债，倘葩趣互娱遭受任何损失，则我们的业务、财</tspan><tspan id="tspan116" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 177.29581" y="143.9955">务状况及经营业绩将会受到不利影响。</tspan></text>

9104 205.0708 216.3766 227.92329 241.08369 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="63.998001">国法律顾问认为，合约安排乃经过严谨设计，以尽量减少与相关中国法律法</tspan><tspan id="tspan40" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 47.737801" y="79.997498">规的潜在冲突。</tspan><tspan id="tspan42" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 153.8196" y="111.9976">我们的中国法律顾问亦认为：</tspan></text>

064 26.0128 39.019199 52.0256 65.031998 78.038399 91.0448 104.0512 117.0576 130.064 143.0704 156.0768 169.08321 180.38901 191.75529 204.7617 216.0675 227.43381 240.4402 253.44659 266.453 279.45941 292.46579 305.4722 318.47861 331.48499 344.49139 357.4978" y="79.997498">不能直接颁布临时或最终清盘令。此外，由香港及开曼群岛等境外</tspan><tspan id="tspan126" x="0 13.2407 26.4814 39.722099 52.962799 66.203499 79.444199 92.684898 105.9256 119.1663 132.407 145.64771 158.8884 172.1291 185.3698 198.6105 211.8512 225.0919 238.3326 251.5733 264.814 278.05469 291.29541 304.5361 317.77679 331.01749 344.25821 357.4989" y="95.997002">法院授予的临时救济措施或强制执行令未必能在中国得到认可或</tspan><tspan id="tspan128" x="0 12.9558 25.9116 38.867401 50.173199 61.477901" y="111.9965">强制执行；及</tspan></text>

<text id="text158" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,102.7402,473.0182)" xml:space="preserve"><tspan id="tspan156" x="0 12.8887 25.777399 38.6661 51.554798 64.443497 77.332199 90.220901 103.1096 115.9983 128.88699 140.19279 151.4975" y="0">以合法形式掩盖非法目的；或</tspan></text>
<text id="text162" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,266.7557,473.0182)" xml:space="preserve"><tspan id="tspan160" x="0 3.9688001 9.7746" y="0">(v)</tspan></text>
<text id="text172" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,281.708,473.0182)" xml:space="preserve"><tspan id="tspan164" x="0 12.8887 25.777399 38.6661 51.554798 64.443497 77.332199 90.220901 103.1096 115.9983 128.88699 141.7757 154.6644 167.5531 180.4418 193.33051 206.21919 217.5239" y="0">合约违反法律及行政法规的强制性规定。</tspan><tspan id="tspan166" x="-196.66789 -183.61861 -170.56931 -157.52 -144.4707 -131.4214 -118.3721 -105.3228 -92.273499 -79.224197 -66.174896 -54.869099 -43.4533 -30.403999 -17.3547 -4.3053999 8.7439003 21.7932 34.842499 47.8918 60.941101 73.990402 87.039703 100.089 113.1383 126.1876 139.23689 152.28619 165.33549 178.3848 191.4341 204.4834 217.5327" y="15.9995">我们的中国法律顾问认为，我们的合约安排的相关条款并不属于任何上述五</tspan><tspan id="tspan168" x="-196.66789 -183.6241 -170.58031 -159.27451 -147.8653 -134.8215 -121.7777 -110.4719 -99.062698 -86.018898 -72.975098 -59.931301 -46.887501 -33.8437 -20.7999 -7.7561002 5.2877002 18.331499 31.375299 42.681099 54.090302 67.134102 80.177902 93.221703 106.2655 119.3093 132.3531 145.3969 158.4407 171.4845 180.0403 191.44949 204.4933 217.53709" y="31.999001">种情形。尤其是，我们的中国法律顾问认为，合约安排将不会被视为「以合法</tspan><tspan id="tspan170" x="-196.66789 -184.2027 -171.7375 -159.27229 -146.8071 -134.3419 -121.8767 -109.4115 -98.106796 -92.302101 -80.995201 -68.529999 -56.0648 -43.599602 -31.134399 -25.330799 -14.025 -1.5598 10.9054 23.3706 35.8358 48.300999 60.766201 73.2314 85.696602 98.161797 109.4665 115.2723" y="47.998501">形式掩盖非法目的」，故亦不属于《中华人民共和国合同法》第</tspan></text>
<text id="text176" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,408.4346,425.0197)" xml:space="preserve"><tspan id="tspan174" x="0 6.4218001" y="0">52</tspan></text>

<text id="text194" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,418.4006,409.0202)" xml:space="preserve"><tspan id="tspan192" x="0 4.1216998 10.6964" y="0">(a)</tspan></text>
<text id="text202" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,434.4419,409.0202)" xml:space="preserve"><tspan id="tspan196" x="0 12.9591 25.9182 38.8773 51.836399 64.795502" y="0">使葩趣互娱将</tspan><tspan id="tspan198" x="-349.4007 -336.35141 -323.30209 -310.25281 -297.20349 -284.15421 -271.10489 -258.0556 -245.0063 -231.957 -218.9077 -205.8584 -192.8091 -179.7598 -166.71049 -155.40469 -143.99001 -130.9407 -117.8914 -104.8421 -91.792801 -78.7435 -65.694199 -52.644901 -39.5956 -26.546301 -13.497 -0.44769999 12.6016 25.6509 38.700199 51.7495 64.798798" y="15.9995">相关经济利益转让予北京泡泡玛特，作为委聘北京泡泡玛特为其独家服务供</tspan><tspan id="tspan200" x="-349.4007 -336.44159 -323.48251 -310.52341 -297.5643 -284.60519 -273.30051 -261.9903" y="31.999001">应商的服务费，及</tspan></text>

<text id="text216" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,284.1115,361.0217)" xml:space="preserve"><tspan id="tspan214" x="0" y="0">4</tspan></text>
<text id="text230" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,291.9094,361.0217)" xml:space="preserve"><tspan id="tspan218" x="0 6.3326998 17.6374 23.443199 34.749001 47.7048 60.660599 73.616402 86.572197 99.528 112.4838 125.4396 138.3954 151.3512 162.657 168.4606 181.4164 194.37219 207.328" y="0">条（为《中华人民共和国合同法》第一部分</tspan><tspan id="tspan220" x="-206.86929 -193.7562 -180.6431 -167.53 -154.4169 -141.3038 -129.998 -118.5074 -105.3943 -99.586304 -88.095703 -74.982597 -61.869499 -48.756401 -35.643299 -22.530199 -9.4171 3.6960001 16.809099 29.922199 41.413898 47.4067 60.519798 73.632896 86.746002 99.8591 111.3508 117.1577 128.6483 141.7614 154.8745 167.98759 181.10069 194.21381 207.3269" y="15.9995">总则中的一条，列载《中华人民共和国合同法》的基本原则），合约安排的订约</tspan><tspan id="tspan222" x="-206.86819 -193.70779 -180.54739 -167.38699 -154.22659 -141.06619 -127.9058 -114.7454 -101.585 -88.424599 -75.264198 -62.103802 -48.943401 -35.783001 -22.622601 -11.3168 0.2299 13.3903 26.550699 39.711102 52.871498 66.031898 79.192299 92.352699 105.5131 118.6735 131.83389 144.99429 158.15469 171.31509 184.47549 195.7813 207.3269" y="31.999001">方有权按照彼等本身意愿订立合约，且任何人士不得非法干预该等权利。此</tspan><tspan id="tspan224" x="-206.86819 -195.56239 -184.14661 -171.09731 -158.048 -144.9987 -131.9494 -118.9001 -105.8508 -92.801498 -79.752197 -66.702904 -53.653599 -40.604301 -27.555 -14.5057 -1.4564 11.5929 24.6422 37.691502 50.740799 63.7901 76.839401 89.888702 102.938 115.9873 129.03661 142.08591 155.13519 168.18449 181.2338 194.2831 207.3324" y="47.998501">外，合约安排的效力为允许本公司于联交所上市并取得葩趣互娱的所有经济</tspan><tspan id="tspan226" x="-206.86819 -193.5901 -182.2843 -170.599 -157.32091 -144.0428 -130.76469 -117.4866 -104.2085 -90.930397 -77.652298 -66.346497 -54.6623 -41.384201 -28.1061 -14.828 -1.5499001 11.7282 25.0063 38.284401 51.5625 64.840599 78.118698 91.396797 104.6749 117.953 131.23109 144.5092 157.78729 171.0654 182.3723 194.0565 207.33459" y="63.998001">利益，此并非不正当目的，现时众多上市公司亦采取类似的合约安排。总结</tspan><tspan id="tspan228" x="-206.86819 -193.6913 -182.3855 -170.819 -157.64211 -144.46519 -131.2883 -118.1114 -104.9345 -91.757599 -78.580704 -72.7771 -61.210602 -48.033699 -34.8568 -21.679899 -8.5030003 4.6739001 17.8508 31.0277 44.204601 57.3815 68.946899 75.012299" y="79.997498">而言，合约安排并不属于《中华人民共和国合同法》第</tspan></text>

<text id="text88" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,178.6996,617.0126)" xml:space="preserve"><tspan id="tspan86" x="0 12.9558 25.9116 37.216301 43.022099 54.328999 67.284798 80.240601 93.196404 106.1522 117.458 123.2616 136.21741 149.1732 162.129 175.08479 188.0406 200.9964 213.95219 226.908 239.8638 251.1696" y="0">日生效。《外商投资法》规定若干外商投资形式：</tspan></text>
<text id="text92" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3838,585.0125)" xml:space="preserve"><tspan id="tspan90" x="0 4.1557999" y="0">• </tspan></text>
<text id="text96" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,141.7297,585.0125)" xml:space="preserve"><tspan id="tspan94" x="0 12.4619 24.9238 37.3857 49.847599 62.309502 74.7714 87.233299 99.695198 112.1571 124.619 137.0809 149.5428 162.0047 174.4666 186.9285 199.3904 211.85229 224.31419 236.77609 249.23801 261.69989 274.1618 286.62369 299.0856 311.54749 324.0094 336.47131 348.9332 360.23901" y="0">外国投资者于中国境内单独或与其他投资者共同设立外商投资企业；</tspan></text>
<text id="text100" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3838,553.0124)" xml:space="preserve"><tspan id="tspan98" x="0 4.1557999" y="0">• </tspan></text>
<text id="text104" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,141.7297,553.0124)" xml:space="preserve"><tspan id="tspan102" x="0 12.6555 25.311001 37.966499 50.622002 63.2775 75.932999 88.588501 101.244 113.8995 126.555 139.21049 151.866 164.5215 177.177 189.8325 201.1394 212.44411 225.09959 236.4054 247.7112 260.3667 273.02219 285.6777 298.33319 310.98871 323.6442 336.29971 348.9552 360.25989" y="0">外国投资者购买任何境内企业的股份、股权、财产或其他类似权益；</tspan></text>
<text id="text108" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3838,521.0123)" xml:space="preserve"><tspan id="tspan106" x="0 4.1557999" y="0">• </tspan></text>
<text id="text112" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,141.7297,521.0123)" xml:space="preserve"><tspan id="tspan110" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 207.2928 220.2486 233.20441 246.1602 259.116 272.07181 285.02759 296.3334 307.63919" y="0">外国投资者单独或与其他投资者共同投资中国新项目；及</tspan></text>
<text id="text116" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3838,489.0122)" xml:space="preserve"><tspan id="tspan114" x="0 4.1557999" y="0">• </tspan></text>
<text id="text128" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,141.7297,489.0122)" xml:space="preserve"><tspan id="tspan118" x="0 13.376 26.752001 40.127998 53.504002 66.879997 80.255997 93.632004 107.008 118.3138 130.11349 143.4895 156.86549 170.2415 183.61749 196.9935 210.36951 223.7455 237.12151 250.4975 263.8735 277.24951 290.62549 304.0015 317.3775 330.75351 344.12949 357.50549" y="0">外国投资者根据法律、行政法规或国务院规定的条文透过任何其</tspan><tspan id="tspan120" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 89.041702" y="15.9995">他方式进行投资。</tspan><tspan id="tspan122" x="-33.845901 -22.2948 -9.1310997 4.0325999 17.196301 30.360001 41.91 47.9622 61.1259 74.289597 87.4533 100.617 113.7807 126.9444 140.10809 153.2718 166.4355 179.5992 192.76289 205.92661 219.0903 232.254 243.5598 249.3689 260.91891 274.08261 287.24631 300.41 313.5737 325.12479 331.1759 344.3396 357.5033" y="47.999599">《外商投资法》规定若干行业领域的外商投资限制。《外商投资法》所载的</tspan><tspan id="tspan124" x="-62.192902 -56.3871 -44.848099 -31.6943 -18.540501 -5.3867002 6.1522999 11.9592 20.748199 33.902 47.055801 60.209599 73.363403 86.517197 99.670998 112.8248 125.9786 139.1324 152.28619 165.44 178.5938 191.7476 204.9014 218.05521 226.61099 238.14999 251.3038 264.45761 277.61139 290.7652 303.91901 315.45801 324.24701 332.8028 344.3418 357.49561" y="63.9991">「《负面清单》」分别将相关禁止及受限制行业分类为「禁止实施目录」及「限制</tspan><tspan id="tspan126" x="-56.692902 -43.737099 -30.7813 -17.8255 -6.5197001 -0.71499997" y="79.998596">实施目录」：</tspan></text>
<text id="text132" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3827,377.0135)" xml:space="preserve"><tspan id="tspan130" x="0 4.1557999" y="0">• </tspan></text>
<text id="text136" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,141.7286,377.0135)" xml:space="preserve"><tspan id="tspan134" x="0 12.4454 24.8908 37.336201 49.781601 62.227001 73.532799" y="0">禁止实施目录：</tspan></text>
<text id="text140" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,226.5683,377.0135)" xml:space="preserve"><tspan id="tspan138" x="0 12.4454 24.8908 37.336201 49.781601 62.227001 74.672401 87.117798 99.563202 112.0086 124.454 136.8994 149.3448 161.79021 174.2356 186.681 199.1264 211.57179 224.0172 236.4626 248.908 261.35339 272.65921" y="0">外国投资者不得投资禁止实施目录列明的任何领域。</tspan></text>
<text id="text144" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3827,345.0134)" xml:space="preserve"><tspan id="tspan142" x="0 4.1557999" y="0">• </tspan></text>

<text id="text168" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,229.0576,345.0134)" xml:space="preserve"><tspan id="tspan150" x="0 12.9437 25.8874 38.8311 51.774799 64.718498 77.662201 90.605904 103.5496 116.4933 129.437 142.38071 155.3244 168.2681 181.21181 194.1555 207.0992 220.04289 232.9866 245.9303 258.87399 270.17871" y="0">外国投资者如符合若干条件并在投资前申请许可，</tspan><tspan id="tspan152" x="-87.329002 -74.373199 -61.4174 -48.461601 -35.505798 -22.549999 -9.5942001 3.3615999 16.3174 29.273199 42.229 55.184799 68.140602 81.096397 94.0522 105.3591" y="15.9995">则可投资限制实施目录列明的领域。</tspan><tspan id="tspan154" x="-115.6749 -102.6014 -91.295601 -85.489799 -74.045403 -60.971901 -47.898399 -34.824902 -21.7514 -10.3081 -4.3648 8.7087002 21.7822 34.855701 47.929199 61.002701 74.076202 87.149696 100.2232 113.2967 126.3702 139.4437 152.5172 165.5907 178.6642 191.7377 204.8112 217.8847 230.95821 244.03169 257.10519 270.17871" y="47.999599">然而，《外商投资法》并无指明限制实施目录及禁止实施目录所包括的业</tspan><tspan id="tspan156" x="-144.0219 -132.71609" y="63.9991">务。</tspan><tspan id="tspan158" x="-115.6749 -102.586 -89.497101 -76.408203 -63.319302 -50.2304 -37.141499 -24.052601 -10.9637 2.1252 15.2141 28.302999 41.391899 54.480801 67.569702 80.6586 93.747498 106.8364 119.9253 133.01421 146.1031 159.192 172.2809 185.3698 198.45869 209.7645 221.2265 234.3154 245.6212 257.08319 270.17209" y="95.999199">如任何外国投资者直接或者间接持有任何境内企业的股份、股权、财产</tspan><tspan id="tspan160" x="-144.0219 -130.8615 -117.7011 -104.5407 -91.380302 -80.074501 -68.5289 -55.3685 -42.208099 -29.047701 -15.8873 -2.7269001 10.4335 23.593901 36.754299 49.9147 63.0751 76.235497 89.395897 102.5563 115.7167 128.87711 142.03751 155.19791 168.35831 181.51871 194.67909 207.83949 219.14529 230.692 243.8524 257.01279 270.17319" y="111.9987">或其他权益，该境内企业不得投资禁止实施目录列明的任何领域。外国投资</tspan><tspan id="tspan162" x="-144.0219 -130.8615 -117.7011 -104.5407 -91.380302 -78.219902 -65.059502 -51.899101 -38.738701 -25.5783 -12.4179 0.74250001 13.9029 27.063299 40.223701 53.384102 64.691002 76.236603 89.397003 102.5574 115.7178 128.8782 142.0386 155.19901 168.35941 179.66521 191.2119 204.3723 217.5327 230.6931 243.8535 257.01389 270.17429" y="127.9982">者获准投资限制实施目录列明的领域，惟须符合若干条件。外国投资者可投</tspan><tspan id="tspan164" x="-144.0219 -135.46609 -129.66029 -118.0905 -104.9103 -91.730103 -78.549896 -66.980103 -61.1754 -52.355598 -39.1754 -25.995199 -12.815 0.36520001 13.5454 26.725599 38.031399 49.6012 62.781399 75.961601 89.1418 102.322 115.5022 128.6824 141.86259 155.0428 168.22301 181.4032 194.5834 207.7636 220.9438 234.12399 245.42979 256.9985 270.17871" y="143.9977">资「《负面清单》」以外的任何领域，且应按与境内投资相同的基准管理，除非</tspan><tspan id="tspan166" x="-144.0219 -131.0661 -118.1103 -105.1545 -92.1987 -79.242897 -66.287102 -53.331299 -40.3755 -27.419701 -14.4639 -3.1580999" y="159.99719">法律及行政法规另有规定。</tspan></text>

<text id="text62" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 244.80721 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">倘外国投资者投资禁止实施目录列明的领域，有关主管部门应当责令其</tspan><tspan id="tspan28" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 49.3493 61.033501 74.3116 87.589699 100.8678 114.1459 127.424 140.7021 153.98019 167.2583 178.5641 190.2494 203.5275 216.8056 230.08369 243.3618 256.63989 269.918 283.19611 296.47421 309.75229 323.0304 334.33621 346.02151 359.29959 372.5777 385.8558" y="15.9995">停止投资活动，并限期出售该等股份、财产或采取其他必要措施，以恢复到</tspan><tspan id="tspan30" x="-28.347 -15.1206 -1.8942 11.3322 24.558599 37.785 49.090801 60.715599 73.942001 87.168404 100.3948 113.6212 126.8476 140.07401 146.7653 158.39011 171.6176 183.2424 189.0471 200.673 213.8994 227.12691 240.3544 253.58189 266.80939 280.0369 293.2644 306.49191 319.71939 332.9469 346.17441 359.40189 372.62939 385.8569" y="31.999001">投资前的状况，并没收违法收入（如有）。倘外国投资者的投资活动违反限制</tspan><tspan id="tspan32" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 178.6983 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="47.998501">实施目录规定的限制性特别管理措施，有关主管部门应当责令其限期改正并</tspan><tspan id="tspan34" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 49.3493 61.033501 74.3116 87.589699 100.8678 114.1459 127.424 140.7021 153.98019 167.2583 180.53641 193.8145 207.09261 220.3707 233.6488 244.9557 256.64099 269.9191 283.1972 296.47531 309.75339 323.03149 336.3096 349.58771 360.89349 372.5777 385.8558" y="63.998001">采取必要措施，以满足准入特别管理措施的要求；倘违法者拒绝改正，则须</tspan><tspan id="tspan36" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 112.5168" y="79.997498">按照前一句规定施以处罚。</tspan><tspan id="tspan38" x="0 12.9899 24.2957 30.100401 41.445801 54.435699 67.425598 80.415497 93.405403 104.7508 110.594 123.5839 136.57381 149.56371 162.5536 175.5435 188.5334 201.5233 214.5132 227.5031 240.493 253.48289 266.47281 279.46271 292.45261 305.4425 318.4324 329.73929 335.53629 346.88171 359.87161 372.86151 385.85141" y="111.9976">此外，《外商投资法》并无明确规定我们经营所在行业的规则。《外商投资</tspan><tspan id="tspan40" x="-28.347 -17.041201 -11.2354 1.2881 13.8116 26.3351 38.858601 51.382099 63.905602 76.4291 88.952599 101.4761 113.9996 126.5231 139.0466 151.5701 164.0936 176.6171 189.14059 201.66409 214.18761 225.49229 236.7981 249.32159 261.84509 274.36859 286.89209 299.41559 311.93909 324.46259 336.98611 349.50961 362.03311 374.55661 385.8624" y="127.9971">法》并无明确规定合约安排为一种外商投资形式。我们的中国法律顾问已告知，</tspan><tspan id="tspan42" x="-28.347 -15.0392 -1.7314 11.5764 17.3811 29.1005 42.408298 55.716099 69.023903 82.331703 94.051102 100.2683 113.5761 126.8839 140.1917 153.4995 166.8073 180.1151 193.4229 206.7307 220.0385 231.3454 243.0648 256.37259 269.68039 282.98819 296.29599 309.60379 322.91159 334.21741 345.9368 359.2446 372.5524 385.8602" y="143.9966">由于根据《外商投资法》合约安排不被列作投资，且倘未来的法律、行政法规</tspan><tspan id="tspan44" x="-28.3459 -15.2966 -2.2472999 10.802 23.851299 36.9006 49.949902 62.999199 76.0485 89.097801 102.1471 115.1964 128.2457 141.295 154.3443 167.3936 180.4429 193.4922 206.5415 219.59081 232.64011 245.68941 258.73871 271.78799 284.83731 296.142 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="159.99609">或国务院的规定并未纳入合约安排为外商投资的一种形式，我们的合约安排</tspan><tspan id="tspan46" x="-28.3459 -15.3901 -2.4342999 10.5215 23.477301 36.433102 49.388901 62.3447 75.300499 88.256302 101.2121 114.1679 127.1237 140.0795 153.03529 165.9911 178.9469 191.90269 204.85851 217.8143 229.1212" y="175.99561">整体及组成合约安排的各协议均不会受到影响。</tspan><tspan id="tspan48" x="0.0011 13.3177 26.6343 39.950901 53.267502 66.584099 79.900703 91.205399 97.013397 108.7449 122.0615 135.3781 148.6947 162.01131 173.7428 179.9743 193.29089 204.59669 216.3282 229.64481 242.9614 256.27802 269.5946 282.91119 296.22781 309.5444 322.86099 334.16571 345.89719 359.21381 372.5304 385.84698" y="207.9957">尽管有上述规定，《外商投资法》规定，外国投资者透过法律、行政法规</tspan><tspan id="tspan50" x="-28.344801 -15.6684 -2.9920001 9.6843996 22.3608 35.037201 47.7136 60.389999 73.066399 85.742798 98.419197 111.0956 123.772 136.44839 149.1248 161.80119 174.4776 187.15401 199.8304 212.50681 225.1832 237.8596 250.536 263.2124 275.88879 288.56519 301.24161 313.918 326.59439 339.27081 350.5766 361.88239 374.55881 385.86349" y="223.99519">或国务院规定的任何其他方式进行投资可被视为外商投资的一种形式。因此，</tspan><tspan id="tspan52" x="-28.344801 -15.2955 -2.2462001 10.8031 22.1089 33.523602 46.572899 59.6222 72.671501 85.720802 98.770103 111.8194 124.8687 137.918 150.9673 164.0166 177.0659 190.1152 203.16451 216.21381 229.26311 242.31239 255.36169 268.41101 281.4603 294.50961 307.5589 320.60818 333.6575 346.70679 359.7561 372.80539 385.85471" y="239.99471">未来法律、行政法规或国务院的规定可能规定合约安排作为外商投资的一种</tspan><tspan id="tspan54" x="-28.344801 -15.3945 -4.0886998 7.2171001 20.1674 31.472099 42.777901 55.728199 68.678497 81.628799 94.579102 107.5294 120.4797 133.42999 146.38029 159.3306 170.6353 181.9411 194.8914 207.84171 220.79201 233.74229 246.6926 259.64291 272.5932 285.54349 298.4938 311.44409 324.39441 337.3447 350.29501 363.2453 374.55109 385.8558" y="255.9942">方式。然而，截至最后实际可行日期，有关合约安排的处理方法尚不确定。有</tspan><tspan id="tspan56" x="-28.344801 -15.3197 -2.2946 10.7305 23.7556 36.780701 45.336498 56.723701 69.748802 82.773903 95.799004 107.1862 118.5745 131.59959 144.62469 157.6498 170.6749 183.7 196.7251 209.7502 222.7753 235.8004 248.8255 261.85059 274.8757 286.26291 292.0643 303.45261 316.47769 329.50281 342.52789 355.55301 366.94019 372.82629 385.85141" y="271.99371">关详情请参阅「风险因素－与我们的合约安排有关的风险－《外商投资法》的诠</tspan><tspan id="tspan58" x="-28.344801 -15.2955 -2.2462001 10.8031 23.8524 36.901699 49.951 63.000301 76.049599 89.0989 102.1482 115.1975 128.2468 141.2961 154.3454 167.3947 180.444 193.4933 204.7991 216.2149 229.26421 242.31351 255.36279 268.41211 281.4614 294.51071 307.56 320.60931 333.6586 346.70789 359.7572 372.80649 385.8558" y="287.99319">释及实施及其可能对我们当前的公司架构、公司管治及业务营运的可行性造</tspan><tspan id="tspan60" x="-28.344801 -15.389 -2.4331999 10.5226 23.478399 36.4342 49.389999 62.345798 75.301598 88.257401 101.2132 114.169 125.4748 131.2784" y="303.99271">成的影响存在巨大不确定性」。</tspan></text>

<text id="text194" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,272.3925,297.0171)" xml:space="preserve"><tspan id="tspan182" x="0 13.3441 26.6882 40.032299 53.3764 66.720497 80.064598 93.408699 106.7528 120.0969 133.44099 146.7851 160.1292 173.4733 186.8174 200.1615 213.5056 226.8497" y="0">其将仅于收到详细申请材料并审查有关申</tspan><tspan id="tspan184" x="-187.3553 -174.39951 -161.4437 -148.4879 -135.5321 -122.5763 -109.6205 -96.664703 -83.7089 -70.753098 -57.797298 -44.841499 -31.8857 -18.929899 -5.9741001 6.9816999 19.9375 32.893299 45.849098 58.804901 71.760696 83.066498" y="15.9995">请的具体事实后方可最终厘定是否满足资质要求。</tspan><tspan id="tspan186" x="-159.0083 -146.036 -133.06371 -120.0914 -107.1191 -94.146797 -81.1745 -68.202202 -55.2299 -42.257599 -29.285299 -17.9795 -6.6550002 6.3172998 19.2896 32.261902 45.2342 58.206501 71.178802 84.1511 97.123398 110.0957 123.068 136.0403 149.0126 161.98489 174.9572 187.9295 200.90179 213.8741 226.84641" y="47.999599">我们的中国法律顾问认为，有关中国政府机关可能会认为我们已采取及</tspan><tspan id="tspan188" x="-187.3553 -174.306 -161.2567 -148.2074 -135.1581 -122.1088 -109.0595 -96.010201 -82.960899 -69.911598 -56.862301 -43.813 -30.7637 -17.714399 -6.4096999 5.0061002 18.055401 31.1047 44.153999 57.2033 70.252602 83.301903 96.351196 109.4005 122.4498 135.4991 148.5484 161.5977 174.647 187.6963 200.74561 213.79491 226.84419" y="63.9991">将采取的上述措施符合资质要求，原因是我们具有在海外市场提供增值电信</tspan><tspan id="tspan190" x="-187.3553 -174.1949 -161.0345 -147.8741 -134.7137 -123.4079 -111.8623 -98.701897 -85.541496 -72.381104 -59.220699 -46.060299 -32.899899 -19.7395 -6.5791001 6.5812998 19.741699 32.9021 46.0625 57.368301 68.915001 82.075401 95.235802 108.3962 121.5566 134.717 147.8774 161.0378 174.1982 187.3586 200.519 213.6794 226.8398" y="79.998596">业务的经验，符合适用中国法律法规的规定，惟须视乎北京市通信管理局酌</tspan><tspan id="tspan192" x="-187.3553 -174.39951 -161.4437 -148.4879 -135.5321 -122.5763 -109.6205 -96.664703 -83.7089 -70.753098 -57.797298 -44.841499 -31.8857 -18.929899 -5.9741001 6.9816999 18.2875" y="95.9981">情决定本集团是否符合资质要求而定。</tspan></text>
