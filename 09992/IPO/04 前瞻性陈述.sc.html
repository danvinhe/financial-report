<text id="text52" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 117.8001 130.88901 143.97791 157.0668 170.1557 183.2446 196.3335 207.6382 219.1013 232.1902 245.2791 258.36801 271.45691 284.54581 295.85159 307.3136 320.4025 333.49139 346.58029 359.66919 372.75809 385.84698" y="0">本招股章程中若干陈述为前瞻性陈述，因其性质使然，涉及重大风险及</tspan><tspan id="tspan28" x="-28.347 -15.1613 -1.9756 11.2101 24.3958 35.701599 47.278 60.463699 73.649399 86.835098 100.0208 113.2065 126.3922 139.5779 152.7636 165.9493 179.13499 190.4408 202.0172 215.2029 226.5087 238.0851 251.2708 262.5766 274.15302 287.33871 298.6445 310.22089 323.40659 334.7124 346.28989 359.47559 372.66129 385.84698" y="15.9995">不确定因素。任何表达或涉及讨论预期、相信、计划、目标、假设、未来事件</tspan><tspan id="tspan30" x="-28.347 -15.5639 -2.7808001 3.0260999 14.3308 27.113899 39.896999 52.680099 65.463203 78.2463 91.029404 103.8125 109.6216 120.9274 133.71049 145.0163 150.821 156.6268 167.9326 180.7157 192.0215 197.8273 203.6331 214.9389 227.722 239.0278 244.8336 250.6394 261.94519 274.7283 286.03409 291.8399 297.64569 308.95151 321.73459 333.04041 338.84619 344.65201 355.95779 368.74091 380.04669 385.85251" y="31.999001">或表现（一般会透过使用如「将会」、「预期」、「预计」、「估计」、「相信」、「今后」、</tspan><tspan id="tspan32" x="-33.844799 -22.503799 -9.5183001 1.8227 7.6273999 13.4332 24.7742 37.759701 49.1007 54.905399 60.711201 72.0522 85.037697 96.3787 102.1834 107.9892 119.3302 132.3157 143.65669 149.4614 155.2672 166.6082 179.5937 190.93469 196.7394 202.5452 213.8862 226.8717 238.21271 244.0174 249.8232 261.16422 274.14969 285.49069 291.29541 297.1012 308.4433 321.4288 332.7709 338.57449 344.38031 355.72131 368.70679 380.04779 385.85251" y="47.998501">「必须」、「或会」、「寻求」、「应该」、「有意」、「计划」、「预测」、「可能」、「愿景」、</tspan><tspan id="tspan34" x="-33.844799 -22.539 -9.5832005 1.7226 7.5272999 13.3331 24.638901 37.5947 48.900501 54.7052 60.511002 71.816803 84.772598 96.0784 101.8831 107.6889 118.9947 131.9505 143.2563 149.061 154.86681 166.17371 179.1295 190.4364 196.24001 202.04581 213.35049 226.3063 239.2621 250.5679 258.99609 267.42429 278.729 291.68481 302.9917 311.41989 324.3757 337.33151 348.6362 359.94199 372.8978 385.85361" y="63.998001">「目的」、「打算」、「力求」、「指标」、「目标」、「时间表」及「展望」等词汇，但非必</tspan><tspan id="tspan36" x="-28.344801 -15.3516 -2.3584001 8.9913998 15.7201 28.713301 41.706501 54.699699 67.692902 80.686096 93.679298 106.6725 119.6657 130.9715 142.32021 155.3134 168.30659 181.2998 194.293 207.28619 220.2794 233.2726 246.26579 259.259 272.2522 285.24539 298.23859 311.23181 324.22501 337.2182 350.2114 361.51721 372.86591 385.8591" y="79.997498">然如此）的陈述并非历史事实，而是具有前瞻性且可能涉及估计及假设，以及</tspan><tspan id="tspan38" x="-28.344801 -15.2295 -2.1142001 4.5704999 16.0644 29.179701 42.294998 55.410301 68.525597 81.6409 94.756203 107.8715 120.9868 134.1021 147.21741 160.3327 173.448 186.56329 199.6786 212.7939 225.90919 239.02451 252.1398 263.6337 269.43729 280.93121 294.04651 307.1618 320.2771 333.3924 346.50769 359.62299 372.73831 385.85361" y="95.997002">受风险（包括但不限于本招股章程所详述的风险因素）、不确定因素及其他因</tspan><tspan id="tspan40" x="-28.344801 -15.0667 -1.7886 9.5172005 21.202499 34.480598 47.758701 61.0368 74.314903 87.593002 100.8711 114.1492 127.4273 140.7054 153.98351 167.2616 180.5397 193.81779 207.0959 220.37399 233.6521 246.93021 260.20831 273.48639 284.79221 296.47641 309.75449 321.0603 332.74561 346.02371 359.30179 372.5799 385.858" y="111.9965">素影响，其中若干因素并非本公司所能控制及难以预料。因此，该等因素可</tspan><tspan id="tspan42" x="-28.344801 -15.389 -2.4331999 10.5226 23.478399 36.4342 49.389999 62.345798 75.301598 88.257401 101.2132 114.169 127.1248 140.0806 153.03641 165.9922 178.948 191.90379 204.8596 217.8154 230.77119 243.72701 256.6828 269.63861 280.9444" y="127.996">能导致实际业绩或结果与前瞻性陈述所述者有重大差异。</tspan><tspan id="tspan44" x="0.0022 12.9745 25.9468 38.919102 51.891399 64.863701 77.835999 90.808296 103.7806 116.7529 129.7252 142.69749 155.6698 168.64211 181.6144 194.5867 207.55901 220.5313 233.5036 246.47591 259.44821 272.4205 285.39279 296.69861 308.0231 320.99539 333.96771 346.94 359.91229 372.88461 385.8569" y="159.99609">我们的前瞻性陈述乃依据有关未来事件的假设及因素，有关假设及因素</tspan><tspan id="tspan46" x="-28.344801 -15.2955 -2.2462001 10.8031 23.8524 36.901699 49.951 63.000301 76.049599 87.354301 98.770103 111.8194 124.8687 137.918 150.9673 164.0166 177.0659 190.1152 203.16451 216.21381 229.26311 242.31239 255.36169 268.41101 281.4603 294.50961 307.5589 320.60818 333.6575 346.70679 359.7561 372.80539 385.85471" y="175.99561">可能被证实为不正确。该等假设及因素乃基于我们现时所获关于所经营业务</tspan><tspan id="tspan48" x="-28.344801 -15.3505 -2.3562 8.9496002 20.300501 33.2948 46.289101 59.283401 72.277702 85.272003 98.266296 111.2606 124.2549 137.24921 150.2435 161.5493 172.90021 185.8945 198.88879 211.8831 224.8774 237.8717 250.866 263.86029 276.85461 289.84891 296.5347 307.88559 320.87991 333.87421 346.8685 359.86279 372.85709 385.85141" y="191.9951">的资料。可能影响实际业绩的风险、不确定因素及其他因素（其中多项非我们</tspan><tspan id="tspan50" x="-28.344801 -15.389 -2.4331999 10.5226 21.8284 28.5131 41.468899 54.424702 67.380501 80.336304 93.292099 104.5979" y="207.9946">所能控制）包括但不限于：</tspan></text>
