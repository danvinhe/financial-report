<text id="text116" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,489.0127)" xml:space="preserve"><tspan id="tspan86" x="0 13.3056 26.6112 39.916801 53.222401 66.528 79.833603 93.139198 106.4448 119.7504 133.056 146.3616 159.66721 172.97279 186.2784 199.584 212.8896 226.19521 239.50079 252.8064 266.112 279.4176 292.72321 306.02881 319.33441 332.64001 345.94559 359.25119 372.55679 385.8624" y="0">国际发售将包括选择性地向机构及专业投资者以及预期对发售股份有</tspan><tspan id="tspan88" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 178.6983 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="15.9995">大量需求的其他投资者推广发售股份。专业投资者一般包括日常业务涉及买</tspan><tspan id="tspan90" x="-28.347 -15.0964 -1.8458 11.4048 24.655399 37.905998 51.156601 64.407204 77.657799 90.908401 104.159 115.4648 127.1182 140.3688 153.6194 164.9252 176.5775 189.82809 196.50841 208.1618 221.4124 234.66299 247.9136 261.16422 274.41479 286.06711 293.0972 306.34781 319.59839 332.849 346.09961 359.35019 372.6008 385.85141" y="31.999001">卖股份及其他证券的经纪、证券商、公司（包括基金经理）及定期投资于股份</tspan><tspan id="tspan92" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 101.4024 112.9491 126.1095 139.2699 152.4303 165.5907 176.8965 188.44321 201.60361 214.76401 227.92439 241.08479 254.24519 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="47.998501">及其他证券的公司实体。有意的专业、机构及其他投资者须指明其准备根据</tspan><tspan id="tspan94" x="-28.347 -15.0964 -1.8458 11.4048 24.655399 37.905998 51.156601 64.407204 77.657799 90.908401 104.159 117.4096 130.6602 143.9108 157.16141 170.412 183.6626 196.91319 210.1638 223.4144 236.66499 249.9156 263.1662 274.47198 286.1254 299.37601 312.62659 325.8772 339.12781 347.68359 359.33701 372.58759 385.8382" y="63.998001">国际发售以不同价格或特定价格购买的发售股份数目。该过程称为「累计投</tspan><tspan id="tspan96" x="-28.347 -17.041201 -11.2354 0.0704 13.0262 25.982 38.937801 51.8936 64.849403 77.805199 90.761002 103.7168 115.0226" y="79.997498">标」，其预期持续至定价日。</tspan><tspan id="tspan98" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 259.44601 272.4183 285.39059 298.36292 311.33521 324.3075 337.27979 350.25211 363.2244 374.53021 385.85471" y="111.9976">根据国际发售分配发售股份将取决于联席全球协调人以及多项因素，包</tspan><tspan id="tspan100" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 75.081596 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 323.5155 336.6759 349.8363 362.9967 374.30249 385.84811" y="127.9971">括需求程度及时间、有关投资者于有关行业的投资资产或股本资产总额，以</tspan><tspan id="tspan102" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 335.28989 346.70569 359.755 372.80429 385.85361" y="143.9966">及预期有关投资者于股份在联交所上市后会否持有或出售其股份。此分配旨</tspan><tspan id="tspan104" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 337.03339 350.0827 363.13199 374.43781 385.85251" y="159.99609">在为国际发售项下的发售股份分配建立一个稳固的专业及机构股东基础，以</tspan><tspan id="tspan106" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 164.34" y="175.99561">符合我们及我们的股东的整体利益。</tspan><tspan id="tspan108" x="0 12.958 25.916 38.874001 51.832001 64.790001 77.748001 84.431602 95.739601 108.6976 121.6556 134.6136 147.57159 158.88071 165.5676 178.5256 191.4836 204.4416 217.3996 230.3576 243.3156 256.27359 269.2316 282.18961 295.14761 308.10559 321.0636 334.02161 346.97961 359.93759 372.8956 385.85361" y="207.9957">联席全球协调人（代表包销商）可能要求任何已根据国际发售获发售发售</tspan><tspan id="tspan110" x="-28.347 -15.4033 -2.4596 10.4841 23.427799 36.371498 49.315201 62.2589 75.202599 88.146301 101.09 114.0337 126.9774 139.9211 152.86481 165.8085 178.7522 191.69591 204.6396 217.5833 230.52699 243.4707 256.4144 269.35809 282.30179 295.24551 308.18921 321.1329 334.0766 347.02029 359.96399 372.90771 385.85141" y="223.99519">股份以及已根据香港公开发售作出申请的投资者向联席全球协调人提供足够</tspan><tspan id="tspan112" x="-28.347 -15.1866 -3.8819001 7.6648002 20.825199 33.9856 47.146 60.3064 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 244.552 257.7124 270.8728 284.0332 297.1936 308.49939 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="239.99471">资料，以令彼等得以识别根据香港公开发售作出的有关申请，并确保其将在</tspan><tspan id="tspan114" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 178.9458 191.9016 204.85741 217.8132 230.769 243.72479 255.03059" y="255.9942">根据香港公开发售作出的任何发售股份申请中剔除。</tspan></text>

<text id="text120" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,377.012)" xml:space="preserve"><tspan id="tspan96" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 259.44601 272.4183 285.39059 298.36292 311.33521 324.3075 337.27979 350.25211 361.55789 372.88351 385.8558" y="0">稳定价格行动乃包销商在若干市场为促进证券经销而采取的做法。包销</tspan><tspan id="tspan98" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 217.84621 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="15.9995">商可于指定期间在第二市场竞投或购买证券，减慢并在可行的情况下阻止证</tspan><tspan id="tspan100" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 180.36591 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 321.66089 333.20651 346.36691 359.52731 372.68771 385.84811" y="31.999001">券的首次公开市价下跌至发售价以下，以达到稳定价格的目的。该等交易可</tspan><tspan id="tspan102" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 204.79691 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="47.998501">在容许进行有关行动的所有司法权区进行，惟任何行动均须遵照所有适用法</tspan><tspan id="tspan104" x="-28.347 -15.1206 -1.8942 11.3322 24.558599 37.785 44.474098 56.0989 69.326401 82.553902 95.781403 109.0089 122.2364 135.4639 148.69141 161.9189 175.14639 188.3739 199.9987 205.799 217.4238 230.65131 243.8788 255.1846 266.80939 280.0358 293.26331 306.49081 319.71829 332.9458 346.17331 359.40079 372.6283 385.8558" y="63.998001">律及监管规定（包括香港法例及监管规定）。在香港，据以进行稳定价格行动</tspan><tspan id="tspan106" x="-28.3459 -15.3901 -2.4342999 10.5215 23.477301 36.433102 49.388901 62.3447 75.300499 88.256302 99.562103" y="79.997498">的价格不得超逾发售价。</tspan><tspan id="tspan108" x="0.0011 12.9734 25.9457 38.917999 51.890301 64.862602 77.8349 89.140701 100.4652 113.4375 126.4098 139.3821 152.3544 165.32671 178.299 191.2713 204.24361 217.2159 230.1882 243.16051 256.13281 269.1051 282.07739 295.04971 308.022 320.99429 333.96661 346.9389 359.91119 372.88351 385.8558" y="111.9976">就全球发售而言，稳定价格操作人或代其行事的任何人士可代表包销商</tspan><tspan id="tspan110" x="-28.3459 -15.2966 -2.2472999 10.802 23.851299 36.9006 49.949902 62.999199 76.0485 89.097801 102.1471 113.4529 124.8687 137.918 150.9673 164.0166 177.0659 190.1152 203.16451 216.21381 229.26311 242.31239 255.36169 268.41101 281.4603 294.50961 307.5589 320.60818 333.6575 346.70679 359.7561 372.80539 385.85471" y="127.9971">超额分配股份或进行交易，以于上市日期后一段有限期间内稳定或维持股份</tspan><tspan id="tspan112" x="-28.3459 -15.1855 -2.0251 11.1353 24.2957 37.4561 50.616501 63.776901 76.937302 88.244202 99.789803 112.9502 124.256 135.8027 148.9631 162.1235 175.28391 188.44431 201.60471 214.76511 227.92551 241.08591 254.24631 267.40671 280.56711 293.72751 306.88791 320.04831 333.20871 346.36911 359.52951 372.68991 385.85031" y="143.9966">市价高于原有的水准。然而，稳定价格操作人或代其行事的任何人士并无进</tspan><tspan id="tspan114" x="-28.3459 -15.1855 -2.0251 11.1353 24.2957 37.4561 50.616501 63.776901 76.937302 90.097702 101.4035 112.9502 126.1106 139.271 152.4314 165.5918 178.7522 191.9126 205.073 218.2334 231.3938 244.5542 255.86 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="159.99609">行稳定价格行动的责任。倘进行该等稳定价格行动，则该等稳定价格行动将</tspan><tspan id="tspan116" x="-28.3459 -15.2966 -2.2472999 10.802 23.851299 36.9006 49.949902 62.999199 76.0485 89.097801 102.1471 115.1964 128.2457 141.295 154.3443 167.3936 180.4429 193.4922 206.5415 219.59081 232.64011 245.68941 258.73871 271.78799 284.83731 297.8866 310.93591 323.9852 337.03448 350.0838 361.38849 372.80429 385.85361" y="175.99561">由稳定价格操作人或代其行事的任何人士全权酌情进行并可随时终止，惟须</tspan><tspan id="tspan118" x="-28.3459 -15.224 -2.1020999 11.0198 24.141701 37.263599 50.385502 63.507401 76.629303 89.751198 102.8731 115.995 129.1169 142.2388 155.3607 168.4826 181.60451" y="191.9951">于递交香港公开发售申请截止日期起计</tspan></text>
