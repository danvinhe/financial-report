         y="0"
         id="tspan44">本节及本招股章程其他章节所载资料及统计数据乃摘录自不同政府</tspan><tspan
         x="-24.907894 -11.075995 2.7559025 16.587801 28.292416 40.491268 54.32317 68.155067 81.986961 95.818863 109.65076 123.48266 137.31456 151.14645 164.97835 178.81026 192.64215 206.47404 220.30594 234.13785 247.96974 261.80164 275.63354 289.46542 303.29733 317.12924 330.96112 344.79303 358.62494 372.45682 386.28873"
         y="16.563887"
         id="tspan46">官方刊物、可供查阅的公开市场调查资料来源及其他独立供应商的资料</tspan><tspan
         x="-20.469978 -6.8590088 4.8456059 16.783674 30.394646 42.099258 54.037327 67.6483 81.25927 94.870239 108.48121 122.09218 135.70316 149.31412 162.92509 176.53606 190.14703 203.758 217.36897 230.97993 244.59091 258.20187 271.81287 285.42383 299.03479 312.64575 326.25674 339.86771 353.47867 367.08963 378.79312 390.7312"
         y="33.127773"
         id="tspan48">来源。此外，我们委聘弗若斯特沙利文就全球发售编制独立行业报告，即</tspan><tspan
         x="-16.032064 -2.5429466 10.946172 24.435289 37.924408 51.413528 64.902649 78.391762 91.880882 103.58549 115.37894 128.86806 142.35718 155.8463 167.5509 179.34435 192.83347 206.32259 219.81171 233.30083 246.78995 260.27905 273.76819 287.25729 300.7464 314.23553 327.72464 341.21378 354.70288 368.19202 381.68112 395.17026"
         y="49.691658"
         id="tspan50">弗若斯特沙利文报告。我们认为，本节及本招股章程其他章节所载资料的</tspan><tspan
         x="-11.594151 1.8949678 15.384087 28.873205 42.362324 55.85144 69.340561 82.829681 96.318794 109.80791 123.29704 136.78615 148.49077 160.28421 173.77333 187.26245 200.75156 214.24068 227.7298 241.21892 254.70804 268.19714 281.68628 295.17538 308.66452 322.15363 335.64276 349.13187 362.62097 376.11011 387.81473 399.60815"
         y="66.255547"
         id="tspan52">资料来源属恰当的资料来源，且我们已合理谨慎摘录及转载有关资料。我</tspan><tspan
         x="-7.1562362 6.4547338 20.065704 33.676674 47.287643 60.898617 74.509583 86.214203 98.152267 111.76324 125.37421 138.98518 152.59615 166.20712 179.81808 193.42906 207.04002 220.651 234.26198 247.87294 259.57755 271.5145 285.12546 298.73642 312.34741 325.95837 339.56934 353.1803 366.79129 380.40225 392.10687 404.04492"
         y="82.819427"
         id="tspan54">们并无理由认为，该等资料属虚假或有所误导，或任何事实有所遗漏，致</tspan><tspan
         x="-2.718322 10.250363 23.219049 36.187733 49.156422 62.125107 75.093788 88.062477 101.03116 113.99985 126.96854 139.93723 152.9059 164.61166 176.31514 189.28381 202.2525 215.22119 228.18988 241.15855 254.12724 267.09595 280.06461 293.03329 306.00198 318.97067 331.93936 344.90805 357.87674 370.84543 383.81409 396.78278 408.4874"
         y="99.383316"
         id="tspan56">使该等资料属虚假或有所误导。来自官方及非官方来源的资料并未经我们、</tspan><tspan
         x="1.7195921 15.459248 29.198902 42.938557 56.678211 70.41787 84.157524 95.862137 107.95167 121.69132 135.43097 149.17062 162.91029 174.61377 186.70329 200.44295 214.1826 227.92226 241.66191 255.40157 269.14124 280.8447 292.93423 306.67389 320.41354 334.1532 347.89285 361.63251 375.37216 387.07678 399.16516 412.90482"
         y="115.9472"
         id="tspan58">联席全球协调人、联席保荐人、联席账簿管理人、联席牵头经办人、任何</tspan><tspan
         x="6.1575065 19.989405 33.821301 45.525917 57.723633 71.555534 85.387428 99.21933 113.05122 126.88313 140.71503 154.54692 168.37881 182.21071 196.04262 209.87451 223.70641 237.5383 251.37021 265.20212 279.034 292.86591 306.69778 320.52969 334.3616 348.19348 362.02539 375.8573 389.68918 403.52109 417.35297"
         y="132.51109"
         id="tspan60">包销商、彼等各自的任何董事及顾问或参与全球发售的任何其他人士或</tspan><tspan
         x="10.595421 23.697346 29.707947 41.411423 54.513348 67.615273 80.717201 93.819122 106.92105 120.02297 133.12491 146.22682 159.32875 171.03337 177.04625 190.14816 203.25009 216.35202 228.05664 239.76125 252.86317 265.96509 279.06702 292.16895 305.27087 318.3728 331.47473 344.57666 357.67859 370.78052 383.88242 396.98434 410.08627 421.79089"
         y="149.07497"
         id="tspan62">各方（不包括弗若斯特沙利文）独立核实，且概无就其准确性发表任何声明。</tspan><tspan
         x="15.033335 28.095402 39.800018 51.504631 64.566696 77.628769 90.690834 103.7529 116.81496 129.87703 142.9391 156.00117 169.06323 182.12531 195.18738 208.24944 221.31151 234.37358 247.43564 260.49771 273.55978 286.62186 299.6839 312.74597 324.45059 336.15408 349.21613 362.2782 375.34027 388.40234 401.46442 414.52646 426.23108"
         y="165.63885"
         id="tspan64">因此，本节所载来自官方及非官方来源的资料未必准确，且不应过份依赖。</tspan><tspan
         x="19.471249 32.960369 46.449486 59.938602 73.427719 86.91684 100.40596 113.89508 127.38419 140.87332 154.36243 167.85155 181.34067 194.82979 208.31891 220.02238 231.81696 245.30608 258.7952 272.28433 285.77344 299.26254 312.75168 326.24078 339.72992 353.21902 366.70816 380.19727 393.68637 405.39099 417.18445 430.67355"
         y="182.20274"
         id="tspan66">我们的董事经作出合理查询后确认，自弗若斯特沙利文报告日期起，市场</tspan><tspan

         y="198.76663"
         id="tspan68">资料概无出现可能使本节披露的资料存有保留意见、相抵触或对本节资</tspan><tspan
         x="28.347078 41.759895 55.172714 68.585533 81.998352 95.411171 108.82399 122.23681 135.64963 149.06244 162.47527 175.88808 187.5927"
         y="215.33052"
         id="tspan70">料造成重大影响的不利变动。</tspan></text>

         id="tspan84">流玩具市场行业趋势的知识、统计数据、资料及行业见解。一级研究涉及与</tspan><tspan

         y="0"
         id="tspan44">。潮流玩具中注入了消费者耳熟能详的</tspan><tspan
         x="-145.0647 -132.52361 -119.9825 -107.4414 -94.900299 -82.3592 -71.053398 -59.747601 -47.206501 -34.665401 -22.1243 -9.5832005 2.9579 15.499 28.0401 40.5812 53.122299 65.663399 78.204498 90.745598 103.2867 115.8278 128.3689 139.6747 150.9805 163.52161 176.0627 188.60381 201.1449 212.4507"
         y="15.9995"
         id="tspan46">潮流文化内容。潮流玩具拥有著时尚设计及审美价值，可持作展示、</tspan><tspan
         x="-145.0647 -132.0583 -119.0519 -106.0455 -93.039101 -80.0327 -67.026299 -55.720501 -44.354198 -31.347799 -18.3414 -5.335 7.6714001 20.677799 33.6842 46.690601 59.696999 72.7034 85.709801 98.716202 111.7226 124.729 137.7354 150.74181 162.04761 173.41389 186.4203 199.4267 212.43311"
         y="31.999001"
         id="tspan48">收藏或交换之用。潮流玩具往往会带来愉悦感及陪伴感，令消费者</tspan><tspan
         x="-145.0647 -131.68871 -118.3127 -104.9367 -91.560699 -78.1847 -64.808701 -53.502899 -41.702099 -28.326099 -14.9501 -1.5741 11.8019 25.1779 38.553902 51.929901 65.305901 78.6819 92.057899 105.4339 118.8099 132.1859 145.5619 158.9379 172.3139 185.6899 199.0659 212.44189"
         y="47.998501"
         id="tspan50">感到慰藉及舒适，而粉丝可通过购买不同的潮流玩具表达其独特</tspan><tspan
         x="-145.0647 -132.0583 -119.0519 -106.0455 -93.039101 -80.0327 -67.026299 -54.019901 -41.0135 -28.007099 -16.7013 -5.335 7.6714001 20.677799 33.6842 46.690601 59.696999 72.7034 85.709801 98.716202 111.7226 124.729 137.7354 150.74181 162.04761 173.41389 186.4203 199.4267 212.43311"
         y="63.998001"
         id="tspan52">的生活方式及社会地位。随著忠实粉丝群体的不断扩大，中国的潮</tspan><tspan

         y="31.999001"
         id="tspan70">及个性化的背景下，世界各地的人对各式各样以往属于小众的潮</tspan><tspan

         y="47.998501"
         id="tspan72">流文化抱持更加开放及热情的态度。同时，社交媒体推动了有关趋</tspan><tspan

         y="63.998001"
         id="tspan74">势，原因为人们越来越多参与内容互动及投身彼等的社交社区，以</tspan><tspan
         x="-128.3656 -115.3504 -102.3352 -89.32 -76.304802 -63.2896 -50.274399 -37.259201 -24.243999 -11.2288 1.7864 13.0922 24.468399 37.483601 48.7883 54.594101 65.970299 78.985497 90.361702 98.986801 112.002 125.0172 138.03239 151.04761 164.06281 177.078 190.0932 203.1084 216.1236 229.13879"
         y="79.997498"
         id="tspan76">表现对有关内容的亲切感。此外，「盲盒」等产品设计及业界在开拓</tspan><tspan

         y="95.997002"
