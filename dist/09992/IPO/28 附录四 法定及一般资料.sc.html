         y="0"
         id="tspan108">除非获得董事会、董事委员会或董事会授权人士的明确书面同意，</tspan><tspan
         x="-28.3459 -15.0403 -1.7347 11.5709 24.876499 38.182098 51.487701 64.793297 78.0989 91.404503 104.7101 118.0157 131.3213 144.62691 157.9325 171.2381 184.5437 197.8493 211.15491 224.46049 237.7661 251.0717 264.37729 277.68289 290.98849 304.2941 317.5997 330.9053 344.21091 357.51651"
         y="15.9995"
         id="tspan110">根据首次公开发售后股份奖励计划已授出但尚未归属之奖励股份为获</tspan><tspan
         x="-28.3459 -15.257 -2.1681001 10.9208 24.009701 37.098598 50.1875 63.276402 76.365303 89.454201 102.5431 113.8478 125.3109 138.3998 151.48869 164.57761 177.6665 190.7554 203.8443 215.1501 226.61211 239.701 252.7899 265.87881 278.96771 292.05661 305.14551 318.23441 331.3233 344.4122 357.5011"
         y="31.999001"
         id="tspan112">授股份之选定参与者所有，不得出让或转让。选定参与者不得以任何方</tspan><tspan

         y="47.998501"
         id="tspan114">式，将任何奖励出售、转让、押记、按揭、设立产权负担或就此以任何其</tspan><tspan

         y="63.998001"
         id="tspan116">他人士为受益人创设任何利益或订立任何协议以进行上述各项行为。</tspan></text>

         y="47.999599"
         id="tspan132">于受限制股份单位计划受托人及董事会于归属日期之前不时议定</tspan><tspan

         x="0 12.9151 25.8302 38.7453 51.6604 64.5755 77.490601 90.405701 103.3208 116.2359 129.151 142.0661 154.9812 167.8963 180.8114 193.7265 206.6416 219.5567 232.4718 245.3869 258.302 271.2171 284.1322 297.0473 309.9624 322.8775 335.7926 348.7077 361.6228 374.5379 385.84369"

         id="tspan38">者进行上述转让的能力的法律或监管限制而无法以股份形式收取奖励，</tspan><tspan
         x="0 13.3056 26.6112 39.916801 53.222401 66.528 79.833603 93.139198 106.4448 119.7504 133.056 146.3616 159.66721 172.97279 186.2784 199.584 212.8896 226.19521 239.50079 252.8064 266.112 279.4176 292.72321 306.02881 319.33441 332.64001 345.94559 359.25119 372.55679 385.8624"

         id="tspan40">则董事会或其代表将指示并促使受限制股份单位计划受托人按当前市</tspan><tspan
         x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 259.44601 272.4183 283.72409 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471"

         id="tspan68">平合理之方式进行。有关合并或拆细选定参与者之奖励股份所产生之所</tspan><tspan

         y="63.998001"
         id="tspan70">有零碎股份（如有）被视为归还股份，不得于相关归属日期转让予相关的</tspan><tspan

         y="143.9966"

         x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 62.460201 75.432503 88.4048 101.3771 112.6829 124.0074 136.97971 149.952 162.9243 175.89661 188.8689 201.8412 214.81351 227.7858 240.7581 253.73039 266.7027 279.67499 292.64731 305.6196 318.59189 331.56421 344.5365 357.50879"

         id="tspan88">倘任何非现金分派或其他事件因董事会认为就尚未归属奖励作出</tspan><tspan
