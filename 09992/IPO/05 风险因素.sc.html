<text id="text44" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,151.684,713.0118)" xml:space="preserve"><tspan id="tspan38" x="0 11.583 24.7731 37.9632 51.153301 64.343399 77.533501 90.723602 103.9137 117.1038 130.2939 143.48399 156.6741 169.8642 183.05431 196.2444 207.5502 219.1321 232.3222 245.5123 258.70239 271.89249 285.08261 298.27271 309.57849 321.1604 334.35049 347.54059" y="0">。此类税收优惠福利基于应课税溢利，并每年重新授予。倘我们</tspan><tspan id="tspan40" x="-66.6446 -53.4842 -40.323799 -27.163401 -14.003 -0.84259999 12.3178 25.478201 38.638599 51.799 64.959396 78.119797 91.280197 104.4406 117.601 128.9068 140.45351 153.61391 166.77431 179.93469 193.09509 206.25549 219.41589 232.57629 245.73669 258.89709 272.0575 285.2179 296.52261 308.06931 321.22971 334.39011 347.55051" y="15.9995">不再拥有享有优惠税收待遇的资格，我们的所得税开支或会增加，这可能对</tspan><tspan id="tspan42" x="-66.6446 -53.688801 -40.733002 -27.777201 -14.8214 -1.8656 11.0902 24.046 37.001801 49.9576 62.913399 75.869202 88.824997 100.1308" y="31.999001">我们的经营业绩产生不利影响。</tspan></text>
<text id="text48" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,649.0127)" xml:space="preserve"><tspan id="tspan46" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 207.2928 220.2486 233.20441 246.1602 259.116 270.42181" y="0">我们的成功部分取决于我们成功管理库存的能力。</tspan></text>
<text id="text80" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,617.0126)" xml:space="preserve"><tspan id="tspan50" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 259.44601 272.4183 285.39059 296.69641 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">我们必须保持足够的库存水平以成功经营我们的业务，但我们亦须避免</tspan><tspan id="tspan52" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 48.760799 60.307499 73.467903 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 269.01929 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="15.9995">累积过剩库存，这会增加营运资金需求并降低毛利率。我们从第三方制造商</tspan><tspan id="tspan54" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 87.352097 98.767899 111.8172 124.8665 137.9158 150.9651 164.0144 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="31.999001">处获得几乎所有库存，且通常须在将该等产品出售予我们的客户之前提前订</tspan><tspan id="tspan56" x="-28.347 -15.3527 -2.3584001 8.9474001 20.2983 33.292599 44.5984 55.949299 68.943604 81.937897 94.932198 107.9265 120.9208 133.9151 146.90939 159.9037 172.89799 185.8923 198.8866 211.88091 224.8752 237.86951 250.8638 257.54959 268.90051 281.89481 294.8891 307.88339 320.87769 333.87201 346.8663 359.8606 372.85489 385.84921" y="47.998501">购产品。因此，可能难以应对消费者偏好及市场状况（对于潮流文化产品而言</tspan><tspan id="tspan58" x="-28.347 -15.3538 -2.3606 10.6326 21.9813 28.7111 41.7043 54.697498 66.002197 77.351997 90.3452 103.3384 116.3316 129.3248 142.31799 155.3112 168.3044 181.29761 194.2908 207.284 220.27721 233.2704 246.2636 259.25681 272.25 285.24319 298.23639 311.22961 322.5343 333.88409 346.87729 359.87051 372.86371 385.8569" y="63.998001">变化很快）的变化。倘我们未能准确预测若干产品的受欢迎程度，我们可能没</tspan><tspan id="tspan60" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 51.321602 64.599701 77.8778 91.155899 102.4617 114.147 127.4251 138.7298 150.4151 163.69321 176.9713 190.2494 203.5275 216.8056 230.08369 243.3618 256.63989 269.918 283.19611 296.47421 309.75229 323.0304 336.3085 347.61539 359.29959 372.5777 385.8558" y="79.997498">有足够的库存满足需求。或者，倘需求或未来销售未达到预测水平，我们可</tspan><tspan id="tspan62" x="-28.347 -15.1239 -1.9008 11.3223 24.545401 37.768501 50.9916 64.214699 77.437798 90.660896 103.884 117.1071 130.3302 141.6371 153.25861 166.4817 179.7048 192.9279 204.2326 215.8541 229.07829 242.30141 255.52451 268.74759 281.9707 295.19379 308.4169 321.64001 334.8631 348.08621 361.3093 374.53241 385.8382" y="95.997002">能会长期持有超出需求的库存、进行撇减、以低于预期的价格出售或丢弃。</tspan><tspan id="tspan64" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 114.5628 126.1095 139.2699 152.4303 165.5907 178.7511 190.0569 201.60361 214.76401 227.92439 241.08479 254.24519 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="111.9965">倘我们未能成功管理库存，我们的业务、财务状况及经营业绩可能会受到不</tspan><tspan id="tspan66" x="-28.347 -15.3912 -2.4354 8.8704004" y="127.996">利影响。</tspan><tspan id="tspan68" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 259.44601 272.4183 285.39059 298.36292 309.6698 320.99429 333.96661 346.9389 359.91119 372.88351 385.8558" y="159.99609">我们亦可能受到经销商库存政策及做法变化的负面影响。我们的经销商</tspan><tspan id="tspan70" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 230.89549 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="175.99561">对向我们的采购量并无具有约束力的长期承诺，并通过提交采购订单进行所</tspan><tspan id="tspan72" x="-28.347 -15.0689 -1.7908 9.5150003 21.2003 34.478401 45.7831 57.468399 70.746498 84.024597 97.302696 110.5808 123.8589 137.13699 150.4151 163.69321 176.9713 190.2494 203.5275 216.8056 230.08369 243.3618 256.63989 269.918 283.19611 296.47421 309.75229 323.0304 336.3085 349.58661 360.89349 372.5777 385.8558" y="191.9951">有采购。因此，任何经销商都可以自由减少对我们产品的整体购买量，并减</tspan><tspan id="tspan74" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 322.2406 333.6553 346.70459 359.75391 372.80319 385.85251" y="207.9946">少其经销产品的数量及种类以及为我们的产品分配的货架空间。倘需求或未</tspan><tspan id="tspan76" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 101.4024 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 255.8589 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="223.99409">来销售未达到预测水平，我们可能会持有超额库存。倘我们未能成功管理库</tspan><tspan id="tspan78" x="-28.347 -17.041201 -5.7354002 7.2203999 20.176201 33.132 46.087799 57.3936 68.698303 81.654099 94.609901 107.5657 120.5215 133.47729 146.43311 159.3889 172.3447 185.30051 198.2563 211.2121 224.16789 237.1237 250.0795 263.03531 275.99109 288.9469 300.25269" y="239.99361">存，我们的业务、财务状况及经营业绩可能会受到不利影响。</tspan></text>
<text id="text84" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,345.0189)" xml:space="preserve"><tspan id="tspan82" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 207.2928 220.2486 233.20441 246.1602 259.116 270.42181" y="0">我们面临与我们销售的产品仓储相关的若干风险。</tspan></text>
<text id="text106" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,313.0188)" xml:space="preserve"><tspan id="tspan86" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 117.8001 130.88901 143.97791 157.0668 170.1557 183.2446 196.3335 209.42239 222.51131 235.6002 246.90491 258.36801 271.45691 284.54581 297.6347 310.7236 323.8125 336.9014 349.9903 363.07919 374.38501 385.84698" y="0">我们的其中一个主要仓储物流设施位于北京，北京亦为总部所在地。我</tspan><tspan id="tspan88" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 165.649 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="15.9995">们亦在南京设有一个额外中央仓库。我们亦于嘉兴及东莞配备有两个外包仓</tspan><tspan id="tspan90" x="-28.347 -15.6706 -2.9942 9.6822004 22.358601 35.035 46.340801 57.646599 70.322998 82.999397 95.675797 108.3522 121.0286 133.705 146.38139 159.0578 171.73421 184.4106 197.08701 209.7634 222.4398 235.1162 247.7926 260.46899 273.14539 285.82181 298.4982 311.17459 323.85101 336.5274 349.2038 361.88019 374.55661 385.8624" y="31.999001">库服务提供商。在将产品交付至我们的批发客户指定的零售点或交货点之前，</tspan><tspan id="tspan92" x="-28.347 -15.2086 -2.0702 11.0682 24.2066 37.345001 50.483398 63.621799 76.760201 89.898598 103.037 116.1754 129.3138 142.45219 153.758 165.2794 178.4178 191.5562 204.6946 217.83299 230.97141 244.1098 257.2482 270.3866 283.52499 296.66339 309.80179 316.492 328.0134 341.15179 354.29019 367.42859 378.94891 385.85031" y="47.998501">我们将产品存放在我们的仓库中。我们就我们可能因仓库事故（包括火灾）而</tspan><tspan id="tspan94" x="-28.3459 -15.0953 -1.8447 11.4059 24.6565 37.907101 51.1577 64.408302 77.658897 90.9095 104.1601 115.4659 127.1193 140.3699 151.6757 163.328 176.5786 189.82919 203.0798 216.3304 229.58099 242.8316 249.5119 261.16422 274.41479 287.66541 300.91599 312.5683 319.59949 332.8501 346.10071 359.35129 372.6019 385.85251" y="63.998001">遭受的经济损失投购保险。然而，倘发生该等事故（包括火灾）对我们销售的</tspan><tspan id="tspan96" x="-28.3459 -15.2966 -2.2472999 10.802 23.851299 36.9006 49.949902 62.999199 76.0485 89.097801 102.1471 115.1964 126.5022 137.918 150.9673 164.0166 177.0659 190.1152 203.16451 216.21381 229.26311 242.31239 255.36169 268.41101 281.4603 294.50961 307.5589 320.60818 333.6575 346.70679 359.7561 372.80539 385.85471" y="79.997498">产品或我们的仓库造成损害，我们按时向我们的零售及批发渠道供应产品的</tspan><tspan id="tspan98" x="-28.3459 -15.0678 -1.7897 11.4884 24.7665 38.044601 51.322701 64.6008 77.878899 91.156998 104.4351 115.7409 127.4262 140.7043 153.98241 167.2605 180.5386 193.8167 207.0948 220.37289 233.651 246.92909 260.20721 271.513 283.1972 296.47531 309.75339 323.03149 334.33731 346.02261 359.30069 372.5788 385.8569" y="95.997002">能力可能会受到不利影响，从而导致我们的市场声誉、财务状况、经营业绩</tspan><tspan id="tspan100" x="-28.3459 -15.2966 -2.2472999 10.802 23.851299 36.9006 49.949902 62.999199 76.0485 89.097801 102.1471 113.4529 124.8687 137.918 150.9673 164.0166 177.0659 190.1152 203.16451 216.21381 229.26311 242.31239 255.36169 268.41101 281.4603 294.50961 307.5589 320.60818 333.6575 346.70679 359.7561 372.80539 385.85471" y="111.9965">或业务受到重大不利影响。发生任何该等事件亦可能要求我们作出重大意外</tspan><tspan id="tspan102" x="-28.3459 -15.1855 -2.0251 11.1353 24.2957 37.4561 50.616501 63.776901 76.937302 90.097702 103.2581 116.4185 129.5789 142.7393 154.0462 165.5918 178.7533 191.9137 205.0741 218.2345 231.3949 244.5553 257.7157 270.8761 284.0365 297.1969 310.3573 323.5177 336.6781 347.98389 359.52951 372.68991 385.85031" y="127.996">资本支出并延迟我们的产品交付。倘上述任何一项或多项风险落实，我们的</tspan><tspan id="tspan104" x="-28.3459 -15.3901 -2.4342999 10.5215 23.477301 36.433102 49.388901 62.3447 75.300499 88.256302 101.2121 114.1679 127.1237 140.0795 153.03529 165.9911 178.9469 191.90269 203.2085" y="143.9955">财务状况及经营业绩可能会受到不利影响。</tspan></text>
<text id="text110" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0405,137.0232)" xml:space="preserve"><tspan id="tspan108" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 207.2928 220.2486 231.5544" y="0">我们依靠第三方物流公司交付我们的产品。</tspan></text>
<text id="text116" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3875,105.0231)" xml:space="preserve"><tspan id="tspan112" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 218.86259 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">我们主要聘请第三方物流公司运输产品。与我们的一家或多家物流公司</tspan><tspan id="tspan114" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 335.28989 346.70569 359.755 372.80429 385.85361" y="15.9995">发生的合同关系的争议或终止可能导致产品交付延迟或成本增加。无法保证</tspan></text>
</g>

<text id="text40" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 221.8381 234.88741 247.93671 260.98599 274.03531 287.08459 300.13391 313.1832 326.23251 339.2818 352.33109 365.3804 376.68619 388.10199 401.15131 414.20059" y="0">我们能够按照我们可接受的条款继续或扩展与现有物流公司的关系，或者我</tspan><tspan id="tspan28" x="0 12.9965 25.993 38.989498 51.986 64.982498 77.978996 90.975502 103.972 116.9685 129.965 142.9615 155.95799 168.9545 181.951 194.94749 207.944 220.94051 233.937 246.9335 259.92999 272.92651 285.923 298.91949 311.91599 324.91251 337.909 350.90549 363.90201 376.8985 389.89499 402.89151 414.1962" y="15.9995">们能够与新的物流公司建立关系或加强与现有物流公司的关系以确保准确、</tspan><tspan id="tspan30" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 105.2832 118.4436 131.604 144.7644 157.9248 171.08521 182.39211 193.9377 207.0981 220.2585 233.4189 246.5793 259.73969 272.90009 284.2059 295.7515 308.9119 322.0723 335.2327 348.3931 361.5535 374.7139 387.8743 401.0347 414.1951" y="31.999001">及时及具有成本效益的交付服务。若未能得偿所愿，则可能会妨碍我们及时</tspan><tspan id="tspan32" x="0 12.6764 25.3528 38.029202 50.705601 63.382 76.058403 88.734802 101.4112 114.0876 126.764 139.4404 152.11681 164.7932 177.4696 190.146 202.8224 215.49879 228.1752 240.85159 253.528 266.20441 278.8808 291.55719 304.23361 316.91 329.5864 342.26279 354.93921 367.6156 378.92139 390.2272 402.90359 414.20831" y="47.998501">提供足够数量的产品或以我们的消费者可接受的价格提供产品的能力。此外，</tspan><tspan id="tspan34" x="0 13.1065 26.212999 39.3195 52.425999 65.532501 78.639 91.745499 104.852 117.9585 131.065 144.17149 157.278 170.38451 183.491 196.5975 209.70399 222.8105 235.91701 249.0235 260.32932 271.81329 284.9198 298.02631 311.13281 324.23929 337.34579 350.4523 363.55881 376.66531 389.77179 402.8783 414.18411" y="63.998001">由于我们对该等物流公司并无任何直接控制权，我们无法保证其服务质量。</tspan><tspan id="tspan36" x="0 13.1604 26.320801 39.481201 52.641602 63.947399 75.492996 88.653397 101.8138 114.9742 128.1346 141.295 154.4554 167.6158 180.7762 193.9366 207.097 220.2574 233.4178 244.7236 256.27029 269.43069 282.59109 295.7515 308.9119 322.0723 335.2327 348.3931 361.5535 374.7139 387.8743 401.0347 414.1951" y="79.997498">倘交付延迟、产品损坏或存在任何其他问题，我们的销售及品牌形象可能会</tspan><tspan id="tspan38" x="0 12.9558 25.9116 38.867401 50.173199" y="95.997002">受到影响。</tspan></text>
<text id="text48" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,585.0147)" xml:space="preserve"><tspan id="tspan42" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 105.2832 118.4436 131.604 144.7644 157.9248 171.08521 184.24561 197.40601 210.56641 221.87219 233.4189 246.5793 259.73969 272.90009 286.06049 299.22089 312.38129 325.54169 338.70209 351.86249 365.02289 378.18329 389.48801 401.0347 414.1951" y="0">我们的业务在很大程度上取决于第三方，包括我们的供应商及外包商，我们</tspan><tspan id="tspan44" x="0 12.9437 25.8874 38.8311 51.774799 64.718498 77.662201 90.605904 103.5496 116.4933 129.437 142.38071 155.3244 168.2681 181.21181 194.1555 207.0992 220.04289 232.9866 245.9303 258.87399 271.81769 284.76141 297.70511 310.6488 323.5925 336.53619 349.47989 362.42361 375.36731 388.311 401.2547 414.19839" y="15.9995">的声誉及有效经营业务的能力可能会受到我们无法控制的第三方采取的行动</tspan><tspan id="tspan46" x="0 12.9558 25.9116 37.2174" y="31.999001">的损害。</tspan></text>
<text id="text62" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,521.0156)" xml:space="preserve"><tspan id="tspan50" x="0 13.2132 26.426399 37.731098 49.339401 62.552601 73.858398 85.466698 98.679901 111.8931 125.1063 138.3195 151.5327 164.7459 177.95911 191.1723 204.3855 217.59869 230.8119 244.0251 257.23831 270.45151 281.75729 293.3656 306.5788 319.79199 333.00519 346.21841 359.43161 372.64481 385.858" y="0">就制造、运输、物流及信息技术等服务及系统而言，我们非常依赖供应</tspan><tspan id="tspan52" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 114.5628 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 323.5155 334.82129 346.36801 359.52841 372.68881 385.84921" y="15.9995">商及与第三方的外包关系。我们任何供应商或外包商的任何缺点，尤其是影</tspan><tspan id="tspan54" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 140.88361 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 295.34009 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="31.999001">响该等服务或系统质量的缺点，可能会被客户归咎于我们，从而损害我们的</tspan><tspan id="tspan56" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 51.321602 62.627399 74.312698 87.590797 100.8689 114.147 127.4251 140.7032 153.98129 167.2594 180.53751 193.8156 207.0937 220.3718 231.6776 243.3629 256.64099 267.94571 279.63101 292.90909 306.18719 319.4653 332.74341 346.02151 359.29959 372.5777 385.8558" y="47.998501">声誉及品牌价值，并可能影响我们的经营业绩。此外，将该等服务及系统的</tspan><tspan id="tspan58" x="-28.347 -15.4033 -2.4596 10.4841 23.427799 36.371498 49.315201 62.2589 75.202599 88.146301 101.09 114.0337 126.9774 139.9211 152.86481 165.8085 178.7522 191.69591 204.6396 217.5833 230.52699 243.4707 256.4144 269.35809 282.30179 295.24551 308.18921 321.1329 334.0766 347.02029 359.96399 372.90771 385.85141" y="63.998001">问题转移至该等供应商及外包商或该等供应商及外包商经营失败可能导致产</tspan><tspan id="tspan60" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 34.780899 46.0867 59.0425 71.998299 84.954102 97.909897 110.8657 123.8215 136.7773 149.73309 162.6889 175.6447 188.60049 201.5563 214.5121 227.4679 240.42371 253.3795 266.3353 279.29111 292.24689 305.2027 318.15851 329.46539" y="79.997498">品销售延迟、降低我们的经营效率并需要大量资本投资进行补救。</tspan></text>
<text id="text70" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,409.018)" xml:space="preserve"><tspan id="tspan64" x="0 12.9965 25.993 38.989498 51.986 64.982498 77.978996 90.975502 103.972 116.9685 129.965 142.9615 155.95799 168.9545 181.951 194.94749 207.944 220.94051 233.937 246.9335 259.92999 272.92651 285.923 298.91949 311.91599 324.91251 337.909 350.90549 363.90201 376.8985 389.89499 402.89151 414.1962" y="0">我们的成功在很大程度上取决于我们的高级职员及其他雇员的努力及奉献，</tspan><tspan id="tspan66" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 193.996 205.41071 218.46001 231.50929 244.55859 257.60791 270.6572 283.70651 296.7558 309.80511 322.8544 335.90369 348.953 362.00229 375.05161 388.10089 401.15021 414.19949" y="15.9995">而任何一名或多名关键雇员的流失，或我们无法吸引及留住合格人员以及维</tspan><tspan id="tspan68" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 101.9964 113.3022 126.258 139.21381 152.1696 165.1254 178.08121 191.037 203.9928 216.94859 229.9044 242.8602 255.81599 268.77179 281.7276 293.03448" y="31.999001">持我们的企业文化，可能对我们的业务产生负面影响。</tspan></text>
<text id="text84" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,345.0189)" xml:space="preserve"><tspan id="tspan72" x="0 12.485 24.969999 37.455002 49.939999 62.424999 74.910004 87.394997 99.879997 112.365 124.85 137.33501 149.82001 162.30499 174.78999 187.27499 199.75999 212.245 224.73 237.215 249.7 262.185 274.67001 287.155 299.64001 312.125 324.60999 337.095 349.57999 362.065 374.54999 385.8558" y="0">我们的成功在很大程度上取决于我们的高级管理团队的持续服务及表现。</tspan><tspan id="tspan74" x="-28.347 -15.2977 -3.9919 7.4239001 20.4732 33.522499 46.5718 59.621101 72.670403 85.719704 98.768997 111.8183 124.8676 137.9169 150.9662 164.0155 177.0648 190.11411 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="15.9995">尤其，我们的董事会主席及行政总裁王宁先生及我们高级管理团队的其他成</tspan><tspan id="tspan76" x="-28.347 -21.6612 -9.9351997 3.3770001 16.689199 30.0014 43.313599 56.625801 69.938004 83.250198 96.562401 109.8746 123.1868 136.49899 149.8112 163.1234 176.43559 187.7403 199.46629 212.7785 226.0907 239.40289 252.7151 266.02731 279.33951 292.6517 305.9639 319.27609 332.58829 345.90051 359.21271 372.5249 385.8371" y="31.999001">员（包括我们的首席财务官杨镜冰先生、我们的执行董事兼首席营运官司德</tspan><tspan id="tspan78" x="-28.347 -15.0964 -3.7906001 7.8628001 21.1134 34.363998 47.614601 60.8652 74.115799 87.366402 100.617 113.8676 127.1182 140.3688 147.0502 158.7025 171.95309 185.2037 198.4543 210.1066 217.1378 230.3884 243.63901 256.88959 268.19431 279.84769 293.0983 306.34891 319.59949 332.8501 346.10071 359.35129 372.6019 385.85251" y="47.998501">先生、我们的执行董事兼副总裁（产品开发）杨涛女士、我们的执行董事兼副</tspan><tspan id="tspan80" x="-28.348101 -15.3824 -8.6966 2.6201999 15.5859 28.5516 41.5173 52.835201 59.5331 72.498802 85.4645 98.430199 111.3959 124.3616 137.3273 150.293 163.2587 176.2244 189.19009 195.877 207.1938 220.1595 233.1252 246.0909 257.40881 264.10669 277.07239 290.03809 303.00381 315.96951 327.28629 333.98419 346.94989 359.91559 372.88129 385.84698" y="63.998001">总裁（线下业务）刘冉女士及我们的副总裁（海外业务）文德一先生）对我们的业</tspan><tspan id="tspan82" x="-28.349199 -15.0304 -1.7115999 11.6072 24.926001 38.244801 51.563599 62.8694 74.601997 87.920799 101.2396 114.5584 127.8772 141.196 154.5148 165.8206 177.55321 190.87199 204.1908 217.5096 230.8284 244.1472 257.466 270.78479 284.10361 297.42239 310.74121 322.047" y="79.997498">务营运至关重要。我们依赖其才能，并相信其为我们与艺术家、</tspan></text>

<text id="text106" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,459.277,265.0214)" xml:space="preserve"><tspan id="tspan90" x="0 13.3188 26.6376 39.956402" y="0">提供商及</tspan><tspan id="tspan92" x="-374.23981 -361.19049 -348.1412 -335.09189 -322.0426 -308.99329 -295.944 -282.89471 -269.8454 -256.79611 -243.7468 -230.69749 -217.64819 -204.59891 -191.54961 -178.50031 -165.451 -152.4017 -141.0959 -129.6801 -116.6308 -103.5815 -90.532204 -77.482903 -64.433601 -51.3843 -38.334999 -25.2857 -12.2364 0.81290001 13.8622 26.911501 39.9608" y="15.9995">其他业务合作伙伴之间的关系所不可或缺。我们的高级管理团队的任何成员</tspan><tspan id="tspan94" x="-374.23981 -361.19049 -348.1412 -335.09189 -322.0426 -308.99329 -295.944 -282.89471 -269.8454 -256.79611 -243.7468 -230.69749 -217.64819 -204.59891 -191.54961 -178.50031 -165.451 -152.4017 -139.3524 -126.3031 -113.2538 -100.2045 -87.155197 -74.105904 -61.056599 -48.007301 -34.958 -21.908701 -10.6029 0.81290001 13.8622 26.911501 39.9608" y="31.999001">或任何其他关键雇员的流失可能会削弱我们执行业务计划的能力，因此可能</tspan><tspan id="tspan96" x="-374.23981 -361.284 -348.32819 -335.37241 -322.4166 -309.46078 -298.155 -286.84921 -273.8934 -260.93759 -247.9818 -235.026 -222.07021 -209.1144 -196.1586 -183.2028 -170.24699 -157.2912 -144.3354 -131.37959 -118.4238 -105.468 -92.512199 -79.556396 -68.250603" y="47.998501">对我们的业务、财务状况及经营业绩产生重大不利影响。</tspan><tspan id="tspan98" x="-345.89279 -333.22629 -321.9205 -310.61581 -297.94931 -285.28281 -272.6163 -259.9498 -247.28329 -234.61681 -221.9503 -209.2838 -196.61729 -183.95081 -171.2843 -159.9774 -148.6727 -136.0062 -123.3397 -110.6732 -98.006699 -85.340202 -72.673698 -60.007198 -47.340698 -34.674198 -22.0077 -9.3411999 3.3253 15.9918 28.6583 39.9641" y="79.998596">此外，对合资格人员的竞争很激烈。我们与许多其他潜在雇主竞争招聘、</tspan><tspan id="tspan100" x="-374.23981 -361.29611 -348.35239 -335.40869 -322.465 -309.5213 -296.57761 -283.63391 -270.69019 -257.74649 -244.8028 -231.8591 -218.91541 -205.97169 -193.028 -180.0843 -167.14059 -154.1969 -141.2532 -128.30949 -115.3658 -102.4221 -89.478401 -76.534698 -63.591 -50.647301 -37.703602 -24.759899 -11.8162 1.1275001 14.0712 27.0149 39.958599" y="95.9981">雇用及留住我们的高级管理团队及我们于中国的许多其他技术熟练高级职员</tspan><tspan id="tspan102" x="-374.23981 -361.56339 -348.88699 -336.2106 -323.53421 -312.22839 -300.92261 -288.24619 -275.56979 -262.8934 -250.217 -237.5406 -224.8642 -212.18781 -199.5114 -186.83501 -174.1586 -161.48219 -148.8058 -136.12939 -123.453 -110.7766 -98.100197 -85.423798 -72.747398 -60.070999 -47.3946 -34.718201 -22.0418 -9.3654003 3.3110001 15.9874 28.663799 39.968498" y="111.9976">及其他雇员。对该等人士的竞争可能会导致我们提供更高的薪酬及其他福利，</tspan><tspan id="tspan104" x="-374.23981 -361.284 -348.32819 -335.37241 -322.4166 -309.46078 -296.505 -283.54919 -272.24341 -260.93759 -247.9818 -235.026 -222.07021 -209.1144 -196.1586 -183.2028 -170.24699 -157.2912 -144.3354 -131.37959 -120.0738" y="127.9971">以吸引及留住他们，从而增加我们的经营成本。</tspan></text>

<text id="text40" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 13.0889 24.3936 35.856701 48.945599 62.0345 75.123398 88.212303 101.3012 114.3901 127.479 140.5679 153.6568 166.7457 179.83459 192.92349 206.01241 219.1013 232.1902 243.496 254.95799 268.04691 281.1358 294.2247 307.3136 320.4025 333.49139 346.58029 359.66919 372.75809 385.84698" y="0">此外，随著我们不断发展业务并雇用新雇员，雇用维护我们企业文化的</tspan><tspan id="tspan28" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 51.321602 64.599701 77.8778 91.155899 104.434 117.7121 130.9902 144.2683 157.5464 168.8522 180.53751 193.8156 207.0937 220.3718 231.6776 243.3629 256.64099 269.9191 283.1972 294.50299 306.18829 319.4664 332.74451 346.02261 359.30069 372.5788 385.8569" y="15.9995">人员可能会变得越来越具有挑战性。我们相信，培养速度、团队合作及创造</tspan><tspan id="tspan30" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 182.21941 195.37981 206.68671 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 321.66089 333.20651 346.36691 359.52731 372.68771 385.84811" y="31.999001">力的企业文化是我们的主要竞争优势之一。随著我们不断发展，我们可能无</tspan><tspan id="tspan32" x="-28.347 -15.1866 -2.0262001 9.2796001 20.825199 33.9856 47.146 60.3064 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 244.552 257.7124 270.8728 282.17969 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="47.998501">法物色、雇用或留住足够的人员来维护我们的企业文化，包括管理层及其他</tspan><tspan id="tspan34" x="-28.347 -15.2977 -2.2484 10.8009 22.106701 33.5214 46.570702 59.619999 72.669296 85.718597 98.767899 111.8172 124.8665 137.9158 150.9651 164.0144 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="63.998001">关键职位。我们的企业文化亦可能受到劳动力日益多元化以及技能组合日益</tspan><tspan id="tspan36" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 75.081596 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 269.01929 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="79.997498">多样化的不利影响。倘我们无法保持企业文化的优势，我们的竞争能力及业</tspan><tspan id="tspan38" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 99.560997" y="95.997002">务可能会受到不利影响。</tspan></text>
<text id="text46" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.039,585.0147)" xml:space="preserve"><tspan id="tspan42" x="0 12.9437 25.8874 38.8311 51.774799 64.718498 77.662201 90.605904 103.5496 116.4933 129.437 142.38071 155.3244 168.2681 181.21181 194.1555 207.0992 220.04289 232.9866 245.9303 258.87399 271.81769 284.76141 297.70511 310.6488 323.5925 336.53619 349.47989 362.42361 375.36731 388.311 401.2547 414.19839" y="0">未能成功运行我们的信息系统并有效实施新技术可能会扰乱我们的业务或降</tspan><tspan id="tspan44" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 140.8638" y="15.9995">低我们的销量或盈利能力。</tspan></text>
<text id="text82" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,537.0151)" xml:space="preserve"><tspan id="tspan48" x="0 13.3056 26.6112 39.916801 53.222401 66.528 79.833603 93.139198 106.4448 119.7504 133.056 146.3616 159.66721 172.97279 186.2784 199.584 212.8896 226.19521 239.50079 252.8064 266.112 279.4176 292.72321 306.02881 319.33441 332.64001 345.94559 359.25119 372.55679 385.8624" y="0">我们广泛依赖各种信息技术系统及软件应用程序来管理我们业务的许</tspan><tspan id="tspan50" x="-28.347 -15.3967 -2.4463999 8.8593998 20.165199 33.115501 46.0658 59.016102 71.9664 84.916702 96.222504 107.5272 120.4775 133.4278 146.3781 159.3284 170.6342 181.94 194.8903 207.84061 220.79089 233.7412 246.6915 259.64182 270.9476 282.25339 295.2037 308.15399 321.10431 334.0546 347.00491 359.9552 372.90549 385.8558" y="15.9995">多方面，包括产品开发、供应链管理、产品销售及交付、财务报告以及各种其</tspan><tspan id="tspan52" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 48.760799 60.307499 73.467903 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 323.5155 336.6759 347.98169 359.52731 372.68771 385.84811" y="31.999001">他流程及交易。我们严重依赖于该等系统及相关备用系统的完整性、安全性</tspan><tspan id="tspan54" x="-28.347 -15.3967 -2.4463999 10.5039 23.454201 36.404499 47.709202 59.014999 71.965302 84.915604 97.865898 110.8162 123.7665 136.7168 149.6671 162.6174 173.9221 185.22791 198.17821 211.12849 224.0788 237.0291 249.9794 262.92969 275.88 287.18579 298.49161 311.44189 324.39221 337.3425 350.29279 361.5975 372.90329 385.85361" y="47.998501">及一致性运行。该等系统可能因停电、计算机及电信故障、计算机病毒、恶意</tspan><tspan id="tspan56" x="-28.347 -15.1613 -1.9756 11.2101 24.3958 37.581501 50.7672 63.9529 77.138603 88.444397 100.0219 113.2076 124.5123 136.0898 149.2755 160.5802 172.1577 185.3434 196.6481 208.2256 221.4113 232.716 244.2935 257.47919 270.66489 281.9696 293.54709 306.73279 319.91849 333.10419 346.28989 359.47559 372.66129 385.84698" y="63.998001">软件及其他安全漏洞、飓风、火灾、洪水、地震、龙卷风、战争或恐怖主义等</tspan><tspan id="tspan58" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 283.09271 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="79.997498">灾难性事件以及我们雇员的使用错误而受到损坏或中断。我们业务的有效经</tspan><tspan id="tspan60" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 165.649 177.06371 190.11301 203.16229 216.21159 229.26089 242.3102 255.3595 268.40881 281.4581 294.50739 307.5567 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251" y="95.997002">营及成功发展取决于该等信息系统，包括我们有效运行该等信息系统以及成</tspan><tspan id="tspan62" x="-28.347 -15.2405 -2.1340001 10.9725 24.079 37.185501 50.292 63.398499 76.504997 89.611504 102.718 115.8245 128.931 142.03751 155.144 168.2505 181.35699 194.4635 205.7693 217.2533 230.3598 243.46629 256.57281 269.67929 282.7858 295.8923 308.99881 322.10529 335.21179 348.3183 361.4248 374.53131 385.8371" y="111.9965">功选择及实施适当的灾难恢复系统的能力。该等信息系统未能按设计执行、</tspan><tspan id="tspan64" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 126.5011 137.9169 150.9662 164.0155 177.0648 190.11411 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="127.996">我们未能有效运行该等系统，或安全漏洞或我们的信息系统运行中断可能会</tspan><tspan id="tspan66" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 60.6936 71.998299 84.954102 97.909897 110.8657 123.8215 136.7773 149.73309 162.6889 175.6447 188.60049 201.5563 214.5121 227.4679 240.42371 253.3795 266.3353 279.29111 292.24689 305.2027 318.15851 331.11429 342.4201" y="143.9955">扰乱我们的业务、需要大量资本投资来解决问题或使我们承担责任。</tspan><tspan id="tspan68" x="0 13.2132 24.5179 36.1273 49.3405 62.553699 75.766899 88.980103 102.1933 115.4065 128.61971 139.92439 151.5327 164.7459 177.95911 191.1723 204.3855 217.59869 230.8119 244.0251 257.23831 270.45151 283.6647 296.8779 310.09109 323.30429 336.51749 349.73071 362.94391 374.24969 385.858" y="175.99561">此外，我们可能不时实施、修改及升级我们的信息技术系统及程序，以</tspan><tspan id="tspan70" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 167.20441 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 323.5155 336.6759 349.8363 362.9967 374.30249 385.84811" y="191.9951">支持我们的发展及电商业务的发展。该等修改及升级可能需要大量投资，且</tspan><tspan id="tspan72" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 270.0434 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="207.9946">可能无法将我们的盈利能力提升至超过其成本的水平，或者根本不会提升盈</tspan><tspan id="tspan74" x="-28.347 -15.0689 -1.7908 9.5150003 21.2003 34.478401 45.7831 57.468399 70.746498 84.024597 97.302696 110.5808 123.8589 137.13699 150.4151 163.69321 176.9713 190.2494 203.5275 216.8056 230.08369 243.3618 256.63989 269.918 283.19611 296.47421 309.75229 323.0304 334.33621 346.02151 359.29959 372.5777 385.8558" y="223.99409">利能力。此外，实施任何新技术系统的过程涉及固有成本及风险，包括潜在</tspan><tspan id="tspan76" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 61.9212 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 244.552 255.8589 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="239.99361">延迟及系统故障、我们的内部控制结构的潜在中断、转移管理层的时间及注</tspan><tspan id="tspan78" x="-28.347 -15.1866 -3.8819001 7.6648002 20.825199 33.9856 47.146 60.3064 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 190.0558 201.60249 214.76289 227.92329 241.08369 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="255.9931">意力，以及需要重新培训或雇用新雇员，其中任何一项均可能扰乱我们的业</tspan><tspan id="tspan80" x="-28.347 -15.3912 -2.4354 8.8704004 20.176201 33.132 46.087799 59.043598 71.999397 84.9552 97.911003 109.2168 120.5226 133.47839 146.4342 159.39 172.34579 185.30161 198.2574 211.2132 224.16901 237.1248 250.0806 263.03641 275.99219 288.948 301.90381 314.85959 327.8154 339.12119" y="271.99261">务经营，并对我们的业务、财务状况及经营业绩造成重大不利影响。</tspan></text>
<text id="text86" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.039,233.0224)" xml:space="preserve"><tspan id="tspan84" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 153.8196 165.1243 178.08009 191.0359 203.9917 216.94749 229.90331 242.8591 255.8149 268.77069 281.7265 294.68231 307.63809 320.5939 333.54971 344.8555" y="0">倘我们的电子数据受到损害，我们的业务可能会受到严重损害。</tspan></text>
<text id="text96" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,201.0223)" xml:space="preserve"><tspan id="tspan88" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 117.8001 130.88901 143.97791 157.0668 168.37151 179.83459 192.92349 206.01241 219.1013 232.1902 245.2791 258.36801 271.45691 284.54581 297.6347 310.7236 323.8125 336.9014 349.9903 363.07919 374.38501 385.84698" y="0">我们以电子方式保存大量数据。该等数据涉及我们业务的所有方面，包</tspan><tspan id="tspan90" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 51.321602 64.599701 77.8778 91.155899 104.434 117.7121 130.9902 142.29601 153.98129 167.2594 180.53751 193.8156 207.0937 220.3718 233.6499 244.9557 256.64099 269.9191 283.1972 294.50189 306.18719 319.4653 332.74341 346.02151 359.29959 372.5777 385.8558" y="15.9995">括当前及正在开发的未来产品，亦包含若干客户、供应商、合作伙伴及员工</tspan><tspan id="tspan92" x="-28.347 -15.1866 -2.0262001 9.2796001 20.825199 33.9856 47.146 60.3064 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 244.552 257.7124 270.8728 284.0332 297.1936 310.354 323.5144 334.82019 346.36691 359.52731 372.68771 385.84811" y="31.999001">的数据。我们维护旨在保护我们控制范围内的数据的系统及流程，但尽管采</tspan><tspan id="tspan94" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 75.081596 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 229.5381 241.08369 254.24519 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="47.998501">取了该等保护措施，仍存在入侵或篡改的风险，这可能会损害数据的完整性</tspan></text>

5.0649 178.0152 190.9655 202.2713 213.5771 226.5274 239.47771 250.78349 262.0882 275.03851 287.9888 300.93909 312.2449 323.55069 336.50101 349.45129 362.40161 375.3519 388.30219 401.2525 414.20279" y="63.998001">害对该等数据的保护。对我们的客户、供应商、合作伙伴、雇员或我们自有机</tspan><tspan id="tspan36" x="0.0011 13.0504 26.099701 39.148998 52.198299 65.247597 76.553398 87.9692 101.0185 114.0678 127.1171 140.1664 153.2157 166.265 179.3143 192.3636 205.4129 218.4622 231.51151 244.56081 257.61011 270.65939 283.70871 296.758 309.80731 322.8566 335.90591 348.9552 362.00449 375.0538 388.10309 401.1524 414.20169" y="79.997498">密数据的损害，或未能防止或减轻因我们的信息技术系统漏洞或其他方式对</tspan><tspan id="tspan38" x="0.0011 13.1615 26.321899 39.4823 52.6427 65.803101 78.963501 92.123901 105.2843 118.4447 131.6051 144.7655 156.0713 167.6169 180.7773 193.9377 207.0981 220.2585 233.4189 246.5793 259.73969 272.90009 286.06049 299.22089 312.38129 323.6871 335.2338 348.3942 361.5546 374.715 387.8754 401.0358 414.1962" y="95.997002">该等数据造成的丢失或损坏，可能会严重中断我们的经营、损害我们的客户</tspan><tspan id="tspan40" x="0.0011 13.2792 26.557301 39.8354 53.113499 66.391602 79.669701 92.9478 106.2259 117.5317 129.217 142.4951 155.77319 169.0513 182.32941 195.6075 208.8856 220.19141 231.87669 245.1548 258.43289 271.711 284.98911 298.26721 311.54529 324.82339 336.12921 347.81451 361.09259 374.3707 387.6488 400.92691 414.20499" y="111.9965">及其他业务合作伙伴、损害我们的声誉、违反适用法律法规，并使我们承担</tspan><tspan id="tspan42" x="0.0011 12.9569 25.912701 38.8685 51.824299 64.780098 77.735901 90.691704 103.6475 116.6033 129.5591 142.51489 155.4707 168.4265 181.38229 194.3381 207.2939 220.24969 233.20551 244.51131" y="127.996">可能属重大的额外成本及责任以及业务损失。</tspan></text>

.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="79.998596">于往绩记录期间及直至最后实际可行日期，我们并无根据相关法律法规</tspan><tspan id="tspan42" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 323.9841 337.03339 350.0827 361.38739 372.80319 385.85251" y="95.9981">规定按部分雇员实际工资水平向社保计划及住房公积金作出全额供款。截至</tspan><tspan id="tspan44" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 74.303902 85.719704 98.768997 111.8183 124.8676 137.9169 150.9662 164.0155 177.0648 190.11411 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="111.9976">最后实际可行日期，我们并未收到地方机构的任何通知或相关雇员的任何申</tspan><tspan id="tspan46" x="-28.347 -15.5903 -2.8336 9.9231005 21.228901 32.5336 45.290298 58.047001 70.803703 83.560402 96.317101 109.0738 121.8305 134.5872 147.3439 160.1006 172.8573 185.614 198.3707 211.1274 223.88409 236.64079 249.39751 262.15421 274.91089 287.6676 300.42429 313.181 324.48679 335.7926" y="127.9971">索或请求，要求我们就不足供款作出付款或对我们处以行政罚款。于</tspan></text>

<text id="text138" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0361,409.018)" xml:space="preserve"><tspan id="tspan134" x="0 13.1604 26.320801 39.481201 52.641602 65.802002 78.962402 92.122803 103.4286 114.9753 128.1357 141.2961 154.4565 167.6169 180.7773 193.9377 207.0981 220.2585 233.4189 246.5793 259.73969 271.0444 282.59109 295.7515 308.9119 322.0723 335.2327 348.3931 361.5535 374.7139 387.8743 401.0347 414.1951" y="0">我们需要多项批文、执照及许可证方可经营业务，而未能取得或更新任何该</tspan><tspan id="tspan136" x="0 12.9558 25.9116 37.2174 48.523201 61.479 74.434799 87.390602 100.3464 113.3022 126.258 139.21381 152.1696 165.1254 178.08121 191.037 203.9928 216.94859 229.9044 242.8602 255.81599 268.77179 281.7276 294.68341 307.63919 320.595 333.55081 346.50659 359.4624 372.41821 385.37399 398.3298 409.63559" y="15.9995">等批文、执照及许可证均可能对我们的业务及经营业绩造成重大不利影响。</tspan></text>
<text id="text158" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3831,361.0184)" xml:space="preserve"><tspan id="tspan140" x="0 13.2132 26.426399 39.639599 52.852798 66.066002 79.279198 92.492401 103.7982 115.4065 128.61971 141.8329 155.0461 168.25929 181.4725 194.6857 207.8989 221.11211 232.41679 244.0262 257.23941 270.45261 283.6658 296.879 310.09219 321.39691 333.00629 346.21951 359.43271 372.6459 385.8591" y="0">根据中国法律法规，我们须持有多项批文、执照及许可证，方可在中国</tspan><tspan id="tspan142" x="-28.347 -15.0964 -1.8458 11.4048 22.7106 34.3629 47.613499 60.864101 74.1147 85.420502 97.0728 110.3234 123.574 136.8246 150.0752 163.32581 176.5764 189.827 203.07761 216.3282 229.5788 236.25909 247.91251 261.16309 274.4137 287.66431 299.31659 306.34671 319.59729 332.8479 346.09851 359.34909 372.5997 385.85031" y="15.9995">经营业务。该等批文、执照及许可证在妥善遵守（其中包括）适用法律及法规</tspan><tspan id="tspan144" x="-28.348101 -15.07 -1.7919 11.4862 24.764299 36.070099 47.754299 61.032398 74.310501 87.5886 98.8955 110.5808 123.8589 137.13699 150.4151 163.69321 176.9713 190.2494 203.5275 216.8056 230.08369 243.3618 256.63989 269.918 283.19611 296.47421 309.75229 323.0304 336.3085 349.58661 360.8924 372.5766 385.85471" y="31.999001">后即可获得。该等批文、执照及许可证须接受有关部门的检查或核查，且仅</tspan><tspan id="tspan146" x="-28.348101 -15.3923 -2.4365001 10.5193 23.4751 36.430901 49.3867 62.342499 75.298302 88.254097 101.2099 114.1657 127.1215 140.0773 153.0331 165.98891 177.29469" y="47.998501">于固定期限内有效并须予续期及认证。</tspan><tspan id="tspan148" x="-0.0011 12.9712 25.943501 38.915798 51.8881 64.860397 77.832703 90.805 103.7773 116.7496 129.72189 142.6942 155.6665 168.63879 179.9446 191.2691 204.24139 217.2137 230.186 243.15829 256.13062 269.10291 282.0752 295.04749 308.01981 320.9921 333.96439 346.93671 359.909 372.88129 385.85361" y="79.998596">遵守政府法规可能需要大额费用，及任何违规行为均可能使我们承担责</tspan><tspan id="tspan150" x="-28.348101 -17.042299 -5.4956002 7.6648002 20.825199 33.9856 47.146 60.3064 71.611099 83.157799 96.318199 109.4786 122.639 135.79939 148.95979 162.12019 175.28059 188.44099 201.60139 214.7618 227.9222 241.0826 254.243 267.40341 280.56381 293.72421 306.88461 320.04501 333.20541 346.36581 359.52621 372.68661 385.84698" y="95.9981">任。倘有任何违规，我们或须产生大额费用及花费管理层大量时间及资源来</tspan><tspan id="tspan152" x="-28.348101 -15.125 -1.9019001 11.3212 24.5443 37.767399 49.0732 60.694698 73.917801 87.1409 100.364 113.5871 126.8102 140.03329 153.25639 166.47951 179.70261 192.9257 204.23151 215.853 229.07719 242.30029 255.52341 268.74649 281.9696 295.19269 308.4158 321.63889 334.862 348.08511 361.3082 374.53131 385.8371" y="111.9976">解决相关问题。相关店舖可能须暂时停业，直至符合所有法律及监管要求。</tspan><tspan id="tspan154" x="-28.348101 -15.2988 -2.2495 10.7998 23.8491 36.898399 49.947701 62.997002 76.046303 89.095596 102.1449 115.1942 128.2435 141.2928 154.3421 167.3914 178.6972 190.11189 203.16119 216.21049 229.2598 242.3091 255.3584 268.40771 281.457 294.50629 307.5556 320.60489 333.65421 346.70349 359.75281 372.80209 385.85141" y="127.9971">我们亦可能因该等问题招致负面报导，从而可能会对我们的业务及财务表现</tspan><tspan id="tspan156" x="-28.348101 -15.3923 -2.4365001 10.5193 23.4751 36.430901 49.3867 62.342499 73.6483" y="143.9966">产生重大不利影响。</tspan></text>

<text id="text36" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 257.77951 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">我们在为新店舖及新加工设施获取必要的批文、执照及许可证方面可能</tspan><tspan id="tspan28" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 36.071201 47.755402 61.033501 74.3116 87.589699 100.8678 112.1747 123.8589 137.13699 148.44279 160.1281 173.4062 186.6843 199.9624 213.24049 226.5186 239.79671 253.0748 266.35291 279.63101 292.90909 306.18719 319.4653 332.74341 346.02151 359.29959 372.5777 385.8558" y="15.9995">会遇到困难、延迟或失败。此外，我们无法保证未来能及时甚至无法取得或</tspan><tspan id="tspan30" x="-28.347 -15.081 -1.8150001 11.451 24.716999 37.983002 51.249001 64.514999 77.780998 91.046997 104.313 117.579 130.845 144.11099 157.377 168.6828 180.35271 193.6187 206.8847 220.1507 233.4167 246.68269 257.98849 269.65839 282.92441 296.1904 309.45639 322.72241 335.9884 349.25439 362.52039 374.19031 385.8602" y="31.999001">更新现有业务经营所需的所有批文、执照及许可证。倘我们未能获得及╱或</tspan><tspan id="tspan32" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 48.760799 60.307499 73.467903 86.628304 99.788696 112.9491 126.1095 137.4153 148.96091 162.12131 175.28169 188.44209 201.60249 214.76289 227.92329 241.08369 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="47.998501">延续所需批文、执照或许可证，则我们正在行的业务可能会中断及扩张计划</tspan><tspan id="tspan34" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 34.780899" y="63.998001">可能会延误。</tspan></text>
<text id="text40" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.039,617.0137)" xml:space="preserve"><tspan id="tspan38" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 207.2928 218.5986" y="0">未来的扩张计划面临不确定因素及风险。</tspan></text>
<text id="text68" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,585.0136)" xml:space="preserve"><tspan id="tspan42" x="0 13.2704 26.5408 39.811199 53.0816 66.351997 79.622398 92.892799 106.1632 114.719 126.3944 139.66479 152.9352 166.2056 179.476 192.7464 206.0168 219.2872 232.5576 245.828 259.09839 270.7738 279.70029 292.9707 306.24109 319.51151 332.78189 346.05231 359.32269 372.59311 385.86349" y="0">我们已在本招股章程「未来计划及所得款项用途」一节载列我们的未来</tspan><tspan id="tspan44" x="-28.347 -15.1866 -3.8819001 7.6648002 20.825199 33.9856 47.146 60.3064 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 244.552 257.7124 270.8728 284.0332 297.1936 310.354 321.65979 333.20541 346.36581 359.52621 372.68661 385.84698" y="15.9995">计划。我们的未来计划能否成功实施可能超出我们的控制之外，且部分未来</tspan><tspan id="tspan46" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 167.20441 178.7511 191.9115 205.0719 216.3766 227.92329 241.08369 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="31.999001">事件可能影响扩张计划的平稳运行，如法律、条例及法规合规变动相关的成</tspan><tspan id="tspan48" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 178.9458 191.9016 204.85741 217.8132 230.769 242.0748" y="47.998501">本变动及自政府取得必要的许可证及批文遭延误。</tspan><tspan id="tspan50" x="0 13.3056 26.6112 39.916801 53.222401 66.528 79.833603 93.139198 106.4448 119.7504 133.056 146.3616 159.66721 172.97279 186.2784 199.584 212.8896 226.19521 239.50079 252.8064 266.112 279.4176 292.72321 306.02881 319.33441 332.64001 345.94559 359.25119 372.55679 385.8624" y="79.998596">我们未来可能决定进入新的地区或市场或有选择性地在新市场寻求战</tspan><tspan id="tspan52" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 49.3493 61.033501 74.3116 87.589699 100.8678 114.1459 127.424 140.7021 153.98019 165.286 176.9713 190.2494 203.5275 216.8056 230.08369 243.3618 256.63989 267.94571 279.63101 292.90909 306.18719 319.4653 332.74341 346.02151 359.29959 372.5777 385.8558" y="95.9981">略收购或投资。我们在文化和习俗、法律和监管架构、竞争格局及客户偏好</tspan><tspan id="tspan54" x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 310.93481 322.2406 333.6553 346.70459 359.75391 372.80319 385.85251" y="111.9976">与现有市场不同的新地区或市场经营经验可能有限或并无经验。我们可能不</tspan><tspan id="tspan56" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 167.20441 178.7511 191.9115 203.2173 214.76289 227.92329 241.08369 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="127.9971">熟悉新市场当地的业务及监管环境，因此，我们可能未能遵守新监管规定或</tspan><tspan id="tspan58" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 138.42841" y="143.9966">吸引足够数量的客户实现盈利。</tspan><tspan id="tspan60" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 205.8903 217.2148 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="175.9967">概不能保证我们的扩张计划将会成功。倘我们未能准确预测实施扩张计</tspan><tspan id="tspan62" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 48.760799 60.307499 73.467903 86.628304 99.788696 112.9491 124.2549 135.80161 148.96201 162.12241 175.28281 188.44321 201.60361 214.76401 227.92439 241.08479 254.24519 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="191.9962">划所需的时间、劳工及成本，或倘我们在扩张后未能遵守新地区或市场的新</tspan><tspan id="tspan64" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 142.7382 155.89861 169.05901 180.36591 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 297.1947 310.3551 323.5155 336.6759 347.98169 359.52731 372.68771 385.84811" y="207.9957">监管规定或取得足够数量的销售订单，甚至根本无法取得销售订单，我们的</tspan><tspan id="tspan66" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 164.34" y="223.99519">业务及经营业绩可能受到不利影响。</tspan></text>
<text id="text72" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.039,329.0183)" xml:space="preserve"><tspan id="tspan70" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 192.687" y="0">我们对潜在损失及索偿的投保有限。</tspan></text>
<text id="text78" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,297.0182)" xml:space="preserve"><tspan id="tspan74" x="0 13.3056 26.6112 39.916801 53.222401 66.528 79.833603 93.139198 106.4448 119.7504 133.056 146.3616 159.66721 172.97279 186.2784 199.584 212.8896 226.19521 239.50079 252.8064 266.112 279.4176 292.72321 306.02881 319.33441 332.64001 345.94559 359.25119 372.55679 385.8624" y="0">我们已投购我们认为合乎我们业务规模及类型和符合所在行业标准商</tspan><tspan id="tspan76" x="-28.347 -15.3021 -2.2572 10.7877 23.8326 36.877499 49.922401 62.9673 76.012199 89.057098 100.3618 111.7721 124.817 137.86189 150.9068 163.95171 176.9966 190.0415 203.0864 216.1313 229.17619 242.2211 253.5269 264.93719 277.98209 291.02701 299.5817 310.9931 324.03799" y="15.9995">业常规的有限法定保险。有关我们保单的更多详情，请参阅「业务</tspan></text>
<text id="text84" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,453.1958,282.6687)" xml:space="preserve"><tspan id="tspan80" x="0" y="0">—</tspan><tspan id="tspan82" x="11.3047" y="1.65"> </tspan></text>
<text id="text92" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,468.9753,281.0187)" xml:space="preserve"><tspan id="tspan86" x="0 13.0449 24.4552 30.261" y="0">保险」。</tspan><tspan id="tspan88" x="-383.93631 -370.88699 -357.83771 -344.78839 -331.73911 -318.68979 -305.6405 -292.59119 -279.5419 -266.49261 -253.4433 -240.394 -229.0882 -217.67239 -204.62309 -191.57381 -178.52451 -165.4752 -152.4259 -139.3766 -126.3273 -113.278 -100.2287 -87.179398 -74.130096 -61.080799 -48.031502 -34.982201 -21.932899 -8.8836002 4.1657 17.215 30.264299" y="15.9995">倘我们被追究未投保的损失，则我们的业务及经营业绩可能会受到重大不利</tspan><tspan id="tspan90" x="-383.93631 -370.9805 -359.67471" y="31.999001">影响。</tspan></text>
<text id="text96" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.039,217.0196)" xml:space="preserve"><tspan id="tspan94" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 127.908 139.21271 152.1685 165.1243 178.08009 191.0359 203.9917 216.94749 229.90331 242.8591 255.8149 268.77069 281.7265 294.68231 307.63809 320.5939 333.54971 346.50549 359.4613 372.41711 385.37289 398.3287 409.63449" y="0">我们或会遭受自然灾害、战事或恐怖袭击或面临其他我们无法控制的因素。</tspan></text>
<text id="text106" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,185.0195)" xml:space="preserve"><tspan id="tspan98" x="0 12.9723 25.944599 38.916901 50.222698 61.547199 74.519501 87.491798 100.4641 113.4364 126.4087 139.381 152.3533 165.32561 178.2979 191.2702 204.24249 217.2148 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">自然灾害、战事或恐怖袭击或其他我们无法控制的因素可能对我们开展</tspan><tspan id="tspan100" x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 61.9212 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 242.6974 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811" y="15.9995">业务地区的经济、基础设施及民生产生不利影响。我们的业务经营可能受到</tspan><tspan id="tspan102" x="-28.347 -15.0326 -3.7268 8.0003004 21.314699 32.620499 44.347599 57.661999 70.976402 82.282204 94.0093 107.3237 120.6381 131.94389 143.67101 156.9854 170.2998 183.6142 196.9286 208.23441 219.9615 233.27589 244.5817 256.30881 269.6232 282.93759 296.25201 309.56641 322.8808 336.19519 347.50101 359.22809 372.54251 385.8569" y="31.999001">洪水、地震、沙尘暴、暴风雪、火灾或旱灾、电力、水量或燃料短缺、信息管</tspan><tspan id="tspan104" x="-28.347 -15.0689 -1.7908 11.4873 24.7654 38.043499 49.3493 61.033501 74.3116 87.589699 100.8678 114.1459 125.4517 137.13589 150.414 163.69209 176.9702 190.24831 203.5264 216.8045 230.0826 243.3607 256.63879 267.94351 279.62881 292.90689 306.185 319.4631 332.74121 346.01929 359.29739 372.5755 385.85361" y="47.998501">理系统的故障、失灵及崩溃、意外的维修或技术问题，或可能易受潜在战事</tspan></text>

<text id="text38" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,713.0118)" xml:space="preserve"><tspan id="tspan26" x="0 13.2781 26.5562 39.834301 53.1124 66.390503 79.668602 92.946701 104.2525 115.9378 129.2159 142.494 155.77209 169.0502 182.32829 195.6064 208.88451 222.1626 235.4407 248.7188 261.99689 275.27499 288.5531 301.83121 313.13809 324.8223 338.1004 349.40619 361.09149 374.3696 387.64771 400.92581 414.20389" y="0">或恐怖袭击的影响。严重的自然灾害可能造成人员伤亡、伤害、资产受损以</tspan><tspan id="tspan28" x="0 13.2231 26.446199 39.6693 52.892399 66.115501 79.3386 92.561699 105.7848 119.0079 132.231 143.5368 155.15829 168.38139 181.60451 194.82761 208.0507 221.2738 234.4969 247.72 260.94312 274.1662 287.38931 300.6124 313.83551 327.05859 340.28171 351.58749 363.20901 376.4321 389.65521 402.8783 414.18301" y="15.9995">及我们业务及经营的中断。战事或恐怖袭击亦会造成员工伤残、人员伤亡、</tspan><tspan id="tspan30" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 167.8974 179.3132 192.3625 205.4118 218.46111 231.51041 244.55969 257.60901 270.65829 283.70761 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="31.999001">业务网中断并破坏我们的市场。任意该等因素及其他我们无法控制的因素均</tspan><tspan id="tspan32" x="0 13.0493 26.0986 39.1479 52.197201 65.246498 78.295799 91.3451 104.3944 117.4437 130.493 143.5423 156.5916 169.6409 182.6902 195.7395 208.7888 220.0946 231.51041 244.55969 257.60901 270.65829 283.70761 296.7569 309.80621 322.8555 335.90479 348.9541 362.00339 375.0527 388.10199 401.15131 414.20059" y="47.998501">会对总体商业氛围及环境产生不利影响，为我们开展业务的地区带来不确定</tspan><tspan id="tspan34" x="0 13.2781 24.5839 36.269199 49.547298 62.825401 76.1035 89.381599 102.6597 115.9378 129.2159 142.494 155.77209 169.0502 182.32829 195.6064 208.88451 222.1626 235.4407 248.7188 260.0246 271.7099 284.98801 298.26611 311.54419 324.8223 338.1004 351.37851 364.65659 375.9624 387.64661 400.92471 414.20279" y="63.998001">因素，使我们的业务蒙受我们无法预测的损失，以及对我们的业务、财务状</tspan><tspan id="tspan36" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 179.7312" y="79.997498">况及经营业绩造成重大不利影响。</tspan></text>
<text id="text42" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,601.0142)" xml:space="preserve"><tspan id="tspan40" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 207.2928 220.2486 233.20441 246.1602 259.116 270.42181 281.7276 294.68341 307.63919 320.595 333.55081 346.50659 359.4624 370.76819" y="0">我们无法保证在日常业务过程中不会被卷入索赔、争议或法律程序。</tspan></text>
<text id="text64" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,569.0141)" xml:space="preserve"><tspan id="tspan44" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 117.8001 130.88901 143.97791 157.0668 170.1557 183.2446 196.3335 209.42239 222.51131 233.81599 245.2791 258.36801 271.45691 284.54581 297.6347 310.7236 323.8125 335.11829 346.58029 359.66919 372.75809 385.84698" y="0">我们不时会于日常业务过程中被卷入申索、争议或法律程序。其可能涉</tspan><tspan id="tspan46" x="-28.347 -21.6612 -10.2652 2.7676001 15.8004 28.8332 40.229198 47.005199 60.037998 73.070801 86.1036 99.136398 112.1692 125.202 138.2348 151.26759 164.3004 177.33321 190.366 203.3988 216.43159 229.4644 242.49719 255.53 268.56281 281.59561 294.62839 307.66119 320.694 333.72681 346.75961 359.79239 372.8252 385.858" y="15.9995">及（其中包括）有关泡泡玛特品牌产品及我们销售的第三方产品的产品质量事</tspan><tspan id="tspan48" x="-28.3459 -17.0401 -5.7343001 7.2160001 20.1663 33.1166 44.421299 55.7271 68.677399 79.9832 91.287903 104.2382 117.1885 130.13879 143.0891 156.0394 168.9897 181.94 194.8903 207.84061 220.79089 233.7412 246.6915 259.64182 270.9476 282.25339 295.2037 308.15399 321.10431 334.0546 347.00491 359.9552 372.90549 385.8558" y="31.999001">件、环境问题、违约、雇佣或劳工争议及侵犯知识产权。截至最后实际可行日</tspan><tspan id="tspan50" x="-28.3459 -17.0401 -5.6243 7.4250002 20.4743 33.523602 46.572899 59.6222 72.671501 85.720802 98.770103 111.8194 124.8687 137.918 150.9673 164.0166 177.0659 190.1152 203.16451 216.21381 229.26311 242.31239 255.36169 268.41101 281.4603 294.50961 307.5589 320.60818 333.6575 346.70679 359.7561 372.80539 385.85471" y="47.998501">期，我们并未被卷入任何可能会对我们的业务及经营业绩造成重大影响的诉</tspan><tspan id="tspan52" x="-28.3459 -15.1855 -2.0251 11.1353 24.2957 37.4561 48.761902 60.308601 73.469002 86.629402 99.789803 112.9502 126.1106 139.271 152.4314 165.5918 178.7522 191.9126 205.073 218.2334 231.3938 244.5542 257.7146 270.875 284.0354 297.1958 308.50049 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="63.998001">讼及法律程序。任何由我们发起或以我们为对象提出的申索、争议或法律程</tspan><tspan id="tspan54" x="-28.3459 -21.660101 -10.0078 3.2428 16.493401 29.743999 42.994598 56.245201 67.897499 74.928703 88.179298 101.4299 114.6805 127.9311 141.1817 154.4323 167.68291 180.9335 194.1841 207.43469 220.6853 233.9359 247.18649 258.49231 270.14459 283.3952 296.64581 309.89639 323.147 336.39761 349.64819 360.95291 372.60629 385.8569" y="79.997498">序（无论是否有理）都可能导致大量费用及资源转移，且倘若我们败诉，其可</tspan><tspan id="tspan56" x="-28.3459 -15.0678 -1.7897 11.4884 24.7665 38.044601 51.322701 64.6008 77.878899 91.156998 104.4351 115.7409 127.4262 140.7043 152.009 163.69431 176.9724 190.2505 203.52859 216.8067 230.08479 243.3629 254.6687 266.354 279.63211 292.91019 306.18829 319.4664 332.74451 346.02261 359.30069 372.5788 385.8569" y="95.997002">能会严重损害我们的声誉。此外，针对我们的申索、争议或法律程序可能是</tspan><tspan id="tspan58" x="-28.3459 -15.2966 -2.2472999 10.802 23.851299 36.9006 49.949902 62.999199 76.0485 89.097801 102.1471 115.1964 128.2457 141.295 154.3443 167.3936 180.4429 193.4922 206.5415 219.59081 232.64011 243.94591 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361" y="111.9965">由于我们的供应商向我们出售的缺陷产品而引起，且他们可能无法及时或根</tspan><tspan id="tspan60" x="-28.3459 -15.5716 -2.7973001 9.9770002 22.751301 35.5256 48.2999 61.0742 73.848503 86.622803 99.397102 112.1714 124.9457 137.72 149.0247 160.33051 173.1048 185.8791 198.6534 211.4277 224.202 236.9763 249.7506 262.5249 275.29919 288.07349 300.84781 313.6221 326.39639 339.17068 350.4765 361.78229 374.55661 385.8613" y="127.996">本无法全额赔偿我们因该等申索、争议及法律程序而招致的任何成本。例如，</tspan><tspan id="tspan62" x="-28.3459" y="143.9955">于</tspan></text>

<text id="text64" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,312.4259,697.0123)" xml:space="preserve"><tspan id="tspan44" x="0 13.3441 26.6882 40.032299 53.3764 66.720497 80.064598 93.408699 106.7528 120.0969 133.44099 146.7851 160.1292 173.4733 186.8174" y="0">在中国法律允许的情况下拥有独家</tspan><tspan id="tspan46" x="-227.38651 -214.3372 -201.2879 -188.2386 -175.1893 -162.14 -149.0907 -136.0414 -122.9921 -109.9428 -96.893501 -83.8442 -70.794899 -57.745602 -44.696301 -31.646999 -18.5977 -7.2919002 4.1238999 17.173201 30.2225 43.271801 56.321098 69.370399 82.419701 95.469002 108.5183 121.5676 134.6169 147.6662 160.7155 173.7648 186.8141" y="15.9995">购买权购买所有或部分葩趣互娱的股权，或要求葩趣互娱的任何现有股东根</tspan><tspan id="tspan48" x="-227.38651 -214.44279 -201.4991 -188.5554 -175.61169 -162.668 -149.7243 -136.78059 -123.8369 -110.8932 -97.949501 -85.005798 -72.062103 -59.118401 -46.174702 -33.230999 -20.2873 -7.3435998 5.6001 18.5438 31.487499 44.431198 57.374901 70.318604 83.262299 96.206001 109.1497 122.0934 135.03709 147.9808 160.9245 173.86819 186.8119" y="31.999001">据相关法律按我们的指示在任何时间将葩趣互娱的任何或部分股权转让予我</tspan><tspan id="tspan50" x="-227.38651 -214.2261 -201.0657 -187.9053 -174.7449 -161.5845 -148.4241 -135.2637 -122.1033 -108.9429 -95.782501 -82.622101 -69.4617 -58.155899 -46.6092 -33.448799 -20.288401 -7.1279998 6.0324001 19.192801 32.353199 45.513599 56.819401 68.364998 81.525398 94.685799 107.8462 121.0066 134.16701 147.32739 160.48779 173.64819 186.80859" y="47.998501">们指定的其他中国人士或实体。由于该等合约安排，我们是葩趣互娱的主要</tspan><tspan id="tspan52" x="-227.38651 -214.2261 -201.0657 -189.7599 -178.21429 -165.05389 -151.89349 -138.73309 -125.5727 -112.4123 -99.2519 -86.091499 -72.931099 -59.770699 -46.610298 -35.304501 -23.757799 -10.5974 2.563 15.7234 28.883801 42.044201 55.204601 68.364998 81.525398 94.685799 107.8462 121.0066 134.16701 147.32739 160.48779 173.64819 186.80859" y="63.998001">受益人，故将其经营业绩综合入账。葩趣互娱持有对我们的业务营运至关重</tspan><tspan id="tspan54" x="-227.38651 -214.43069 -201.4749 -188.5191 -175.56329 -162.6075 -151.3017 -139.9959 -127.0401 -114.0843 -101.1285 -88.172699 -75.216904 -62.261101 -50.955299" y="79.997498">要的若干牌照、批文及主要资产。</tspan><tspan id="tspan56" x="-199.03951 -185.7339 -172.4283 -159.1227 -145.81709 -132.51151 -119.2059 -105.9003 -92.594704 -79.289101 -65.983498 -52.677898 -39.372299 -26.0667 -12.7611 0.54449999 13.8501 27.155701 40.4613 53.766899 67.072502 80.378098 93.683701 106.9893 120.2949 133.60049 146.9061 160.2117 173.5173 186.82291" y="111.9976">倘中国政府发现我们的合约安排未遵守外商投资业务限制或倘中国政</tspan><tspan id="tspan58" x="-227.38651 -214.44279 -201.4991 -188.5554 -175.61169 -162.668 -149.7243 -136.78059 -123.8369 -110.8932 -97.949501 -85.005798 -72.062103 -59.118401 -46.174702 -33.230999 -20.2873 -7.3435998 5.6001 18.5438 31.487499 44.431198 57.374901 70.318604 83.262299 96.206001 109.1497 122.0934 135.03709 147.9808 160.9245 173.86819 186.8119" y="127.9971">府另外发现我们或葩趣互娱违反中国法律或法规或缺少经营业务所必需的许</tspan><tspan id="tspan60" x="-227.38651 -214.2261 -201.0657 -187.9053 -174.7449 -163.4391 -151.89349 -138.73309 -125.5727 -112.4123 -99.2519 -87.945 -76.399399 -63.238998 -50.078602 -36.918201 -23.757799 -10.5974 2.563 15.7234 28.883801 42.044201 55.204601 68.364998 81.525398 94.685799 107.8462 121.0066 134.16701 147.32739 160.48779 173.64819 186.80859" y="143.9966">可证或牌照，包括商务部、工信部及文化旅游部在内的相关中国监管机构对</tspan><tspan id="tspan62" x="-227.38651 -214.43069 -201.4749 -188.5191 -175.56329 -162.6075 -149.6517 -136.69591 -123.7401 -110.7843 -97.828499 -84.872704 -71.916901 -58.961102 -46.005299 -33.0495 -20.0937 -7.1378999 4.1679001 15.4737 28.429501 41.3853 54.341099 67.296898 80.252701 91.558502" y="159.99609">处理该触犯或违反行为有极大自由裁量权，包括但不限于：</tspan></text>

<text id="text108" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,141.7323,361.0162)" xml:space="preserve"><tspan id="tspan104" x="0 13.2407 26.4814 39.722099 52.962799 66.203499 79.444199 92.684898 105.9256 119.1663 132.407 145.64771 158.8884 172.1291 185.3698 198.6105 211.8512 225.0919 238.3326 251.5733 264.814 278.05469 291.29541 304.5361 317.77679 331.01749 344.25821 357.4989" y="0">要求我们或我们的中国附属公司及葩趣互娱重组相关拥有权架构</tspan><tspan id="tspan106" x="0 12.9558 25.9116 37.2174" y="15.9995">或经营；</tspan></text>
<text id="text112" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,313.0166)" xml:space="preserve"><tspan id="tspan110" x="0 4.1557999" y="0">• </tspan></text>
<text id="text118" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,141.7323,313.0166)" xml:space="preserve"><tspan id="tspan114" x="0 13.2407 26.4814 39.722099 52.962799 66.203499 79.444199 92.684898 105.9256 119.1663 132.407 145.64771 158.8884 172.1291 185.3698 198.6105 211.8512 225.0919 238.3326 251.5733 264.814 278.05469 291.29541 304.5361 317.77679 331.01749 344.25821 357.4989" y="0">限制或禁止我们使用首次公开发售或其他融资活动所得款项来为</tspan><tspan id="tspan116" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 179.7323 191.0381" y="15.9995">葩趣互娱的业务及营运提供资金；或</tspan></text>
<text id="text122" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,265.017)" xml:space="preserve"><tspan id="tspan120" x="0 4.1557999" y="0">• </tspan></text>
<text id="text140" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,141.7323,265.017)" xml:space="preserve"><tspan id="tspan124" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 207.2928 220.2486 233.20441 246.1602 259.116 270.42181" y="0">采取可能会损害我们业务的其他监管或执法行动。</tspan><tspan id="tspan126" x="-28.3459 -15.7773 -3.2086999 9.3599005 21.928499 34.497101 47.065701 59.6343 72.202904 84.7715 97.340103 109.9087 122.4773 135.0459 147.6145 160.18311 172.75169 185.3203 197.8889 210.4575 223.02609 235.5947 246.9005 258.2052 270.7738 283.34241 295.91101 308.47961 321.04819 333.61679 346.18539 357.49121" y="32.000099">任何该等行动均会对我们的业务经营构成重大干扰，并会对我们的业务、</tspan><tspan id="tspan128" x="-56.692902 -43.532501 -30.372101 -17.2117 -4.0513 9.1091003 22.269501 35.429901 48.590302 61.750702 74.911102 88.071503 101.2319 114.3923 127.5527 140.7131 153.8735 165.17931 176.726 189.8864 201.1922 212.73779 225.89819 239.05859 252.21899 265.37939 278.53979 291.7002 304.8606 318.021 331.1814 344.3418 357.5022" y="47.999599">财务状况及经营业绩造成重大不利影响。此外，倘中国政府部门发现我们的</tspan><tspan id="tspan130" x="-56.692902 -43.532501 -30.372101 -17.2117 -4.0513 9.1091003 22.269501 35.429901 48.590302 61.750702 74.911102 88.071503 101.2319 114.3923 127.5527 138.85851 150.4052 163.5656 176.726 189.8864 203.0468 214.3515 225.89819 239.05859 252.21899 265.37939 278.53979 291.7002 304.8606 318.021 331.1814 344.3418 357.5022" y="63.9991">法律架构及合约安排违反中国法律、规定及法规，尚不明确中国政府采取的</tspan><tspan id="tspan132" x="-56.692902 -43.749199 -30.8055 -17.861799 -4.9180999 8.0256004 20.969299 33.912998 46.856701 59.8004 72.744102 85.687798 98.6315 111.5752 124.5189 137.4626 150.4063 163.35001 176.2937 189.2374 202.18111 215.1248 228.0685 241.01221 253.9559 266.8996 279.84329 292.78699 305.73071 318.67441 331.6181 344.5618 357.50549" y="79.998596">行动将会对我们及我们将葩趣互娱的财务业绩综合入账至我们综合财务报表</tspan><tspan id="tspan134" x="-56.692902 -43.532501 -30.372101 -17.2117 -4.0513 9.1091003 22.269501 35.429901 48.590302 59.897202 71.442802 84.603203 97.763603 110.924 124.0844 137.2448 150.4052 163.5656 176.726 189.8864 203.0468 216.2072 229.3676 242.528 255.6884 268.84879 282.00919 295.16959 308.32999 321.49039 332.7962 344.3429 357.5033" y="95.9981">的能力产生何种影响。倘任何处罚导致我们无法管理葩趣互娱的活动，从而</tspan><tspan id="tspan136" x="-56.692902 -43.540199 -30.387501 -17.2348 -4.0820999 9.0705996 22.223301 35.375999 48.528702 61.6814 74.834099 87.986801 99.524696 111.0626 124.2153 137.368 150.52071 163.6734 176.8261 189.97881 203.1315 216.28419 229.4369 242.5896 255.74229 268.89499 282.0477 295.20041 308.35309 319.65891 331.19681 344.34949 357.5022" y="111.9976">极大影响彼等的经济表现及╱或我们不能从葩趣互娱收取经济利益，我们未</tspan><tspan id="tspan138" x="-56.692902 -43.737099 -30.7813 -17.8255 -4.8697 8.0860996 21.041901 33.9977 46.953499 59.909302 72.865097 85.8209 98.776703 111.7325 124.6883 137.6441 150.5999 163.55569 176.51151 189.4673 202.4231 215.37891 228.3347 241.2905 254.24631 267.20209 280.1579 293.11371 306.06949 319.0253 331.98111 343.2869" y="127.9971">必能根据国际财务报告准则将葩趣互娱综合入账至我们的综合财务报表。</tspan></text>
