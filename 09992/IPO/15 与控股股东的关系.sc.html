<text id="text36" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,141.7319,713.0118)" xml:space="preserve"><tspan id="tspan30" x="0 13.2407 26.4814 39.722099 52.962799 66.203499 79.444199 92.684898 105.9256 119.1663 132.407 145.64771 158.8884 172.1291 185.3698 198.6105 211.8512 225.0919 238.3326 251.5733 264.814 278.05469 291.29541 304.5361 317.77679 331.01749 344.25821 357.4989" y="0">倘本集团与董事或彼等各自的联系人将订立的任何交易产生潜在</tspan><tspan id="tspan32" x="0 13.376 26.752001 40.127998 51.4338 63.233501 76.609497 89.985497 103.3615 116.7375 130.11349 143.4895 156.86549 170.2415 183.61749 196.9935 210.36951 223.7455 237.12151 250.4975 263.8735 277.24951 290.62549 304.0015 317.3775 330.75351 344.12949 357.50549" y="15.9995">利益冲突，则有利益关系的董事须于本公司相关董事会会议上就</tspan><tspan id="tspan34" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 194.33701 205.64281 216.94859" y="31.999001">有关交易投票前申报有关利益的性质；及</tspan></text>

<text id="text52" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,141.7319,649.0127)" xml:space="preserve"><tspan id="tspan42" x="0 13.2407 26.4814 39.722099 52.962799 66.203499 79.444199 92.684898 105.9256 119.1663 132.407 145.64771 158.8884 172.1291 185.3698 198.6105 211.8512 225.0919 238.3326 251.5733 264.814 278.05469 291.29541 304.5361 317.77679 331.01749 344.25821 357.4989" y="0">我们已采纳一系列企业管治措施以管理本集团与控股股东之间的</tspan><tspan id="tspan44" x="0 13.0856 26.1712 39.256802 45.941502 57.399101 70.484703 81.942299 87.7481 99.206802 112.2924 125.378 138.46359 151.54919 164.6348 177.7204 190.806 203.8916 216.9772 230.06281 243.14841 254.45419 265.9118 278.99741 292.08301 305.16861 318.25421 331.33981 344.42542 357.51099" y="15.9995">利益冲突（如有），为我们的独立管理提供支持。进一步详情请参阅</tspan><tspan id="tspan46" x="0 12.9558 25.9116 38.867401 47.423199 58.727901 70.033699 82.989502 95.945297 108.9011 121.8569 134.8127 146.1185 151.9232" y="31.999001">本节下文「－企业管治措施」。</tspan><tspan id="tspan48" x="-28.3459 -15.257 -2.1681001 10.9208 24.009701 37.098598 48.403301 59.866402 72.955299 86.044197 99.133102 110.4389 121.9009 134.98981 148.0787 161.1676 174.2565 187.3454 200.4343 213.52319 226.61211 239.701 252.7899 265.87881 278.96771 292.05661 305.14551 318.23441 331.3233 344.4122 357.5011" y="63.9991">根据上文所述，董事认为，董事会整体连同我们的高级管理层团队能独</tspan><tspan id="tspan50" x="-56.692902 -43.737099 -30.7813 -17.8255 -4.8697 8.0860996 21.041901 33.9977 46.953499 59.909302 72.865097 85.8209 97.126701" y="79.998596">立于控股股东履行管理职责。</tspan></text>
<text id="text56" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.039,537.014)" xml:space="preserve"><tspan id="tspan54" x="0 12.9558 25.9116 38.867401" y="0">营运独立</tspan></text>
<text id="text76" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,505.0139)" xml:space="preserve"><tspan id="tspan58" x="0 13.2517 26.503401 39.7551 53.006802 66.258499 79.510201 92.761902 106.0136 119.2653 132.517 145.76871 159.0204 170.3262 181.9807 195.23241 208.4841 215.1732 226.8277 240.07941 253.3311 266.58279 279.8345 293.08621 306.33789 319.5896 332.84131 346.09299 359.3447 372.59641 385.84811" y="0">本集团并不依赖控股股东营运。本公司（透过附属公司及中国营运实体</tspan><tspan id="tspan60" x="-28.3459 -15.0469 -1.7479 11.5511 23.260599 30.3512 43.6502 56.9492 70.248199 83.547203 96.846199 110.1452 123.4442 136.74319 150.04221 163.3412 176.6402 189.93919 203.2382 216.5372 229.8362 243.13519 254.44099 266.15051 279.44949 292.7485 306.04749 319.3465 332.64551 345.94449 359.2435 372.54251 385.84149" y="15.9995">葩趣互娱）持有经营我们业务必要的所有相关牌照，并拥有必要的所有相关</tspan><tspan id="tspan62" x="-28.3459 -15.3956 -2.4453001 10.505 23.455299 36.405602 49.3559 62.306198 75.2565 86.562302 97.866997 110.8173 123.7676 136.7179 149.6682 162.6185 175.5688 188.5191 201.46941 212.77521 224.08099 237.0313 248.3371 259.64182 272.5921 285.54239 298.49271 311.44299 322.74881 334.0546 347.00491 359.9552 372.90549 385.8558" y="31.999001">知识产权及研发设施。我们拥有充足的资金、设施、设备及雇员，可独立于控</tspan><tspan id="tspan64" x="-28.3459 -15.1855 -2.0251 11.1353 24.2957 37.4561 50.616501 61.922298 73.467903 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 255.86 267.40561 280.56601 293.72641 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="47.998501">股股东经营业务。我们亦拥有独立的渠道接触客户，并拥有独立管理层团队</tspan><tspan id="tspan66" x="-28.3459 -15.3901 -2.4342999 10.5215 23.477301 36.433102 49.388901 60.694698" y="63.998001">经营我们的业务。</tspan><tspan id="tspan68" x="0.0011 13.2143 24.518999 36.128399 49.341599 62.554798 75.767998 88.981201 102.1944 113.5002 125.1085 138.3217 151.5349 164.74809 177.9613 191.1745 204.3877 217.60091 230.8141 244.0273 257.24051 270.4537 283.6669 296.8801 310.09329 323.30649 334.61121 346.22061 359.43381 372.647 385.8602" y="95.9981">此外，根据合约安排，董事获授权行使相关股东的所有权利。本集团有</tspan><tspan id="tspan70" x="-28.3459 -15.2966 -2.2472999 10.802 23.851299 36.9006 49.949902 62.999199 76.0485 89.097801 102.1471 115.1964 128.2457 141.295 154.3443 167.3936 180.4429 193.4922 206.5415 219.59081 232.64011 245.68941 258.73871 271.78799 284.83731 297.8866 310.93591 323.9852 337.03448 350.0838 361.38849 372.80429 385.85361" y="111.9976">权享受葩趣互娱的所有经济利益及对葩趣互娱的营运行使管理控制权。根据</tspan><tspan id="tspan72" x="-28.3459 -15.1855 -2.0251 11.1353 24.2957 37.4561 50.616501 61.922298 73.467903 86.628304 99.788696 112.9491 126.1095 139.2699 152.4303 165.5907 178.7511 191.9115 205.0719 218.2323 231.3927 244.5531 257.7135 270.8739 284.0343 295.34009 306.88681 320.04721 333.20761 346.36801 359.52841 372.68881 385.84921" y="127.9971">独家购买权协议，本公司已获授一项不可撤销及独家权利，以按名义价购买</tspan><tspan id="tspan74" x="-28.3459 -15.3736 -2.4013 10.571" y="143.9966">葩趣互娱</tspan></text>
<text id="text80" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,136.6389,361.0173)" xml:space="preserve"><tspan id="tspan78" x="0 6.4218001 12.8436 19.2654" y="0">100%</tspan></text>
<text id="text92" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,167.3696,361.0173)" xml:space="preserve"><tspan id="tspan82" x="0 12.9723 25.944599 38.916901 51.889198 58.577202 69.901703 82.874001 95.846298 108.8186 121.7909 134.7632 147.7355 160.70779 172.0334 177.8425 189.16811 202.1404 215.1127 228.08501 241.0573 254.0296 267.00189 279.97421 292.9465 305.91879 318.89111 331.8634" y="0">股权及资产（并非由本集团拥有），除非相关政府机关或中国法</tspan><tspan id="tspan84" x="-82.329498 -69.223 -56.116501 -43.009998 -29.9035 -16.797001 -3.6905 9.4160004 22.522499 35.629002 48.7355 61.841999 74.948502 88.055 99.360802 110.8437 123.9502 137.0567 150.16319 163.2697 176.37621 189.4827 202.5892 215.69569 228.8022 241.90871 255.0152 268.1217 281.22821 294.33469 307.44119 320.5477 331.85349" y="15.9995">律要求使用另一金额作为购买价，则采用该要求下的最低金额作为购买价。</tspan><tspan id="tspan86" x="-82.329498 -69.051399 -57.745602 -46.060299 -32.7822 -19.504101 -6.2259998 7.0521002 20.3302 33.608299 46.886398 60.164501 73.442596 86.720703 98.025398 109.7107 122.9888 136.26691 149.545 162.8231 176.1012 189.3793 202.65739 215.9355 229.21359 242.4917 255.76981 269.04791 282.32599 295.6041 308.8822 320.18799 331.87329" y="31.999001">此外，根据独家咨询和服务协议，鉴于葩趣互娱向本公司提供咨询服务，本</tspan><tspan id="tspan88" x="-82.329498 -69.373703 -56.4179 -43.462101 -30.5063 -17.550501 -4.5946999 8.3611002 21.3169 34.272701 47.2285 60.184299 73.140099 86.095901 99.051697 112.0075 124.9633 137.9191 150.87489 163.8307 176.7865 189.74229 202.6981 215.6539 228.6097 241.56551 252.87131" y="47.998501">公司拥有葩趣互娱所开发的所有知识产权的独家及专有权利。</tspan><tspan id="tspan90" x="-53.982498 -41.026699 -28.0709 -15.1151 -2.1593001 10.7965 22.102301 33.407001 46.362801 59.3186 72.274399 83.5802 94.884903 107.8407 120.7965 133.7523 146.7081 159.66389 172.61971 185.5755 198.5313 211.48711 224.4429 237.3987 248.7056" y="79.998596">根据上文所述，董事认为，我们能独立于控股股东营运。</tspan></text>

<text id="text46" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.3864,681.0117)" xml:space="preserve"><tspan id="tspan30" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 179.94569 191.2702 204.24249 217.2148 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="0">本集团拥有独立的财务申报系统，并根据本集团自身的业务需要作出财</tspan><tspan id="tspan32" x="-28.347 -15.6706 -2.9942 8.3115997 19.617399 32.2938 44.9702 57.646599 70.322998 82.999397 95.675797 108.3522 121.0286 133.705 146.38139 159.0578 171.73421 184.4106 197.08701 209.7634 222.4398 235.1162 247.7926 260.46899 273.14539 285.82181 298.4982 311.17459 323.85101 336.5274 349.2038 361.88019 374.55661 385.8624" y="15.9995">务决策。我们拥有内部控制及会计系统以及独立的财务部门以履行司库职能。</tspan><tspan id="tspan34" x="-28.347 -15.1195 -1.892 11.3355 24.563 37.790501 49.096298 60.7211 73.947502 87.175003 100.4025 113.63 126.8575 140.08501 153.3125 166.53999 179.7675 192.995 206.2225 219.45 232.67751 245.905 259.13251 265.80731 277.4321 290.65851 303.88489 317.1113 328.73611 334.5441 346.16891 359.39529 372.6228 385.84921" y="31.999001">更为重要的是，我们已经并有能力自第三方取得融资（如有必要），而毋须依</tspan><tspan id="tspan36" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 47.737801" y="47.998501">赖于控股股东。</tspan><tspan id="tspan38" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 179.94569 191.2702 204.24249 217.2148 230.1871 243.15939 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="79.998596">于往绩记录期间及截至上市日期，概无控股股东或彼等各自的联系人提</tspan><tspan id="tspan40" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 177.29581" y="95.9981">供或获授的未偿还贷款或未解除担保。</tspan><tspan id="tspan42" x="0 13.0889 26.177799 39.266701 52.355598 65.444504 76.749199 88.212303 101.3012 114.3901 127.479 138.78481 150.2468 163.33569 176.42461 189.5135 202.6024 215.6913 228.7802 241.86909 254.95799 268.04691 281.1358 294.2247 307.3136 320.4025 333.49139 346.58029 359.66919 372.75809 385.84698" y="127.9982">根据上文所述，董事认为，董事及高级管理层能在上市后独立于控股股</tspan><tspan id="tspan44" x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 178.9458 191.9016 204.85741 217.8132 230.769 243.72479 256.6806 269.63641 280.9422" y="143.9977">东且在并无过分依赖控股股东的情况下经营我们的业务。</tspan></text>

<text id="text78" style="font-variant:normal;font-size:12px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,85.0394,409.139)" xml:space="preserve"><tspan id="tspan76" x="0 14.1336 28.2672 42.400799 56.534401 70.667999" y="0">企业管治措施</tspan></text>
<text id="text86" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,377.012)" xml:space="preserve"><tspan id="tspan80" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 116.6022 129.558 142.51379 155.4696 168.4254 181.3812 192.687 203.9928 216.94859 229.9044 242.8602 255.81599 268.77179 281.7276 294.68341 307.63919 320.595 333.55081 346.50659 357.81241" y="0">本公司将遵守企业管治守则的条文，当中载列良好企业管治原则。</tspan><tspan id="tspan82" x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 246.47369 259.44601 270.7518 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471" y="32.000099">董事深知良好企业管治对保护股东权益的重要性。我们将采取以下措施</tspan><tspan id="tspan84" x="-28.347 -15.5793 -2.8116 9.9561005 22.723801 35.491501 48.259201 61.026901 73.794601 86.562302 99.330002 110.6358 121.9405 134.70821 147.47591 160.24361 173.01131 185.77901 198.54671 211.31441 224.08211 236.84979 249.61749 262.38519 275.15289 287.92059 300.68829 313.45599 326.22369 338.99139 351.75909 364.52679 377.29449 388.60031" y="47.999599">以保障良好企业管治标准，并避免本集团与控股股东之间出现潜在利益冲突：</tspan></text>
<text id="text90" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,297.0123)" xml:space="preserve"><tspan id="tspan88" x="0 3.9688001 10.3906 14.3594" y="0">(a) </tspan></text>
<text id="text98" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,141.7319,297.0123)" xml:space="preserve"><tspan id="tspan92" x="0 13.376 26.752001 40.127998 53.504002 66.879997 80.255997 93.632004 107.008 120.384 133.75999 147.136 160.51199 173.888 187.26401 200.64 214.01601 225.32291 237.1226 250.4986 263.8746 277.25061 290.62659 304.00259 317.3786 330.75461 344.13062 357.50659" y="0">倘在举行股东大会审议所提议的交易中，控股股东或其任何联系</tspan><tspan id="tspan94" x="0 13.0064 26.0128 39.019199 52.0256 65.031998 78.038399 91.0448 104.0512 117.0576 128.3634 139.72971 152.7361 165.74249 178.7489 191.75529 204.7617 217.7681 230.77451 243.7809 256.78729 269.7937 282.80011 295.80649 308.8129 320.11871 331.48499 344.49139 357.4978" y="15.9995">人于当中拥有重大权益，则控股股东将不得就决议案投票，且不应</tspan><tspan id="tspan96" x="0 12.9558 25.9116 38.867401 51.8232 64.778999 77.734802 90.690598 103.6464 114.9522" y="31.999001">计入投票的法定人数；</tspan></text>

<text id="text114" style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:Arial;-inkscape-font-specification:ArialMT;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,113.386,169.0141)" xml:space="preserve"><tspan id="tspan112" x="0 3.9688001 9.7746 13.7434" y="0">(c) </tspan></text>
<text id="text120" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,141.7319,169.0141)" xml:space="preserve"><tspan id="tspan116" x="0 13.2407 26.4814 39.722099 52.962799 66.203499 79.444199 92.684898 105.9256 119.1663 132.407 145.64771 158.8884 172.1291 185.3698 198.6105 211.8512 225.0919 238.3326 251.5733 264.814 278.05469 291.29541 304.5361 317.77679 331.01749 344.25821 357.4989" y="0">独立非执行董事将每年审阅本集团与控股股东之间有否出现利益</tspan><tspan id="tspan118" x="0 13.1428 19.827499 25.633301" y="15.9995">冲突（「</tspan></text>
<text id="text124" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Bold-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Bold-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,178.8921,153.0146)" xml:space="preserve"><tspan id="tspan122" x="0 13.1428 26.285601 39.428398" y="0">年度审阅</tspan></text>
<text id="text130" style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none" transform="matrix(1,0,0,-1,229.8452,153.0146)" xml:space="preserve"><tspan id="tspan126" x="0 5.8058 11.6116 23.1374 36.280201 49.423 62.5658 75.708603 88.851402 101.9942 115.137 128.2798 141.42261 152.72729 164.2531 177.3959 190.5387 203.6815 216.8243 229.9671 243.10989 256.25269 269.39551" y="0">」），并提供公正及专业意见，以保障少数股东的利</tspan><tspan id="tspan128" x="-88.112198 -76.806396" y="15.9995">益；</tspan></text>
