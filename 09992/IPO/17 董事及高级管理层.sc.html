         y="15.9995"
         id="tspan36">但可选择偏离以下规定：主席及行政总裁的职责应区别开来，不应由同一个</tspan><tspan
         x="-176.8701 -163.592 -150.3139 -139.0081 -127.3228 -114.0447 -100.7666 -87.488503 -74.210403 -60.932301 -47.654202 -34.376099 -21.098 -7.8199 5.4582 18.7363 32.0144 45.2925 58.570599 71.848701 83.154503 94.839798 108.1179 121.396 134.6741 147.95219 161.2303 174.50841 187.7865 201.06461 214.3427 225.6474 237.3327"

         id="tspan38">人履行。我们的主席及行政总裁并未区别开来，目前由王先生同时兼任。董</tspan><tspan

         y="47.998501"
         id="tspan40">事会认为，由同一人士担任主席及行政总裁可确保本集团的领导贯彻一致，</tspan><tspan
         x="-176.8701 -163.7097 -150.5493 -137.3889 -124.2285 -111.0681 -97.9077 -84.747299 -71.586899 -58.426498 -45.266102 -32.105701 -18.945299 -5.7849002 7.3755002 20.5359 33.696301 46.856701 60.017101 73.177498 84.483299 96.029999 109.1904 122.3508 135.5112 148.6716 159.9763 171.52299 184.6834 197.8438 211.0042 224.1646 237.325"
         y="63.998001"
         id="tspan42">令本集团实现更为有效及高效的整体战略规划。董事会认为，现有安排的权</tspan><tspan

         y="79.997498"
         id="tspan44">力及权限平衡不会受损，且此架构可令本公司及时有效地作出及实施决策。</tspan><tspan
         x="-176.8701 -163.8208 -150.7715 -137.7222 -124.6729 -111.6236 -98.574303 -85.525002 -72.4757 -59.426399 -46.377102 -33.327801 -20.2785 -7.2291999 5.8200998 18.8694 31.918699 44.967999 56.2738 67.689598 80.738899 93.7882 106.8375 119.8868 132.9361 145.9854 159.0347 172.084 185.1333 198.1826 211.2319 224.2812 237.33051"
         y="95.997002"
         id="tspan46">董事会将持续检讨并考虑本集团整体情况，于合适的时间分离本公司董事会</tspan><tspan

         x="-100.3761 -87.326797 -74.277496 -61.228199 -48.178902 -35.129601 -22.080299 -10.7745 0.64130002 13.6906 26.739901 39.7892 52.838501 65.887802 78.937103 91.986397 105.0357 118.085 131.13429 144.18359 157.23289 170.2822 183.3315 196.3808 209.4301 222.4794 235.5287 248.578 261.62729 274.67661 287.72589 300.77521 313.82449"
         y="63.9991"
         id="tspan86">任董事任何款项，作为彼等失去本集团任何成员公司董事职位或有关管理本</tspan><tspan
         x="-100.3761 -88.031898 -75.687698 -63.343498 -50.999298 -38.655102 -26.3109 -13.9667 -1.6224999 10.7217 23.065901 35.410099 47.754299 60.098499 72.442703 84.786903 97.131104 109.4753 121.8195 134.1637 145.409 156.6532 168.99741 180.24159 191.48579 203.83 216.17419 228.5184 240.86259 253.2068 265.55099 277.8952 290.23941 302.58359 313.82779"
         y="79.998596"
         id="tspan88">集团任何成员公司事务的任何其他职位的补偿。同期，概无董事放弃任何薪酬。</tspan></text>
    <text
       xml:space="preserve"
       transform="matrix(1,0,0,-1,85.0394,537.139)"

         y="0"
         id="tspan92">董事会多元化政策</tspan></text>
    <text
       xml:space="preserve"
       transform="matrix(1,0,0,-1,113.386,505.012)"
       style="font-variant:normal;font-size:11px;font-family:MHeiHK-Light-ETen-B5-H-Identity;-inkscape-font-specification:MHeiHK-Light-ETen-B5-H-Identity-H;writing-mode:lr-tb;fill:#231916;fill-opacity:1;fill-rule:nonzero;stroke:none"
       id="text124"><tspan
         x="0 12.9723 25.944599 38.916901 51.889198 64.861504 77.833801 90.806099 103.7784 116.7507 129.72301 142.6953 155.6676 168.63989 181.6122 194.5845 207.55679 220.5291 233.5014 244.80721 256.13171 269.104 282.07629 295.04861 308.0209 320.99319 333.96552 346.93781 359.9101 372.88239 385.85471"
         y="0"
         id="tspan96">为改善董事会有效性及维持高标准企业管治，我们已采纳董事会多元化</tspan><tspan
         x="-28.347 -15.1866 -3.8819001 7.6648002 20.825199 33.9856 47.146 60.3064 73.466797 86.627197 99.787598 112.948 126.1084 139.2688 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 244.552 257.7124 270.8728 284.0332 297.1936 310.354 323.5144 334.82019 346.36691 359.52731 372.68771 385.84811"
         y="15.9995"
         id="tspan98">政策，当中载有指导我们达致并维持董事会多元化的目标及方法。根据董事</tspan><tspan
         x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 48.205299 59.621101 72.670403 85.719704 98.768997 111.8183 124.8676 137.9169 150.9662 164.0155 177.0648 190.11411 203.16341 216.21271 229.26199 242.31129 255.3606 268.40991 281.4592 294.50851 307.5578 320.60709 333.6564 346.70569 359.755 372.80429 385.85361"
         y="31.999001"
         id="tspan100">会多元化政策，我们通过在筛选董事会候选人时考虑多项因素来寻求达致董</tspan><tspan
         x="-28.347 -15.0326 -1.7182 11.5962 24.910601 36.2164 47.943501 61.2579 74.572304 87.886703 101.2011 114.5155 127.8299 141.1443 152.4501 164.1772 177.49159 188.79739 200.52451 213.8389 225.1447 236.8718 250.1862 263.50061 276.815 288.12079 299.8479 313.16229 324.46811 336.19519 349.50961 360.8154 372.54251 385.8569"
         y="47.998501"
         id="tspan102">事会多元化，包括但不限于性别、技能、年龄、专业经验、知识、文化、教育</tspan><tspan
         x="-28.347 -15.1866 -3.8819001 7.6648002 20.825199 33.9856 47.146 60.3064 73.466797 86.627197 97.932999 109.4797 122.6401 135.80051 148.96091 162.12131 175.28169 188.44209 201.60249 214.76289 227.92329 241.08369 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811"
         y="63.998001"
         id="tspan104">背景、种族及服务年期。最终是否委任将基于所选候选人将对董事会作出的</tspan><tspan
         x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 60.6936"
         y="79.997498"
         id="tspan106">价值及贡献而定。</tspan><tspan
         x="0 13.0317 26.0634 39.0951 52.126801 65.158501 78.190201 91.221901 104.2536 117.2853 130.317 143.34869 156.3804 169.41209 182.4438 195.47549 208.5072 221.53889 234.5706 247.60229 260.634 271.93869 283.33359 296.3653 309.397 322.42871 335.46039 348.4921 361.5238 374.55551 385.8602"
         y="111.9976"
         id="tspan108">董事会目前由两名女性董事及七名男性董事组成，知识技能搭配平衡，</tspan><tspan
         x="-28.347 -15.2977 -2.2484 10.8009 23.850201 36.899502 49.948799 62.9981 76.047401 89.096703 102.146 115.1953 128.2446 141.2939 154.3432 167.3925 180.4418 193.4911 206.54041 219.58971 232.63901 245.68829 258.73761 271.7869 284.83621 297.8855 309.19131 320.60599 333.6553 346.70459 359.75391 372.80319 385.85251"
         y="127.9971"
         id="tspan110">包括但不限于潮流玩具行业经验之外的整体管理及战略发展、质量保证及控</tspan><tspan
         x="-28.347 -17.041201 -5.7354002 7.2149 20.165199 33.115501 46.0658 59.016102 71.9664 84.916702 97.866997 110.8173 123.7676 135.0723 146.3781 159.3284 172.2787 185.229 198.17931 211.12959 224.0799 237.0302 249.9805 262.93079 274.2355 285.54129 298.49161 311.44189 324.39221 337.3425 348.64719 359.953 372.90329 385.85361"
         y="143.9966"
         id="tspan112">制、财务及会计以及企业管治。彼等取得多个专业学位，包括广告学、工商管</tspan><tspan
         x="-28.347 -17.041201 -5.3140998 8.0003004 21.314699 34.629101 45.934898 57.661999 70.976402 84.290802 97.605202 110.9196 122.2254 133.9525 147.26691 160.5813 173.89571 185.20151 196.9286 210.243 223.5574 236.8718 248.1776 259.90469 273.21909 286.53351 299.8479 311.15369 322.8808 336.19519 349.50961 362.82401 374.12979 385.8569"
         y="159.99609"
         id="tspan114">理、通识研究、传播学研究、旅游管理、法文研究、英文研究、公共政策、国</tspan><tspan
         x="-28.347 -15.3912 -2.4354 8.8704004 20.176201 33.132 44.437801 55.743599 68.699402 81.655197 92.960999 104.2657 117.2215 130.17731 143.1331 156.0889 167.3947 178.7005 191.6563 204.61211 217.5679 230.5237 243.47951 256.4353 269.39111 282.34689 295.3027 308.25851 321.21429 334.1701 347.12589 360.0817 373.03751 384.34329"
         y="175.99561"
         id="tspan116">际经济、财务、社会学、审计及会计。董事会认为其符合董事会多元化政策。</tspan><tspan
         x="0 13.0889 26.177799 39.266701 52.355598 65.444504 78.533401 91.622299 104.7112 117.8001 130.88901 143.97791 157.0668 170.1557 183.2446 196.3335 209.42239 222.51131 235.6002 248.6891 261.77802 273.0827 284.54581 297.6347 310.7236 322.02939 333.49139 346.58029 359.66919 372.75809 385.84698"
         y="207.9957"
         id="tspan118">我们的提名委员会负责确保董事会成员的多元化。上市后，提名委员会</tspan><tspan
         x="-28.347 -15.1866 -2.0262001 11.1342 24.2946 37.455002 50.615398 63.775799 76.936203 90.096603 103.257 116.4174 129.5778 140.88251 152.4292 165.5896 178.75 191.9104 205.0708 218.2312 231.3916 242.6974 254.24409 267.40451 280.56491 293.72531 306.88571 320.04611 333.20651 346.36691 359.52731 372.68771 385.84811"
         y="223.99519"
         id="tspan120">将不时检讨董事会多元化政策，确保其持续有效，而我们将每年在企业管治</tspan><tspan
         x="-28.347 -15.3912 -2.4354 10.5204 23.4762 36.431999 49.387798 62.343601 75.2994 88.255203 101.211 114.1668 127.1226 140.0784 153.03419 165.99001 178.9458 191.9016 203.2063"
         y="239.99471"
         id="tspan122">报告中披露董事会多元化政策的实施情况。</tspan></text>
