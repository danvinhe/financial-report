2999 10.5215 21.827299 33.133099 46.088902 59.044701 72.000504 84.956299 97.912102 110.8679 123.8237 136.7795 149.73531 162.6911 175.6469 188.60271 199.90849 211.21429 224.1701 237.1259 250.0817 263.03751 275.99329 288.9491 301.90491 314.86069 327.8165 339.12231" y="143.99879">我们相信，我们获取的证据属充分及适当，为发表意见提供了基础。</tspan><tspan id="tspan48" x="-28.3459 -15.3736 -2.4013 10.571 23.543301 36.515598 49.4879 62.460201 75.432503 88.4048 101.3771 114.3494 127.3217 140.29401 153.2663 166.2386 179.21091 192.1832 205.1555 218.12781 231.1001 244.0724 257.04471 270.017 282.98929 294.2962 305.6207 318.59299 331.56531 344.5376 357.50989" y="175.9989">本所的工作并非按照美国审核准则或其他公认准则及惯例，或美国公众</tspan><tspan id="tspan50" x="-56.692902 -43.749199 -30.8055 -17.861799 -4.9180999 8.0256004 20.969299 33.912998 46.856701 59.8004 72.744102 85.687798 98.6315 111.5752 124.5189 137.4626 150.4063 163.35001 176.2937 189.2374 202.18111 215.1248 228.0685 241.01221 253.9559 266.8996 279.84329 292.78699 305.73071 318.67441 331.6181 344.5618 357.50549" y="191.9984">公司会计监察委员会的审核准则或任何专业团体于任何其他海外司法权区的</tspan><tspan id="tspan52" x="-56.692902 -43.6436 -30.594299 -17.545 -4.4956999 8.5536003 21.6029 32.908699 44.324501 57.373798 70.423103 83.472397 96.521698 109.571 122.6203 135.6696 148.7189 161.7682 174.8175 187.86681 200.91611 213.96539 227.01469 240.064 253.1133 266.1626 279.21191 292.2612 305.31049 318.3598 331.40909 344.4584 357.50769" y="207.99789">准则及惯例进行，故不应假设我们已根据该等准则和惯例进行工作般依赖本</tspan><tspan id="tspan54" x="-56.692902 -43.737099 -32.431301" y="223.99741">报告。</tspan></text>
